name: Integrate Case 04 FTL terminology deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case04-ftl-terminology-deepening.yml'
      - 'scripts/integrate_case04_ftl_terminology.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply bounded Case 04 terminology deepening
        run: |
          python scripts/integrate_case04_ftl_terminology.py
          python -c "from pathlib import Path; p=Path('CASE_INDEX.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + chr(10), encoding='utf-8')"
          rm scripts/integrate_case04_ftl_terminology.py
          rm .github/workflows/case04-ftl-terminology-deepening.yml
      - name: Validate canonical state
        run: |
          test -f evidence/04-ftl-1995-1996-terminology-standardization-addendum.md
          grep -q 'public term use by February 1995' evidence/04-flash-1992-1998-grounding.md
          grep -q 'May 1996 PCMCIA specification release date' cases/04-flash-virtual-mapping-logical-identity.md
          grep -q 'FTL terminology is now conservatively attested in public technical use by February 1995' ROADMAP.md
          grep -q '^## Case 04 deepening — FTL terminology / PCMCIA chronology findings$' CASE_INDEX.md
          grep -q '^\- \*\*2285 — FTL public technical use by February 1995' CASE_INDEX.md
          grep -q '^\- \*\*2296 — related-repository boundary:' CASE_INDEX.md
          test ! -e scripts/integrate_case04_ftl_terminology.py
          test ! -e .github/workflows/case04-ftl-terminology-deepening.yml
          git diff --check
      - name: Commit integrated research state
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ROADMAP.md CASE_INDEX.md \
            cases/04-flash-virtual-mapping-logical-identity.md \
            evidence/04-flash-1992-1998-grounding.md \
            evidence/04-ftl-1995-1996-terminology-standardization-addendum.md \
            scripts/integrate_case04_ftl_terminology.py \
            .github/workflows/case04-ftl-terminology-deepening.yml
          git diff --cached --check
          git commit -m "case04: deepen FTL terminology prior-art boundary"
          git push
