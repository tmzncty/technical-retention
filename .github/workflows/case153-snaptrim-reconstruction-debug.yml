name: Case 153 snaptrim reconstruction debug

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case153-snaptrim-reconstruction-debug.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Capture patch failure
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          git checkout -B main origin/main
          set +e
          python3 .github/case153_snaptrim_reconstruction_patch.py > /tmp/case153.out 2>&1
          status=$?
          set -e
          git reset --hard HEAD
          printf 'status=%s\n' "$status" > .github/case153_snaptrim_debug.txt
          cat /tmp/case153.out >> .github/case153_snaptrim_debug.txt
          rm .github/workflows/case153-snaptrim-reconstruction-debug.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ops: capture Case 153 integration failure [skip ci]"
          git push origin HEAD:main
