name: Temporary Case110 SnapLock WORM deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case110-snaplock.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate bounded research slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 _automation_case110_snaplock.py
          git diff --check
          test -f evidence/110-netapp-2003-2026-snaplock-onprem-worm-deepening.md
          grep -q '3083 — fiscal-2003 introduction floor' CASE_INDEX.md
          grep -q 'NetApp SnapLock on-premises WORM deepening' cases/110-amazon-s3-object-lock-version-worm-retention.md
          grep -q 'Case 110 NetApp SnapLock fiscal-2003 on-premises disk-WORM' ROADMAP.md
          test ! -e _automation_case110_snaplock.py
          test ! -e .github/workflows/tmp-case110-snaplock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "case110: deepen SnapLock on-prem WORM prior-art boundary"
          git push origin main
