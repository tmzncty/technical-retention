name: case21-controller-transition-integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case21-controller-transition-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize stale Evidence 21 ledger anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('evidence/21-micron-1999-sdram-refresh-mode-grounding.md')
          text = p.read_text(encoding='utf-8')
          row = '| Retained data in self refresh remain ordinarily serviceable without exiting the mode | X | contradicted by input/CKE and exit semantics |'
          anchor = '| Micron datasheet equals complete JEDEC standard history | X | rejected | one manufacturer product-family artifact |'
          if row not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, row + '\n' + anchor, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Integrate Case 21 controller-transition deepening
        run: python3 .github/scripts/case21_controller_transition_integrate.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e .github/scripts/case21_controller_transition_integrate.py
          test ! -e .github/workflows/case21-controller-transition-integrate.yml
          grep -n 'Infineon XMC4700/XMC4800 EBU' cases/21-micron-sdram-refresh-mode-handoff.md
          grep -n 'Source 4 — Infineon XMC4700/XMC4800 EBU' evidence/21-micron-1999-sdram-refresh-mode-grounding.md
          grep -n 'SDRAM self-refresh transition-completion deepening' ROADMAP.md
          grep -n '1355\. \*\*self-refresh request' CASE_INDEX.md
          grep -n '1364\. \*\*later controller composition' CASE_INDEX.md
          git diff --check
          git status --short
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'case21: deepen self-refresh transition completion boundary'
          git push origin HEAD:main
