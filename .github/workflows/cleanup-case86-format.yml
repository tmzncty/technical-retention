name: Cleanup Case 86 formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-case86-format.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/scripts/cleanup_case86_format.py
      - name: Validate markdown anchors
        run: |
          ! grep -q 'claim |$' evidence/86-dec-1960-1970-core-power-restart-grounding.md || true
          grep -q '^| controlled shutdown preservation ≠ failure-triggered automatic restart' evidence/86-dec-1960-1970-core-power-restart-grounding.md
          grep -q '^| core-content survival ≠ execution-context survival' evidence/86-dec-1960-1970-core-power-restart-grounding.md
      - name: Commit cleanup and remove one-shot files
        run: |
          rm -f .github/scripts/cleanup_case86_format.py
          rm -f .github/workflows/cleanup-case86-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'case86: fix evidence table formatting'
          git push
