name: Integrate Case 96 dRAID

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case96-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate navigation and status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate_case96.py || true
          git diff --check
          rm -f scripts/integrate_case96.py
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/case96-integration.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case96: integrate dRAID recovery navigation'
          git push
