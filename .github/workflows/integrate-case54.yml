name: integrate-case54

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/integrate_case54.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate navigation and status
        run: python .github/scripts/integrate_case54.py
      - name: Commit integrated files and remove one-shot runner
        run: |
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .github/scripts/integrate_case54.py .github/workflows/integrate-case54.yml
          git diff --cached --check
          git commit -m "docs: integrate grounded DDR5 RFM case"
          git push
