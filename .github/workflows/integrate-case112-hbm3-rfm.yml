name: integrate-case112-hbm3-rfm

on:
  push:
    paths:
      - '.github/workflows/integrate-case112-hbm3-rfm.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch navigation and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap_bullet = '- [x] HBM3 per-bank Refresh Management target/coverage boundary — [`cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md`](cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md), grounded by [`evidence/112-jedec-hbm3-2022-2023-rfm-grounding.md`](evidence/112-jedec-hbm3-2022-2023-rfm-grounding.md): JESD238 (January 2022) and JESD238A (January 2023) explicitly keep activity-triggered `RFM` separate from periodic `REF`, make `RFMpb` target one selected bank without the rolling-all-bank rule required of periodic `REFpb`, and keep RAA activity accounting distinct from internal refresh-counter progress. This closes only the bounded HBM3 `maintenance target vs periodic coverage vs activity accounting` relation; pre-2022 committee/genealogy work, named controller/device implementation, ARFM/later HBM evolution, independent bus traces, hidden victim-selection behavior, and fault injection remain open. Broader HBM history stays with `computing-archaeology`.'
          index_row = '| [HBM3 Refresh Management: Activity-Triggered Bonus Maintenance vs Periodic Retention Refresh](cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md) | **grounded** | dynamic payload + ordinary periodic REF/REFpb coverage + per-bank RAA activation-pressure state + targeted RFMpb/all-bank RFMab bonus maintenance opportunity | separate maintenance target geometry, periodic retained-set coverage, activity-pressure accounting, service admission, and hidden in-DRAM mitigation; show single-bank RFMpb deliberately lacks REFpb\'s rolling-all-bank obligation | [2022–2023 HBM3 RFM grounding](evidence/112-jedec-hbm3-2022-2023-rfm-grounding.md); pre-2022 genealogy, named-device/controller implementation, ARFM/later HBM evolution, independent command traces, hidden mitigation, and fault injection remain open |'
          findings = '- **1751 — HBM3 activity-triggered RFM ≠ periodic REF obligation:** JESD238/JESD238A explicitly preserve the controller\'s ordinary periodic refresh duty while adding extra management for high-activity conditions.\n- **1752 — RFM completion ≠ internal refresh-counter progress:** the HBM3 contract says an RFM command does not affect the ordinary internal refresh counters, so an RFM interval cannot be counted as baseline periodic-refresh progress.\n- **1753 — HBM3 `RFMpb` ≠ HBM3 `REFpb` rolling coverage:** periodic `REFpb` may target one bank at a time but must cover all banks within an SID before a bank repeats; the standard explicitly exempts `RFMpb` from that rolling-all-bank rule.\n- **1754 — one-bank RFM target ≠ one-bank retained set:** repeatedly targeting a hot bank with `RFMpb` does not remove the other banks from the ordinary periodic-retention obligation.\n- **1755 — RAA count ≠ payload:** Rolling Accumulated ACTIVATE state is maintenance-control state used to decide future intervention, not the user data being retained.\n- **1756 — RAA count ≠ wall-clock retention age:** HBM3 RAA accumulates activation pressure and can be reduced by maintenance; it is not a timer measuring how long charge has been retained.\n- **1757 — `RAAIMT` / `RAAMMT` ≠ demonstrated bit-flip threshold:** the standard defines management/admission thresholds, not an empirical point at which payload corruption is asserted to occur.\n- **1758 — ACTIVATE blocked at `RAAMMT` ≠ payload loss:** a bank can become temporarily inadmissible for another ACTIVATE until maintenance earns back budget while its payload remains retained.\n- **1759 — ordinary REF reducing RAA ≠ REF becoming disturbance-only maintenance:** one ordinary refresh event can both advance baseline retention work and reduce activation-pressure accounting without collapsing the two obligations.\n- **1760 — RFM “bonus time” ≠ disclosed internal mitigation algorithm:** the standardized interval exposes maintenance opportunity but not physical victim selection, row adjacency, internal counters, or the exact restore sequence.\n- **1761 — RFM command completion ≠ proof of a specific victim-row rewrite:** a host-observable RFM event does not certify which physical rows were restored inside the HBM3 device.\n- **1762 — sufficiently long self-refresh RAA reset ≠ RFM replacing periodic refresh:** HBM3 may reset RAA after `tRAASRF`, but this accounting reset occurs under a qualifying self-refresh regime and does not merge RFM with ordinary refresh-counter semantics.\n- **1763 — HBM3 `RFMpb` ≠ DDR5 `RFMsb` target geometry:** Case 112\'s bounded HBM3 command selects one bank, while Case 54\'s DDR5 same-bank RFM vocabulary belongs to a different target geometry; shared RFM terminology is not mechanism identity.\n- **1764 — RowHammer 2014 disturbance evidence ≠ HBM3-RFM genealogy:** Kim et al. provide an earlier open activation-induced disturbance floor, but that chronology does not demonstrate a direct design line into JESD238.\n- **1765 — January 2022 JESD238 publication ≠ RFM invention priority:** the public standard date is a historical floor for the inspected interface, not a priority claim over earlier patents, vendor mechanisms, committee drafts, or private designs.'
          continuation = '## Continuation — Case 112 HBM3 per-bank RFM\n\nCase 112 extends this split-maintenance analysis into HBM3 without duplicating the DDR5 case. Its bounded contribution is target/coverage geometry: HBM3 `RFMpb` selects one bank and is explicitly exempt from the rolling-all-bank rule that applies to HBM3 periodic `REFpb`. The HBM3 standard also states that RFM does not replace periodic REF or advance the ordinary internal refresh counters.\n\nSee [`112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md`](112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md) and [`../evidence/112-jedec-hbm3-2022-2023-rfm-grounding.md`](../evidence/112-jedec-hbm3-2022-2023-rfm-grounding.md).\n\nThis is a **functional/interface comparison**, not a claim that DDR5 `RFMsb` and HBM3 `RFMpb` have identical target geometry or that one is genealogically derived from the other.'

          cp = Path("cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md")
          ep = Path("evidence/112-jedec-hbm3-2022-2023-rfm-grounding.md")
          if not cp.exists() or not ep.exists():
              raise SystemExit("Case/Evidence 112 missing")

          rp = Path("ROADMAP.md")
          r = rp.read_text(encoding="utf-8")
          if "cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md" not in r:
              anchor = "## Phase 2 — Build missing technical bridges\n\n"
              if anchor not in r:
                  raise SystemExit("Phase-2 anchor missing")
              r = r.replace(anchor, anchor + roadmap_bullet + "\n", 1)
              rp.write_text(r, encoding="utf-8")

          ip = Path("CASE_INDEX.md")
          idx = ip.read_text(encoding="utf-8")
          if "cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md" not in idx:
              lines = idx.splitlines()
              pos = [i for i, line in enumerate(lines)
                     if "cases/111-enterprise-ssd-extended-shutdown-maintenance.md" in line]
              if len(pos) != 1:
                  raise SystemExit(f"expected one Case-111 row, got {len(pos)}")
              lines.insert(pos[0] + 1, index_row)
              idx = "\n".join(lines).rstrip() + "\n"
          if "**1751 —" not in idx:
              idx = idx.rstrip() + "\n\n## Case 112 — HBM3 RFM findings\n\n" + findings + "\n"
          ip.write_text(idx, encoding="utf-8")

          c54p = Path("cases/54-ddr5-rfm-split-maintenance-authority.md")
          c54 = c54p.read_text(encoding="utf-8")
          if "Continuation — Case 112 HBM3 per-bank RFM" not in c54:
              c54p.write_text(c54.rstrip() + "\n\n" + continuation + "\n", encoding="utf-8")

          final_idx = ip.read_text(encoding="utf-8")
          for n in range(1751, 1766):
              marker = f"**{n} —"
              if final_idx.count(marker) != 1:
                  raise SystemExit(f"finding {n} count={final_idx.count(marker)}")
          if final_idx.count("cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md") != 1:
              raise SystemExit("Case 112 CASE_INDEX link count unexpected")
          if rp.read_text(encoding="utf-8").count("cases/112-hbm3-rfm-bonus-maintenance-vs-periodic-refresh.md") != 1:
              raise SystemExit("Case 112 ROADMAP link count unexpected")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/integrate-case112-hbm3-rfm.yml
          git add ROADMAP.md CASE_INDEX.md cases/54-ddr5-rfm-split-maintenance-authority.md \
                  .github/workflows/integrate-case112-hbm3-rfm.yml
          git diff --cached --check
          git commit -m "case112: integrate HBM3 RFM navigation and comparison"
          git push origin HEAD:main
