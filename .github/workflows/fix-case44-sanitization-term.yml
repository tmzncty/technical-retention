name: fix-case44-sanitization-term

on:
  push:
    paths:
      - '.github/workflows/fix-case44-sanitization-term.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: technical-retention-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Normalize Case 44 sanitization terminology
        run: bash scripts/fix_case44_sanitization_term.sh
