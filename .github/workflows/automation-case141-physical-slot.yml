## Status

**`grounded`** for the bounded persistence semantics of manually advancing a physical replication slot in PostgreSQL 11-era code and its February-2020 correction. This slice uses PostgreSQL's own commit announcements, developer discussion, released documentation, and release notes.

It does **not** claim that `pg_replication_slot_advance()` synchronously fsyncs slot state before returning, that moving a slot frontier immediately removes older WAL, or that a slot-position change is a sanitization event. It also does not establish the pre-2018 proposal genealogy of manual slot advancement.

## Research question

Case 141 already establishes that replication-slot metadata can retain a compact frontier whose value keeps a much larger WAL corpus alive. The remaining physical-slot question is narrower:

> **When an administrator manually advances a physical replication slot, when has the new retention frontier merely become visible in memory, when has it become restart-persistent control state, and when—if ever—does that imply older WAL has actually disappeared?**

This is useful because one SQL operation crosses three different horizons that are easy to collapse:

```text
function completed / new restart_lsn visible
        !=
slot control state written for restart recovery
        !=
older WAL physically reclaimed
```

## Sources inspected

1. PostgreSQL committers archive, **“Ability to advance replication slots”**, 17 January 2018, commit `9c7d06d60680c7f00d931233873dee81fdb311c6`: <https://www.postgresql.org/message-id/E1ebm6p-000761-Hc%40gemulon.postgresql.org>.
2. Alexey Kondratov, pgsql-hackers, **“Physical replication slot advance is not persistent”**, 24 December 2019: <https://www.postgresql.org/message-id/059cc53a-8b14-653a-a24d-5f867503b0ee%40postgrespro.ru>.
3. Michael Paquier, pgsql-hackers follow-up, 28 January 2020, documenting the chosen checkpoint-mediated behavior: <https://www.postgresql.org/message-id/20200128080114.GB145179%40paquier.xyz>.
4. PostgreSQL committers archive, **“Fix slot data persistency when advancing physical replication slots”**, 30 January 2020, master commit `b0afdcad21fde1470e6502a376bfaf0e10d384fa`, backpatched through 11: <https://www.postgresql.org/message-id/E1iwzPK-0002kB-2n%40gemulon.postgresql.org>.
5. PostgreSQL 11.7 release notes, released 13 February 2020: <https://www.postgresql.org/docs/11/release-11-7.html>.
6. PostgreSQL 12.2 release notes, released 13 February 2020: <https://www.postgresql.org/docs/12/release-12-2.html>.
7. PostgreSQL 12 system-administration function documentation for `pg_replication_slot_advance()`: <https://www.postgresql.org/docs/12/functions-admin.html>.

The commit announcement is the preferred implementation-history anchor because it is first-party PostgreSQL project material. Branch-specific backpatch object IDs may differ; the historical claim here is the project-level fix and its explicit `Backpatch-through: 11`, corroborated by the 11.7 and 12.2 release notes.

---

## Historical record

### H/P — manual advancement entered PostgreSQL in January 2018 for both physical and logical slots

The PostgreSQL committers archive records commit `9c7d06d60680c7f00d931233873dee81fdb311c6` on **17 January 2018** as adding a new user function, `pg_replication_slot_advance()`, capable of advancing both physical and logical replication slots.

For this case, the important historical boundary is modest:

> By January 2018 PostgreSQL had a public administrative operation for deliberately moving a replication slot's retained progress frontier forward.

This is an implementation/public-source floor, not a claim that PostgreSQL invented manual replication-progress advancement or that the first proposal occurred on that date.

### H/P — a December-2019 report demonstrated that physical-slot advancement could be visible yet fail to survive restart

On **24 December 2019**, Alexey Kondratov reported a reproducible physical-slot discrepancy. After creating a physical slot, generating WAL, advancing it, and observing the newer `restart_lsn`, a server restart caused the slot to return to the older value.

The report identifies the crucial boundary directly: the physical path changed the **in-memory** slot state but did not arrange for that updated persistent data to be saved. The same thread distinguished logical-slot behavior because logical advancement already dirtied the slot through its own path.

Historical record therefore supplies a concrete counterexample to the shortcut:

`SQL-visible frontier movement == already restart-persistent frontier movement`

That equality was false for the affected physical-slot implementation.

### H/P — the January-2020 fix marked physical-slot advancement dirty so a later checkpoint could save it

PostgreSQL's **30 January 2020** commit announcement for `b0afdcad21fde1470e6502a376bfaf0e10d384fa` states that physical advancement had failed to mark the slot dirty, preventing the following checkpoint from flushing the slot data to disk. It records that the effect could therefore be lost even across a clean restart, while logical advancement did not have the same defect.

The correction was deliberately bounded. It made physical advancement participate in the same checkpoint-oriented slot persistence machinery rather than turning the SQL function into an immediate synchronous slot flush.

The commit was marked **`Backpatch-through: 11`** and added recovery/TAP tests covering physical and logical slot advancement across clean restarts.

### H/P — released 11.7 and 12.2 explicitly carry the persistence fix

PostgreSQL **11.7** and **12.2**, both released on **13 February 2020**, include the same user-visible release-note item: the effect of `pg_replication_slot_advance()` on a physical replication slot is made persistent across restarts.

This provides a released-version boundary distinct from the 30-January mainline fix:

`fix commit date != supported release date`

### H/P — persistence remains checkpoint-mediated; a crash can still expose an earlier slot position

The PostgreSQL 12 documentation states that when advancement occurs, the updated slot information is written out at the **following checkpoint**. It separately warns that after a crash the slot may return to an earlier position.

The January-2020 design discussion explicitly preserved this behavior rather than forcing an immediate flush inside `pg_replication_slot_advance()`.

Thus the historical fix must not be summarized as “the function became synchronously durable.” The actual released contract is narrower:

```text
advance returns
    -> updated slot state exists
    -> slot is eligible/scheduled for checkpoint persistence
    -> checkpoint writes the updated slot state
```

A crash may interrupt that sequence before the newer frontier becomes the restart-recovered frontier.

---

## Engineering reconstruction

### E — operation completion, control-state persistence, and WAL reclamation are separate transitions

The physical slot's `restart_lsn` is a control relation that contributes to how far back WAL may still be needed. Moving it forward changes the **claim on history**; it does not itself contain the WAL and it is not the filesystem operation that deletes old segments.

A useful reconstruction is therefore:

```text
administrator requests slot advance
        -> new restart_lsn becomes current in memory
        -> slot persistence state is marked for checkpoint write
        -> later checkpoint makes that control state restart-recoverable
        -> WAL-removal machinery may later treat older history as reclaimable
        -> old WAL may later be removed
```

Each arrow has a distinct failure/observation boundary.

### E — a successful SQL return is not a synchronous durability acknowledgement for the slot frontier

After the 2020 fix, `pg_replication_slot_advance()` returning a new position tells the caller what position was reached. It does not prove that the slot's persistent on-disk state has already crossed the next checkpoint boundary.

Therefore:

> **function completion != checkpoint durability of the retention frontier.**

The explicit crash rollback warning is the counterexample that keeps this distinction empirical rather than merely conceptual.

### E — clean-restart persistence and arbitrary-crash persistence are not identical guarantees

The fix added tests across clean restart and repaired a bug that could lose physical advancement even there. The retained design still permits a crash before the follow-up checkpoint to recover an earlier slot position.

So:

> **clean restart after the persistence path has run != arbitrary crash at every point after SQL return.**

This is a persistence-horizon statement about control metadata, not a judgment that the API is defective after the fix.

### E — moving `restart_lsn` forward changes reclamation authority before proving completed reclamation

An advanced physical slot may cease to require some older WAL. That weakens one reason those segments were protected, but the function does not itself prove that the old files were immediately unlinked, overwritten, or otherwise made unrecoverable.

This aligns with Case 141's later `unreserved`/`lost` distinction:

> **retention protection withdrawn or narrowed != history already physically absent.**

The 2018–2020 slice therefore deepens the same case at a different layer: first the **frontier itself** has a persistence horizon; only then can that frontier participate in a later reclamation decision.

### E/A — one SQL function over physical and logical slots does not imply one internal state-transition path

The 2019–2020 bug and fix are a useful counterexample to interface-level normalization. PostgreSQL exposed one administrative function for both slot kinds, yet the two paths differed in whether advancement caused slot persistent state to be marked dirty.

Functional comparison only:

> **same operation name / similar returned progress != identical persistence implementation.**

This does not establish a deeper physical/logical genealogy beyond the documented shared API and code paths.

---

## Functional analogy

The narrow comparison to other repository cases is **checkpointed control-state persistence**. Kafka high-watermark checkpoints, HDFS retained authority state, DDR5 ECS summaries, and PostgreSQL slot state can all force the researcher to ask whether a currently visible control value is also recoverable after a restart.

That is only a functional comparison. Their protocols, authority models, persistence frequencies, and failure consequences differ. No historical or implementation continuity is asserted.

---

## Philosophical interpretation — bounded

Project interpretation only: a retained history can depend on a second-order retained relation that says which history still matters, and that second-order relation can itself have a persistence delay. The “memory of what must remain” is therefore not automatically simultaneous with the live control decision that produced it.

This is not PostgreSQL project vocabulary, and it should not be substituted for the implementation terms `restart_lsn`, dirty slot state, checkpoint, or WAL removal.

---

## Rejected / unsupported claims

- **X — `pg_replication_slot_advance()` return means the slot frontier has already been synchronously flushed to durable storage.** Rejected by the checkpoint-mediated documentation and crash rollback warning.
- **X — the 2020 fix removed all possible backward movement after crash.** Rejected: the project explicitly kept the possibility that a crash exposes an older persisted position.
- **X — advancing a physical slot immediately deletes every older WAL segment.** Rejected: frontier change and WAL reclamation are different operations/horizons.
- **X — advancing a slot sanitizes old WAL.** Rejected: slot semantics provide no proof of filesystem/device remnant destruction, archive deletion, backup deletion, or forensic unrecoverability.
- **X — identical SQL API means physical and logical slots had identical persistence paths.** Rejected by the bug itself.
- **X — January 2018 or January 2020 establishes invention priority for replication-progress advancement or checkpointed metadata.** Rejected: these dates establish PostgreSQL implementation/fix floors only.

