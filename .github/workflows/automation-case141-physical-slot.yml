PostgreSQL added `pg_replication_slot_advance()` on **17 January 2018** for both physical and logical replication slots. The shared SQL interface did not, however, imply identical persistence behavior in the two implementations. A **24 December 2019** pgsql-hackers report demonstrated that a physical slot's newly advanced `restart_lsn` could be visible before restart and then revert afterward because the physical path had changed only in-memory state without marking the persistent slot data dirty.

