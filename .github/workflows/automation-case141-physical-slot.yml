    != older WAL physically reclaimed
```

### Engineering reconstruction — the claimant on WAL has its own delayed persistence boundary

A physical slot's `restart_lsn` is a compact claimant on history. Advancing it can narrow the WAL prefix that the slot still requires, but the claimant itself first crosses an in-memory-to-checkpoint persistence boundary. Only separately can WAL-removal machinery use the newer frontier and later reclaim files.

This closes three shortcuts:

- `function returned != checkpoint-durable slot frontier`;
- `clean-restart persistence != arbitrary-crash persistence immediately after return`;
- `restart_lsn advanced != old WAL already removed`.

The physical/logical discrepancy also provides a direct interface-level counterexample: **same SQL function != identical internal persistence path**.

