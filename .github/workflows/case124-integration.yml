name: Integrate Case 124

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case124-integration.yml'
      - '.github/scripts/integrate_case124.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward authoritative main
        run: git pull --ff-only origin main

      - name: Integrate bounded research slice
        run: python .github/scripts/integrate_case124.py

      - name: Validate research tree
        run: |
          git diff --check
          test -f cases/124-linux-ext4-rename-fsync-durability-closure.md
          test -f evidence/124-linux-ext4-2009-2026-rename-fsync-grounding.md
          grep -Fq 'cases/124-linux-ext4-rename-fsync-durability-closure.md' ROADMAP.md
          grep -Fq 'cases/124-linux-ext4-rename-fsync-durability-closure.md' CASE_INDEX.md
          grep -Fq 'rename atomic visibility ≠ crash durability' CASE_INDEX.md
          grep -Fq 'file `fsync` ≠ directory-entry `fsync`' CASE_INDEX.md

      - name: Commit and push canonical research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/124-linux-ext4-rename-fsync-durability-closure.md evidence/124-linux-ext4-2009-2026-rename-fsync-grounding.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'case124: ground ext4 rename/fsync durability closure'
          git push origin HEAD:main

      - name: Remove one-shot integration infrastructure
        run: |
          git rm .github/scripts/integrate_case124.py .github/workflows/case124-integration.yml
          git commit -m 'chore: remove Case 124 integration helper'
          git push origin HEAD:main
