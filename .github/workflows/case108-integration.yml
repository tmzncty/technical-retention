name: case108-integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case108-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to current main
        run: git pull --ff-only origin main

      - name: Integrate bounded Case 108 slice
        run: python tools/case108_integrate.py

      - name: Validate and commit research tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "case108: ground HDD zone-bit geometry boundary"
          git push origin HEAD:main
