name: case33-refresh-deepening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case33-refresh-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Case 33 research deepening
        shell: bash
        run: |
          python3 scripts/oneoff_case33_deepening.py
          git diff --check
      - name: Remove one-shot files and commit
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/case33-refresh-deepening.yml
          rm scripts/oneoff_case33_deepening.py
          git diff --check
          test "$(git status --short | grep -v '^$' | wc -l)" -eq 7
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'case33: deepen same-bank refresh geometry boundary'
          git push origin HEAD:main
