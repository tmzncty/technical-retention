name: Case 146 Intel 28F008SA integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case146-intel-28f008sa-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Apply Case 146 research patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "7f0d65d771023c7128abbd6c632d6af5f0d9b7a3"
          python3 .github/case146_intel_28f008sa_patch.py
          sed -i 's/[[:space:]]\+$//' cases/146-flash-erase-suspend-pending-operation-state.md
          sed -i 's/[[:space:]]\+$//' evidence/146-intel-28f008sa-suspend-abort-power-boundary-deepening.md
          sed -i 's/[[:space:]]\+$//' ROADMAP.md
          sed -i 's/[[:space:]]\+$//' CASE_INDEX.md
          rm .github/case146_intel_28f008sa_patch.py
          rm .github/workflows/case146-intel-28f008sa-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case146: deepen Intel 28F008SA suspend-abort boundary [skip ci]"
          git push origin HEAD:main
