name: Integrate Case 31 navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-case31.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration
        run: python .github/scripts/integrate_case31.py

      - name: Commit integration
        run: |
          rm .github/scripts/integrate_case31.py
          rm .github/workflows/integrate-case31.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md .github/scripts/integrate_case31.py .github/workflows/integrate-case31.yml
          git commit -m "docs: integrate grounded SNIA persistence-domain bridge"
          git push origin HEAD:main
