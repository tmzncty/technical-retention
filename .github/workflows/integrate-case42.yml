name: Integrate Case 42

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case42.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 42
        run: python3 .github/scripts/integrate_case42.py
      - name: Validate and commit
        run: |
          test -f cases/42-apache-kafka-log-compaction-delete-marker-retention.md
          test -f evidence/42-kafka-081-log-compaction-grounding.md
          grep -Fq 'After forty-three bounded cases' CASE_INDEX.md
          grep -Fq '391. **current-state reconstructability' CASE_INDEX.md
          grep -Fq '400. **source-of-current-state role' CASE_INDEX.md
          grep -Fq 'cases/42-apache-kafka-log-compaction-delete-marker-retention.md' README.md
          grep -Fq 'append-log / changelog compaction and current-state reconstruction' ROADMAP.md
          rm -f .github/scripts/integrate_case42.py .github/workflows/integrate-case42.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md .github/scripts/integrate_case42.py .github/workflows/integrate-case42.yml
          git commit -m 'docs: integrate grounded Kafka log-compaction bridge'
          git push origin HEAD:main
