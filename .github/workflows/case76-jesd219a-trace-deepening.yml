name: case76-jesd219a-trace-deepening

on:
  push:
    paths:
      - '.github/workflows/case76-jesd219a-trace-deepening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Case 76 research slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          case = 'cases/76-jedec-ssd-endurance-retention-qualification.md'
          evidence = 'evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md'
          roadmap = 'ROADMAP.md'
          index = 'CASE_INDEX.md'

          replace_once(
              case,
              'Prior-art deepening now also separates the earlier JESD22-A117 device-level program/erase-endurance-and-retention test family from JESD218\'s later SSD-level host-TBW service contract, using a 2006 Renesas standards inventory, JEDEC\'s own later revision ledger, and a 2002 IEEE post-cycling retention paper.',
              'Prior-art deepening now also separates the earlier JESD22-A117 device-level program/erase-endurance-and-retention test family from JESD218\'s later SSD-level host-TBW service contract, using a 2006 Renesas standards inventory, JEDEC\'s own later revision ledger, and a 2002 IEEE post-cycling retention paper. The 2010→2012 workload chronology is now further bounded by July 2012 JESD219A publication metadata and its separately distributed Master/Test Trace artifacts; this does not substitute for direct inspection of the normative JESD219A body.'
          )

          old_bridge = '''Direct facsimile archaeology of JESD218A and the later normative JESD219A client-workload text remains open. The purpose of this deepening is to prevent later revisions from being silently projected backward into September 2010.'''
          new_bridge = '''Direct facsimile archaeology of JESD218A and the later normative JESD219A client-workload text remains open. The purpose of this deepening is to prevent later revisions from being silently projected backward into September 2010.

### By July 2012 the client workload had become a standard-plus-trace artifact set

A later publication boundary can now be grounded without pretending that a standards-catalog record is a substitute for the full normative text. Accuris's JEDEC catalog records **JESD219A, _Solid-State Drive (SSD) Endurance Workloads_**, as a 26-page standard published **1 July 2012**. Its description says that the workloads are used with JESD218 and explicitly points to separate `JESD219A_MT` and `JESD219A_TT` **supporting trace files**.[^jesd219a-catalog]

The companion catalog records make the client-workload embodiment more concrete. `JESD219A_MT`, **Master Trace for 128 GB SSD**, is described as a supporting file for implementing the endurance-verification client workload. The record says that it represents actual SSD activity over **seven months**, applies to client endurance verification for user capacities of at least 64 GB, can serve directly as the test trace for 128–256 GB devices with its existing LBA range, and can be compressed or expanded for other capacities under the stated maximum-LBA relation.[^jesd219a-mt]

`JESD219A_TT`, **Test Trace for 64 GB–128 GB SSD**, is separately described as a trace **derived from the 128 GB Master Trace** using the compression method in JESD219, with the same workload characteristics except that its maximum LBA represents 64 GB of user capacity.[^jesd219a-tt]

This closes a narrower gap than direct normative facsimile archaeology. It establishes that, by July 2012, the client workload was no longer merely a committee presentation or an unfinished promise in the September 2010 issue: JEDEC's cataloged revision had named supporting workload artifacts, including a captured Master Trace and a derived Test Trace. It does **not** establish every clause, preconditioning rule, trace transformation algorithm, or later revision change inside the full JESD219A text.

The retention-specific point is also narrower than a generic workload-history claim. The trace files are not the SSD payload being protected. They are retained **workload history/control input** used to reproduce a qualification stress relation later. That gives a useful engineering decomposition:

```text
application-class requirement
    !=
workload-standard prose
    !=
captured Master Trace history
    !=
capacity-adapted Test Trace
    !=
endurance-stress execution
    !=
JESD218 qualification verdict
    !=
later power-off retention interval
```

From the artifact descriptions alone, several boundaries follow:

> **workload-standard text ≠ supporting trace artifact**;

> **Master Trace ≠ derived Test Trace**;

> **workload role continuity ≠ one fixed LBA geometry**;

> **seven months represented by the source trace ≠ the later JESD218 power-off retention interval**.

The first three are historical-record-plus-engineering boundaries around the July 2012 artifact set. The last is a cross-document engineering reconstruction: one interval characterizes the history represented by the workload source, while JESD218's retention-use interval is a separate post-endurance service requirement. Neither should be silently substituted for the other.'''
          replace_once(case, old_bridge, new_bridge)

          replace_once(
              case,
              'A full pre-2000 EEPROM/Flash qualification genealogy, direct facsimile archaeology of original A117/A117B, the complete JESD219 workload history, and later JESD218 revision history remain separate work best coordinated with `computing-archaeology`.',
              'A full pre-2000 EEPROM/Flash qualification genealogy, direct facsimile archaeology of original A117/A117B, the complete JESD219 workload history, and later JESD218 revision history remain separate work best coordinated with `computing-archaeology`. A fresh repository search for `JESD219A`, `SSD endurance workload`, and the trace-artifact names found no dedicated `computing-archaeology` case to reuse; this repository therefore keeps only the bounded retention-specific standard/trace relation while leaving any broad standards genealogy to that companion project.'
          )

          p = Path(case)
          text = p.read_text(encoding='utf-8')
          if '[^jesd219a-catalog]:' not in text:
              text = text.rstrip() + '''\n\n[^jesd219a-catalog]: Accuris / JEDEC catalog, **JESD219A, _Solid-State Drive (SSD) Endurance Workloads_**, published 1 July 2012, 26 pages. The catalog description says the workloads are used with JESD218 and points to `JESD219A_MT` and `JESD219A_TT` as supporting trace files: <https://store.accuristech.com/asa/standards/jedec-jesd219a?product_id=1837609>. Accuris's JEDEC browse page also lists the September 2010 `JESD 219` and July 2012 `JESD219A` as separate catalog entries: <https://store.accuristech.com/products?page=23&per_page=10&publisher_id=110&sort_direction=asc&sort_order=doc_no>. This is publication/catalog evidence, not direct inspection of the full secured normative standard.\n[^jesd219a-mt]: Accuris / JEDEC catalog, **JESD219A_MT, _Master Trace for 128 GB SSD_**, published 1 July 2012. The description identifies it as a supporting file for the endurance-verification client workload, says it represents seven months of actual SSD activity, and documents its direct/scaled capacity use: <https://store.accuristech.com/standards/jedec-jesd219a_mt?product_id=1838012>.\n[^jesd219a-tt]: Accuris / JEDEC catalog, **JESD219A_TT, _Test Trace for 64 GB - 128 GB SSD_**, published 1 July 2012. The description says it is derived from the 128 GB Master Trace using the JESD219 compression method and preserves the Master Trace characteristics except for maximum LBA: <https://store.accuristech.com/standards/jedec-jesd219a_tt?product_id=1837608>.\n'''
              p.write_text(text, encoding='utf-8')

          replace_once(
              evidence,
              '8. **Alvin Cox / JEDEC JC-64.8 presentation (August 2011)** — contemporaneous committee-chair evidence for the evolving JESD218A/JESD219 client-workload state, kept below normative standards text in authority.',
              '8. **Alvin Cox / JEDEC JC-64.8 presentation (August 2011)** — contemporaneous committee-chair evidence for the evolving JESD218A/JESD219 client-workload state, kept below normative standards text in authority.\n9. **JEDEC/Accuris JESD219A + MT/TT catalog records (July 2012)** — publication and supporting-artifact evidence that the client workload had become a standard-plus-trace artifact set; used below the authority of directly inspected normative text.'
          )

          source9 = '''---

## Source 9 — JESD219A publication and supporting trace artifacts, July 2012

**Cataloged standard:** JEDEC, _Solid-State Drive (SSD) Endurance Workloads_, JESD219A, publication date 1 July 2012.

**Inspected catalog record:** Accuris / JEDEC:
<https://store.accuristech.com/asa/standards/jedec-jesd219a?product_id=1837609>

**Supporting artifacts:**

- `JESD219A_MT`, _Master Trace for 128 GB SSD_: <https://store.accuristech.com/standards/jedec-jesd219a_mt?product_id=1838012>;
- `JESD219A_TT`, _Test Trace for 64 GB - 128 GB SSD_: <https://store.accuristech.com/standards/jedec-jesd219a_tt?product_id=1837608>.

### Exact metadata inspected

- JESD219A is cataloged as a 26-page JEDEC standard published **07/01/2012**;
- its catalog description says that it defines workloads for SSD endurance rating/verification in conjunction with JESD218 and explicitly names `JESD219A_MT` and `JESD219A_TT` as supporting trace files;
- `JESD219A_MT` is cataloged on the same date as a supporting file for implementation of the endurance-verification **client workload**;
- the Master Trace description says it represents **seven months of actual SSD activity**, is used for client endurance verification under JESD218 for user capacities ≥64 GB, can be used directly for 128–256 GB with its existing LBA range, and can be compressed/expanded for other capacities under a stated maximum-LBA constraint;
- `JESD219A_TT` is cataloged on the same date as a supporting client-workload file for 64–128 GB devices;
- the Test Trace description says it is **derived from the 128 GB Master Trace** using the compression method described in JESD219 and that its characteristics are identical except for a maximum LBA representing 64 GB user capacity;
- Accuris's JEDEC browse page lists the September 2010 `JESD 219` and July 2012 `JESD219A` as distinct catalog entries, providing a publication-level revision cross-check: <https://store.accuristech.com/products?page=23&per_page=10&publisher_id=110&sort_direction=asc&sort_order=doc_no>.

### What this source set directly grounds

**Historical record:**

- by July 2012, JESD219A and separately named MT/TT supporting artifacts were cataloged as the client-workload implementation set;
- the Master Trace was represented as captured real SSD activity over seven months rather than an invented synthetic command list;
- the 64–128 GB Test Trace was derived from the 128 GB Master Trace rather than recorded as an independent source history;
- capacity adaptation was part of the documented workload-artifact relation.

**Engineering reconstruction:**

```text
workload standard
    !=
supporting trace artifact
    !=
source Master Trace history
    !=
derived capacity-adapted Test Trace
    !=
test execution
    !=
qualification result
```

This also creates a retention-specific control-state observation: the trace is a retained **history used to reproduce future stress**, not the user payload whose endurance/retention is being qualified.

### Evidence limit

These are publisher/distributor catalog records carrying JEDEC document metadata and descriptions. They are adequate for publication date, artifact identity, and the quoted high-level artifact relation, but they are **not a directly inspected full normative JESD219A facsimile**. They therefore do not close clause-level preconditioning, trace-transformation, or later revision archaeology. Nor do they establish invention priority for trace-based SSD workload qualification.

'''
          replace_once(
              evidence,
              '---\n\n## Qualification-semantics deepening from the original JESD218 facsimile',
              source9 + '---\n\n## Qualification-semantics deepening from the original JESD218 facsimile'
          )

          replace_once(
              roadmap,
              'full JESD218/JESD219 revision chronology and later TLC/QLC named-product validation remain separate work.',
              'the July 2012 JESD219A publication/supporting-trace bridge is now grounded; direct normative JESD218A/JESD219A facsimile archaeology, later B/C revision history, post-rating fault testing, and TLC/QLC named-product validation remain separate work.'
          )

          replace_once(
              index,
              'direct normative JESD218A/JESD219A facsimiles, later B/C revision history, post-rating fault testing, TLC/QLC named-product validation, and physical retention models remain separate work',
              'the July 2012 JESD219A publication/supporting-trace artifact bridge is now grounded, while direct normative JESD218A/JESD219A facsimiles, later B/C revision history, post-rating fault testing, TLC/QLC named-product validation, and physical retention models remain separate work'
          )

          p = Path(index)
          text = p.read_text(encoding='utf-8')
          if '1448. **workload-standard prose ≠ supporting trace artifact**' in text:
              raise SystemExit('CASE_INDEX already contains the planned Case 76 trace findings')
          if '1447. **cross-case access-disturbance decomposition ≠ historical genealogy**' not in text:
              raise SystemExit('CASE_INDEX highest-finding anchor changed; refusing to guess numbering')
          findings = '''

### Case 76 JESD219A client-workload artifact deepening — standard, Master Trace, and derived Test Trace

1448. **workload-standard prose ≠ supporting trace artifact** — the July 2012 JESD219A catalog explicitly points to separately distributed `JESD219A_MT` and `JESD219A_TT` files for implementation of the client endurance workload; the workload relation is not exhausted by the prose-standard object alone.
1449. **Master Trace ≠ Test Trace** — the catalog distinguishes a 128 GB Master Trace representing captured SSD activity from a separately named Test Trace derived for a smaller capacity range.
1450. **derived Test Trace ≠ independent workload history** — `JESD219A_TT` is described as derived from the 128 GB Master Trace and as preserving its characteristics except for maximum LBA; derivation must not be rewritten as a second independently observed workload.
1451. **workload role continuity ≠ fixed LBA geometry** — the Master Trace description permits direct use and controlled compression/expansion across capacity ranges, so one standardized client-workload role can survive a bounded address-space transformation without implying one immutable physical/LBA span.
1452. **source-trace timespan ≠ power-off retention interval** — the Master Trace's seven months describes the captured workload history used to drive endurance stress, while JESD218's client/enterprise retention-use durations are separate post-endurance, power-off qualification requirements.
1453. **workload artifact ≠ qualification verdict** — MT/TT provide stress-driving workload evidence/input; JESD218's capacity, UBER, FFR, and later power-off retention criteria determine whether an SSD satisfies the rated service envelope.
1454. **July 2012 catalog/artifact closure ≠ full normative facsimile inspection or invention priority** — the new evidence closes a publication/supporting-artifact gap after the unfinished September 2010 client-workload state, but clause-level JESD219A archaeology and broader trace-workload priority remain separate work.
'''
          p.write_text(text.rstrip() + findings + '\n', encoding='utf-8')

          # Final invariant checks before the integration commit.
          for path in [case, evidence, roadmap, index]:
              t = Path(path).read_text(encoding='utf-8')
              if not t.endswith('\n'):
                  raise SystemExit(f'{path}: missing final newline')
          if 'JESD219A_MT' not in Path(case).read_text(encoding='utf-8'):
              raise SystemExit('case update missing trace artifact')
          if '## Source 9 — JESD219A publication and supporting trace artifacts, July 2012' not in Path(evidence).read_text(encoding='utf-8'):
              raise SystemExit('evidence update missing Source 9')
          if '1454. **July 2012 catalog/artifact closure ≠ full normative facsimile inspection or invention priority**' not in Path(index).read_text(encoding='utf-8'):
              raise SystemExit('index update missing final finding')
          PY

          rm .github/workflows/case76-jesd219a-trace-deepening.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/76-jedec-ssd-endurance-retention-qualification.md \
                  evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md \
                  ROADMAP.md CASE_INDEX.md \
                  .github/workflows/case76-jesd219a-trace-deepening.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'case76: ground JESD219A client trace artifact boundary'
          git push
