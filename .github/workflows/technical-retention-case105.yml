name: technical-retention-case105-one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-retention-case105.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate bounded Case 105
        run: python .github/integration/technical_retention_case105.py
      - name: Validate and commit research slice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [
              Path('cases/105-micron-lpddr2-per-bank-refresh-maintenance-granularity.md'),
              Path('evidence/105-micron-2014-2015-lpddr2-per-bank-refresh-grounding.md'),
              Path('cases/104-micron-lpddr-selective-adaptive-self-refresh.md'),
              Path('ROADMAP.md'),
              Path('CASE_INDEX.md'),
          ]:
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -Fq '105-micron-lpddr2-per-bank-refresh-maintenance-granularity.md' ROADMAP.md
          grep -Fq 'Case 105 — Micron LPDDR2 per-bank REFRESH findings' CASE_INDEX.md
          grep -Fq 'maintenance transaction scope ≠ retained-set scope' CASE_INDEX.md
          grep -Fq 'Case 105' cases/104-micron-lpddr-selective-adaptive-self-refresh.md
          test -f cases/105-micron-lpddr2-per-bank-refresh-maintenance-granularity.md
          test -f evidence/105-micron-2014-2015-lpddr2-per-bank-refresh-grounding.md
          rm .github/integration/technical_retention_case105.py .github/workflows/technical-retention-case105.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m 'case105: ground LPDDR2 per-bank refresh boundary'
          git push origin HEAD:main
