name: integrate-case58

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/integrate_case58.py'
      - '.github/workflows/integrate-case58.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'tmzncty/technical-retention'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 58
        run: |
          set +e
          python .github/scripts/integrate_case58.py
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -q 'After fifty-nine bounded cases' CASE_INDEX.md
            grep -q 'all fifty-nine cases' CASE_INDEX.md
            grep -q '620\.' CASE_INDEX.md
            grep -q 'Raft replicated-state-machine snapshotting / 2014 bounded regime' CASE_INDEX.md
            grep -q 'cases/58-raft-snapshot-log-compaction.md' README.md ROADMAP.md CASE_INDEX.md
          fi
      - name: Commit integrated files and remove one-shot runner
        run: |
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md cases/58-raft-snapshot-log-compaction.md evidence/58-raft-2014-snapshot-log-compaction-grounding.md
          git rm .github/scripts/integrate_case58.py .github/workflows/integrate-case58.yml
          git status --short
          git commit -m "docs: integrate grounded Raft snapshot case"
          git push origin HEAD:main
