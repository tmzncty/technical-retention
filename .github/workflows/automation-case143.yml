name: automation case143 integration

on:
  push:
    branches: [main]
    paths:
      - '.automation/case143-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate Case143 navigation and status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          case_path = Path('cases/143-scsi-background-media-scan-proactive-verification.md')
          evidence_path = Path('evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md')
          if not case_path.exists() or not evidence_path.exists():
              raise SystemExit('Case 143 canonical files are missing')

          # ---- CASE_INDEX ----
          index_path = Path('CASE_INDEX.md')
          ci = index_path.read_text(encoding='utf-8')

          row = '| [SCSI Background Media Scan: Idle-Time Verification, Retained Scan Progress, and Repair-Authority Separation](cases/143-scsi-background-media-scan-proactive-verification.md) | **grounded** | magnetic-disk logical blocks + idle-time drive scan + scan progress/status + medium-error log + typed rewrite/reassignment outcome | separate payload presence, recent verification coverage, foreground-preemptible maintenance, retained traversal/evidence, defect discovery, and repair authority; show drive BMS is neither periodic refresh nor filesystem/distributed scrub | [2005 T10 + 2007 Seagate + 2024 Western Digital grounding](evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md); pre-2005 proprietary/OS genealogy, final standards integration, SMART/offline-test comparison, power-cycle progress persistence, cross-vendor behavior, and fault injection remain open |'

          if row not in ci:
              lines = ci.splitlines()
              anchors = [i for i, line in enumerate(lines)
                         if line.startswith('| [Ceph Reef Capacity-Gated Recovery:')
                         and 'cases/142-ceph-reef-capacity-gated-recovery.md' in line]
              if not anchors:
                  raise SystemExit('Case 142 table row anchor not found')
              lines.insert(anchors[-1] + 1, row)
              ci = '\n'.join(lines) + '\n'

          heading = '## Case 143 — SCSI Background Media Scan findings'
          if heading not in ci:
              nums = [int(x) for x in re.findall(r'(?m)^- \*\*(\d+) —', ci)]
              if not nums:
                  raise SystemExit('No existing finding numbers found')
              n = max(nums) + 1
              findings = [
                  ('2005 T10 BMS standardization != invention', 'T10/04-198r5 explicitly says several drive vendors already had proprietary methods and many systems already scanned media in their operating systems; the 2005 slice is a standard-control/status witness, not a first-invention claim. (`H/P`, `X`)'),
                  ('payload presence != recent proactive verification', 'BMS exists because a logical block can remain present while proactive reads are still useful for discovering difficult or unreadable medium locations before demand does. (`H/P`, `E`)'),
                  ('ordinary demand read != BMS verification read', 'T10 defines background scanning as medium reads for defect discovery/logging/correction and says scanned blocks are not retained in cache merely because BMS read them. (`H/P`, `E`)'),
                  ('BMS enabled != BMS currently executing', 'interval and idle-time gates can leave the feature enabled but dormant; foreground traffic can also suspend active scanning. (`H/P`, `E`)'),
                  ('foreground preemption != maintenance cancellation', 'T10/05-340r0 and Seagate 2007 show host commands interrupting background work while the scan later resumes from its prior position. (`H/P`, `E`)'),
                  ('resume from scan position != demonstrated power-loss checkpoint', 'the inspected sources establish continuation across foreground interruption and, for HC590, disable/re-enable, but do not prove the scan cursor survives arbitrary reset or power loss. (`H/P`, `X`)'),
                  ('scan progress != defect-event ledger', 'BMS status/progress is reported separately from medium-scan defect parameters, and T10 allows result entries to be cleared while scan status remains. (`H/P`, `E`)'),
                  ('cumulative scan count != per-LBA verification history', 'Western Digital HC590 reports lifetime background-scan counts and current progress, but neither field records a complete verification history for each logical block. (`H/P`, `E`)'),
                  ('one completed scan != future integrity guarantee', 'the T10 model returns to an interval and later starts another full cycle, so a completed traversal is bounded evidence at one time rather than a timeless certificate. (`H/P`, `E`)'),
                  ('BMS interval != physical retention deadline', 'the configured interval schedules recurring maintenance; the sources do not identify it as a magnetic-decay deadline analogous to DRAM refresh. (`H/P`, `X`)'),
                  ('defect detected != defect repaired', 'T10 REASSIGN STATUS distinguishes no action, pending host action, successful reassignment, failed reassignment, and rewrite recovery. (`H/P`, `E`)'),
                  ('BMS support != automatic in-scan reassignment', 'Seagate 2007 makes logging/reallocation depend on ARRE/AWRE, while Western Digital HC590 2024 explicitly says reassignment during background scan is not supported. (`H/P`, `E`)'),
                  ('standardized BMS vocabulary != identical vendor repair policy', 'the Seagate and Western Digital named products expose related BMS semantics while differing in in-scan reassignment behavior. (`H/P`, `X`)'),
                  ('maintenance execution lifetime != maintenance-evidence lifetime', 'status, progress, defect entries, and cumulative counters can remain observable outside one active scan burst; those state classes remain distinct from payload. (`H/P`, `E`)'),
                  ('drive BMS != filesystem checksum scrub', 'Case 18 ZFS scrub verifies filesystem/pool checksums and uses ZFS redundancy; SCSI BMS qualifies medium readability under drive-local error-recovery semantics. (`A`, `X`)'),
                  ('drive BMS != HDFS replica verification', 'Case 83 verifies HDFS block/checksum relations and reports corrupt replicas to distributed authority; BMS is below HDFS identity/currentness. (`A`, `X`)'),
                  ('media verification != defect reassignment != RAID rebuild', 'Case 143 supplies a proactive discovery path, Case 14 supplies logical identity across physical reassignment, and Case 136 supplies failed-member rebuild scheduling; sharing a maintenance context does not make the mechanisms equivalent. (`A`, `X`)'),
                  ('reassignment or log clearing != secure erasure', 'logical/physical defect management and deletion of BMS result entries do not establish overwrite, degaussing, sanitize, or forensic disappearance of previous sector content. (`E`, `X`)'),
                  ('inspection obligation as bounded retention relation', 'a medium can remain ordinarily serviceable while the system preserves a recurring opportunity to inspect it and enough state to continue/report that work; this is an engineering/philosophical interpretation, not source-era SCSI theory. (`E`, `I`)'),
                  ('related-repository boundary', 'a fresh `tmzncty/computing-archaeology` search for `background media scan SCSI` found no dedicated study; broader disk-scrubbing/SMART/SCSI genealogy and media physics belong there if developed, while Case 143 keeps the retention-specific inspection/progress/repair-authority comparison. (`H/P` project-state record)')
              ]
              sec = [heading, '', 'Grounding record: [`evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md`](evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md).', '']
              for title, body in findings:
                  sec.append(f'- **{n} — {title}:** {body}')
                  n += 1
              ci = ci.rstrip() + '\n\n' + '\n'.join(sec) + '\n'

          index_path.write_text(ci, encoding='utf-8')

          # ---- ROADMAP ----
          roadmap_path = Path('ROADMAP.md')
          rm = roadmap_path.read_text(encoding='utf-8')

          completed = '- [x] Case 143 SCSI Background Media Scan proactive-verification / repair-authority slice — [`cases/143-scsi-background-media-scan-proactive-verification.md`](cases/143-scsi-background-media-scan-proactive-verification.md) + [`evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md`](evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md): T10/04-198r5 and 05-340r0 separate idle-time drive scanning, foreground preemption, resume-from-position, scan progress/status, defect-result evidence, and typed repair/reassignment outcomes; the proposal itself records pre-existing proprietary vendor and OS scanning, blocking a 2005 invention claim. Seagate Cheetah 15K.5 (2007) grounds named-product idle scanning and ARRE/AWRE-dependent handling, while Western Digital HC590 (2024) provides a counterexample in which in-scan reassignment is not supported while lifetime scan counts and resume-after-disable remain exposed. This closes only the bounded `payload presence vs proactive verification vs retained maintenance progress/evidence vs repair authority` relation; pre-2005 genealogy, final standards integration, SMART/offline-test comparison, power-cycle progress persistence, cross-vendor behavior, and fault injection remain open.'

          if 'Case 143 SCSI Background Media Scan proactive-verification / repair-authority slice' not in rm:
              lines = rm.splitlines()
              anchors = [i for i, line in enumerate(lines)
                         if 'Case 142 Ceph Reef capacity-gated recovery / repair-headroom slice' in line]
              if not anchors:
                  raise SystemExit('ROADMAP Case 142 completed-slice anchor not found')
              lines.insert(anchors[-1] + 1, completed)
              rm = '\n'.join(lines) + '\n'

          lines = rm.splitlines()
          raid_found = False
          for i, line in enumerate(lines):
              if line.startswith('- [ ] RAID / scrubbing / rebuild'):
                  raid_found = True
                  line = line.replace('**partially advanced by grounded Cases 17, 18, and 140**', '**partially advanced by grounded Cases 17, 18, 140, and 143**')
                  sentence = ' Case 143 adds the device-level proactive-inspection boundary: SCSI BMS can scan idle media, yield to foreground work, retain/report traversal and defect state, and hand detected problems into distinct rewrite/reassignment paths; this remains below filesystem/distributed checksum scrub and does not make scan completion equivalent to repair.'
                  marker = ' The broad item stays unchecked because'
                  if 'Case 143 adds the device-level proactive-inspection boundary' not in line:
                      if marker not in line:
                          raise SystemExit('RAID/scrub roadmap tail marker not found')
                      line = line.replace(marker, sentence + marker, 1)
                  lines[i] = line
                  break
          if not raid_found:
              raise SystemExit('RAID/scrub/rebuild roadmap item not found')

          rm = '\n'.join(lines) + '\n'
          roadmap_path.write_text(rm, encoding='utf-8')
          PY

          test "$(grep -c '^| \[SCSI Background Media Scan:' CASE_INDEX.md)" -eq 1
          test "$(grep -c '^## Case 143 — SCSI Background Media Scan findings$' CASE_INDEX.md)" -eq 1
          test "$(grep -c 'Case 143 SCSI Background Media Scan proactive-verification / repair-authority slice' ROADMAP.md)" -eq 1
          test "$(grep -c 'Case 143 adds the device-level proactive-inspection boundary' ROADMAP.md)" -eq 1
          git diff --check

          git rm -f --ignore-unmatch .automation/case143-trigger.txt .github/workflows/automation-case143.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Case143 navigation changes to commit'
            exit 0
          fi
          git commit -m 'case143: integrate SCSI background-scan navigation'
          git push origin HEAD:main