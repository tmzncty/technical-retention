name: one-shot Case 27 deep-scrub prior-art deepening

on:
  push:
    paths:
      - '.github/workflows/case27-deep-scrub-prior-art.yml'

permissions:
  contents: write

jobs:
  deepen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research deepening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"marker not unique in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # --- Case 27: add the 2012 Ceph-internal prior-art floor without widening
          # the bounded Luminous claim into a generic Ceph history.
          case = Path('cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md')
          text = case.read_text()
          scope_marker = "- **Research question:** when an erasure-coded object is mutable, what additional retained integrity state is required to decide whether a surviving fragment is trustworthy, and what happens when that integrity state itself is wrong?\n"
          scope_add = scope_marker + "- **Historical prior-art boundary:** Ceph's own replicated-PG `deep scrub` implementation is anchored separately to September–October 2012. That earlier mechanism is used to prevent a false Luminous-era origin claim; it is not treated as if 2012 replicated scrub already had 2017 BlueStore/EC semantics.\n"
          if scope_marker not in text:
              raise SystemExit('Case 27 scope marker missing')
          text = text.replace(scope_marker, scope_add, 1)

          vocab_marker = "- `EIO`;\n- `inconsistencies`.\n"
          vocab_new = "- `EIO`;\n- `inconsistencies`;\n- in the 2012 deep-scrub source: `crc32`, `last_deep_scrub`, `last_deep_scrub_stamp`, `deep_scrub`, and `repair`.\n"
          if vocab_marker not in text:
              raise SystemExit('Case 27 vocabulary marker missing')
          text = text.replace(vocab_marker, vocab_new, 1)

          hist_marker = "### H/P — Luminous ties EC overwrites to BlueStore integrity support\n"
          hist_insert = """### H/P — Ceph `deep scrub` predates Luminous and was originally a replicated-PG comparison\n\nCeph commit [`9013efd3a3cf92d1ec8e2a39639214792067d0d2`](https://github.com/ceph/ceph/commit/9013efd3a3cf92d1ec8e2a39639214792067d0d2), dated 5 September 2012, introduced the first bounded deep-scrub witness used here. Its commit message says that deep scrub reads every file's contents from the store, computes a `crc32` digest, and has the primary compare digests across replicas; a mismatch marks the PG `inconsistent`. The patch separately added `last_deep_scrub` / `last_deep_scrub_stamp` state and a default `osd_deep_scrub_interval` of one week.\n\nThe same source preserves an important compatibility limit. OSDs without deep-scrub support fall back to ordinary chunky scrub, while only the subset of OSDs that support the feature contribute comparable content digests. Therefore a request for `deep scrub` during a mixed-capability rollout did **not** by itself prove that every replica had received equivalent content-level verification.\n\nA companion documentation commit, [`3fd5914cf35829c3f2e9e5c0a548fae0862732aa`](https://github.com/ceph/ceph/commit/3fd5914cf35829c3f2e9e5c0a548fae0862732aa), explicitly distinguished three operations in the September 2012 vocabulary:\n\n- `scrub`: compare replica object metadata and mark a discrepancy `inconsistent`;\n- `deep-scrub`: compare object contents in addition to metadata;\n- `repair`: on an inconsistent replicated PG, replace inconsistent objects with the primary's copy.\n\nCeph's official [`v0.53` release notice](https://www.ceph.io/en/news/blog/2012/v0-53-released/), dated 16 October 2012, then listed the new deep scrub as comparing object content across replicas, once per week by default.\n\nThese records change the historical boundary of the present case. **Luminous did not introduce Ceph's concept of deep scrub.** The Luminous-specific contribution studied below is instead the later composition of mutable EC overwrites, BlueStore-retained checksums, scheduled deep scrub, and a release incident in which the integrity metadata itself lost authority.\n\nThe 2012 repair wording is also intentionally bounded: `replace with the primary's copy` is a historical policy statement for that replicated-PG path, not proof that the primary is objectively correct. Case 29's 2018 source-level analysis later shows a more qualified `authoritative` candidate-selection path and even preserves explicit uncertainty about correctness.\n\n**Primary anchors:** Ceph commits `9013efd3...` and `3fd5914c...`; official Ceph `v0.53 released` notice, 16 October 2012.\n\n""" + hist_marker
          if hist_marker not in text:
              raise SystemExit('Case 27 historical marker missing')
          text = text.replace(hist_marker, hist_insert, 1)

          prior_marker = "Case 26 already documents a 2003 GFS functional precedent for proactive background integrity verification under the phrase `scan and verify`; Case 18 records a 2004 direct `disk scrubbing` terminology anchor. Reed–Solomon and distributed EC prior art are already controlled in Cases 19 and 24.\n"
          prior_new = "Case 26 already documents a 2003 GFS functional precedent for proactive background integrity verification under the phrase `scan and verify`; Case 18 records a 2004 direct `disk scrubbing` terminology anchor. Within Ceph itself, the September–October 2012 source/release record now establishes `deep scrub` as a replicated-PG metadata/content-comparison mechanism years before Luminous. Reed–Solomon and distributed EC prior art are already controlled in Cases 19 and 24.\n\nThis gives the case a three-level prior-art discipline: **earlier distributed integrity verification (GFS 2003) ≠ generic disk-scrub terminology/history (2004) ≠ Ceph's own replicated `deep scrub` implementation (2012) ≠ Luminous BlueStore/EC integrity-metadata authority (2017–2018).** Chronology and functional resemblance do not prove a direct genealogy among the first two external precedents and Ceph.\n"
          if prior_marker not in text:
              raise SystemExit('Case 27 prior-art marker missing')
          text = text.replace(prior_marker, prior_new, 1)

          limits_marker = "Most importantly, the present source set does **not** fully ground the exact per-shard reconstruction/authoritative-source algorithm used after every scrub-detected error; that is handled separately in Case 29.\n"
          limits_new = limits_marker + "\nThe 2012 compatibility path adds another limit: **`deep-scrub requested ≠ every replica content-qualified`** when some OSDs do not support deep scrub. It is a historical rolling-upgrade boundary, not a claim about modern homogeneous clusters. Likewise, matching `crc32` values are error-detection evidence within that implementation, not cryptographic authentication or proof that every underlying physical failure mode has been excluded.\n"
          if limits_marker not in text:
              raise SystemExit('Case 27 limit marker missing')
          text = text.replace(limits_marker, limits_new, 1)
          case.write_text(text)

          # --- Evidence record: turn the 2012 source inspection into an explicit
          # primary evidence class while keeping the stable filename.
          ev = Path('evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md')
          text = ev.read_text()
          old_title = "# Case 27 Grounding Record — Ceph Luminous EC Overwrites, BlueStore Checksums, and Deep Scrub (2017–2018)"
          new_title = "# Case 27 Grounding Record — Ceph Deep-Scrub Prior Art and Luminous EC Integrity Authority (2012–2018)"
          if old_title not in text:
              raise SystemExit('Evidence 27 title marker missing')
          text = text.replace(old_title, new_title, 1)

          class_marker = "## Evidence classes\n\n### P1 — official Luminous release record\n"
          class_insert = """## Evidence classes\n\n### P0 — Ceph 2012 deep-scrub implementation, command semantics, and release record\n\nThree project-primary records establish the pre-Luminous floor directly:\n\n- `ceph/ceph` commit [`9013efd3a3cf92d1ec8e2a39639214792067d0d2`](https://github.com/ceph/ceph/commit/9013efd3a3cf92d1ec8e2a39639214792067d0d2), 5 September 2012: content reads, per-object `crc32`, primary-side replica digest comparison, `inconsistent` marking, weekly deep-scrub interval state, and mixed-capability fallback;\n- companion documentation commit [`3fd5914cf35829c3f2e9e5c0a548fae0862732aa`](https://github.com/ceph/ceph/commit/3fd5914cf35829c3f2e9e5c0a548fae0862732aa), 5 September 2012: explicit separation of `scrub`, `deep-scrub`, and `repair`;\n- official [`v0.53 released`](https://www.ceph.io/en/news/blog/2012/v0-53-released/) notice, 16 October 2012: new deep scrub compares object content across replicas, weekly by default.\n\nThis is an internal Ceph prior-art floor for the term/mechanism. It does not back-project BlueStore, mutable EC overwrite support, or Luminous digest semantics into 2012.\n\n### P1 — official Luminous release record\n"""
          if class_marker not in text:
              raise SystemExit('Evidence 27 class marker missing')
          text = text.replace(class_marker, class_insert, 1)

          ledger_marker = "## Direct source ledger\n\n### 1. `v12.2.0` release notice — BlueStore + EC overwrite boundary\n"
          ledger_insert = """## Direct source ledger\n\n### 0. September–October 2012 — replicated deep scrub before Luminous\n\nDirectly established by the two September commits plus the October `v0.53` release notice:\n\n- ordinary `scrub` compares replica object metadata; `deep-scrub` adds content comparison;\n- the initial implementation reads object/file content from the store and computes a `crc32` digest;\n- the primary compares replica digests and marks the PG `inconsistent` on mismatch;\n- `repair` is documented separately from detection and, in this bounded replicated path, replaces inconsistent objects with the primary's copy;\n- `last_deep_scrub` and `last_deep_scrub_stamp` make verification history/recency explicit retained operational state;\n- `osd_deep_scrub_interval` defaults to one week in the introduced configuration;\n- an OSD that does not support deep scrub falls back to ordinary chunky scrub, while supported members' digests are compared.\n\nEvidence use:\n\n- prevents a false `Luminous introduced deep scrub` claim;\n- grounds `replica multiplicity ≠ verified replica agreement`;\n- grounds `scrub detection ≠ repair`;\n- grounds a rolling-capability boundary in which **requested maintenance level and achieved verification coverage can differ**;\n- keeps 2012 replicated digest comparison distinct from 2017 BlueStore per-storage checksum authority and from 2018 EC repair-source selection.\n\n### 1. `v12.2.0` release notice — BlueStore + EC overwrite boundary\n"""
          if ledger_marker not in text:
              raise SystemExit('Evidence 27 ledger marker missing')
          text = text.replace(ledger_marker, ledger_insert, 1)

          inspect_marker = "The tag-matched Ceph source documentation was read directly from GitHub at `v12.2.0`. These are text/source files, so no PDF facsimile or screenshot claim is involved.\n"
          inspect_new = "The September 2012 implementation/documentation commits were inspected directly at their exact Git SHAs, including their patches and commit messages. The tag-matched Luminous source documentation was read directly from GitHub at `v12.2.0`. These are text/source files, so no PDF facsimile or screenshot claim is involved.\n"
          if inspect_marker not in text:
              raise SystemExit('Evidence 27 inspection marker missing')
          text = text.replace(inspect_marker, inspect_new, 1)

          term_marker = "No invention-priority claim is made:\n\n- Case 26 already records GFS 2003 `scan and verify` as a proactive background-integrity precedent;\n- Case 18 records 2004 `disk scrubbing` terminology/prior art;\n"
          term_new = "No invention-priority claim is made:\n\n- Case 26 already records GFS 2003 `scan and verify` as a proactive background-integrity precedent;\n- Case 18 records 2004 `disk scrubbing` terminology/prior art;\n- Ceph's own 2012 source/release record establishes its replicated `deep scrub` before the 2017–2018 Luminous regime, so Luminous is not treated as the origin of Ceph scrub semantics;\n"
          if term_marker not in text:
              raise SystemExit('Evidence 27 terminology marker missing')
          text = text.replace(term_marker, term_new, 1)

          maturity_marker = "1. the 2017 mechanism is supported by official release documentation and tag-matched project source files;\n"
          maturity_new = "1. the 2012 deep-scrub floor is supported by exact project commits plus the official `v0.53` release notice, and the 2017 mechanism is supported by official release documentation and tag-matched project source files;\n"
          if maturity_marker not in text:
              raise SystemExit('Evidence 27 maturity marker missing')
          text = text.replace(maturity_marker, maturity_new, 1)
          ev.write_text(text)

          # --- README navigation: make the 2012/Luminous distinction visible.
          old_readme = "- [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) — grounded coded-integrity bridge: Luminous ties mutable erasure-coded overwrites to BlueStore checksumming and deep scrub, while the 12.2.6–12.2.8 digest regression shows that integrity metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before ordinary trust is restored."
          new_readme = "- [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) — grounded coded-integrity bridge with a 2012 Ceph-internal prior-art floor: early replicated `scrub`/`deep-scrub` separates metadata comparison, content-digest comparison, inconsistency detection, and repair; Luminous later ties mutable erasure-coded overwrites to BlueStore checksumming, while the 12.2.6–12.2.8 digest regression shows that integrity metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before ordinary trust is restored."
          replace_once('README.md', old_readme, new_readme)

          # --- ROADMAP: record this as a completed evidence-deepening slice and
          # remove stale wording that still treated distributed scrub as wholly open.
          roadmap = Path('ROADMAP.md')
          r = roadmap.read_text()
          phase_marker = "- [x] ZFS snapshot reference-pinning / deferred reclamation boundary — [`cases/99-zfs-snapshot-reference-pinned-retention.md`](cases/99-zfs-snapshot-reference-pinned-retention.md), grounded by [`evidence/99-zfs-1994-2010-snapshot-reference-grounding.md`](evidence/99-zfs-1994-2010-snapshot-reference-grounding.md): a 2010 Solaris ZFS snapshot keeps an older point-in-time tree admissible by retaining references to old blocks, separating live-dataset supersession from reclamation eligibility; `hold`, clone dependencies, and `defer_destroy` further separate destroy intent from permission/completion. WAFL 1994 is retained only as an earlier COW-snapshot prior-art floor, not as proven direct genealogy. Broader filesystem snapshot/COW lineage, ZFS send/receive retention policy, clone genealogy, field space-exhaustion behavior, and secure media erasure remain open.\n"
          phase_add = phase_marker + "- [x] Ceph `deep scrub` historical prior-art deepening — canonical [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md), with stable [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md), now adds exact September 2012 implementation/documentation commits plus the October 2012 `v0.53` release record. The earlier replicated-PG path separates metadata scrub, content-level CRC32 comparison, inconsistency marking, repair, retained last-deep-scrub time, and mixed-capability fallback. This prevents a false Luminous-origin claim while keeping 2012 replica comparison distinct from 2017 BlueStore checksum authority and 2018 EC authoritative-shard reconstruction. GFS 2003 and disk-scrubbing 2004 remain external prior-art floors, not asserted direct genealogy.\n"
          if phase_marker not in r:
              raise SystemExit('ROADMAP Phase 2 Case 99 marker missing')
          r = r.replace(phase_marker, phase_add, 1)

          old_raid_tail = "The broad item stays unchecked because double-parity/RAID-6, named production-controller rebuild/crash semantics, rebuild throttling, later URE-aware policy, and distributed scrub protocols remain distinct work;"
          new_raid_tail = "The broad item stays unchecked because named production-controller rebuild/crash semantics, rebuild throttling, later URE-aware policy, and broader cross-system scrub/repair protocols remain distinct work; Case 27 now partially advances the distributed-scrub history with Ceph's exact 2012 replicated deep-scrub introduction without turning that one implementation into a universal protocol genealogy;"
          if old_raid_tail not in r:
              raise SystemExit('ROADMAP RAID tail marker missing')
          r = r.replace(old_raid_tail, new_raid_tail, 1)

          old_case27_roadmap = "[`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md), grounded by [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md), adds a bounded mutable-EC integrity regime: Luminous gates EC overwrites on BlueStore checksum/deep-scrub support, while the 12.2.6–12.2.8 digest incident shows that the integrity metadata used to qualify stored state can itself become inconsistent, temporarily lose authority, and require a full verification/repair pass before trust is restored."
          new_case27_roadmap = "[`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md), grounded by [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md), now carries a 2012 Ceph-internal deep-scrub prior-art floor before its bounded Luminous regime: early replicated PGs distinguish metadata scrub, content CRC32 comparison, inconsistency detection, and repair, while Luminous later gates EC overwrites on BlueStore checksum/deep-scrub support and the 12.2.6–12.2.8 digest incident shows that integrity metadata itself can become inconsistent, temporarily lose authority, and require a full verification/repair pass before trust is restored."
          if old_case27_roadmap not in r:
              raise SystemExit('ROADMAP distributed Case 27 marker missing')
          r = r.replace(old_case27_roadmap, new_case27_roadmap, 1)

          old_next = "Prefer a new bounded bridge that adds a genuinely different retention relation: a **mutable coded-object currentness** case, a **local-reconstruction-code repair-geometry** case, **distributed scrub/anti-entropy**, or a revision-specific **later NVMe persistence-domain** case if primary normative text changes the failure/persistence comparison."
          new_next = "Prefer a new bounded bridge that adds a genuinely different retention relation. Mutable coded-object currentness and LRC repair geometry are already grounded in Cases 25 and 24, while distributed verification is now represented by GFS Case 26 and Ceph Case 27 with a 2012 deep-scrub origin anchor. A future distributed-scrub/anti-entropy slice should therefore add a genuinely different failure/authority relation or cross-system synthesis rather than another generic scrub description; revision-specific later NVMe persistence semantics remain useful only if primary normative text changes the comparison."
          if old_next not in r:
              raise SystemExit('ROADMAP next-unit marker missing')
          r = r.replace(old_next, new_next, 1)
          roadmap.write_text(r)

          # --- CASE_INDEX: update canonical row and append source-controlled findings.
          idx = Path('CASE_INDEX.md')
          c = idx.read_text()
          old_row = "| [Ceph Luminous EC Overwrites: BlueStore Checksums, Deep Scrub, and Integrity-Metadata Authority](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) | **grounded** | mutable erasure-coded chunks + CRUSH placement + BlueStore data/metadata checksums + scheduled light/deep scrub + release-scoped digest trust state | separate algebraic EC recoverability from local integrity qualification; show checksum metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before trust is restored | [2017–2018 Ceph Luminous EC scrub grounding](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md); exact `v12.2.8` scrub-repair source selection is now handled separately in Case 29, while later BlueStore checksum evolution and modern auto-repair remain separate work |"
          new_row = "| [Ceph Luminous EC Overwrites: BlueStore Checksums, Deep Scrub, and Integrity-Metadata Authority](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) | **grounded** | 2012 replicated metadata/content scrub + later mutable erasure-coded chunks + CRUSH placement + BlueStore data/metadata checksums + scheduled light/deep scrub + release-scoped digest trust state | separate replica multiplicity from verified agreement and scrub from repair; prevent a Luminous-origin myth; then separate algebraic EC recoverability from local integrity qualification and show checksum metadata itself can become inconsistent, be distrusted, and require requalification | [2012–2018 Ceph deep-scrub/Luminous grounding](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md); exact `v12.2.8` scrub-repair source selection remains Case 29, while broader cross-system scrub genealogy, later BlueStore checksum evolution, and modern auto-repair remain separate work |"
          if old_row not in c:
              raise SystemExit('CASE_INDEX Case 27 row marker missing')
          c = c.replace(old_row, new_row, 1)

          tail = "1318. **retention cost can be deferred into future divergence and reclamation work** — nearly instantaneous snapshot creation can create long-lived space/accounting obligations that become visible only as the live tree changes.\n"
          findings = tail + """\n\n### Case 27 historical deepening — Ceph 2012 deep-scrub prior-art findings\n\n1319. **Ceph deep scrub predates the Luminous EC regime by five years** — exact September 2012 source plus the October `v0.53` release record establish replicated content comparison before BlueStore and mutable-EC overwrite support.\n1320. **ordinary scrub ≠ deep scrub** — the 2012 project documentation separates replica metadata comparison from the deeper operation that also compares object contents.\n1321. **replica multiplicity ≠ verified replica agreement** — several surviving copies can exist while scheduled comparison is still required to establish whether their metadata/content relations agree.\n1322. **inconsistency detection ≠ fault localization** — a digest or metadata disagreement establishes a broken relation among copies; it does not by itself prove which embodiment is objectively correct.\n1323. **2012 primary-based repair authority ≠ proof that the primary is correct** — the period documentation says repair replaces inconsistent replicated objects from the primary, while Case 29's later source preserves explicit uncertainty even in an `authoritative` candidate path.\n1324. **requested deep scrub ≠ complete content-level verification during mixed-capability rollout** — the 2012 compatibility path lets unsupported OSDs fall back to ordinary chunky scrub while only supporting members contribute comparable deep digests.\n1325. **verification recency is retained operational state** — `last_deep_scrub` and `last_deep_scrub_stamp` record that payload persistence and knowledge of when it was last deeply checked are distinct retained relations.\n1326. **configured verification interval ≠ completed verification coverage** — a weekly default expresses scheduling policy; it does not itself prove that every PG/object has finished a deep scrub within that window.\n1327. **CRC agreement ≠ cryptographic authenticity or exhaustive media proof** — the 2012 `crc32` digest is bounded error-detection evidence inside the comparison protocol, not a universal proof about provenance or all physical failure modes.\n1328. **2012 replica digest comparison ≠ 2017 BlueStore checksum authority** — the later Luminous case adds retained storage-backend checksums, mutable EC overwrites, and a checksum-maintenance failure that can make the verifier itself untrustworthy.\n1329. **shared product lineage ≠ unchanged maintenance semantics** — Ceph/RADOS 2006–2007 currentness (Case 05), 2012 replicated deep scrub, 2017 integrity qualification (Case 27), and 2018 EC repair-source selection (Case 29) must remain release-bounded.\n1330. **prior-art chronology ≠ direct genealogy** — GFS 2003 `scan and verify`, 2004 disk-scrubbing research, and Ceph 2012 deep scrub provide earlier functional/terminological floors; chronology alone does not prove one implementation descended directly from another.\n"""
          if tail not in c:
              raise SystemExit('CASE_INDEX findings tail marker missing')
          if '1319. **Ceph deep scrub predates' in c:
              raise SystemExit('CASE_INDEX findings already present')
          c = c.replace(tail, findings, 1)
          idx.write_text(c)
          PY

      - name: Validate bounded integration
        shell: bash
        run: |
          git diff --check
          grep -q '9013efd3a3cf92d1ec8e2a39639214792067d0d2' cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md
          grep -q '3fd5914cf35829c3f2e9e5c0a548fae0862732aa' evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md
          grep -q '^1330\. \*\*prior-art chronology' CASE_INDEX.md
          test "$(grep -c '1319\. \*\*Ceph deep scrub predates' CASE_INDEX.md)" -eq 1

      - name: Commit integrated research and self-clean
        shell: bash
        run: |
          rm .github/workflows/case27-deep-scrub-prior-art.yml
          git add README.md ROADMAP.md CASE_INDEX.md \
            cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md \
            evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md \
            .github/workflows/case27-deep-scrub-prior-art.yml
          git diff --cached --check
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git commit -m 'case27: deepen Ceph deep-scrub prior art'
          git push origin HEAD:main
