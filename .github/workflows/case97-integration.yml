name: Case 97 integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/integrate_case97.py'
      - '.github/workflows/case97-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration
        run: python .github/scripts/integrate_case97.py

      - name: Validate and commit
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "chatgpt-research-agent@users.noreply.github.com"
          git rm .github/scripts/integrate_case97.py .github/workflows/case97-integration.yml
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m "case97: integrate NAND read-disturb retention"
          git push origin HEAD:main
