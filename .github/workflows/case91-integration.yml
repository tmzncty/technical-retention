name: case91-integration

on:
  push:
    paths:
      - '.github/workflows/case91-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 91 navigation and status
        run: python .github/scripts/case91_integrate.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f cases/91-apache-cassandra-tombstone-grace-zombie-prevention.md
          test -f evidence/91-cassandra-2006-2014-tombstone-grace-grounding.md
          grep -Fq 'cases/91-apache-cassandra-tombstone-grace-zombie-prevention.md' README.md
          grep -Fq 'cases/91-apache-cassandra-tombstone-grace-zombie-prevention.md' ROADMAP.md
          grep -Fq 'cases/91-apache-cassandra-tombstone-grace-zombie-prevention.md' CASE_INDEX.md
          grep -Fq 'After ninety-two bounded cases, **all ninety-two cases are now `grounded`.**' CASE_INDEX.md
          grep -Fq '1133. **logical deletion ≠ physical disappearance**' CASE_INDEX.md
          grep -Fq '1148. **deletion evidence has a retirement point**' CASE_INDEX.md
          test ! -e .github/scripts/case91_integrate.py
          test ! -e .github/workflows/case91-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case91: integrate Cassandra tombstone retention'
          git push origin HEAD:main
