name: automation-case38-pli

on:
  push:
    paths:
      - '.github/workflows/automation-case38-pli.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 38 navigation and status
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/case38_integrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-case38-pli.yml .github/scripts/case38_integrate.py
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m "docs: integrate grounded Intel PLI health-validation bridge"
          git push
