name: deepen-case15-badctx

on:
  push:
    paths:
      - '.github/workflows/deepen-case15-badctx.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Deepen Case 15 and integrate navigation
        run: |
          set -euo pipefail
          python3 .github/scripts/deepen_case15_badctx.py
          rm -f .github/scripts/deepen_case15_badctx.py .github/workflows/deepen-case15-badctx.yml
          grep -q 'August 2011 firmware history adds a named-product unsafe-power-loss recovery defect' cases/15-intel-ssd320-power-loss-durability.md
          grep -q 'Source F — Intel SSD Firmware Update Tool release-history compilation' evidence/15-intel-ssd320-power-loss-durability-grounding.md
          grep -q 'substantially advanced at the SSD-device and access-authority layers by grounded Cases 15 and 126' ROADMAP.md
          grep -q '2206' CASE_INDEX.md
          git diff --check
          git config user.name "chatgpt-research-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "case15: deepen named unsafe-power-loss recovery evidence"
          git push origin HEAD:main
