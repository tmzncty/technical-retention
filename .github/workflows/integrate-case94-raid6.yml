name: Integrate Case 94 RAID6 P+Q

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case94-raid6.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate navigation and status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          CASE = 'cases/94-raid6-pq-dual-erasure-corruption-boundary.md'
          EVID = 'evidence/94-raid6-1993-2011-pq-dual-erasure-grounding.md'
          assert Path(CASE).exists()
          assert Path(EVID).exists()

          readme_line = '- [`cases/94-raid6-pq-dual-erasure-corruption-boundary.md`](cases/94-raid6-pq-dual-erasure-corruption-boundary.md) — grounded RAID-6 P+Q bridge: a second independent syndrome extends reconstruction to two known missing contributions, while failure-location knowledge, member-position interpretation, syndrome currentness, and arbitrary corruption diagnosis remain separate retention relations; [grounding](evidence/94-raid6-1993-2011-pq-dual-erasure-grounding.md).'
          ledger_row = '| [RAID-6 P+Q: Dual-Erasure Reconstructability and the Corruption-Location Boundary](cases/94-raid6-pq-dual-erasure-corruption-boundary.md) | **grounded** | block stripe + independent P XOR and Q Reed–Solomon syndromes + member-position/failure-location relation + parity currentness | separate two-known-erasure reconstructability from unknown corruption diagnosis; show extra syndrome expands a typed recovery margin without becoming replication, write-hole closure, or universal integrity | [1993–2011 P+Q / Linux RAID-6 grounding](evidence/94-raid6-1993-2011-pq-dual-erasure-grounding.md); exact RAID-6 genealogy, production-controller crash semantics, modern RAID-Z/dRAID variants, URE-aware rebuild policy, and independent fault injection remain separate work |'
          comparison_row = '| RAID-6 P+Q / 1993–2011 bounded regime | data blocks + independent P XOR and Q finite-field syndromes + member-position/failure-location relation | update both P/Q; reconstruct one/two known missing contributions; rebuild/restore full margin separately; preserve syndrome currentness | surviving direct reads remain ordinary; known missing contributions are reconstructed; arbitrary dual corruption is not generally self-locating | stripe/member index determines Q coefficient; recovery additionally needs which positions failed | physical members may be replaced while the logical stripe contribution is reconstructed; the code relation remains usable only while P/Q/currentness/position relations stay valid | no complete history; retains current coded constraints plus bounded layout/failure/currentness state needed by the recovery model |'
          findings = '''### Case 94 — RAID-6 P+Q dual-erasure findings

1181. **one-parity reconstructability ≠ two-syndrome reconstructability** — P+Q adds an independent relation that can solve two known missing contributions; it is not merely a second copy of RAID5 parity.

1182. **P syndrome ≠ Q syndrome** — in the bounded Linux P+Q formulation, P is ordinary XOR while Q is a position-weighted Reed–Solomon / finite-field relation.

1183. **two redundant disks ≠ two full replicas** — lost data are synthesized from coded constraints rather than selected from two complete duplicate payloads.

1184. **two known drive losses ≠ arbitrary two-drive corruption recovery** — known missing positions and unknown silent-corruption locations create different recovery problems.

1185. **erasure-location knowledge can be constitutive recovery state** — Anvin's equations and Linux's `faila` / `failb` interface require the failed positions as inputs to two-data reconstruction.

1186. **disk-position identity ≠ incidental layout detail** — Q coefficients depend on position, so stripe/member ordering participates in how the retained redundancy is interpreted.

1187. **surviving syndrome bytes ≠ trustworthy redundancy if the coded relation is stale** — currentness remains a prerequisite to admissible reconstruction.

1188. **dual-erasure tolerance ≠ write-hole closure** — an extra syndrome increases coded equations; it does not make multi-member updates crash-atomic.

1189. **first-failure survival ≠ unchanged future-failure margin** — a RAID-6 array may continue after one known loss while having consumed part of its bounded two-erasure margin.

1190. **degraded service ≠ restored redundancy** — completed rebuild/repair, not mere continued I/O, re-establishes the full bounded redundancy margin.

1191. **a third independent missing contribution ≠ covered by this two-syndrome case** — the bounded P+Q relation should not be generalized into universal recoverability.

1192. **successful algebraic reconstruction ≠ corruption diagnosis** — solving for values at known failed positions does not establish which apparently present member is wrong.

1193. **dual-corruption ambiguity can make automated repair harmful** — Anvin's diagnostic warning shows that unjustified source/fault selection can propagate corruption into another member.

1194. **P+Q RAID-6 ≠ all double-failure coding** — EVENODD provides a contemporary two-redundant-disk alternative using XOR-only coding, blocking a one-algorithm story.

1195. **Chen 1993 RAID Level 6 ≠ universal invention-priority proof** — the report grounds period taxonomy and mechanism, not every earlier/later double-parity genealogy claim.

1196. **additional redundancy is failure-model-relative information** — the second independent syndrome expands solvable unknowns under the known-erasure/currentness model; it does not automatically add equivalent fault-location or integrity knowledge.'''

          # README repository map.
          rp = Path('README.md')
          text = rp.read_text()
          if CASE not in text:
              start = text.index('## Repository map')
              end = text.find('\n---\n', start)
              assert end > start
              seg = text[start:end]
              matches = list(re.finditer(r'(?m)^- \[`cases/\d{2}-[^`]+`\]\([^\n]+\).*$', seg))
              assert matches
              pos = start + matches[-1].end()
              text = text[:pos] + '\n' + readme_line + text[pos:]
              rp.write_text(text)

          # ROADMAP explicit RAID gap.
          roadp = Path('ROADMAP.md')
          road = roadp.read_text()
          if CASE not in road:
              m = re.search(r'(?m)^- \[ \] RAID / scrubbing / rebuild —.*$', road)
              assert m
              line = m.group(0)
              assert 'grounded Cases 17 and 18' in line
              assert 'double-parity/RAID-6' in line
              line = line.replace('grounded Cases 17 and 18', 'grounded Cases 17, 18, and 94', 1)
              line = line.replace('double-parity/RAID-6, ', '', 1)
              phrase = 'The broad item stays unchecked because'
              assert phrase in line
              addition = ' [`cases/94-raid6-pq-dual-erasure-corruption-boundary.md`](cases/94-raid6-pq-dual-erasure-corruption-boundary.md), with [grounding](evidence/94-raid6-1993-2011-pq-dual-erasure-grounding.md), now separates P+Q two-known-erasure reconstruction from unknown-corruption diagnosis and keeps syndrome currentness/write-hole closure distinct.'
              line = line.replace(phrase, addition + ' ' + phrase, 1)
              road = road[:m.start()] + line + road[m.end():]
              roadp.write_text(road)

          # CASE_INDEX ledger.
          ip = Path('CASE_INDEX.md')
          idx = ip.read_text()
          if CASE not in idx:
              lines = idx.splitlines()
              hits = [i for i, ln in enumerate(lines) if 'cases/93-dram-variable-retention-time-profile-staleness.md' in ln and ln.startswith('| [')]
              assert len(hits) == 1, hits
              lines.insert(hits[0] + 1, ledger_row)
              idx = '\n'.join(lines) + ('\n' if idx.endswith('\n') else '')

          if 'RAID-6 P+Q / 1993–2011 bounded regime' not in idx:
              cstart = idx.index('## Comparison matrix — provisional')
              cend = idx.index('## Cross-case findings already supported', cstart)
              seg = idx[cstart:cend]
              rows = list(re.finditer(r'(?m)^\| .*\|$', seg))
              assert rows
              pos = cstart + rows[-1].end()
              idx = idx[:pos] + '\n' + comparison_row + idx[pos:]

          if '### Case 94 — RAID-6 P+Q dual-erasure findings' not in idx:
              m = re.search(r'(?m)^1180\..*$', idx)
              assert m
              idx = idx[:m.end()] + '\n\n' + findings + idx[m.end():]

          stale_gate = 'currently eighty-eight (Cases 00–87)'
          if stale_gate in idx:
              idx = idx.replace(stale_gate, 'currently ninety-three active canonical bounded cases (with intentional numbering gaps after duplicate consolidation)', 1)
          ip.write_text(idx)

          active = list(Path('cases').glob('[0-9][0-9]-*.md'))
          assert len(active) == 93, len(active)
          assert rp.read_text().count(CASE) == 1
          assert CASE in roadp.read_text()
          assert ip.read_text().count(CASE) == 1
          assert '1181.' in ip.read_text() and '1196.' in ip.read_text()
          assert 'RAID-6 P+Q / 1993–2011 bounded regime' in ip.read_text()
          print('Case 94 navigation validated; active canonical cases:', len(active))
          PY
          git diff --check
          rm -f .github/workflows/integrate-case94-raid6.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case94: integrate RAID-6 dual-erasure navigation'
          git push
