name: Integrate Case 41 GC grace history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case41-gc-grace-history-deepening.yml'
      - 'scripts/integrate_case41_gc_grace_history.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply bounded Case 41 deepening
        run: python scripts/integrate_case41_gc_grace_history.py
      - name: Normalize changed research files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md',
              'evidence/41-cassandra-3x-tombstone-repair-grounding.md',
              'ROADMAP.md',
              'CASE_INDEX.md',
          ]:
              p = Path(name)
              lines = p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY
      - name: Validate diff and markers
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Historical deepening — Apache Incubator Cassandra 2009 grace-policy floor' cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md
          grep -q 'P12 — Apache Incubator Cassandra GC-grace configurability commit' evidence/41-cassandra-3x-tombstone-repair-grounding.md
          grep -q 'Case 41 historical-policy deepening — Apache Cassandra 2009 GC-grace floor' ROADMAP.md
          grep -q 'Case 41 deepening — Apache Cassandra 2009 GC-grace policy floor' CASE_INDEX.md
      - name: Commit research integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md evidence/41-cassandra-3x-tombstone-repair-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m "case41: deepen Cassandra gc-grace history"
          git push
