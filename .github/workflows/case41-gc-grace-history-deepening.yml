name: Case 41 GC grace historical deepening

on:
  push:
    paths:
      - '.github/workflows/case41-gc-grace-history-deepening.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Case 41 deepening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text.rstrip() + '\n', encoding='utf-8')

          case_path = Path('cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md')
          evidence_path = Path('evidence/41-cassandra-3x-tombstone-repair-grounding.md')
          roadmap_path = Path('ROADMAP.md')
          index_path = Path('CASE_INDEX.md')

          case = read(case_path)
          old = '- **Bounded system:** Apache Cassandra 3.x operational semantics, using the Cassandra 3.11 documentation/branch as the principal inspected artifact and the 3.x `NEWS.txt` record for the repaired-tombstone option.'
          new = '- **Bounded system:** Apache Cassandra 3.x operational semantics remain the principal behavior layer, with bounded historical floors from Apache Incubator Cassandra in 2009 and Cassandra 1.2.19 in 2014; these older artifacts are used only where they directly expose deletion-marker retention and reclamation policy.'
          if old not in case:
              raise SystemExit('Case 41 scope anchor missing')
          case = case.replace(old, new, 1)

          old = '- **Primary source base:** Apache Cassandra 3.11 official documentation, Apache Cassandra source/tests on the `cassandra-3.11` branch, and Apache Cassandra `NEWS.txt`.'
          new = '- **Primary source base:** Apache Cassandra 3.11 official documentation; Apache Cassandra source/tests and release records; exact Apache git history for the 17 April 2009 GC-grace configurability change and the 11 August 2015 repaired-tombstone purge option; plus bounded 1.2.19 implementation evidence.'
          if old not in case:
              raise SystemExit('Case 41 primary-source anchor missing')
          case = case.replace(old, new, 1)

          heading = '## Historical deepening — Cassandra 1.2.19, local purge ordering, and pre-Cassandra prior art'
          if heading not in case:
              raise SystemExit('Case 41 historical-deepening heading missing')
          new_section = r'''## Historical deepening — Apache Incubator Cassandra 2009 grace-policy floor

This earlier slice sharpens the chronology of a mechanism already present in the canonical case. It does **not** identify the invention date of Cassandra tombstones or grace-period reclamation.

### H/P — by 17 April 2009, GC grace was an explicit configurable propagation/failure budget

Apache Incubator Cassandra commit [`fa1f80f40da0bb629c40bf09791c6c90f2608774`](https://github.com/apache/cassandra/commit/fa1f80f40da0bb629c40bf09791c6c90f2608774), committed on **17 April 2009**, changed a fixed `GC_GRACE_IN_SECONDS` into a configuration value. The added `storage-conf.xml` comment says the interval is the time to wait before garbage-collecting deletion markers and instructs operators to choose a value large enough that they are confident the deletion marker will have propagated to all replicas by then, even in the face of hardware failures. The shipped example/default is `864000` seconds, ten days.

That wording is direct historical implementation evidence for the intended operational relation:

```text
retained deletion marker
    + chosen failure/propagation interval
    -> later eligibility for garbage collection
```

It is **not** evidence that the timer itself performs propagation or proves convergence.

### H/P — the 2009 configurability commit is not the origin of GC grace

The same diff removes an already-existing fixed constant:

```text
GC_GRACE_IN_SECONDS = 10 * 24 * 3600
```

and its unchanged context already says deleted columns, supercolumns, and column families must be preserved until they have been deleted for at least that grace interval. Therefore the inspected trunk already had a ten-day preservation rule before this customization commit.

The safe historical claim is only:

> **17 April 2009 is a public implementation floor for configurable Cassandra GC grace and its explicit propagation/hardware-failure rationale; the grace mechanism itself is older than that change.**

This blocks the novelty error `configuration introduction date = mechanism invention date`.

### E — `gc_grace` is a coordination budget, not a convergence certificate

The source comment delegates a judgment to the operator: choose enough time to be confident the deletion marker will propagate through expected failures. That makes the interval a **retention policy budget** around a distributed maintenance process, not evidence that the maintenance process has actually completed.

Project reconstruction:

```text
elapsed grace
    != proof all replicas received the delete

configured failure envelope
    != observed repair completion
```

The distinction explains why a ten-day default cannot be universalized into a timeless safe-forgetting theorem. Outage duration, repair practice, topology, operational failures, and later implementation controls can all change whether the retained negative evidence has actually completed its job.

### H/P — 2015 adds an optional repair-qualified retirement rule

Apache Cassandra commit [`6f0c12f3a4668a5dcae162969843f02498ee7e6d`](https://github.com/apache/cassandra/commit/6f0c12f3a4668a5dcae162969843f02498ee7e6d), committed on **11 August 2015** for **CASSANDRA-6434**, adds `only_purge_repaired_tombstones`. Its release-note text explicitly says the option exists to avoid resurrection if repair has not run within `gc_grace_seconds`, while warning that long periods without repair can retain tombstones and create other problems.

This is a later strengthening of the reclamation predicate:

```text
age-qualified tombstone
    + optional repaired-state qualification
    -> narrower purge authority
```

It must not be projected backward into the 2009 implementation or Cassandra 1.2.19. Conversely, the later option makes visible a distinction that the project should keep explicit: **age eligibility and repair evidence are different kinds of state**.

### E/A — relation to Case 48 without mechanism collapse

Case 48 tracks Cassandra incremental-repair state as its own retained control relation. Case 41 consumes repaired/unrepaired status only insofar as the 2015 option can use it to qualify tombstone reclamation. Thus:

```text
tombstone age
    != repairedness state
    != proof of cluster-wide convergence
```

This is a bounded cross-case engineering relation, not a claim that all repair metadata and tombstone metadata are one mechanism.

---

'''
          if '## Historical deepening — Apache Incubator Cassandra 2009 grace-policy floor' in case:
              raise SystemExit('Case 41 2009 section already present')
          case = case.replace(heading, new_section + heading, 1)
          write(case_path, case)

          evidence = read(evidence_path)
          anchor = '### Cross-version claim controls added by the deepening'
          if anchor not in evidence:
              raise SystemExit('Evidence 41 cross-version anchor missing')
          ev_section = r'''### P12 — Apache Incubator Cassandra GC-grace configurability commit, 17 April 2009

**Commit:** <https://github.com/apache/cassandra/commit/fa1f80f40da0bb629c40bf09791c6c90f2608774>

**Exact artifact:** Apache Incubator Cassandra trunk commit `fa1f80f40da0bb629c40bf09791c6c90f2608774`, committed 2009-04-17 20:08:10 UTC, message `make GC_GRACE_IN_SECONDS customizable in storage.conf.`

Directly inspected diff evidence:

- `conf/storage-conf.xml` adds `GCGraceSeconds = 864000` and describes it as the time to wait before garbage-collecting deletion markers;
- the added operator comment says the value should be large enough that the deletion marker is expected to have propagated to **all replicas**, even in the face of hardware failures;
- `DatabaseDescriptor.java` adds the configurable value with the same ten-day default;
- `ColumnFamilyStore.java` stops using a fixed `GC_GRACE_IN_SECONDS` constant;
- the diff context itself shows that a fixed ten-day grace and the requirement to preserve deleted columns/supercolumns/column families already existed before the customization change.

**Evidence use:** strong primary implementation floor for the explicit `retention interval ↔ propagation/failure envelope` rationale and for configurability by April 2009.

**Boundary:** this commit is not the origin of Cassandra tombstones or GC grace. It proves the mechanism was already present and that configurability/rationale were public by this date.

### P13 — Apache Cassandra repaired-tombstone purge option commit, 11 August 2015

**Commit:** <https://github.com/apache/cassandra/commit/6f0c12f3a4668a5dcae162969843f02498ee7e6d>

**Exact artifact:** Apache Cassandra commit `6f0c12f3a4668a5dcae162969843f02498ee7e6d`, committed 2015-08-11 06:25:55 UTC, message `Add option to only purge tombstones from repaired sstables`, for CASSANDRA-6434.

Directly inspected diff evidence:

- the 3.0.0-beta1 release notes add an option to not purge unrepaired tombstones;
- the rationale explicitly names the risk of data being resurrected when repair has not run within `gc_grace_seconds`;
- the same note warns that failing to run repair for a long time can retain tombstones and cause other problems;
- source changes add `only_purge_repaired_tombstones` and track unrepaired tombstone deletion time in purge-related read/compaction paths.

**Evidence use:** strong project-history evidence for the later transition from age-only eligibility toward optional repair-qualified retirement authority.

**Boundary:** this later option is not silently attributed to 2009-era Cassandra or 1.2.19, and its presence does not prove cluster-wide convergence by itself.

'''
          if '### P12 — Apache Incubator Cassandra GC-grace configurability commit' in evidence:
              raise SystemExit('Evidence 41 P12 already present')
          evidence = evidence.replace(anchor, ev_section + anchor, 1)

          ledger_anchor = '| `gc_grace_seconds` retains tombstones for a failure/recovery envelope | H/P + E | P1 | timer is not itself repair |'
          if ledger_anchor not in evidence:
              raise SystemExit('Evidence 41 claim-ledger anchor missing')
          ledger_extra = ledger_anchor + '\n' + \
              '| Configurable GC grace with an explicit all-replica/hardware-failure rationale is public by 17 April 2009 | H/P | P12 | implementation floor, not mechanism origin |\n' + \
              '| Elapsed grace is not proof that propagation or repair completed | E | P12 | policy budget, not convergence certificate |\n' + \
              '| Repair-qualified tombstone purge appears as an optional Cassandra change by 11 August 2015 | H/P | P13 | do not project backward |'
          evidence = evidence.replace(ledger_anchor, ledger_extra, 1)

          old_limit = '1. This record is centered on Cassandra 3.x/3.11 documentation and branch implementation; it is not a cross-version Cassandra semantics history.'
          new_limit = '1. This record uses Cassandra 3.x/3.11 as the principal behavior layer, plus bounded 2009 and 1.2.19 historical floors; it is still not a complete cross-version Cassandra semantics history.'
          if old_limit not in evidence:
              raise SystemExit('Evidence 41 limit anchor missing')
          evidence = evidence.replace(old_limit, new_limit, 1)
          write(evidence_path, evidence)

          roadmap = read(roadmap_path)
          marker = 'Case 41 historical-policy deepening — Apache Cassandra 2009 GC-grace floor'
          if marker not in roadmap:
              lines = roadmap.splitlines()
              target = None
              for i, line in enumerate(lines):
                  if 'cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md' in line:
                      target = i
                      break
              if target is None:
                  # Keep the slice navigable even if the older Case 41 roadmap line has moved.
                  phase = next((i for i, line in enumerate(lines) if line.startswith('## Phase 2')), None)
                  if phase is None:
                      raise SystemExit('ROADMAP Phase 2 anchor missing')
                  target = phase
              bullet = ('- [x] Case 41 historical-policy deepening — Apache Cassandra 2009 GC-grace floor — '
                        'exact Apache git history now pushes the public implementation floor for configurable deletion-marker grace and its all-replica/hardware-failure rationale to 17 April 2009, while the same diff proves fixed ten-day grace logic predates that customization; the 11 August 2015 CASSANDRA-6434 commit separately grounds the later optional repaired-SSTable purge predicate. This closes only the bounded `grace-age budget vs propagation/repair evidence vs purge authority` chronology; exact first-introduction archaeology, full release-by-release semantics, operational failure distributions, and broader Cassandra genealogy remain open.')
              lines.insert(target + 1, bullet)
              roadmap = '\n'.join(lines)
          write(roadmap_path, roadmap)

          index = read(index_path)
          section_marker = '### Case 41 deepening — Apache Cassandra 2009 GC-grace policy floor'
          if section_marker in index:
              raise SystemExit('CASE_INDEX Case 41 2009 section already present')
          nums = [int(x) for x in re.findall(r'^- \*\*(\d+) —', index, flags=re.M)]
          n = max(nums) + 1 if nums else 1
          findings = [
              ('configurability date ≠ mechanism origin', 'The 17 April 2009 commit makes GC grace configurable, but its own diff removes a preexisting fixed ten-day constant and retains preexisting preservation commentary; therefore the change is a configurability/rationale floor, not an invention date.'),
              ('grace interval ≠ convergence certificate', 'The 2009 source tells operators to choose enough time to be confident deletion markers propagate to all replicas through hardware failures; the timer is a budget around propagation, not evidence that propagation actually completed.'),
              ('retention policy parameter ≠ maintenance actuator', '`GCGraceSeconds` delays eligibility for garbage collection; it does not itself deliver a missed delete, run anti-entropy repair, or validate replica agreement.'),
              ('ten-day default ≠ universal safe-forgetting theorem', 'A historical default encodes one operational assumption set; it cannot prove every outage, topology, repair practice, or future release is safe after exactly ten days.'),
              ('negative-state lifetime can encode a failure envelope', 'Deletion evidence may be retained not because the payload is valuable, but because stale positive embodiments may survive elsewhere for a bounded operational interval.'),
              ('age eligibility ≠ repair-qualified retirement authority', 'The 2015 CASSANDRA-6434 option adds repaired-SSTable qualification on top of tombstone age; these are different state variables and different evidence claims.'),
              ('later repair-qualified purge ≠ 2009 behavior', 'The 2015 option must not be projected backward into the 2009 trunk or Cassandra 1.2.19.'),
              ('repairedness state ≠ proof of cluster-wide convergence', 'Using repaired/unrepaired status as a purge guard is stronger than age alone, but the bounded source does not license a universal claim that one metadata bit certifies every replica and failure path.'),
              ('same tombstone vocabulary across versions ≠ identical purge predicate', 'The canonical case spans bounded release layers; continuity of the word `tombstone` does not imply identical encodings, compaction rules, or retirement predicates.'),
              ('Bigtable 2006 prior function ≠ Cassandra genealogy', 'Earlier deletion-entry retention across immutable SSTables blocks Cassandra novelty claims for the broad function but does not prove direct implementation descent.'),
              ('Case 41 tombstone age ≠ Case 48 repair state', 'Case 48 supplies a distinct repaired/unrepaired lifecycle; Case 41 uses that state only where a later purge option consumes it as reclamation qualification.'),
              ('forgetting negative evidence remains a positive-state admission risk', 'The deeper 2009–2015 chronology strengthens the core cross-case rule: reclaiming currentness evidence is safe only relative to the stale embodiments and repair relations that evidence still needs to defeat.')
          ]
          out = [section_marker, '']
          for title, body in findings:
              out.append(f'- **{n} — {title}** — {body}')
              n += 1
          index = index.rstrip() + '\n\n' + '\n'.join(out) + '\n'
          write(index_path, index)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Historical deepening — Apache Incubator Cassandra 2009 grace-policy floor' cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md
          grep -q 'P12 — Apache Incubator Cassandra GC-grace configurability commit' evidence/41-cassandra-3x-tombstone-repair-grounding.md
          grep -q 'Case 41 historical-policy deepening — Apache Cassandra 2009 GC-grace floor' ROADMAP.md
          grep -q 'Case 41 deepening — Apache Cassandra 2009 GC-grace policy floor' CASE_INDEX.md
          test "$(grep -c 'Historical deepening — Apache Incubator Cassandra 2009 grace-policy floor' cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md)" -eq 1
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md evidence/41-cassandra-3x-tombstone-repair-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m 'case41: deepen Cassandra gc-grace history'
          git push origin main
