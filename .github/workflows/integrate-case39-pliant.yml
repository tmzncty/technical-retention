name: Integrate Case 39 Pliant recovery deepening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
      - name: Integrate bounded Case 39 deepening
        run: |
          test -f evidence/39-pliant-2007-2009-power-loss-metadata-gc-authority-deepening.md
          ! grep -q '^## 2007–2009 Pliant controller deepening' cases/39-geckoftl-power-failure-metadata-recovery.md
          echo >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo '---' >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo '## 2007–2009 Pliant controller deepening — power-loss reconstruction and GC authority' >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo 'Detailed evidence: [`evidence/39-pliant-2007-2009-power-loss-metadata-gc-authority-deepening.md`](../evidence/39-pliant-2007-2009-power-loss-metadata-gc-authority-deepening.md).' >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo 'The 2007-priority / 2009-public Pliant controller family separates volatile Forward/Reverse working tables from Flash-resident SuperBlock/SuperPage recovery evidence, then reconstructs mapping currentness, validity, and SuperBlock Freelist membership after power loss. A paired garbage-collection disclosure consumes Reverse-Table invalid counts and Freelist state, so the bounded retention seam is `retained state witnesses -> reconstructed currentness/validity/free-space authority -> later allocation and GC authority`.' >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo 'Two limits are now explicit: `priority date != public availability` (Park et al. was publicly released 10 April 2009; the Pliant applications were published 2 July 2009), and `reconstructed GC authority != resumed interrupted GC transaction`. No Pliant→GeckoFTL or Pliant→Crucial/Micron genealogy is claimed.' >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo >> cases/39-geckoftl-power-failure-metadata-recovery.md
          echo 'Case 39 remains **`grounded`**. The generic controller-metadata-recovery debt is narrowed, while named shipping-controller behavior, independent power-cut validation, and exact mid-GC interruption semantics remain open.' >> cases/39-geckoftl-power-failure-metadata-recovery.md
      - name: Validate and commit
        run: |
          grep -q '39-pliant-2007-2009-power-loss-metadata-gc-authority-deepening.md' cases/39-geckoftl-power-failure-metadata-recovery.md
          grep -q 'priority date != public availability' cases/39-geckoftl-power-failure-metadata-recovery.md
          git diff --check
          git add cases/39-geckoftl-power-failure-metadata-recovery.md
          git commit -m 'case39: integrate Pliant recovery authority boundary [skip ci]'
          git push origin HEAD:main
