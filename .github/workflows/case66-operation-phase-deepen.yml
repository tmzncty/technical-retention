name: case66-operation-phase-deepen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case66-operation-phase-deepen.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deepen Case 66
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          case_path = Path('cases/66-nvme14-persistent-event-log-history.md')
          evidence_path = Path('evidence/66-nvme14-2019-persistent-event-log-grounding.md')
          roadmap_path = Path('ROADMAP.md')
          index_path = Path('CASE_INDEX.md')

          for p in (case_path, evidence_path, roadmap_path, index_path):
              if not p.exists():
                  raise SystemExit(f'missing required file: {p}')

          case_marker = '## 2019 public-release / operation-phase evidence deepening'
          if case_marker not in case_path.read_text(encoding='utf-8'):
              with case_path.open('a', encoding='utf-8') as f:
                  f.write(r'''

## 2019 public-release / operation-phase evidence deepening

This bounded addendum closes two small evidence gaps without changing Case 66's mechanism scope.

First, the NVM Express first-party announcement can be dated precisely: **23 July 2019**. It announced release of the NVMe 1.4 Base Specification and described the Persistent Event Log as providing robust drive history for issue triage and debug at scale. The ratified specification itself is dated **10 June 2019**. These remain different historical facts:

> **specification document date ≠ public-release announcement date ≠ invention / first-implementation date**.

Second, §§5.14.1.13.1.7–10 make the event-history/effect boundary sharper than the generic event-type list alone. A `Format NVM Start` event is recorded after command-parameter validation but **before modifying any NVM contents**; a `Format NVM Completion` event is recorded when a Format NVM command that modified NVM contents completes and carries status/incomplete-format information. Likewise, `Sanitize Start` is recorded at the start of a sanitize operation, while `Sanitize Completion` is recorded at completion and carries sanitize progress/status information.

Therefore:

> **retained operation-start evidence ≠ evidence that the operation completed**.

and:

> **controller-reported completion/status evidence ≠ independent proof of lower-layer physical erasure**.

This distinction matters because Case 66 is about retained historical evidence, while Cases 44 and 47 remain responsible for command-level sanitize semantics and empirical remanence. A surviving PEL entry can establish that the controller recorded a phase transition; it should not be promoted into a stronger forensic claim about the final physical medium.

The same start/completion pairing also blocks an overly simple event-log reading: a history interface can preserve **phase-qualified evidence** about one maintenance action rather than one undifferentiated fact that “sanitize happened” or “format happened.”
''')

          evidence_marker = '## 2026 deepening — precise 2019 release chronology and phase-qualified maintenance evidence'
          if evidence_marker not in evidence_path.read_text(encoding='utf-8'):
              with evidence_path.open('a', encoding='utf-8') as f:
                  f.write(r'''

## 2026 deepening — precise 2019 release chronology and phase-qualified maintenance evidence

### P10 — first-party public-release date

NVM Express, Inc., **“New NVM Express, Inc. Specifications Bolster Cloud and Enterprise Advancements,” 23 July 2019**:

<https://nvmexpress.org/new-nvm-express-inc-specifications-bolster-cloud-and-enterprise-advancements/>

The dateline states **July 23, 2019** and says NVM Express announced release of the NVMe 1.4 Base Specification. The same announcement frames PEL as enabling robust drive history for issue triage and debug at scale.

This refines the older source register, which recorded only the year for this page.

Safe chronology:

- Revision 1.4 document date: **10 June 2019**;
- first-party release announcement: **23 July 2019**.

Unsafe upgrade:

- either date as first proposal, invention, first implementation, or first shipping product.

### P11 — Format NVM Start / Completion event phase boundary

Revision 1.4 §5.14.1.13.1.7 says a Format NVM Start event is recorded after successful command-parameter validation and **before modifying any contents of the NVM**. §5.14.1.13.1.8 says the corresponding Completion event is recorded at completion of a Format NVM command that resulted in NVM-content modification and contains status fields capable of representing incomplete/failed format outcomes.

Safe relation:

> `Format Start event != Format Completion event != proof of one universal physical rewrite/erase effect`.

The start record is especially strong counterevidence against treating an operation-history entry as proof that its intended destructive effect already happened.

### P12 — Sanitize Start / Completion event phase boundary

Revision 1.4 §5.14.1.13.1.9 says a Sanitize Start event is recorded at the start of a sanitize operation. §5.14.1.13.1.10 says Sanitize Completion is recorded at completion and carries Sanitize Progress, Sanitize Status, and vendor-specific completion information.

Safe relations:

- `Sanitize Start record != Sanitize Completion record`;
- `controller-recorded completion/status evidence != independent lower-layer forensic-erasure proof`.

The second relation is an engineering/epistemic boundary, not a claim that a successful sanitize is ineffective. Cases 44 and 47 remain the repository locations for sanitize command semantics and implementation-level remanence.

### Why this is a real retention deepening

PEL is not merely retaining “an event happened.” For these maintenance operations it can retain **which phase of the operation the controller recorded**, with distinct start and completion records. The historical object therefore has an evidentiary granularity that matters after the live operation is gone.

A surviving start entry can outlive a failed/interrupted operation. Conversely, even a completion entry is still retained controller evidence about that operation, not the destructive mechanism itself.

### Updated stop conditions

This addendum does not establish:

- the first public draft or technical proposal that introduced PEL;
- exact device behavior if power is lost between Start and Completion event creation;
- that every commercial controller supports/retains every optional event class identically;
- independent physical-media confirmation of sanitize or format effects;
- a direct historical genealogy from ATA/SCSI diagnostic logs to NVMe PEL.
''')

          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap_line = "- [x] **NVMe PEL operation-phase evidence boundary** (Case 66 deepening): NVM Express' 23-Jul-2019 first-party release announcement is now separated from the 10-Jun-2019 specification document date, and NVMe 1.4 Format/Sanitize Start vs Completion event rules are grounded as phase-qualified retained evidence: `operation-start record != completion record != independent physical-effect proof`. Cases 44/47 remain the sanitize/remanence boundary; proposal genealogy, named-device power-loss traces, and physical validation remain open."
          if 'NVMe PEL operation-phase evidence boundary' not in roadmap:
              lines = roadmap.splitlines()
              hits = [i for i, line in enumerate(lines) if 'NVMe PEL reporting-generation boundary' in line and '(Case 66)' in line]
              if len(hits) != 1:
                  raise SystemExit(f'expected one Case 66 reporting-generation roadmap anchor, found {len(hits)}')
              lines.insert(hits[0] + 1, roadmap_line)
              roadmap_path.write_text('\n'.join(lines) + ('\n' if roadmap.endswith('\n') else ''), encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index_marker = '## Case 66 deepening — 2019 release chronology and maintenance-operation phase evidence'
          if index_marker not in index:
              if '**3118 — related-repository boundary:**' not in index:
                  raise SystemExit('expected finding 3118 tail anchor not found')
              section = r'''

## Case 66 deepening — 2019 release chronology and maintenance-operation phase evidence

Grounding record: [`evidence/66-nvme14-2019-persistent-event-log-grounding.md`](evidence/66-nvme14-2019-persistent-event-log-grounding.md).

- **3119 — specification date != public-release announcement != invention date:** NVMe Revision 1.4 is dated 10-Jun-2019, while NVM Express' first-party release announcement is dated 23-Jul-2019; neither date proves first proposal, implementation, shipment, or invention priority. (`H/P`, `X`)
- **3120 — period `robust drive history` framing != archival-completeness claim:** the 23-Jul-2019 NVM Express announcement frames PEL as robust drive history for triage/debug, while the normative specification separately retains Case 66's explicit suppression, eviction, sanitize, and capacity limits. (`H/P`, `X`)
- **3121 — Format NVM Start evidence precedes content modification:** NVMe 1.4 requires the Start event after successful parameter validation but before modifying NVM contents, so a retained start record cannot itself prove the intended format effect occurred. (`H/P`, `E`)
- **3122 — Format NVM Completion evidence != generic success bit:** the Completion event is tied to command completion after NVM-content modification and carries fields that can represent incomplete or unsuccessful outcomes. (`H/P`, `E`)
- **3123 — Sanitize Start record != Sanitize Completion record:** the standard assigns separate event types to operation start and completion, preserving phase-qualified historical evidence rather than one undifferentiated `sanitize happened` fact. (`H/P`, `E`)
- **3124 — Sanitize Completion record != independent physical-erasure proof:** the PEL entry carries controller-reported sanitize progress/status/completion information; Cases 44/47 remain the separate command/effect/remanence boundary. (`H/P`, `E`, `A`, `X`)
- **3125 — retained history can preserve operation phase after live execution disappears:** PEL's Start/Completion pairing demonstrates historical evidence whose meaning depends on the recorded process phase, not merely event presence. (`E`)
- **3126 — phase evidence != operation mechanism:** event records describe controller-observed/recorded transitions and do not themselves perform format/sanitize work. (`E`, `X`)
- **3127 — evidence deepening != genealogy claim:** the tighter 2019 chronology and phase semantics do not establish PEL's proposal ancestry, first implementation, or ATA/SCSI-to-NVMe descent; those remain separate research debt. (`H/P`, `X`)
'''
              index_path.write_text(index.rstrip() + section + '\n', encoding='utf-8')
          PY

          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/case66-operation-phase-deepen.yml
          git add cases/66-nvme14-persistent-event-log-history.md evidence/66-nvme14-2019-persistent-event-log-grounding.md ROADMAP.md CASE_INDEX.md .github/workflows/case66-operation-phase-deepen.yml
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'case66: deepen PEL operation-phase evidence'
          git push origin HEAD:main
