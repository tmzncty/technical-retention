name: case66-operation-phase-deepen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case66-operation-phase-deepen.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Case 66 deepening
        run: |
          set -euo pipefail
          python3 .github/case66_deepen.py
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/case66_deepen.py .github/workflows/case66-operation-phase-deepen.yml
          git add -A
          git diff --cached --check
          git commit -m 'case66: deepen PEL operation-phase evidence'
          git push origin HEAD:main
