name: One-shot Case 23 navigation update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retention-nav-once.yml'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README, ROADMAP, and CASE_INDEX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"anchor not found: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique ({text.count(old)}): {label}")
              return text.replace(old, new, 1)

          # README navigation -------------------------------------------------
          p = Path('README.md')
          s = p.read_text()
          case22 = "- [`cases/22-ibm-system370-paging-backing-copy-currentness.md`](cases/22-ibm-system370-paging-backing-copy-currentness.md) — grounded virtual-memory bridge: a virtual page can outlive one real page frame; page replacement requires page-out only when the selected real copy has changed relative to an extant external copy, while RSM/ASM retain the translation and auxiliary-location relations needed for later page-in."
          case23 = "- [`cases/23-amazon-dynamo-divergent-version-anti-entropy.md`](cases/23-amazon-dynamo-divergent-version-anti-entropy.md) — grounded distributed-currentness bridge: Dynamo can deliberately retain several causally unrelated versions of one key, use vector-clock ancestry to authorize forgetting, separate sloppy-quorum availability from intended-placement convergence through hinted handoff, and repair replica divergence through read repair plus Merkle-tree anti-entropy."
          s = replace_once(s, case22, case22 + "\n" + case23, 'README case 22 row')

          ev22 = "- [`evidence/22-ibm-1972-1976-paging-currentness-grounding.md`](evidence/22-ibm-1972-1976-paging-currentness-grounding.md) — Case-22 grounding record: period IBM OS/VS2 documents separate virtual-page identity, real-frame residency, external-page-storage location, change/reference state, conditional page-out, page-fault recovery, and RSM/ASM auxiliary-location bookkeeping; Atlas 1962 controls invention-priority claims."
          ev23 = "- [`evidence/23-amazon-dynamo-2007-version-handoff-antientropy-grounding.md`](evidence/23-amazon-dynamo-2007-version-handoff-antientropy-grounding.md) — Case-23 grounding record: directly inspected 2007 Dynamo pages separate causal supersession from concurrent-version retention, sloppy-quorum success from hinted-placement convergence, Merkle-tree divergence detection from synchronization, read repair from background anti-entropy, and production foreground service from resource-budgeted repair work while preserving earlier epidemic/Bayou prior-art boundaries."
          s = replace_once(s, ev22, ev22 + "\n" + ev23, 'README evidence 22 row')

          old = "The current post-audit technical bridge set now extends through Case 22."
          new = "The current post-audit technical bridge set now extends through Case 23."
          s = replace_once(s, old, new, 'README bridge count')

          anchor = "Case 22 adds a capacity/residency-triggered hierarchy relation: **virtual-page identity ≠ page-frame identity ≠ backing-slot identity**, **residency ≠ currentness**, **frame reassignment ≠ forgetting**, and **page replacement ≠ unconditional page-out**; the current copy can move from real storage to external page storage only when required by the documented change relation, while nonresidency can remain recoverable through page fault/page-in without becoming archival durability."
          addition = anchor + " Case 23 adds a different distributed-currentness counterexample: **replica multiplicity ≠ one already-selected current value**, **causal ancestry can authorize forgetting while causal incomparability can require continued retention**, **write availability ≠ intended-placement convergence**, and **replica-divergence detection ≠ synchronization completion**. Dynamo therefore complements Case 05 rather than replacing it: bounded RADOS peering and Dynamo's application-visible divergent-version reconciliation are distinct historical currentness regimes."
          s = replace_once(s, anchor, addition, 'README Case 22 synthesis paragraph')
          p.write_text(s)

          # ROADMAP -----------------------------------------------------------
          p = Path('ROADMAP.md')
          lines = p.read_text().splitlines()
          prefix = "- [ ] distributed replication and erasure coding beyond RADOS —"
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"ROADMAP distributed anchor count: {len(matches)}")
          lines[matches[0]] = "- [ ] distributed replication and erasure coding beyond RADOS — **partially advanced by grounded Cases 19 and 23**. [`cases/19-facebook-f4-erasure-coded-failure-domains.md`](cases/19-facebook-f4-erasure-coded-failure-domains.md), grounded by [`evidence/19-facebook-f4-2014-erasure-coding-grounding.md`](evidence/19-facebook-f4-2014-erasure-coding-grounding.md), separates Reed–Solomon fragment algebra from failure-domain placement, direct reads from online reconstruction, content repair from placement convergence, and local recovery from geo-level composition. [`cases/23-amazon-dynamo-divergent-version-anti-entropy.md`](cases/23-amazon-dynamo-divergent-version-anti-entropy.md), grounded by [`evidence/23-amazon-dynamo-2007-version-handoff-antientropy-grounding.md`](evidence/23-amazon-dynamo-2007-version-handoff-antientropy-grounding.md), separately adds mutable replicated currentness: causally unrelated versions can remain simultaneously admissible until reconciliation; hinted handoff separates successful availability from intended placement; and read repair plus Merkle-tree anti-entropy separate request completion, divergence detection, synchronization, and convergence. The broad item stays unchecked because mutable **erasure-coded** object currentness/consistency, modern LRC/EC designs, repair scheduling under different bandwidth/failure models, distributed integrity scrubbing beyond replica synchronization, and later production semantics remain separate regimes. f4 and Dynamo both explicitly build on earlier coding/replication techniques rather than supporting invention-priority claims for those ingredients."

          phase3_anchor = "- [ ] In distributed coded storage, how should `coded recoverability`, `read availability`, `full-fragment repair`, and `restored failure-domain placement` be separated?"
          phase3_new = phase3_anchor + "\n- [ ] In divergent-version replication, how should `causally superseded`, `concurrent/admissible`, `returned`, `read-repaired`, `anti-entropy synchronized`, and `placement-converged` states be separated?"
          joined = "\n".join(lines) + "\n"
          joined = replace_once(joined, phase3_anchor, phase3_new, 'ROADMAP phase 3 distributed axis')
          p.write_text(joined)

          # CASE_INDEX --------------------------------------------------------
          p = Path('CASE_INDEX.md')
          s = p.read_text()
          row22 = "| [IBM System/370 OS/VS2 Paging: Virtual-Page Identity, Backing-Copy Currentness, and Conditional Writeback](cases/22-ibm-system370-paging-backing-copy-currentness.md) | **grounded** | virtual-page contents + real-frame residency/translation + external-page-storage copy + reference/change state + ASM slot/location state + conditional page-out/page-in | separate virtual identity from frame/backing-slot identity; residency from currentness; capacity-triggered frame reuse from forgetting; working backing retention from crash durability | [1972–1976 IBM paging grounding](evidence/22-ibm-1972-1976-paging-currentness-grounding.md); Atlas→IBM genealogy, DAT/TLB/segmentation, replacement-policy history, copy-on-write/demand-zero, Unix swap, and mmap remain separate work |"
          row23 = "| [Amazon Dynamo: Divergent Version Retention, Hinted Handoff, and Anti-Entropy](cases/23-amazon-dynamo-divergent-version-anti-entropy.md) | **grounded** | replicated key/value versions + per-version vector clocks/context + sloppy-quorum temporary placement + intended-recipient hints + read repair + Merkle-tree anti-entropy | show currentness can remain plural until causal/semantic reconciliation; separate write/read availability from intended placement and replica convergence; separate divergence detection from repair | [2007 Dynamo grounding](evidence/23-amazon-dynamo-2007-version-handoff-antientropy-grounding.md); vector-clock genealogy, later Dynamo/DynamoDB semantics, modern LRC/EC currentness, and broader consistency theory remain separate work |"
          s = replace_once(s, row22, row22 + "\n" + row23, 'CASE_INDEX case row 22')

          matrix22 = "| IBM OS/VS2 paging / 1972–1976 bounded regime | virtual-page contents + residency/translation state + reference/change currentness state + external page-data-set/slot relation | capacity-pressure frame selection; conditional page-out of changed pages; page-in after faults; RSM/ASM frame and auxiliary-location bookkeeping | resident access proceeds normally; a nonresident reference faults and requires page-in; reference state can influence later replacement | virtual-page designation resolves to a real frame when resident; ASM tracks auxiliary location when external | real-frame residency and dynamically allocated external slot can change while virtual-page identity persists | no complete history; the current page plus the relations required to locate/recover it are retained |"
          matrix23 = "| Amazon Dynamo / 2007 bounded regime | key/value replicas + causally related or concurrent object versions + vector clocks/context + preference/hint/Merkle repair state | quorum replication; hinted handoff; opportunistic read repair; background anti-entropy/synchronization; resource-budgeted handoff | reads gather versions and may return several causally unrelated leaves; stale replies can trigger read repair after response | key → preference list / first reachable nodes; actual temporary hinted location can differ from intended recipient; currentness depends on causal version relation | replica location can change temporarily and later converge; no one physical copy alone defines the surviving admissible version set | no complete history; causally superseded ancestors may be forgotten while unresolved concurrent leaves must remain until reconciliation |"
          s = replace_once(s, matrix22, matrix22 + "\n" + matrix23, 'CASE_INDEX matrix row 22')

          old_count = "After twenty-two bounded cases, **all twenty-two cases are now `grounded`.**"
          new_count = "After twenty-four bounded cases, **all twenty-four cases are now `grounded`.**"
          s = replace_once(s, old_count, new_count, 'CASE_INDEX cross-case count')

          old80 = "80. **category coherence is provisional and evidence-gated** — twenty-two grounded regimes now support the current relational criterion, including the grounded delay-line circulation/temperature-control regime plus powered flip-flop, static-MOS, cache-policy, refresh-address-internalization, autonomous leakage-tracked refresh-scheduling, SDRAM refresh-mode handoff, floating-gate EPROM erase-asymmetry, byte-erasable EEPROM, coarse-erase early Flash, HDD defect-reassignment, SSD power-loss-durability, BSD FFS crash-admissibility, RAID parity-reconstruction, ZFS proactive-scrubbing, f4 distributed-erasure-coding, NVMe 1.0 persistence-interface, and IBM paging/backing-copy-currentness bridges; future write-back-cache, filesystem, refresh, virtual-memory, and distributed regimes must still be allowed to break or revise it rather than being forced into it;"
          new80 = "80. **category coherence is provisional and evidence-gated** — twenty-four grounded regimes now support the current relational criterion, including the grounded delay-line circulation/temperature-control regime plus powered flip-flop, static-MOS, cache-policy, refresh-address-internalization, autonomous leakage-tracked refresh-scheduling, SDRAM refresh-mode handoff, floating-gate EPROM erase-asymmetry, byte-erasable EEPROM, coarse-erase early Flash, HDD defect-reassignment, SSD power-loss-durability, BSD FFS crash-admissibility, RAID parity-reconstruction, ZFS proactive-scrubbing, f4 distributed-erasure-coding, NVMe 1.0 persistence-interface, IBM paging/backing-copy-currentness, and Dynamo divergent-version/anti-entropy bridges; future write-back-cache, filesystem, refresh, virtual-memory, and distributed regimes must still be allowed to break or revise it rather than being forced into it;"
          s = replace_once(s, old80, new80, 'CASE_INDEX finding 80 count')

          f209 = "209. **paging relocation ≠ cache eviction, FTL relocation, or defect remapping** — all can preserve a higher-level designation across changed embodiment, but OS/VS2 frame reuse is capacity/residency-triggered and conditionally propagates changed state; the historical triggers, authority, and mechanisms remain distinct."
          additions = """210. **replica multiplicity ≠ one already-selected current value** — Dynamo can retain and return several causally unrelated leaf versions for one key; in this bounded regime the admissible current state can remain plural until reconciliation, unlike a model in which one replica/value is already authoritative.\n211. **causal ancestry can authorize forgetting while causal incomparability can create a retention obligation** — Dynamo's vector-clock comparison lets an ancestor version be forgotten, but concurrent branches must remain until reconciliation establishes a successor; existence of a newer-looking value alone does not prove safe discard.\n212. **write availability ≠ intended-placement convergence** — sloppy quorum can accept a write on a reachable substitute node while a hint retains the intended recipient and later handoff remains outstanding; successful service and steady-state replica placement can complete at different times.\n213. **hinted payload ≠ complete repair relation** — the temporary replica bytes do not by themselves identify why they are temporary or where they should return; the retained hint is control metadata constitutive of the future handoff obligation.\n214. **replica-divergence detection ≠ synchronization completion** — Merkle-tree comparison can localize keys that are out of sync before the corresponding payload synchronization action completes; proof of difference and repair of difference are separate retention work.\n215. **read completion ≠ replica convergence** — Dynamo can return a read after its response threshold while the coordinator continues waiting briefly for stale replies and performs read repair afterward; foreground availability can precede repair completion.\n216. **anti-entropy ≠ integrity scrubbing or physical refresh** — Dynamo's background anti-entropy compares replica currentness and synchronizes divergent distributed copies; ZFS scrub verifies checksum-qualified media/object integrity and DRAM refresh restores decaying physical state. Their shared maintenance shape is functional analogy, not one historical mechanism.\n217. **Dynamo divergent-version currentness ≠ RADOS peering currentness** — both retain version/repair metadata, but the bounded RADOS case establishes a correct placement-group state before normal I/O while Dynamo can expose several causally unrelated versions for application reconciliation; distributed `currentness` is therefore itself regime-specific.\n218. **background retention maintenance can be explicitly resource-budgeted against foreground service** — Dynamo's production admission controller limits replica-synchronization and handoff work when it harms put/get latency; automated repair is real work whose completion time can be shaped by service policy rather than disappearing behind the interface."""
          s = replace_once(s, f209, f209 + "\n" + additions, 'CASE_INDEX findings tail')
          p.write_text(s)
          PY

      - name: Commit navigation update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .github/workflows/retention-nav-once.yml
          git commit -m "docs: index grounded Dynamo currentness bridge"
          git push
