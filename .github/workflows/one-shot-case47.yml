name: one-shot-case47

on:
  push:
    paths:
      - '.github/workflows/one-shot-case47.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 47 navigation and status
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def insert_after_line(text, prefix, new_line):
              lines = text.splitlines()
              if any(new_line == line for line in lines):
                  return text
              for i, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines.insert(i + 1, new_line)
                      return "\n".join(lines) + ("\n" if text.endswith("\n") else "")
              raise SystemExit(f"anchor not found: {prefix}")

          # README navigation
          readme = Path('README.md').read_text()
          readme = insert_after_line(
              readme,
              '- [`cases/46-google-gfs-master-log-checkpoint-recovery.md`]',
              '- [`cases/47-fast11-ssd-sanitization-verification.md`](cases/47-fast11-ssd-sanitization-verification.md) — grounded empirical SSD-forgetting/compliance bridge: FAST ’11 raw-flash fingerprint extraction separates logical disappearance and controller-reported erase success from independently verified removal of stale physical embodiments, while keeping the anonymized A–L product sample and simulated FTL scrub proposals explicitly bounded.'
          )
          readme = insert_after_line(
              readme,
              '- [`evidence/46-gfs-2003-master-log-checkpoint-grounding.md`]',
              '- [`evidence/47-fast11-2011-ssd-sanitization-grounding.md`](evidence/47-fast11-2011-ssd-sanitization-grounding.md) — Case-47 grounding record: the 2011 FAST study supplies raw-chip verification, anonymized per-drive secure-erase results, overwrite/single-file counterexamples, degaussing and crypto-erasure boundaries, and a strict separation between measured commercial behavior and simulated selective-sanitization designs.'
          )
          Path('README.md').write_text(readme)

          # ROADMAP
          roadmap = Path('ROADMAP.md').read_text()
          old = 'Remaining cleanup: directly inspect Masuoka et al. 1987 IEDM full text if available. Later host-interface deallocation versus media sanitization is now handled separately in grounded Case 44; ATA/SCSI genealogy, named-device sanitize compliance, and forensic validation remain distinct work.'
          new = 'Remaining cleanup: directly inspect Masuoka et al. 1987 IEDM full text if available. Later host-interface deallocation versus media sanitization is now handled separately in grounded Case 44; grounded Case 47 separately supplies anonymized 2011 raw-flash implementation/forensic validation, while ATA/SCSI genealogy, named-device sanitize compliance, and later implementation validation remain distinct work.'
          if old in roadmap:
              roadmap = roadmap.replace(old, new, 1)
          elif new not in roadmap:
              raise SystemExit('ROADMAP Case04 cleanup anchor not found')

          old_count = '**partially advanced by grounded Cases 15, 20, 30, 31, 32, 36, 37, 38, 39, and 44**'
          new_count = '**partially advanced by grounded Cases 15, 20, 30, 31, 32, 36, 37, 38, 39, 44, and 47**'
          if old_count in roadmap:
              roadmap = roadmap.replace(old_count, new_count, 1)
          elif new_count not in roadmap:
              raise SystemExit('ROADMAP SSD count anchor not found')

          case44_end = 'Revision 1.2.1 Format secure erase prevents a false `1.3 invented secure erase` chronology. The broad item stays unchecked because independent named-product PLP fault compliance, commercial/named-controller metadata recovery under interruption, other platform-specific persistence-domain implementations, exact later NVMe 2.1+ terminology if evidence warrants it, and filesystem/database composition remain distinct regimes.'
          case47_add = 'Revision 1.2.1 Format secure erase prevents a false `1.3 invented secure erase` chronology. [`cases/47-fast11-ssd-sanitization-verification.md`](cases/47-fast11-ssd-sanitization-verification.md), grounded by [`evidence/47-fast11-2011-ssd-sanitization-grounding.md`](evidence/47-fast11-2011-ssd-sanitization-grounding.md), adds an independent 2011 implementation-verification bridge below the ordinary host interface: raw-flash fingerprint extraction shows that logical disappearance, advertised/reported erase success, and physical digital-remnant removal can diverge. The tested drives are anonymized, so this closes an empirical product-class compliance/forensic sub-slice without pretending to close named-product or modern-NVMe compliance. The broad item stays unchecked because independent named-product PLP fault compliance, named-product sanitization compliance and later ATA/NVMe sanitize implementation validation, commercial/named-controller metadata recovery under interruption, other platform-specific persistence-domain implementations, exact later NVMe 2.1+ terminology if evidence warrants it, and filesystem/database composition remain distinct regimes.'
          if case44_end in roadmap:
              roadmap = roadmap.replace(case44_end, case47_add, 1)
          elif 'cases/47-fast11-ssd-sanitization-verification.md' not in roadmap:
              raise SystemExit('ROADMAP Case44/47 insertion anchor not found')

          old_k = 'grounded mapped Flash and RADOS plus the bounded FAST 2011 SSD comparison require'
          new_k = 'grounded mapped Flash and RADOS plus grounded Case 47\'s bounded FAST 2011 raw-flash SSD comparison require'
          if old_k in roadmap:
              roadmap = roadmap.replace(old_k, new_k, 1)
          Path('ROADMAP.md').write_text(roadmap)

          # CASE_INDEX
          ci = Path('CASE_INDEX.md').read_text()
          case47_row = '| [FAST ’11 SSD Sanitization Verification: Hidden Flash Remnants, Command Compliance, and Verifiable Forgetting](cases/47-fast11-ssd-sanitization-verification.md) | **grounded** | current LBA value + FTL mapping + stale raw-flash embodiments + over-provisioned areas + controller erase/reporting state + external fingerprint verification witness | separate logical disappearance from digital sanitization; command/reporting contract from implementation compliance; host-address coverage from physical-remnant coverage; current logical state from forensic/raw-flash witness | [2011 FAST SSD sanitization grounding](evidence/47-fast11-2011-ssd-sanitization-grounding.md); drive identities are anonymized, while named-product/controller compliance, later ATA/NVMe sanitize validation, analog remanence, and deployed selective-file sanitization remain separate work |'
          ci = insert_after_line(ci, '| [Google File System Master Metadata Recovery:', case47_row)

          old44 = '| [NVM Express 1.3 Deallocate and Sanitize: Logical Forgetting, Media Sanitization, and Completion State](cases/44-nvme13-deallocate-sanitize-forgetting.md) | **grounded** | advisory logical-range deallocation + controller allocation/currentness state + subsystem-wide sanitize operation + Block/Crypto/Overwrite mechanisms + retained progress/result status | separate logical deallocation from media erasure; sanitize scope from allocated-LBA scope; request completion from operation completion; and forgotten payload from retained forgetting-status evidence | [2016–2017 NVMe grounding](evidence/44-nvme12-13-deallocate-sanitize-grounding.md); ATA/SCSI genealogy, named-controller/device sanitize compliance, hidden-media forensic validation, and filesystem/database deletion composition remain separate work |'
          new44 = '| [NVM Express 1.3 Deallocate and Sanitize: Logical Forgetting, Media Sanitization, and Completion State](cases/44-nvme13-deallocate-sanitize-forgetting.md) | **grounded** | advisory logical-range deallocation + controller allocation/currentness state + subsystem-wide sanitize operation + Block/Crypto/Overwrite mechanisms + retained progress/result status | separate logical deallocation from media erasure; sanitize scope from allocated-LBA scope; request completion from operation completion; and forgotten payload from retained forgetting-status evidence | [2016–2017 NVMe grounding](evidence/44-nvme12-13-deallocate-sanitize-grounding.md); anonymized 2011 raw-flash compliance/forensic validation is now handled separately in Case 47, while ATA/SCSI genealogy, named-controller/device sanitize compliance, later ATA/NVMe implementation validation, and filesystem/database deletion composition remain separate work |'
          if old44 in ci:
              ci = ci.replace(old44, new44, 1)
          elif new44 not in ci:
              raise SystemExit('CASE_INDEX Case44 row anchor not found')

          comparison47 = '| FAST ’11 SSD sanitization / 2011 bounded empirical regime | current host-visible LBA value + FTL mapping + stale flash-page embodiments + spare/over-provisioned contents + controller erase/reporting state + raw-flash fingerprint witness | logical overwrite/delete; controller secure erase; garbage collection; direct post-operation chip extraction/scan; proposed FTL scrubbing kept separate | ordinary interface can hide old values while raw flash still contains them; a controller may report erase success without actual sanitization | host LBA -> FTL current page for service; verification bypasses controller to inspect physical flash and reconstruct stale fingerprints | current mapping can move while old physical pages survive; whole-address overwrite can miss hidden embodiments | no intentional history archive; stale copies are noncurrent remnants, while experimental fingerprints test whether forgetting actually removed them |'
          ci = insert_after_line(ci, '| Google File System master metadata recovery / 2003 bounded regime |', comparison47)

          findings = [
              '447. **logical invisibility ≠ digital sanitization** — FAST ’11 explicitly separates ordinary-interface disappearance from inability to recover old data by lower-level digital means; FTL-remapped stale pages can survive after the old value ceases to be current through the host interface;',
              '448. **reported erase success ≠ verified media sanitization** — anonymized Drive B reported successful sanitization while all data remained intact and its filesystem remained mountable;',
              '449. **interface contract ≠ implementation compliance** — a standardized or advertised command establishes expected behavior only if controller firmware actually implements it; independent tests can reveal divergence invisible from the command name alone;',
              '450. **complete logical-address overwrite ≠ complete physical-witness overwrite** — repeated writes across every visible LBA can still miss remapped, stale, or over-provisioned Flash embodiments;',
              '451. **one current logical value ≠ one surviving physical embodiment** — an FTL can expose one current LBA value while multiple older digital copies survive underneath it without constituting an intentional version archive;',
              '452. **forensic/raw-flash witness ≠ authoritative current state** — a stale fingerprint can be materially recoverable while no longer governing normal LBA reads; forensic persistence and operational currentness are different admissibility relations;',
              '453. **whole-device forgetting capability ≠ selective-file forgetting capability** — erasing a complete drive can be controller-internal, while securely removing one file requires locating and destroying every historical physical embodiment without harming unrelated current data;',
              '454. **service-interface evidence ≠ raw-media verification evidence** — when the controller itself hides stale locations, ordinary post-operation reads are insufficient to test digital sanitization; FAST ’11 deliberately bypasses the controller and inspects chip contents;',
              '455. **sanitization objective continuity ≠ sanitization mechanism portability across media** — the tested hard-drive degaussing technique left Flash-chip data intact, showing that a shared objective does not make a substrate-specific erasure mechanism transferable;',
              '456. **cryptographic sanitization objective ≠ independently verified key destruction** — ciphertext may become inaccessible if key material is really destroyed, but the encrypted test drive’s key-store erasure could not be independently verified by the study;',
              '457. **forgetting work can compete with future retention work** — the paper’s proposed Flash scrubbing can increase erase count/wear and reduce future retention margin on some devices, so stronger elimination work is not materially free;',
              '458. **anonymous empirical product sample ≠ named-product compliance evidence** — the A–L test labels support implementation-class counterexamples but cannot be silently assigned to specific vendors, models, or controllers;',
              '459. **simulation-backed sanitization design ≠ deployed controller behavior** — immediate/background/scan-based FTL scrubbing was evaluated in a simulator using measured Flash data, not demonstrated as firmware in the tested commercial SSDs;'
          ]
          if '447. **logical invisibility ≠ digital sanitization**' not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('446. **master-service identity ≠ one physical master host**'):
                      lines[i+1:i+1] = [''] + findings
                      ci = '\n'.join(lines) + ('\n' if ci.endswith('\n') else '')
                      break
              else:
                  raise SystemExit('finding 446 anchor not found')

          ci = ci.replace('After forty-seven bounded cases, **all forty-seven cases are now `grounded`.**', 'After forty-eight bounded cases, **all forty-eight cases are now `grounded`.**', 1)
          ci = ci.replace('**category coherence is provisional and evidence-gated** — forty-seven grounded regimes now support', '**category coherence is provisional and evidence-gated** — forty-eight grounded regimes now support', 1)
          inventory_old = 'NVMe 1.3 deallocate/sanitize-forgetting, Micron DDR5 on-die-ECC/ECS corrective-scrub, and GFS master-log/checkpoint/re-derived-location recovery bridges;'
          inventory_new = "NVMe 1.3 deallocate/sanitize-forgetting, FAST '11 SSD sanitization-verification/hidden-remnant, Micron DDR5 on-die-ECC/ECS corrective-scrub, and GFS master-log/checkpoint/re-derived-location recovery bridges;"
          if inventory_old in ci:
              ci = ci.replace(inventory_old, inventory_new, 1)
          elif "FAST '11 SSD sanitization-verification/hidden-remnant" not in ci:
              raise SystemExit('finding 80 inventory anchor not found')
          ci = ci.replace('currently forty-seven;', 'currently forty-eight;', 1)
          Path('CASE_INDEX.md').write_text(ci)

          # validation
          checks = {
              'README.md': ['cases/47-fast11-ssd-sanitization-verification.md', 'evidence/47-fast11-2011-ssd-sanitization-grounding.md'],
              'ROADMAP.md': ['Cases 15, 20, 30, 31, 32, 36, 37, 38, 39, 44, and 47', 'grounded Case 47 separately supplies anonymized 2011 raw-flash implementation/forensic validation'],
              'CASE_INDEX.md': ['After forty-eight bounded cases', '447. **logical invisibility ≠ digital sanitization**', '459. **simulation-backed sanitization design ≠ deployed controller behavior**', 'currently forty-eight;', 'FAST ’11 SSD Sanitization Verification']
          }
          for p, needles in checks.items():
              text = Path(p).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'validation failed: {p}: {needle}')
          PY
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .github/workflows/one-shot-case47.yml
          git commit -m "docs: integrate grounded SSD sanitization verification"
          git push