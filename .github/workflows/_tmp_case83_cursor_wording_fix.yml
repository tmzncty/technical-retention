name: Temporary Case 83 cursor wording fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_case83_cursor_wording_fix.yml'
      - 'tools/_tmp_case83_cursor_wording_fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct wording
        run: python3 tools/_tmp_case83_cursor_wording_fix.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add cases/83-apache-hdfs-block-scanner-checksum-verification.md
          git diff --cached --check
          git commit -m "case83: tighten cursor checkpoint wording"
          git push origin HEAD:main
      - name: Remove temporary scaffolding
        run: |
          git rm tools/_tmp_case83_cursor_wording_fix.py .github/workflows/_tmp_case83_cursor_wording_fix.yml
          git commit -m "chore: remove Case 83 wording scaffolding"
          git push origin HEAD:main
