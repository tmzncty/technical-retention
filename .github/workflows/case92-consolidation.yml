name: case92-consolidation

on:
  push:
    paths:
      - '.github/workflows/case92-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate duplicate RowHammer case into Case 53
        run: python .github/scripts/case92_consolidate_into_case53.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f cases/53-dram-rowhammer-targeted-refresh-policy.md
          test -f evidence/53-rowhammer-2012-2020-targeted-refresh-grounding.md
          test ! -e cases/92-dram-rowhammer-access-induced-retention-failure.md
          test ! -e evidence/92-dram-2012-2014-rowhammer-grounding.md
          grep -Fq 'Victim Cells ≠ Weak Cells' cases/53-dram-rowhammer-targeted-refresh-policy.md
          grep -Fq 'B.1 Additional exact ISCA 2014 anchors' evidence/53-rowhammer-2012-2020-targeted-refresh-grounding.md
          grep -Fq 'After ninety-three bounded cases, **all ninety-three cases are now `grounded`.**' CASE_INDEX.md
          grep -Fq 'Cases 53 and 93' ROADMAP.md
          ! grep -R -Fq 'cases/92-dram-rowhammer-access-induced-retention-failure.md' README.md ROADMAP.md CASE_INDEX.md cases/93-dram-variable-retention-time-profile-staleness.md evidence/93-dram-1987-2013-vrt-profiling-grounding.md
          ! grep -R -Fq 'evidence/92-dram-2012-2014-rowhammer-grounding.md' README.md ROADMAP.md CASE_INDEX.md cases/93-dram-variable-retention-time-profile-staleness.md evidence/93-dram-1987-2013-vrt-profiling-grounding.md
          test ! -e .github/scripts/case92_consolidate_into_case53.py
          test ! -e .github/workflows/case92-consolidation.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case53: consolidate duplicate RowHammer case'
          git push origin HEAD:main
