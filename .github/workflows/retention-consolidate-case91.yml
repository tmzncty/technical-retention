name: Consolidate duplicate Cassandra case

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retention-consolidate-case91.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate Case 91 into Case 41
        run: python .github/scripts/consolidate_case91_into_case41.py

      - name: Validate diff
        run: git diff --check

      - name: Commit canonical consolidation and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/consolidate_case91_into_case41.py
          rm -f .github/workflows/retention-consolidate-case91.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case41: consolidate duplicate Cassandra tombstone case'
          git push
