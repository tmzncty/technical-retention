name: Case 55 ATA SMART prior-art integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case55-ata-smart-prior-art-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply bounded research slice
        run: python3 .github/scripts/integrate_case55_ata_smart.py

      - name: Validate research tree
        run: |
          git diff --check
          grep -Fq '1995–1997 ATA SMART supplies an older drive-health-state floor' cases/55-nvme-smart-health-endurance-telemetry.md
          grep -Fq '## Source F — X3T10 SFF liaison report, July 1995' evidence/55-nvme10-13-smart-health-endurance-grounding.md
          grep -Fq 'ATA SMART retained-health-state prior-art floor for NVMe Case 55' ROADMAP.md
          grep -Fq '## Case 55 ATA SMART prior-art deepening — retained health state before NVMe' CASE_INDEX.md
          grep -Fq 'same `SMART` label across ATA and NVMe ≠ unchanged semantics or proven genealogy' CASE_INDEX.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-nvme10-13-smart-health-endurance-grounding.md | sort)"
          test "$changed" = "$expected"

      - name: Commit research
        run: |
          git add CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-nvme10-13-smart-health-endurance-grounding.md
          git commit -m 'case55: ground ATA SMART health-state prior art'
          git push origin main

      - name: Remove one-shot integration files
        run: |
          git rm .github/scripts/integrate_case55_ata_smart.py .github/workflows/case55-ata-smart-prior-art-integration.yml
          git commit -m 'chore: remove case55 ATA SMART integration files'
          git push origin main
