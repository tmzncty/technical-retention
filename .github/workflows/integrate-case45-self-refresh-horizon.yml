> **retained control state != retained validity of the proposition that state once supported**.

This is still not a cross-power claim. It makes the comparison more precise by classifying the transition boundary and the evidence-validity domain alongside the state itself.'''
          synthesis = synthesis.replace(syn_anchor, syn_add, 1)

          rej_anchor = "- **`payload survival implies control-state survival` — rejected.** A physical replica can survive while a restarted NameNode has not yet re-observed it."
          if rej_anchor not in synthesis:
              raise SystemExit('Synthesis 26 rejected-claims anchor missing')
          synthesis = synthesis.replace(rej_anchor, rej_anchor + "\n- **`one transition gives every maintenance-control state the same lifetime` — rejected.** DDR5 self-refresh entry/exit preserves ECS transparency state while resetting REFsb bank phase, and PASR can preserve bits while invalidating their prior full-array evidential scope.", 1)
          synthesis_path.write_text(synthesis, encoding='utf-8')
