name: integrate-case45-self-refresh-horizon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-case45-self-refresh-horizon.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Integrate bounded research slice
        run: python3 .github/scripts/integrate-case45-self-refresh.py
      - name: Validate and commit canonical research files
        shell: bash
        run: |
          sed -i 's/[[:blank:]]\+$//' evidence/45-micron-ddr5-self-refresh-transition-state-horizon-deepening.md
          git diff --check
          grep -q 'Findings 3700–3715' CASE_INDEX.md
          grep -q 'same transition != same persistence horizon' docs/SYNTHESIS_26_MAINTENANCE_CONTROL_STATE_PERSISTENCE_HORIZONS.md
          grep -q 'Self-refresh/PASR transition-horizon deepening' cases/45-micron-ddr5-on-die-ecc-ecs.md
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'case45: deepen self-refresh state horizons [skip ci]'
          git push
