name: Case 119 navigation integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case119-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 119
        run: python tools/integrate_case119.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q 'cases/119-ddr4-post-package-repair-row-remapping.md' ROADMAP.md
          grep -q 'Case 119 — DDR4 Post-Package Repair findings' CASE_INDEX.md
          test "$(grep -c '^| \[DDR4 Post-Package Repair:' CASE_INDEX.md)" -eq 1
          test "$(grep -c '^- \*\*1883 — related-repository boundary:' CASE_INDEX.md)" -eq 1
      - name: Commit integrated navigation
        run: |
          if git diff --quiet; then
            echo 'No integration changes needed.'
            exit 0
          fi
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ROADMAP.md CASE_INDEX.md
          git commit -m 'case119: integrate DDR4 PPR navigation and findings'
          git push origin HEAD:main
