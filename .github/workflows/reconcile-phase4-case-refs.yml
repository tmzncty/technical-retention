name: Reconcile Phase 4 case references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-phase4-case-refs.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile stale Phase 4 references
        run: python .github/scripts/reconcile_phase4_case_refs.py
      - name: Validate Markdown diff
        run: git diff --check
      - name: Commit status cleanup and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/reconcile_phase4_case_refs.py .github/workflows/reconcile-phase4-case-refs.yml
          git add -A
          git diff --cached --check
          git commit -m "roadmap: reconcile forgetting case references"
          git push origin HEAD:main
