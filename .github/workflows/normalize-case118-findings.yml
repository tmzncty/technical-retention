name: Normalize Case 118 findings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-case118-findings.yml'
      - 'scripts/normalize_case118_findings.py'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize Case 118 findings
        run: python scripts/normalize_case118_findings.py
      - name: Validate diff
        run: git diff --check
      - name: Commit normalization
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_INDEX.md
          git commit -m "case118: normalize findings formatting"
          git push
