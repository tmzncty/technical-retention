name: Temporary Case145 JFFS2 GC integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case145-jffs2-gc.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate bounded Case145 research slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 _automation_case145_jffs2_gc.py
          rm -f _automation_case145_jffs2_gc.py .github/workflows/tmp-case145-jffs2-gc.yml
          git diff --check
          test -f cases/145-jffs2-garbage-collection-negative-state-evidence.md
          test -f evidence/145-jffs2-2001-garbage-collection-negative-state-grounding.md
          grep -q '3127 — September–October 2001 public floor' CASE_INDEX.md
          grep -q '3144 — related-repository boundary' CASE_INDEX.md
          grep -q 'Case 145 JFFS2 raw-Flash garbage-collection / negative-state-evidence slice' ROADMAP.md
          test ! -e _automation_case145_jffs2_gc.py
          test ! -e .github/workflows/tmp-case145-jffs2-gc.yml
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case145: ground JFFS2 negative-state reclamation'
          git push origin HEAD:main
