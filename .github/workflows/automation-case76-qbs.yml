name: automation-case76-qbs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/automation-case76-qbs.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Integrate research slice
        run: python tools/automation_case76_qbs.py

      - name: Validate research diff
        run: |
          git diff --check
          test -f evidence/76-lattice-2014-qualified-by-similarity-retention-deepening.md
          grep -q 'Manufacturer qualification coverage can extend beyond directly stressed samples' cases/76-jedec-ssd-endurance-retention-qualification.md
          grep -q 'Case 76 Lattice qualification-by-similarity coverage deepening' ROADMAP.md
          grep -q 'Case 76 — Lattice qualification-by-similarity retention-coverage deepening findings' CASE_INDEX.md

      - name: Commit research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md ROADMAP.md cases/76-jedec-ssd-endurance-retention-qualification.md evidence/76-lattice-2014-qualified-by-similarity-retention-deepening.md
          git diff --cached --check
          git commit -m 'case76: deepen qualification-by-similarity evidence [skip ci]'
          git push origin HEAD:main

      - name: Remove temporary automation files
        run: |
          git rm tools/automation_case76_qbs.py .github/workflows/automation-case76-qbs.yml
          git diff --cached --check
          git commit -m 'case76: clean temporary integration artifacts [skip ci]'
          git push origin HEAD:main
