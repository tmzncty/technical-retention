name: Run Case 141 failover-slot integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate_case141_runner.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run bounded integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output([
              'git', 'show',
              '1f1a5031a5594c9fe6eb4fadd8b4ad925e8dd7ca:.github/workflows/integrate_case141_failover_slots.yml'
          ], text=True)
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          Path('/tmp/integrate_case141.py').write_text(body + '\n')
          PY
          python /tmp/integrate_case141.py
          python - <<'PY'
          from pathlib import Path
          p = Path('cases/141-postgresql-replication-slot-wal-retention-frontier.md')
          text = p.read_text()
          text = text.replace('and PostgreSQL 17 logical failover-slot synchronization (2024)  \n', 'and PostgreSQL 17 logical failover-slot synchronization (2024)\n', 1)
          p.write_text(text)
          PY

      - name: Validate bounded integration
        shell: bash
        run: |
          test -f evidence/141-postgresql-2024-failover-slot-synchronization-deepening.md
          grep -Fq '## 2024 deepening — failover-slot synchronization makes the retention frontier itself cross-node state' cases/141-postgresql-replication-slot-wal-retention-frontier.md
          grep -Fq 'Case 141 deepening — PostgreSQL 17 logical failover-slot synchronization/currentness boundary' ROADMAP.md
          grep -Fq '## Case 141 deepening — PostgreSQL 17 failover-slot synchronization / replicated retention-frontier currentness' CASE_INDEX.md
          git diff --check

      - name: Commit research and remove one-shot scaffolding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/integrate_case141_failover_slots.yml .github/workflows/integrate_case141_runner.yml
          git add CASE_INDEX.md ROADMAP.md cases/141-postgresql-replication-slot-wal-retention-frontier.md evidence/141-postgresql-2024-failover-slot-synchronization-deepening.md
          git commit -m 'case141: deepen PostgreSQL failover-slot currentness [skip ci]'
          git push
