**Status:** `grounded`  
**Case:** [`../cases/129-zfs-feature-flags-format-compatibility.md`](../cases/129-zfs-feature-flags-format-compatibility.md)  
**Bounded question:** when `async_destroy` lets logical destroy return before all blocks are reclaimed, can the unfinished reclamation obligation itself keep a ZFS pool feature active and thereby preserve a software-compatibility requirement?

## Evidence boundary

Case 129 already establishes the general ZFS feature-flag relation between retained on-disk requirements and software admissibility. This slice asks one narrower question about `com.delphix:async_destroy`:

```text
logical destroy completion
    != background space-reclamation completion
    != relaxation of this feature's active-state compatibility obligation
```

The historical/source record below is deliberately limited to released OpenZFS documentation descended from the illumos feature-flags implementation already grounded by Evidence 129A. It does not reconstruct invention priority or a complete implementation genealogy.

## Primary project documentation

- OpenZFS v0.6 `zpool-features(5)`: <https://openzfs.github.io/openzfs-docs/man/v0.6/5/zpool-features.5.html>
- OpenZFS v0.6 `zpool(8)`: <https://openzfs.github.io/openzfs-docs/man/v0.6/8/zpool.8.html>
- Current OpenZFS `zpool-features(7)`: <https://openzfs.github.io/openzfs-docs/man/master/7/zpool-features.7.html>
- Historical feature-flags integration already grounded in Evidence 129A: illumos commit `ad135b5d644628e791c3188a6ecbd9c257961ef8`, 21 May 2012: <https://github.com/illumos/illumos-gate/commit/ad135b5d644628e791c3188a6ecbd9c257961ef8>

The v0.6 manual page identifies itself as an OpenZFS file-format manual page and is used here as released project documentation. Current documentation is later continuity, not evidence that every historical release behaved identically.

---

## Historical / project record

### H/P — `async_destroy` separates destroy completion from completion of space reclamation

The v0.6 `zpool-features(5)` page states that without `async_destroy`, destroying a filesystem requires traversing its data so used space can be returned to the pool, and the filesystem is not fully removed until that space has been reclaimed. With `async_destroy` enabled, reclamation is instead performed by a background process, allowing the destroy operation to complete without traversing the entire filesystem.

The same documentation says an interrupted asynchronous destroy can resume after the pool is opened.

Therefore the released project documentation directly establishes:

`destroy operation can complete != all corresponding space has already been reclaimed`

### H/P — `freeing` exposes remaining asynchronous reclamation work

The feature page says the amount of space still to be reclaimed by the background process is exposed through the `freeing` property. The contemporaneous `zpool(8)` documentation likewise defines `freeing` as space from destroyed filesystems/snapshots that is still being returned asynchronously; over time that quantity decreases while ordinary free space increases.

So `freeing` is not a second copy of the destroyed payload. It is an operator-visible quantity concerning outstanding reclamation.

### H/P — `async_destroy` is active only while `freeing` is non-zero

The v0.6 feature page states explicitly:

> This feature is only active while `freeing` is non-zero.

The same feature table marks `com.delphix:async_destroy` as **read-only compatible** and without dependencies.

This supplies the narrow feature-specific coupling needed here: unfinished asynchronous reclamation is not merely a capacity statistic; it is also the condition under which this pool feature remains in the `active` state.

### H/P — active and enabled are different compatibility states

The same feature-state documentation defines `active` as meaning the feature's on-disk changes are in effect and supporting software is required for read-write import. `enabled` means the feature is permitted but its on-disk changes are not currently in effect; unsupported software can still import such a pool. It also explicitly notes that some features can return from `active` to `enabled`.

For unsupported **read-only-compatible** active features, read-only import remains possible when the relevant import conditions are met.

Therefore:

`active feature != all import impossible`

and:

`enabled feature != active compatibility obligation`

---

## Engineering reconstruction

### E — outstanding reclamation debt can retain a read-write interpreter requirement

Combining the feature-specific and generic project documentation gives this bounded reconstruction:

```text
destroy returns
    ↓
background reclamation remains (`freeing > 0`)
    ↓
`com.delphix:async_destroy` remains active
    ↓
software support remains required for read-write import
    ↓
background reclamation drains (`freeing == 0`)
    ↓
this feature is no longer active
```

Calling the non-zero `freeing` population a **reclamation debt** is project vocabulary, not OpenZFS wording. The source-supported facts are the outstanding-byte quantity, its background processing, and the explicit active-while-nonzero rule.

This is an unusually direct example in which an unfinished maintenance/reclamation relation can preserve a software-compatibility requirement even after the user-visible deletion operation has completed.

### E — control-state relaxation can follow material reclamation without rewriting surviving user payload

When `freeing` drains to zero, the documentation says this particular feature is no longer active. The relevant compatibility relation can therefore relax because background reclamation completed, not because surviving user payload had to be rewritten into a different format.

That statement is limited to `async_destroy`. Other ZFS features have different activation lifetimes: some remain active indefinitely, some are active while particular objects exist, and some can return to `enabled` under their own documented conditions.

### E — `freeing` is evidence of an outstanding relation, not evidence of exact physical embodiment

The property measures space still to be reclaimed. It does not identify exact device sectors, prove that each block remains physically readable, or establish that a specific physical medium has not internally remapped data.

Therefore:

`freeing > 0 != exact physical block map`

and:

`freeing == 0 != forensic or sanitization proof`

---

## Functional comparison

### Case 153 — Ceph asynchronous snaptrim

Case 153 and this slice share one bounded functional pattern:

`logical deletion accepted/completed != asynchronous reclamation obligation completed`

The mechanisms are not treated as equivalent. Ceph's SnapTrim state machine and ZFS `async_destroy` have different implementations and histories. The extra point established here is specifically ZFS's documented coupling between the outstanding reclamation quantity and the pool feature's `active` compatibility state.

No genealogy between Ceph and ZFS is asserted.

---

## Rejected / unsupported claims

- **X — destroy return proves all old blocks are already free.** The released documentation explicitly separates operation completion from background reclamation.
- **X — `async_destroy` being enabled means it is always active.** The documentation says it is active only while `freeing` is non-zero.
- **X — an active `async_destroy` feature makes read-only import impossible to unsupported software.** It is documented as read-only compatible; generic feature semantics preserve a read-only fallback when all unsupported active features permit it.
- **X — `freeing` identifies exact unreclaimed physical sectors.** It is an aggregate reclamation quantity, not an embodiment map.
- **X — `freeing == 0` proves secure deletion, sanitization, or forensic non-recoverability.** No such claim appears in the source scope.
- **X — every ZFS feature returns from active to enabled when a background task finishes.** Activation/deactivation rules are feature-specific.
- **X — the 2012 integration date establishes invention priority for asynchronous deletion or feature-controlled compatibility.** It is a historical implementation anchor only.
- **X — ZFS `async_destroy` and Ceph SnapTrim are the same mechanism or share a proven genealogy.** The comparison is functional only.

