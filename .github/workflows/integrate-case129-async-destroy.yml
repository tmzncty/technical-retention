name: integrate-case129-async-destroy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-case129-async-destroy.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Integrate bounded research slice
        run: python3 .github/scripts/integrate-case129.py
      - name: Commit canonical research files
        shell: bash
        run: |
          sed -i 's/[[:blank:]]\+$//' evidence/129-zfs-async-destroy-reclamation-compatibility-deepening.md
          git status --short
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention@users.noreply.github.com'
          git add -A
          git commit -m 'case129: deepen async-destroy compatibility lifecycle [skip ci]'
          git push
