| `async_destroy` lets destroy complete before all space reclamation finishes | `H/P` | OpenZFS v0.6 feature documentation |
| interrupted background destroy work can resume after pool open | `H/P` | OpenZFS v0.6 feature documentation |
| `freeing` exposes remaining asynchronous reclamation quantity | `H/P` | OpenZFS v0.6 `zpool-features` + `zpool` docs |
| `async_destroy` is active only while `freeing != 0` | `H/P` | explicit feature-specific rule |
| `async_destroy` is read-only compatible | `H/P` | feature table |
| active support is required for read-write import | `H/P` | generic feature-state contract |
| outstanding reclamation can preserve this feature's read-write interpreter obligation | `E` | reconstruction from the two documented rules |
| completion of reclamation can relax this specific obligation | `E` | feature-specific active-state boundary |
| Ceph SnapTrim is a functional asynchronous-reclamation analogy only | `A` | cross-case comparison |
| zero `freeing` proves sanitization | `X` | unsupported by documentation |

