name: Integrate Case 129 PDP-8 power-fail restart grounding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case129-pdp8-power-fail.yml'
      - 'scripts/integrate_case129_pdp8_power_fail.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 129 research and navigation
        run: python scripts/integrate_case129_pdp8_power_fail.py
      - name: Validate canonical diff
        run: |
          test -f cases/129-dec-pdp8-power-fail-core-checkpoint-restart.md
          test -f evidence/129-dec-pdp8-1970-1974-power-fail-restart-grounding.md
          test ! -e scripts/integrate_case129_pdp8_power_fail.py
          test ! -e .github/workflows/integrate-case129-pdp8-power-fail.yml
          grep -q '129-dec-pdp8-power-fail-core-checkpoint-restart.md' README.md
          grep -q '129-dec-pdp8-power-fail-core-checkpoint-restart.md' ROADMAP.md
          grep -q 'Case 129 — DEC PDP-8 power-fail / auto-restart findings' CASE_INDEX.md
          grep -q '\*\*2256 — related-repository boundary:' CASE_INDEX.md
          git diff --check
      - name: Commit research integration and one-shot cleanup
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            cases/129-dec-pdp8-power-fail-core-checkpoint-restart.md \
            evidence/129-dec-pdp8-1970-1974-power-fail-restart-grounding.md \
            README.md ROADMAP.md CASE_INDEX.md \
            scripts/integrate_case129_pdp8_power_fail.py \
            .github/workflows/integrate-case129-pdp8-power-fail.yml
          git diff --cached --check
          git commit -m "case129: ground PDP-8 power-fail restart handoff"
          git push
