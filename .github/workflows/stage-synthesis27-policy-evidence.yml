name: Stage Synthesis 27 policy-evidence validity

on:
  push:
    branches: [main]
    paths:
      - 'tools/stage_synthesis27_policy_evidence.py'
      - '.github/workflows/stage-synthesis27-policy-evidence.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded research slice
        run: python tools/stage_synthesis27_policy_evidence.py
      - name: Validate bounded slice
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SYNTHESIS_27_RETENTION_POLICY_EVIDENCE_VALIDITY.md' README.md
          grep -q 'policy-input persistence != policy-input validity != policy authority' ROADMAP.md
          grep -q '^## Synthesis 27 — retention-policy evidence validity findings$' CASE_INDEX.md
          grep -q '\*\*2799 —' CASE_INDEX.md
          test -f docs/SYNTHESIS_27_RETENTION_POLICY_EVIDENCE_VALIDITY.md
          git diff --check
      - name: Commit and push bounded slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-research-agent"
          git config user.email "actions@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md docs/SYNTHESIS_27_RETENTION_POLICY_EVIDENCE_VALIDITY.md tools/stage_synthesis27_policy_evidence.py .github/workflows/stage-synthesis27-policy-evidence.yml
          git rm tools/stage_synthesis27_policy_evidence.py .github/workflows/stage-synthesis27-policy-evidence.yml
          git diff --cached --check
          git commit -m "synthesis27: separate policy-evidence validity"
          git push
