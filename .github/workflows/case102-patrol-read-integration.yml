name: Case 102 Patrol Read integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case102-patrol-read-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply bounded research slice
        run: |
          set +e
          output="$(python3 .github/scripts/integrate_case102.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$output" | grep -Fq 'Expected one Case 101 table row, got 0' || exit "$rc"
          fi
          python3 .github/scripts/finalize_case102_index.py

      - name: Validate research tree
        run: |
          git diff --check
          test -f cases/102-perc-megaraid-patrol-read-consistency-boundary.md
          test -f evidence/102-dell-lsi-2005-2009-patrol-read-grounding.md
          grep -Fq '## Case 102 — Dell PERC / LSI MegaRAID Patrol Read findings' CASE_INDEX.md
          grep -Fq 'cases/101-scsi-background-medium-scan-proactive-defect-discovery.md' CASE_INDEX.md
          grep -Fq 'cases/102-perc-megaraid-patrol-read-consistency-boundary.md' CASE_INDEX.md
          grep -Fq 'Dell PERC / LSI MegaRAID Patrol Read versus Consistency Check boundary' ROADMAP.md
          grep -Fq 'physical-media verification ≠ redundancy-consistency verification' CASE_INDEX.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' CASE_INDEX.md ROADMAP.md cases/102-perc-megaraid-patrol-read-consistency-boundary.md evidence/102-dell-lsi-2005-2009-patrol-read-grounding.md | sort)"
          test "$changed" = "$expected"

      - name: Commit research
        run: |
          git add CASE_INDEX.md ROADMAP.md cases/102-perc-megaraid-patrol-read-consistency-boundary.md evidence/102-dell-lsi-2005-2009-patrol-read-grounding.md
          git commit -m 'case102: ground controller patrol-read consistency boundary'
          git push origin main

      - name: Remove one-shot integration files
        run: |
          git rm .github/scripts/integrate_case102.py .github/scripts/finalize_case102_index.py .github/workflows/case102-patrol-read-integration.yml
          git commit -m 'chore: remove case102 one-shot integration files'
          git push origin main
