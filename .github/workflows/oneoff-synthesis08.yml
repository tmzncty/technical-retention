name: synthesis08-proactive-integrity-integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-synthesis08.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded synthesis
        run: python3 .github/oneoff_synthesis08.py

      - name: Remove one-shot automation
        run: rm .github/oneoff_synthesis08.py .github/workflows/oneoff-synthesis08.yml

      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          test -f docs/SYNTHESIS_08_PROACTIVE_INTEGRITY_REPAIR_MARGIN.md
          grep -Fq 'SYNTHESIS_08_PROACTIVE_INTEGRITY_REPAIR_MARGIN.md' README.md
          grep -Fq 'SYNTHESIS_08_PROACTIVE_INTEGRITY_REPAIR_MARGIN.md' ROADMAP.md
          grep -Fq '1383. **proactive checking ≠ timeless certainty or one historical lineage**' CASE_INDEX.md
          test ! -e .github/oneoff_synthesis08.py
          test ! -e .github/workflows/oneoff-synthesis08.yml
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'synthesis: separate proactive integrity from repair margin'
          git push origin HEAD:main
