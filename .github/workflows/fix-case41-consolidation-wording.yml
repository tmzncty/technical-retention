name: Fix Case 41 consolidation wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case41-consolidation-wording.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix wording
        run: python .github/scripts/fix_case41_consolidation_wording.py
      - name: Validate
        run: git diff --check
      - name: Commit and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_case41_consolidation_wording.py
          rm -f .github/workflows/fix-case41-consolidation-wording.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case41: fix consolidation wording'
          git push
