name: Correct Case 31 synthesis count

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-case31-count.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          s = p.read_text()
          old = 'at least four contrasting cases at `grounded` or better — currently thirty-one;'
          new = 'at least four contrasting cases at `grounded` or better — currently thirty-two;'
          if old not in s:
              raise SystemExit('expected synthesis-count anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-case31-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CASE_INDEX.md .github/workflows/fix-case31-count.yml
          git commit -m "docs: correct Case 31 synthesis count"
          git push origin HEAD:main
