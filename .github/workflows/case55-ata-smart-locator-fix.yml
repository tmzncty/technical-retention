name: Case 55 ATA SMART locator correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case55-ata-smart-locator-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
      - name: Correct locator
        run: python3 .github/scripts/fix_case55_ata_smart_locators.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -Fq 'printed pp. 91–93 (save-before-return description on p. 92)' evidence/55-nvme10-13-smart-health-endurance-grounding.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          test "$changed" = 'evidence/55-nvme10-13-smart-health-endurance-grounding.md'
          git add evidence/55-nvme10-13-smart-health-endurance-grounding.md
          git commit -m 'case55: correct ATA SMART clause locators'
          git push origin main
      - name: Remove one-shot files
        run: |
          git rm .github/scripts/fix_case55_ata_smart_locators.py .github/workflows/case55-ata-smart-locator-fix.yml
          git commit -m 'chore: remove case55 locator-fix files'
          git push origin main
