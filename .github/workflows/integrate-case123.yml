name: Integrate Case 123

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case123.yml'
      - 'scripts/integrate_case123.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 123 navigation and findings
        run: python scripts/integrate_case123.py
      - name: Normalize changed research files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'ROADMAP.md',
              'CASE_INDEX.md',
              'cases/122-ata4-host-protected-area-addressability-retention.md',
          ]:
              p = Path(name)
              lines = [line.rstrip() for line in p.read_text(encoding='utf-8').splitlines()]
              while lines and not lines[-1]:
                  lines.pop()
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Validate integration
        run: |
          git diff --check
          grep -q 'cases/123-ata6-device-configuration-overlay-capability-retention.md' ROADMAP.md
          grep -q 'cases/123-ata6-device-configuration-overlay-capability-retention.md' CASE_INDEX.md
          grep -q '1982 —' CASE_INDEX.md
          grep -q '2000 —' CASE_INDEX.md
          grep -q 'Case 123' cases/122-ata4-host-protected-area-addressability-retention.md
      - name: Commit research integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add ROADMAP.md CASE_INDEX.md cases/122-ata4-host-protected-area-addressability-retention.md
          git commit -m "case123: integrate DCO capability-retention findings"
          git push
