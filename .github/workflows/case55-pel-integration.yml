name: Case 55 PEL integration

on:
  push:
    paths:
      - '.github/workflows/case55-pel-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python .github/scripts/case55-pel-integrate.py
          python -c 'from pathlib import Path; p=Path("CASE_INDEX.md"); p.write_text(p.read_text(encoding="utf-8").rstrip()+"\n", encoding="utf-8")'
          rm -f .github/workflows/case55-pel-integration.yml .github/scripts/case55-pel-integrate.py
          git add CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md .github/workflows/case55-pel-integration.yml .github/scripts/case55-pel-integrate.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case55: integrate NVMe persistent event history [skip ci]"
          git push origin HEAD:main
