name: Case 55 PEL integration

on:
  push:
    paths:
      - '.github/workflows/case55-pel-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          echo '' | base64 -d > /tmp/integrate_case55_pel.py
          python /tmp/integrate_case55_pel.py
          rm -f .github/workflows/case55-pel-integration.yml
          git add CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-nvme14-2019-persistent-event-log-deepening.md .github/workflows/case55-pel-integration.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case55: deepen NVMe persistent event history [skip ci]"
          git push origin HEAD:main
