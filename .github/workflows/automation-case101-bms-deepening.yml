name: automation case101 bms deepening integration

on:
  push:
    branches: [main]
    paths:
      - '.automation/case101-bms-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate Case101 BMS deepening and remove duplicate Case143
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          case_path = Path('cases/101-scsi-background-medium-scan-proactive-defect-discovery.md')
          evidence_path = Path('evidence/101-wd-2024-bms-progress-repair-policy-deepening.md')
          if not case_path.exists() or not evidence_path.exists():
              raise SystemExit('Canonical Case 101 or focused deepening evidence missing')

          # ---- Canonical Case 101 deepening ----
          case = case_path.read_text(encoding='utf-8')
          heading = '## 2024 Western Digital cross-vendor product deepening'
          if heading not in case:
              section = '''## 2024 Western Digital cross-vendor product deepening

A later named-product witness sharpens the control-state and repair-authority boundary without changing the 2005 origin/standardization claim above. Western Digital's *Ultrastar DC HC590 SAS Hard Disk Drive Specification*, Rev. 1.0 (31 October 2024), exposes current BMS status and `Medium Scan Progress` separately from counts of background scans and background-medium scans performed **over the life of the drive**. This gives a directly documented distinction between a current traversal state and a cumulative maintenance-history summary; the lifetime counter still is not a per-LBA ledger of successful verification.

The same specification says that clearing `EN_BMS` during an active scan suspends the scan and that re-enabling it resumes from the suspended location. The bounded claim is therefore `maintenance execution lifetime != maintenance-control/progress lifetime`. The inspected text does **not** say where that suspended location is stored or that it survives arbitrary reset, power loss, firmware replacement, format, or sanitize, so `resume after disable/re-enable != demonstrated power-loss-persistent checkpoint`.

Most importantly, the HC590 states that **reassignment during the background scan is not supported**. Its result states instead include cases where a defect is pending an application-client `REASSIGN` or write, where a rewrite succeeded, and where the application client successfully reassigned the block. Compared with the existing 2007 Seagate witness, which makes logging/reallocation depend on ARRE/AWRE policy, this blocks a universal `BMS = automatic in-scan relocation` reading:

> **BMS support != automatic in-scan reassignment support.**

and:

> **standardized BMS control/reporting semantics != identical vendor repair policy.**

The 2024 product document is later continuity/counterexample evidence, not evidence of T10's 2005 historical intent or a Seagate-to-Western-Digital implementation genealogy.

Detailed record: [`../evidence/101-wd-2024-bms-progress-repair-policy-deepening.md`](../evidence/101-wd-2024-bms-progress-repair-policy-deepening.md).

---

'''
              marker = '## Engineering reconstruction'
              if marker not in case:
                  raise SystemExit('Case 101 engineering-reconstruction anchor missing')
              case = case.replace(marker, section + marker, 1)
              case_path.write_text(case, encoding='utf-8')

          # ---- Remove accidental duplicate Case 143 navigation and add Case101 findings ----
          index_path = Path('CASE_INDEX.md')
          ci = index_path.read_text(encoding='utf-8')
          ci_lines = [line for line in ci.splitlines()
                      if not line.startswith('| [SCSI Background Media Scan: Idle-Time Verification, Retained Scan Progress, and Repair-Authority Separation](cases/143-scsi-background-media-scan-proactive-verification.md) |')]
          ci = '\n'.join(ci_lines) + '\n'
          ci = re.sub(r'\n## Case 143 — SCSI Background Media Scan findings\n.*\Z', '\n', ci, flags=re.S)

          h101 = '## Case 101 — Western Digital 2024 BMS progress / repair-policy deepening findings'
          if h101 not in ci:
              nums = [int(x) for x in re.findall(r'(?m)^- \*\*(\d+) —', ci)]
              if not nums:
                  raise SystemExit('No finding numbers found')
              n = max(nums) + 1
              findings = [
                  ('current scan progress != lifetime scan-count summary', 'Western Digital HC590 reports current `Medium Scan Progress` separately from background-scan counts performed over the life of the drive. (`H/P`, `E`)'),
                  ('lifetime scan count != per-LBA verification history', 'a cumulative scan count says how many scan operations occurred, not which LBA passed which scan at what time. (`H/P`, `E`)'),
                  ('maintenance execution lifetime != maintenance-control/progress lifetime', 'HC590 allows an active scan to be suspended by disabling BMS and later resumed from the suspended location. (`H/P`, `E`)'),
                  ('resume from suspended location != demonstrated power-loss checkpoint', 'the named product contract proves disable/re-enable continuation but does not establish reset/power-cycle persistence or the physical storage of the cursor. (`H/P`, `X`)'),
                  ('BMS support != automatic in-scan reassignment support', 'HC590 explicitly says reassignment during background scan is not supported. (`H/P`, `E`)'),
                  ('defect detected != device-side relocation completed', 'HC590 exposes pending host REASSIGN/write, successful rewrite, and application-client reassignment outcomes after background-scan discovery. (`H/P`, `E`)'),
                  ('standardized BMS family != identical vendor repair policy', 'the existing 2007 Seagate witness permits logging/reallocation according to ARRE/AWRE, while the 2024 HC590 declines in-scan reassignment; shared interface vocabulary does not erase product-policy differences. (`H/P`, `X`)'),
                  ('current status != cumulative summary != event record != payload', 'BMS status/progress, lifetime counts, error/result records, and user blocks are different retained state classes with different roles and horizons. (`E`)'),
                  ('2024 product witness != 2005 historical intent or genealogy', 'HC590 is later named-product continuity/counterexample evidence and is not projected backward into T10 proposal authorship or Seagate firmware lineage. (`H/P`, `X`)'),
                  ('related-repository boundary', 'a fresh `tmzncty/computing-archaeology` search for `background media scan SCSI` found no dedicated study; broader BMS/SMART/patrol-read genealogy and media physics belong there if developed, while this deepening stays with Case 101. (`H/P` project-state record)')
              ]
              sec = [h101, '', 'Deepening record: [`evidence/101-wd-2024-bms-progress-repair-policy-deepening.md`](evidence/101-wd-2024-bms-progress-repair-policy-deepening.md).', '']
              for title, body in findings:
                  sec.append(f'- **{n} — {title}:** {body}')
                  n += 1
              ci = ci.rstrip() + '\n\n' + '\n'.join(sec) + '\n'
          index_path.write_text(ci, encoding='utf-8')

          # ---- ROADMAP cleanup + canonical deepening entry ----
          roadmap_path = Path('ROADMAP.md')
          rm = roadmap_path.read_text(encoding='utf-8')
          lines = [line for line in rm.splitlines()
                   if 'Case 143 SCSI Background Media Scan proactive-verification / repair-authority slice' not in line]
          rm = '\n'.join(lines) + '\n'

          rm = rm.replace('**partially advanced by grounded Cases 17, 18, 140, and 143**', '**partially advanced by grounded Cases 17, 18, and 140**')
          rm = rm.replace(' Case 143 adds the device-level proactive-inspection boundary: SCSI BMS can scan idle media, yield to foreground work, retain/report traversal and defect state, and hand detected problems into distinct rewrite/reassignment paths; this remains below filesystem/distributed checksum scrub and does not make scan completion equivalent to repair.', '')

          deep = '- [x] Case 101 Western Digital 2024 BMS progress / repair-policy deepening — [`evidence/101-wd-2024-bms-progress-repair-policy-deepening.md`](evidence/101-wd-2024-bms-progress-repair-policy-deepening.md): the Ultrastar DC HC590 Rev. 1.0 (31 October 2024) separates current `Medium Scan Progress` from lifetime background-scan counts, preserves resume-from-suspended-location across `EN_BMS` disable/re-enable without establishing power-loss-persistent checkpointing, and explicitly states that reassignment during BMS is not supported while pending host REASSIGN/write, rewrite, and application-client reassignment outcomes remain visible. This closes only the bounded cross-vendor product-contract question `BMS support vs automatic in-scan repair` plus plural maintenance-evidence horizons; power-cycle persistence, another modern vendor, exact normative SBC/SPC mapping, and fault/load experiments remain open.'
          if 'Case 101 Western Digital 2024 BMS progress / repair-policy deepening' not in rm:
              rlines = rm.splitlines()
              anchors = [i for i, line in enumerate(rlines)
                         if line.startswith('- [x] SCSI Background Medium Scan / proactive medium-readability boundary —')]
              if not anchors:
                  raise SystemExit('Canonical Case 101 ROADMAP anchor not found')
              rlines.insert(anchors[0] + 1, deep)
              rm = '\n'.join(rlines) + '\n'
          roadmap_path.write_text(rm, encoding='utf-8')
          PY

          # Remove duplicate canonical files and temporary automation scaffolding from final tree.
          git rm -f --ignore-unmatch \
            cases/143-scsi-background-media-scan-proactive-verification.md \
            evidence/143-t10-2005-seagate-wd-background-media-scan-grounding.md \
            .automation/case101-bms-trigger.txt \
            .github/workflows/automation-case101-bms-deepening.yml

          test "$(grep -c '^## Case 101 — Western Digital 2024 BMS progress / repair-policy deepening findings$' CASE_INDEX.md)" -eq 1
          test "$(grep -c '^## Case 143 — SCSI Background Media Scan findings$' CASE_INDEX.md || true)" -eq 0
          test "$(grep -c '^| \[SCSI Background Media Scan: Idle-Time Verification' CASE_INDEX.md || true)" -eq 0
          test "$(grep -c 'Case 101 Western Digital 2024 BMS progress / repair-policy deepening' ROADMAP.md)" -eq 1
          test "$(grep -c 'Case 143 SCSI Background Media Scan proactive-verification / repair-authority slice' ROADMAP.md || true)" -eq 0
          test "$(grep -c '^## 2024 Western Digital cross-vendor product deepening$' cases/101-scsi-background-medium-scan-proactive-defect-discovery.md)" -eq 1
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md ROADMAP.md cases/101-scsi-background-medium-scan-proactive-defect-discovery.md evidence/101-wd-2024-bms-progress-repair-policy-deepening.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Case101 BMS deepening changes to commit'
            exit 0
          fi
          git commit -m 'case101: deepen BMS progress and repair-policy boundary'
          git push origin HEAD:main
