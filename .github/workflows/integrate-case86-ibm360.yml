name: Integrate Case 86 IBM 360 deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case86-ibm360.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research integration
        run: python .github/scripts/integrate_case86_ibm360.py

      - name: Validate text diff
        run: |
          git diff --check
          grep -q 'IBM System/360 Model 65 controlled power-transition boundary' CASE_INDEX.md
          grep -q 'Grounding status and remaining archival cleanup' cases/02-magnetic-core-destructive-read.md
          grep -q 'five-second delay before power removal' cases/86-dec-pdp8-core-power-fail-auto-restart.md

      - name: Commit research changes and remove one-shot integration files
        run: |
          rm -f .github/scripts/integrate_case86_ibm360.py
          rm -f .github/workflows/integrate-case86-ibm360.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'case86: deepen controlled power-transition boundary'
          git push
