name: Case 153 snaptrim restart reconstruction integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case153-snaptrim-reconstruction-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Apply Case 153 reconstruction research patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -f .github/case153_snaptrim_reconstruction_patch.py
          python3 .github/case153_snaptrim_reconstruction_patch.py
          sed -i 's/[[:space:]]\+$//' cases/153-ceph-rados-snaptrim-asynchronous-reclamation.md
          sed -i 's/[[:space:]]\+$//' evidence/153-ceph-2016-pg-activation-trim-obligation-reconstruction-deepening.md
          sed -i 's/[[:space:]]\+$//' docs/SYNTHESIS_28_RECLAMATION_AUTHORITY_AFTER_RETIREMENT.md
          sed -i 's/[[:space:]]\+$//' ROADMAP.md
          sed -i 's/[[:space:]]\+$//' CASE_INDEX.md
          rm .github/case153_snaptrim_reconstruction_patch.py
          rm .github/workflows/case153-snaptrim-reconstruction-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case153: deepen snaptrim obligation reconstruction [skip ci]"
          git push origin HEAD:main
