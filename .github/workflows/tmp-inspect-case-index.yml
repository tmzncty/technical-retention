name: tmp-inspect-case-index
on:
  push:
    paths:
      - '.github/workflows/tmp-inspect-case-index.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture tail
        run: |
          tail -n 160 CASE_INDEX.md > .tmp-case-index-tail.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-case-index-tail.txt
          git commit -m 'ops: capture case-index tail [skip ci]'
          git push
