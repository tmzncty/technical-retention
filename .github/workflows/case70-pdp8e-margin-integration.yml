name: Case 70 PDP-8/E margin integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case70-pdp8e-margin-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Apply Case 70 PDP-8/E operating-margin research patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -f .github/case70_pdp8e_margin_patch.py
          python3 .github/case70_pdp8e_margin_patch.py
          sed -i 's/[[:space:]]\+$//' cases/70-magnetic-core-half-select-disturbance.md
          sed -i 's/[[:space:]]\+$//' evidence/70-dec-pdp8e-1973-operating-margin-deepening.md
          sed -i 's/[[:space:]]\+$//' ROADMAP.md
          sed -i 's/[[:space:]]\+$//' CASE_INDEX.md
          rm .github/case70_pdp8e_margin_patch.py
          rm .github/workflows/case70-pdp8e-margin-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case70: deepen PDP-8/E production operating margin [skip ci]"
          git push origin HEAD:main
