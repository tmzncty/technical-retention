name: Integrate Case 48

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-case48.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate navigation and status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # README navigation -------------------------------------------------
          p = Path('README.md')
          text = p.read_text()
          if 'cases/48-apache-cassandra-incremental-repair-state.md' not in text:
              lines = text.splitlines()
              idx = next(i for i, line in enumerate(lines) if 'cases/47-fast11-ssd-sanitization-verification.md' in line)
              lines.insert(idx + 1, "- [`cases/48-apache-cassandra-incremental-repair-state.md`](cases/48-apache-cassandra-incremental-repair-state.md) — grounded distributed-maintenance-state bridge: Cassandra retains prior repair as `repairedAt` / repaired-vs-unrepaired SSTable state that narrows future incremental-repair eligibility; the 4.0 pending-repair/session redesign keeps in-progress repair distinct from completed repair and exposes maintenance-history consistency as its own protocol problem.")
              text = '\n'.join(lines) + '\n'
          if 'evidence/48-cassandra-21-40-incremental-repair-state-grounding.md' not in text:
              lines = text.splitlines()
              idx = next(i for i, line in enumerate(lines) if 'evidence/47-fast11-2011-ssd-sanitization-grounding.md' in line)
              lines.insert(idx + 1, "- [`evidence/48-cassandra-21-40-incremental-repair-state-grounding.md`](evidence/48-cassandra-21-40-incremental-repair-state-grounding.md) — Case-48 grounding record: CASSANDRA-5351, versioned 3.11 documentation/source, CASSANDRA-9143, and 4.0 pending-repair source ground repair-history state, anti-compaction, legacy classification inconsistency, and the later repair-state handoff.")
              text = '\n'.join(lines) + '\n'
          p.write_text(text)

          # ROADMAP ----------------------------------------------------------
          p = Path('ROADMAP.md')
          text = p.read_text()
          text = text.replace(
              'partially advanced by grounded Cases 19, 23, 24, 25, 26, 27, 28, 29, 41, and 46',
              'partially advanced by grounded Cases 19, 23, 24, 25, 26, 27, 28, 29, 41, 46, and 48'
          )
          if 'cases/48-apache-cassandra-incremental-repair-state.md' not in text:
              anchor = 'This separates payload survival, namespace recoverability, replay recovery, participant re-observation, checkpoint admissibility, metadata durability, and shadow-read freshness.'
              addition = " [`cases/48-apache-cassandra-incremental-repair-state.md`](cases/48-apache-cassandra-incremental-repair-state.md), grounded by [`evidence/48-cassandra-21-40-incremental-repair-state-grounding.md`](evidence/48-cassandra-21-40-incremental-repair-state-grounding.md), adds a distributed maintenance-history regime: Cassandra 2.1/3.11 retains successful repair as `repairedAt` / repaired-vs-unrepaired SSTable state so later incremental repair can skip that population, while anti-compaction and separate compaction strategies make the classification alter physical maintenance topology. CASSANDRA-9143 and the 4.0 pending-repair/session redesign then show that repair-history classification itself needs a coordinated in-progress-to-completed handoff rather than being treated as automatically consistent across participants."
              if anchor not in text:
                  raise SystemExit('ROADMAP Case 46 anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
          text = text.replace(
              'later Cassandra tombstone/repair semantics',
              'later Cassandra tombstone semantics, post-4.0 repair/session evolution, modern auto-repair scheduling, and independent repair-state fault validation'
          )
          p.write_text(text)

          # CASE_INDEX -------------------------------------------------------
          p = Path('CASE_INDEX.md')
          text = p.read_text()
          marker = '## Comparison matrix — provisional'
          if marker not in text:
              raise SystemExit('CASE_INDEX comparison marker missing')
          cases_part, rest = text.split(marker, 1)

          if 'cases/48-apache-cassandra-incremental-repair-state.md' not in cases_part:
              lines = cases_part.splitlines()
              idx = next(i for i, line in enumerate(lines) if 'cases/47-fast11-ssd-sanitization-verification.md' in line)
              row = "| [Apache Cassandra Incremental Repair State: `repairedAt`, Anti-Compaction, and Pending-Repair Handoff](cases/48-apache-cassandra-incremental-repair-state.md) | **grounded** | replicated payload + retained SSTable `repairedAt` / repaired-vs-unrepaired classification + anti-compaction separation + later pending-repair/session state | separate past repair completion from present integrity; maintenance history from payload; repair eligibility from application currentness; in-progress repair from completed repair; and local maintenance metadata from cross-replica consistency of that metadata | [2.1–4.0 incremental-repair-state grounding](evidence/48-cassandra-21-40-incremental-repair-state-grounding.md); modern auto-repair, post-4.0 evolution, independent fault injection, and broader anti-entropy genealogy remain separate work |"
              lines.insert(idx + 1, row)
              cases_part = '\n'.join(lines) + '\n\n'

          text = cases_part + marker + rest

          if '| Cassandra incremental repair state / 2.1–4.0 bounded regime |' not in text:
              matrix_anchor = '\n---\n\n## Cross-case findings already supported'
              matrix_row = "| Cassandra incremental repair state / 2.1–4.0 bounded regime | replicated payload + SSTable `repairedAt` / repaired-unrepaired classification + later pending-repair/session state | operator-triggered Merkle validation/streaming; anti-compaction or repair-metadata mutation; separate repaired/unrepaired compaction; later pending isolation and coordinated finalization | ordinary reads remain application-data operations; `--validate` can separately re-check already repaired data | token/range scope + SSTable repair class select maintenance inputs; later pending session identity scopes in-progress work | user-level identity survives SSTable rewrite/split and repair-state reclassification; physical SSTables can be replaced while the partition remains the same logical object | bounded maintenance history is intentionally retained because prior successful repair changes future repair eligibility; it is not a complete mutation or integrity history |"
              if matrix_anchor not in text:
                  raise SystemExit('CASE_INDEX matrix end anchor missing')
              text = text.replace(matrix_anchor, '\n' + matrix_row + matrix_anchor, 1)

          # Current count/status references.
          text = text.replace('forty-eight', 'forty-nine')
          text = text.replace(
              'Cassandra tombstone/repair-window, Kafka log-compaction/delete-marker-retention',
              'Cassandra tombstone/repair-window, Cassandra incremental-repair-state/anti-compaction/pending-repair, Kafka log-compaction/delete-marker-retention'
          )
          text = text.replace(
              'later Cassandra repair/tombstone evolution, secure erasure, cross-version semantics, and broader tombstone genealogy remain separate work',
              'later Cassandra tombstone evolution, post-4.0 repair/session evolution, secure erasure, cross-version semantics, and broader tombstone genealogy remain separate work'
          )

          if '460. **past repair completion can become future-maintenance eligibility state**' not in text:
              findings = [
                  "460. **past repair completion can become future-maintenance eligibility state** — CASSANDRA-5351 explicitly makes remembered successful repair the selector that lets later incremental repair omit already repaired SSTables;",
                  "461. **maintenance-history metadata ≠ payload** — `repairedAt` is not user data, yet it determines whether user-bearing SSTables are revisited by future incremental repair;",
                  "462. **repaired status ≠ present integrity forever** — Apache 3.11 states that later disk corruption, operator loss, or Cassandra bugs are not covered merely because data was previously marked repaired, so occasional full repair remains necessary;",
                  "463. **repair completion ≠ disposal of repair history** — successful incremental maintenance leaves a repaired/unrepaired classification that continues to alter later repair and compaction behavior;",
                  "464. **anti-compaction ≠ ordinary compaction** — Cassandra anti-compaction specifically separates repaired ranges and writes repaired/unrepaired metadata classes; a wholly covered SSTable can instead mutate `repairedAt` without a physical split;",
                  "465. **maintenance-state transition ≠ necessarily payload rewrite** — the 3.11 implementation can change repair eligibility by metadata mutation alone when an SSTable lies wholly within the repaired range;",
                  "466. **maintenance-state consistency can itself become a distributed repair obligation** — CASSANDRA-9143 documents participants disagreeing about repaired classification, motivating stronger coordination of the repair-state transition;",
                  "467. **pending repair ≠ repaired** — Cassandra 4.0 isolates data selected for an in-progress incremental repair in a pending class before final promotion;",
                  "468. **failed maintenance attempt ≠ successful-maintenance evidence** — the 4.0 design returns failed pending data to unrepaired rather than preserving a false completed-repair classification;",
                  "469. **repair optimization ≠ perpetual verification coverage** — skipping already repaired data reduces repair I/O but intentionally stops rechecking it for fault classes that arise after the remembered repair, which is why full repair/validation remain distinct;",
                  "470. **lower repeated repair I/O ≠ lower total maintenance complexity** — incremental repair trades repeated full-range work for repair metadata, anti-compaction, separate compaction populations, operator cadence, and later session-state coordination;",
                  "471. **repair-history partitioning ≠ deletion state, while it can affect deletion reclamation** — Cassandra 3.11 warns that abandoned repaired/unrepaired separation can block tombstone dropping, so remembered maintenance topology can constrain later forgetting without becoming the tombstone itself;",
                  "472. **operator-triggered repair ≠ automatic retention maintenance** — in the bounded 3.11 regime Cassandra does not automatically schedule anti-entropy repair; an operator or external orchestrator must supply cadence, without implying the same boundary for later built-in auto-repair."
              ]
              lines = text.splitlines()
              idx = next(i for i, line in enumerate(lines) if line.startswith('459. **simulation-backed sanitization design ≠ deployed controller behavior**'))
              lines[idx+1:idx+1] = findings
              text = '\n'.join(lines) + '\n'

          # Validation -------------------------------------------------------
          required = [
              'cases/48-apache-cassandra-incremental-repair-state.md',
              'evidence/48-cassandra-21-40-incremental-repair-state-grounding.md',
              'After forty-nine bounded cases, **all forty-nine cases are now `grounded`.**',
              'currently forty-nine;',
              '460. **past repair completion can become future-maintenance eligibility state**',
              '472. **operator-triggered repair ≠ automatic retention maintenance**'
          ]
          missing = [s for s in required if s not in text]
          if missing:
              raise SystemExit('CASE_INDEX validation failed: ' + repr(missing))
          p.write_text(text)

          # Repo-wide integration checks ------------------------------------
          assert 'cases/48-apache-cassandra-incremental-repair-state.md' in Path('README.md').read_text()
          assert 'evidence/48-cassandra-21-40-incremental-repair-state-grounding.md' in Path('README.md').read_text()
          assert 'Cases 19, 23, 24, 25, 26, 27, 28, 29, 41, 46, and 48' in Path('ROADMAP.md').read_text()
          assert 'post-4.0 repair/session evolution' in Path('ROADMAP.md').read_text()
          PY

          rm .github/workflows/integrate-case48.yml
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: integrate grounded Cassandra incremental repair state'
          git push
