name: temporary-case151-retry

on:
  push:
    paths:
      - '.github/workflows/tmp-case151-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    concurrency:
      group: technical-retention-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch validation and run Case151 integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integration_151.sh')
          s = p.read_text(encoding='utf-8')
          old = "grep -q 'LPDDR2 REFpb != DDR5 REFsb' \"$case_path\""
          new = "grep -q 'LPDDR2.*REFpb.*DDR5.*REFsb' \"$case_path\""
          if old not in s:
              raise SystemExit('expected validation line not found')
          s = s.replace(old, new, 1)
          old_rm = 'git rm -f scripts/integration_151.sh .github/workflows/integrate-case151.yml'
          new_rm = 'git rm -f scripts/integration_151.sh .github/workflows/integrate-case151.yml .github/workflows/tmp-case151-retry.yml'
          if old_rm not in s:
              raise SystemExit('expected temporary-file cleanup line not found')
          s = s.replace(old_rm, new_rm, 1)
          p.write_text(s, encoding='utf-8')
          PY
          bash scripts/integration_151.sh
