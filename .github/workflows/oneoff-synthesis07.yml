name: synthesis07-coded-recovery-integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-synthesis07.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded synthesis
        run: python3 .github/oneoff_synthesis07.py
      - name: Remove one-shot automation
        run: rm .github/oneoff_synthesis07.py .github/workflows/oneoff-synthesis07.yml
      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          test -f docs/SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md
          grep -Fq 'SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md' README.md
          grep -Fq 'SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md' ROADMAP.md
          grep -Fq '1372. **cross-case recovery pipeline' CASE_INDEX.md
          test ! -e .github/oneoff_synthesis07.py
          test ! -e .github/workflows/oneoff-synthesis07.yml
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'synthesis: separate coded recoverability from repair margin'
          git push origin HEAD:main
