name: automation-case55-pm9a3
on:
  push:
    paths:
      - '.github/workflows/automation-case55-pm9a3.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Integrate bounded Case 55 slice
        run: |
          set +e
          python3 scripts/tmp_case55_extract_parent_payload.py > .tmp-case55-run.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .tmp-case55-run.log
            git commit -m 'ops: refresh Case 55 integration failure [skip ci]' || true
            git push
            exit "$rc"
          fi
          set -e
          git diff --check
          test -f evidence/55-samsung-pm9a3-2021-vendor-smart-layout-deepening.md
          grep -q 'Case 55 Samsung PM9A3 named-product vendor-telemetry layout deepening' ROADMAP.md
          grep -q 'Findings 3636–3651' CASE_INDEX.md
          grep -q 'Named-product vendor-layout deepening' cases/55-nvme-smart-health-endurance-telemetry.md
          rm -f .tmp-case55-run.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-samsung-pm9a3-2021-vendor-smart-layout-deepening.md .tmp-case55-run.log
          git commit -m 'case55: deepen PM9A3 vendor telemetry layout [skip ci]'
          git push
