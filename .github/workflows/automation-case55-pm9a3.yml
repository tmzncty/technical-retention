name: automation-case55-pm9a3
on:
  push:
    paths:
      - '.github/workflows/automation-case55-pm9a3.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Integrate bounded Case 55 slice
        run: |
          : > .tmp-case55-run.log
          set +e
          python3 scripts/tmp_case55_extract_parent_payload.py >> .tmp-case55-run.log 2>&1
          helper_rc=$?
          echo "helper_rc=$helper_rc" >> .tmp-case55-run.log
          python3 -c "from pathlib import Path; p=Path('CASE_INDEX.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n', encoding='utf-8')"
          git diff --check >> .tmp-case55-run.log 2>&1
          diff_rc=$?
          echo "diff_rc=$diff_rc" >> .tmp-case55-run.log
          test -f evidence/55-samsung-pm9a3-2021-vendor-smart-layout-deepening.md
          evidence_rc=$?
          echo "evidence_rc=$evidence_rc" >> .tmp-case55-run.log
          grep -q 'Case 55 Samsung PM9A3 named-product vendor-telemetry layout deepening' ROADMAP.md
          roadmap_rc=$?
          echo "roadmap_rc=$roadmap_rc" >> .tmp-case55-run.log
          grep -q 'Findings 3636–3651' CASE_INDEX.md
          index_rc=$?
          echo "index_rc=$index_rc" >> .tmp-case55-run.log
          grep -q 'Named-product vendor-layout deepening' cases/55-nvme-smart-health-endurance-telemetry.md
          case_rc=$?
          echo "case_rc=$case_rc" >> .tmp-case55-run.log
          set -e

          total=$((helper_rc + diff_rc + evidence_rc + roadmap_rc + index_rc + case_rc))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$total" -ne 0 ]; then
            git add .tmp-case55-run.log
            git commit -m 'ops: capture Case 55 validation failure [skip ci]' || true
            git push
            exit 1
          fi

          rm -f .tmp-case55-run.log
          git add -A CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-samsung-pm9a3-2021-vendor-smart-layout-deepening.md .tmp-case55-run.log
          git commit -m 'case55: deepen PM9A3 vendor telemetry layout [skip ci]'
          git push
