name: fix-case34-index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile Case 34 index summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          t = p.read_text()
          old = 'Intel ADR/eADR power-fail-domain, and DDR5 same-bank-refresh-localization bridges; future write-back-cache'
          new = 'Intel ADR/eADR power-fail-domain, DDR5 same-bank-refresh-localization, and temperature-conditioned DRAM-refresh bridges; future write-back-cache'
          if old not in t:
              raise RuntimeError('category-coherence summary anchor not found')
          t = t.replace(old, new, 1)
          old_row = '[2020–2023 Micron DDR5 same-bank-refresh grounding](evidence/33-micron-2020-2023-ddr5-same-bank-refresh-grounding.md); exact JEDEC timing/revision chronology, LPDDR/per-bank genealogy, temperature-compensated refresh, and retention-aware scheduling remain separate work |'
          new_row = '[2020–2023 Micron DDR5 same-bank-refresh grounding](evidence/33-micron-2020-2023-ddr5-same-bank-refresh-grounding.md); temperature-conditioned cadence is now handled separately in Case 34, while exact JEDEC timing/revision chronology, LPDDR/per-bank genealogy, standardized temperature-compensated self-refresh, and retention-aware scheduling remain separate work |'
          if old_row not in t:
              raise RuntimeError('Case 33 next-work anchor not found')
          t = t.replace(old_row, new_row, 1)
          p.write_text(t)
          PY
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_INDEX.md
          git rm .github/workflows/fix-case34-index.yml
          git commit -m "docs: reconcile Case 34 index summary"
          git push
