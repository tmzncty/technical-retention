name: Case 76 standards deepening

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research update
        run: |
          python .github/case76_deepen.py
          python - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          grep -q 'September 2010 standards pair was not workload-complete' cases/76-jedec-ssd-endurance-retention-qualification.md
          grep -q 'Source 7 — JEDEC JESD219' evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md
          grep -q '^1354\.' CASE_INDEX.md
          grep -q 'JESD218/JESD219 standards-completeness and qualification-semantics deepening' ROADMAP.md
      - name: Commit and clean staging files
        run: |
          rm -f .github/case76_deepen.py .github/workflows/case76-standards-deepen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md cases/76-jedec-ssd-endurance-retention-qualification.md evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md .github/case76_deepen.py .github/workflows/case76-standards-deepen.yml
          git diff --cached --check
          git commit -m 'case76: deepen workload chronology and qualification semantics'
          git push origin HEAD:main
