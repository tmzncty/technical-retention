name: synthesis09-notation-fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-synthesis09-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix notation
        run: python3 .github/oneoff_synthesis09_fix.py
      - name: Remove one-shot automation
        run: rm .github/oneoff_synthesis09_fix.py .github/workflows/oneoff-synthesis09-fix.yml
      - name: Validate and commit
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'successful on-demand reconstruction' docs/SYNTHESIS_09_DISTRIBUTED_CODED_SERVICE_REPAIR_PLACEMENT.md
          grep -Fq '    ≠' docs/SYNTHESIS_09_DISTRIBUTED_CODED_SERVICE_REPAIR_PLACEMENT.md
          test ! -e .github/oneoff_synthesis09_fix.py
          test ! -e .github/workflows/oneoff-synthesis09-fix.yml
          git diff --check
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'synthesis09: fix reconstruction inequality notation'
          git push origin HEAD:main
