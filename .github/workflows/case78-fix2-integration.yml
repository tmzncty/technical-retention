name: Case 78 repaired integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case78-fix2-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 78 with diagnostic capture
        shell: bash
        run: |
          set +e
          python .github/case78_fix2.py > /tmp/case78.log 2>&1
          status=$?
          cat /tmp/case78.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/case78.log .github/case78-debug.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/case78-debug.log
            git commit -m "chore: capture case78 integration diagnostic"
            git push
            exit "$status"
          fi
      - name: Validate and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes'; exit 1; } || true
          git commit -m "case78: ground NAND bad-block retention metadata"
          git push
