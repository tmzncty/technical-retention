name: Case 19 failure-domain margin integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-case19-margin-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Apply and finalize Case 19 research
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git merge-base --is-ancestor da0b9200dbe999b4e3109b7bb3e668fcaae81af2 HEAD
          test -f .github/case19_margin_patch.py
          python3 .github/case19_margin_patch.py
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'cases/19-facebook-f4-erasure-coded-failure-domains.md',
              'evidence/19-facebook-f4-fragment-placement-failure-domain-margin-deepening.md',
              'docs/SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md',
              'ROADMAP.md',
              'CASE_INDEX.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          grep -q 'Finding 3891' CASE_INDEX.md
          grep -q 'Case 19 placement-violation slice closed' ROADMAP.md
          grep -q 'reconstruction can restore blocks before it restores failure-domain margin' cases/19-facebook-f4-erasure-coded-failure-domains.md
          grep -q 'fragment-count recovery is not geometry recovery' docs/SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md
          rm -f .github/case19_margin_patch.py
          rm -f .github/workflows/zz-case19-margin-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case19: deepen failure-domain placement margin [skip ci]"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
