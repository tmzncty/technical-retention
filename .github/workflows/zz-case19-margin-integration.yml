name: Case 19 failure-domain margin integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-case19-margin-integration.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Diagnose research patch
        shell: bash
        run: |
          set +e
          exec > >(tee .github/case19_margin_debug.txt) 2>&1
          echo STEP_HEAD
          git rev-parse HEAD
          echo STEP_FETCH
          git fetch origin main
          git checkout -B main origin/main
          echo STEP_ANCESTOR
          git merge-base --is-ancestor da0b9200dbe999b4e3109b7bb3e668fcaae81af2 HEAD
          echo ancestor_code=$?
          echo STEP_FILES
          ls -l .github/case19_margin_patch.py cases/19-facebook-f4-erasure-coded-failure-domains.md ROADMAP.md CASE_INDEX.md docs/SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md
          echo STEP_PATCH_SYNTAX
          python3 -m py_compile .github/case19_margin_patch.py
          echo syntax_code=$?
          echo STEP_ANCHORS
          grep -n 'Counterexamples and limits' cases/19-facebook-f4-erasure-coded-failure-domains.md | head
          grep -n 'coded-fragment loss concentrated' ROADMAP.md | head
          grep -n 'Finding 3876' CASE_INDEX.md | head
          echo STEP_PATCH_RUN
          sed -i 's/## What this case does not prove/## Counterexamples and limits/' .github/case19_margin_patch.py
          python3 .github/case19_margin_patch.py
          code=$?
          echo patch_code=$code
          echo STEP_DIFF
          git diff --stat
          echo STEP_SAVE_DEBUG
          git restore --worktree --staged cases/19-facebook-f4-erasure-coded-failure-domains.md docs/SYNTHESIS_07_CODED_RECOVERABILITY_REPAIR_MARGIN.md ROADMAP.md CASE_INDEX.md .github/case19_margin_patch.py 2>/dev/null || true
          rm -f evidence/19-facebook-f4-fragment-placement-failure-domain-margin-deepening.md
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/case19_margin_debug.txt
          git commit -m "ops: capture Case 19 integration diagnostics [skip ci]"
          git push origin HEAD:main
          exit $code
