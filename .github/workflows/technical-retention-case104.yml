name: technical-retention-case104-one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-retention-case104.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate bounded Case 104
        run: python .github/integration/technical_retention_case104.py
      - name: Validate and commit research slice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [
              Path('cases/104-micron-lpddr-selective-adaptive-self-refresh.md'),
              Path('evidence/104-micron-2009-2014-lpddr-tcsr-pasr-grounding.md'),
              Path('cases/21-micron-sdram-refresh-mode-handoff.md'),
              Path('ROADMAP.md'),
              Path('CASE_INDEX.md'),
          ]:
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -Fq '104-micron-lpddr-selective-adaptive-self-refresh.md' ROADMAP.md
          grep -Fq 'Micron LPDDR TCSR/PASR findings' CASE_INDEX.md
          grep -Fq 'maintenance rate** (temperature-compensated internal cadence)' cases/21-micron-sdram-refresh-mode-handoff.md
          test -f cases/104-micron-lpddr-selective-adaptive-self-refresh.md
          test -f evidence/104-micron-2009-2014-lpddr-tcsr-pasr-grounding.md
          rm .github/integration/technical_retention_case104.py .github/workflows/technical-retention-case104.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m 'case104: ground selective adaptive LPDDR self-refresh'
          git push origin HEAD:main
