name: tmp-case38-s3500-independent-validation

on:
  push:
    paths:
      - '.github/workflows/tmp-case38-s3500-independent-validation.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Case Index and remove integration scaffolding
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          text = p.read_text(encoding='utf-8')
          p.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-case38-s3500-independent-validation.yml
          rm -f .github/scripts/tmp_case38_s3500_integrate.py
          rm -f .github/scripts/tmp_case38_safe_runner.py
          git diff --check
          test -f evidence/38-intel-s3500-2014-independent-power-cut-stack-validation-deepening.md
          grep -q '3541 — independent S3500 witness' CASE_INDEX.md
          grep -q 'Case 38 Intel DC S3500 independent power-cut stack validation' ROADMAP.md
          grep -q 'Independent named-product follow-up' cases/38-intel-dc-s3700-pli-self-test-validation.md
      - name: Commit clean final tree
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case38: normalize integration output [skip ci]'
          git push origin HEAD:main
