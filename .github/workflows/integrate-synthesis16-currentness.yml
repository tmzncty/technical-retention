name: Integrate Synthesis 16 currentness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-synthesis16-currentness.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
      - name: Integrate bounded synthesis
        run: python3 scripts/integrate_synthesis16_currentness.py
      - name: Validate and commit
        run: |
          test -f docs/SYNTHESIS_16_REPLICA_CURRENTNESS_RETAINED_RELATION.md
          grep -q 'SYNTHESIS_16_REPLICA_CURRENTNESS_RETAINED_RELATION.md' README.md
          grep -q 'When replicas disagree' ROADMAP.md
          grep -q '## Synthesis 16 — replica currentness as retained relation findings' CASE_INDEX.md
          grep -q '2028 — related-repository boundary' CASE_INDEX.md
          test ! -e scripts/integrate_synthesis16_currentness.py
          test ! -e .github/workflows/integrate-synthesis16-currentness.yml
          git diff --check
          git add -A
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'synthesis16: separate replica currentness relations'
          git push origin HEAD:main
