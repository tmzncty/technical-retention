name: Integrate Case 66 log-lifetime deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case66-log-lifetimes.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Deepen Case 66 evidence and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          case_path = Path('cases/66-nvme14-persistent-event-log-history.md')
          ev_path = Path('evidence/66-nvme14-2019-persistent-event-log-grounding.md')
          roadmap_path = Path('ROADMAP.md')
          index_path = Path('CASE_INDEX.md')

          case = case_path.read_text(encoding='utf-8')
          if '### The same NVMe interface family contains deliberately different history lifetimes' not in case:
              anchor = '## Retained states and control state\n'
              addition = '''### The same NVMe interface family contains deliberately different history lifetimes

PEL is easier to misread if every diagnostic log is treated as one generic history store. Earlier NVMe revisions already exposed a different lifetime decomposition.

NVMe 1.0 (ratified **March 1, 2011**) defines the Error Information entry's 64-bit `Error Count` as an incrementing identifier retained across power-off conditions, and defines SMART / Health information as controller-lifetime information retained across power cycles. That is an earlier NVMe floor for **retained diagnostic summary/ordinal state**, not for the later PEL mechanism.

By NVMe 1.3c (**May 24, 2018**), §5.14.1.1 explicitly describes the controller-global Error Information log as a bounded recent-error list and says the controller **should** remove all entries on power cycle and reset. The entry's `Error Count`, however, is still specified as retained across power-off conditions.

NVMe 1.4 preserves this contrast while adding PEL. In the same ratified specification:

- Error Information is **controller-global**;
- its recent detailed entries are recommended to be cleared on power cycle and Controller Level Reset;
- the per-error `Error Count` survives power-off conditions;
- PEL is **NVM-subsystem-global** and its event information **shall** survive power cycles and resets, subject to the separate suppression/deletion/sanitize rules already discussed above.

Therefore:

> **detailed diagnostic entry lifetime ≠ diagnostic count lifetime ≠ persistent event-history lifetime**.

and:

> **controller-local history scope ≠ subsystem-global history scope**.

The standard can preserve a long-lived ordinal/aggregate trace while allowing the richer recent-entry population to disappear at a failure boundary, then separately provide another log whose event records cross that boundary.

'''
              assert anchor in case
              case = case.replace(anchor, addition + anchor, 1)

          old_state = '7. **other diagnostic state** — SMART/Health and telemetry, which may be snapshotted or referenced but are not identical to PEL.\n'
          new_state = old_state + '8. **Error Information state** — controller-local recent detailed entries plus a cross-power `Error Count` whose lifetime is not the same as the entry population or PEL.\n'
          if '8. **Error Information state**' not in case:
              assert old_state in case
              case = case.replace(old_state, new_state, 1)

          if '### A retained count can outlive the detailed records it once identified' not in case:
              anchor = '### The reporting context is a retained view, not the log itself\n'
              addition = '''### A retained count can outlive the detailed records it once identified

The Error Information contrast makes the repository's `history retention` category more precise. A controller may retain the monotonically advancing `Error Count` across power-off while the richer recent Error Information entries are recommended to be cleared at power/reset boundaries.

Therefore:

> **retained historical count/ordinal ≠ retained historical detail**.

A later observer may learn that error-history state advanced without recovering the queue ID, command ID, status, LBA, namespace, or other fields of the discarded earlier entry. Persistence of the summary relation does not reconstruct the forgotten event record.

This also blocks a scope shortcut:

> **same Get Log Page command family ≠ same retention regime**.

NVMe log pages can differ in scope, persistence boundary, capacity policy, and historical granularity even when they share a retrieval command family.

'''
              assert anchor in case
              case = case.replace(anchor, addition + anchor, 1)

          old_cross = '''Case 55:

```text
current warning
    !=
cumulative counters
    !=
reserve/endurance estimate
```

Case 66:
'''
          new_cross = '''Case 55 and the pre-PEL Error Information path already show that diagnostic state can split by lifetime:

```text
current warning
    !=
cumulative/lifetime counters
    !=
recent detailed Error Information entries
    !=
cross-power Error Count ordinal
```

Case 66:
'''
          if 'recent detailed Error Information entries' not in case:
              assert old_cross in case
              case = case.replace(old_cross, new_cross, 1)

          ledger_anchor = '| SMART/Health snapshots can become PEL historical events | `H/P` | §5.14.1.13.1.1 |\n'
          ledger_add = ledger_anchor + '| NVMe 1.3c recommends clearing detailed Error Information entries on power cycle/reset while retaining the entry `Error Count` across power-off | `H/P` | official Revision 1.3c §5.14.1.1; preserve `should` strength |\n| NVMe 1.4 keeps Error Information controller-global while PEL is NVM-subsystem-global and cross-reset persistent | `H/P` | official Revision 1.4 §§5.14.1.1, 5.14.1.13 |\n| a retained error count reconstructs the discarded detailed error entry | `X` | count/ordinal persistence does not preserve queue, command, status, LBA, namespace, or other discarded fields |\n'
          if 'NVMe 1.3c recommends clearing detailed Error Information entries' not in case:
              assert ledger_anchor in case
              case = case.replace(ledger_anchor, ledger_add, 1)

          old_chain = '''SMART/Health aggregate state
    !=
PEL retention/suppression/deletion policy
'''
          new_chain = '''SMART/Health aggregate state
    !=
recent Error Information entry population
    !=
cross-power Error Count ordinal
    !=
PEL retention/suppression/deletion policy
'''
          if 'cross-power Error Count ordinal' not in case:
              assert old_chain in case
              case = case.replace(old_chain, new_chain, 1)

          prior_anchor = 'This case does not claim that NVMe invented event logging, audit histories, black-box recording, or drive-health diagnostics. A full ATA/SCSI/vendor event-log genealogy would be a different historical slice. The defensible claim here is narrower:\n'
          prior_add = '''This case does not claim that NVMe invented event logging, audit histories, black-box recording, or drive-health diagnostics. Even inside NVMe, Revision 1.0 in 2011 already retained Error Count across power-off and SMART/Health information across power cycles, while Revision 1.3c in 2018 explicitly paired a reset-cleared recent Error Information population with a cross-power Error Count. These are earlier floors for retained diagnostic state and mixed history lifetimes, not the PEL mechanism itself.

A full ATA/SCSI/vendor event-log genealogy would be a different historical slice. The defensible 2019 claim is narrower:\n'''
          if 'Revision 1.0 in 2011 already retained Error Count' not in case:
              assert prior_anchor in case
              case = case.replace(prior_anchor, prior_add, 1)

          old_sources = '''1. NVM Express, Inc., **NVM Express Base Specification Revision 1.4**, 10 June 2019, especially §5.14.1.13–5.14.1.13.1.15, printed pp. 138–151: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_4-2019.06.10-Ratified.pdf>
2. NVM Express, Inc., **“New NVM Express, Inc. Specifications Bolster Cloud and Enterprise Advancements,”** 2019, describing PEL as robust drive history for issue triage/debug: <https://nvmexpress.org/new-nvm-express-inc-specifications-bolster-cloud-and-enterprise-advancements/>
'''
          new_sources = '''1. NVM Express, Inc., **NVM Express Base Specification Revision 1.4**, 10 June 2019, especially §5.14.1.1 (printed pp. 120–121) and §5.14.1.13–5.14.1.13.1.15 (printed pp. 138–151): <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_4-2019.06.10-Ratified.pdf>
2. NVM Express, Inc., **NVM Express Revision 1.3c**, 24 May 2018, §5.14.1.1, printed p. 103: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_3c-2018.05.24-Ratified.pdf>
3. NVM Express / NVMHCI Workgroup, **NVM Express Revision 1.0**, ratified 1 March 2011, §5.10.1.1–5.10.1.2, printed pp. 63–65: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_0-Gold.pdf>
4. NVM Express, Inc., **“New NVM Express, Inc. Specifications Bolster Cloud and Enterprise Advancements,”** 2019, describing PEL as robust drive history for issue triage/debug: <https://nvmexpress.org/new-nvm-express-inc-specifications-bolster-cloud-and-enterprise-advancements/>
'''
          if 'NVM Express Revision 1.3c' not in case.split('## Sources',1)[1]:
              assert old_sources in case
              case = case.replace(old_sources, new_sources, 1)

          case_path.write_text(case, encoding='utf-8')

          ev = ev_path.read_text(encoding='utf-8')
          if ev.startswith('# Grounding Record — NVMe 1.4 Persistent Event Log (2019)'):
              ev = ev.replace('# Grounding Record — NVMe 1.4 Persistent Event Log (2019)', '# Grounding Record — NVMe Persistent Event History and Log-Lifetime Contrast (2011–2019)', 1)

          if '## Deepening — Error Information entries, retained Error Count, and PEL' not in ev:
              anchor = '## In-repository prior-art boundary\n'
              addition = '''## Deepening — Error Information entries, retained Error Count, and PEL

### A — NVMe 1.0 historical floor (2011)

NVM Express Revision 1.0 was ratified **1 March 2011**. In §5.10.1.1, the Error Information entry defines a 64-bit incrementing `Error Count` and says it is retained across power-off conditions. In §5.10.1.2, SMART / Health information is described as information over the life of the controller and retained across power cycles.

Safe claim:

> NVMe retained diagnostic summary/ordinal state across power boundaries from Revision 1.0.

Unsafe upgrade:

> Revision 1.0 already provided the later NVMe 1.4 Persistent Event Log.

It did not. This is prior art inside NVMe for retained diagnostic state, not identity with PEL.

### A — NVMe 1.3c explicit mixed-lifetime error history (2018)

Revision 1.3c §5.14.1.1 makes the lifetime split explicit. Error Information is controller-global and returns a bounded recent-error population. If full, the controller should add the new entry and discard the oldest. The controller **should** remove all entries on power cycle and reset. The `Error Count` field is nevertheless specified as retained across power-off conditions.

The wording strength matters: `should clear` is a recommendation, not a `shall` requirement. The case therefore records the historical contract without upgrading recommendation to mandatory conformance.

Safe relations:

- detailed recent Error Information entries ≠ cross-power Error Count;
- recent-error population ≠ lifetime diagnostic summary;
- controller-global log scope ≠ later PEL subsystem-global scope.

### A — NVMe 1.4 preserves the contrast while adding PEL (2019)

Revision 1.4 §5.14.1.1 retains the same basic Error Information decomposition: controller-global recent entries, oldest-entry displacement under capacity pressure, recommended clearing on power cycle and Controller Level Reset, and a cross-power `Error Count`.

Revision 1.4 §5.14.1.13 then defines a separate PEL whose event information **shall** be retained across power cycles and resets and whose scope is the NVM subsystem.

This is a stronger retention-specific comparison than simply saying that PEL is persistent:

```text
error occurrence
    -> recent detailed Error Information entry
    -> Error Count / ordinal history that can cross power-off

significant device event
    -> PEL event entry
    -> subsystem-global cross-reset history
```

The two paths may refer to related faults, but the specification does not make them the same record population or the same lifetime contract.

### Engineering reconstruction boundary

A retained count/ordinal can survive after richer records have been discarded. It can establish that diagnostic history advanced, but it cannot reconstruct the lost queue ID, command ID, completion status, parameter-error location, LBA, namespace, or vendor-specific fields.

Therefore:

> **historical-summary persistence ≠ historical-detail persistence**.

and:

> **history lifetime is a property of a particular state relation, not of the word `log` in general**.

### Prior-art consequence for the 2019 PEL claim

The safe novelty boundary is now narrower than the first pass:

- 2011 NVMe already has retained error ordinal and lifetime SMART/Health state;
- 2018 NVMe 1.3c explicitly has mixed lifetimes inside one error-reporting path;
- 2019 NVMe 1.4 adds the inspected PEL composition: subsystem-global significant-event detail with explicit cross-reset persistence plus bounded suppression/deletion/sanitize/retrieval-context rules.

Chronology therefore blocks any claim that PEL introduced `retained device history` as such. The bounded contribution is the 2019 **event-detail persistence and retrieval-policy composition**, not first invention of diagnostic memory.

'''
              assert anchor in ev
              ev = ev.replace(anchor, addition + anchor, 1)

          ev_sources = '''1. NVM Express, Inc., **NVM Express Base Specification Revision 1.4**, 10 June 2019, §5.14.1.13–5.14.1.13.1.15: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_4-2019.06.10-Ratified.pdf>
2. NVM Express, Inc., **“New NVM Express, Inc. Specifications Bolster Cloud and Enterprise Advancements,”** 2019: <https://nvmexpress.org/new-nvm-express-inc-specifications-bolster-cloud-and-enterprise-advancements/>
'''
          ev_sources_new = '''1. NVM Express, Inc., **NVM Express Base Specification Revision 1.4**, 10 June 2019, §5.14.1.1 and §5.14.1.13–5.14.1.13.1.15: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_4-2019.06.10-Ratified.pdf>
2. NVM Express, Inc., **NVM Express Revision 1.3c**, 24 May 2018, §5.14.1.1: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_3c-2018.05.24-Ratified.pdf>
3. NVM Express / NVMHCI Workgroup, **NVM Express Revision 1.0**, ratified 1 March 2011, §5.10.1.1–5.10.1.2: <https://nvmexpress.org/wp-content/uploads/NVM-Express-1_0-Gold.pdf>
4. NVM Express, Inc., **“New NVM Express, Inc. Specifications Bolster Cloud and Enterprise Advancements,”** 2019: <https://nvmexpress.org/new-nvm-express-inc-specifications-bolster-cloud-and-enterprise-advancements/>
'''
          if 'NVM Express Revision 1.3c' not in ev.split('## Sources',1)[1]:
              assert ev_sources in ev
              ev = ev.replace(ev_sources, ev_sources_new, 1)
          ev_path.write_text(ev, encoding='utf-8')

          roadmap = roadmap_path.read_text(encoding='utf-8')
          if 'Case 66 now also grounds the 2011–2019 NVMe log-lifetime contrast' not in roadmap:
              lines = roadmap.splitlines()
              hits = 0
              for i, line in enumerate(lines):
                  if 'cases/66-nvme14-persistent-event-log-history.md' in line:
                      lines[i] = line + ' Case 66 now also grounds the 2011–2019 NVMe log-lifetime contrast: Revision 1.0 already retains Error Count/SMART history across power boundaries, Revision 1.3c explicitly pairs reset-cleared recent Error Information entries with a cross-power Error Count, and Revision 1.4 adds subsystem-global cross-reset PEL event detail. This sharpens `history lifetime != log-page label` without claiming PEL invented diagnostic memory.'
                      hits += 1
              assert hits == 1, hits
              roadmap = '\n'.join(lines) + '\n'
          roadmap_path.write_text(roadmap, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          old_row_fragment = '| [NVM Express 1.4 Persistent Event Log: Retained Device History, Selective Forgetting, and Snapshot-Consistent Retrieval](cases/66-nvme14-persistent-event-log-history.md) | **grounded** |'
          new_row = '| [NVM Express 1.4 Persistent Event Log: Retained Device History, Selective Forgetting, and Snapshot-Consistent Retrieval](cases/66-nvme14-persistent-event-log-history.md) | **grounded** | subsystem-global persistent significant-event records + controller-local recent Error Information entries + cross-power Error Count + finite vendor-specific capacity/policy + sanitize interaction + temporary reporting context | separate detailed-entry lifetime from retained count/ordinal lifetime; controller-local error detail from subsystem-global PEL history; cross-reset persistence from indefinite retention; live SMART state from historical snapshot; underlying event accumulation from one stable retrieval view | [expanded 2011–2019 NVMe log-lifetime/PEL grounding](evidence/66-nvme14-2019-persistent-event-log-grounding.md); ATA/SCSI genealogy, named-device implementation/compliance, physical PEL layout, later NVMe evolution, and failure-injection validation remain separate work |'
          if '[expanded 2011–2019 NVMe log-lifetime/PEL grounding]' not in index:
              lines = index.splitlines()
              hits = 0
              for i, line in enumerate(lines):
                  if line.startswith(old_row_fragment):
                      lines[i] = new_row
                      hits += 1
              assert hits == 1, hits
              index = '\n'.join(lines) + '\n'

          if '**1884 — detailed Error Information entry lifetime != Error Count lifetime:**' not in index:
              findings = '''

## Case 66 deepening — NVMe diagnostic-history lifetime findings

- **1884 — detailed Error Information entry lifetime != Error Count lifetime:** NVMe 1.3c/1.4 recommends clearing the recent detailed Error Information entry population at power/reset boundaries while separately retaining the per-error `Error Count` across power-off. (`H/P`)
- **1885 — recommended log clearing != counter reset:** the source uses `should` for clearing Error Information entries and independently specifies Error Count retention; the case must not silently upgrade either relation into one universal reset rule. (`H/P`, `X`)
- **1886 — retained error ordinal != recoverable error detail:** a later count can show that diagnostic history advanced without reconstructing discarded queue, command, status, LBA, namespace, parameter-location, or vendor-specific fields. (`E`)
- **1887 — controller-global Error Information != subsystem-global PEL:** Revision 1.4 assigns different scopes to the two log pages, so shared Get Log Page transport does not imply one logical history object. (`H/P`)
- **1888 — recent-n oldest-discard policy != PEL vendor-selective retention policy:** Error Information is a bounded recent-error list with oldest-entry displacement guidance, while PEL permits vendor-specific suppression and deletion that may retain an important older event over newer ones. (`H/P`, `E`)
- **1889 — Error Count persistence != PEL event persistence:** cross-power survival of a compact ordinal/history summary does not establish cross-reset survival of the richer event record population. (`H/P`, `E`)
- **1890 — NVMe 1.0 retained diagnostic state != NVMe 1.4 PEL:** the 1 March 2011 Revision 1.0 already retains Error Count across power-off and SMART/Health information across power cycles, blocking any 2019 origin claim for retained device-health/history state as such. (`H/P`, `X`)
- **1891 — NVMe 1.3c mixed-lifetime logging predates PEL:** by 24 May 2018 the standard already explicitly combines reset-cleared recent Error Information entries with a cross-power Error Count. (`H/P`)
- **1892 — 2019 PEL contribution != invention of diagnostic memory:** the bounded 1.4 contribution is subsystem-global significant-event detail with explicit cross-reset persistence plus suppression/deletion/sanitize/reporting-context semantics. (`H/P`, `E`, `X`)
- **1893 — Error Count unique identifier != causal chronology:** a monotonic per-error identifier orders/identifies error-log entries within its contract but does not preserve the full causal relation, command stream, or physical fault history that produced them. (`H/P`, `E`, `X`)
- **1894 — one `log page` label != one retention class:** NVMe log pages differ in scope, failure-boundary lifetime, granularity, capacity policy, and current-versus-historical semantics. (`E`)
- **1895 — PEL hardware-error event != Error Information entry:** both can report error-related facts, but the standard defines distinct event formats/scopes/lifetimes rather than one duplicated record population. (`H/P`, `X`)
- **1896 — current diagnostic state != retained summary != retained event detail:** Case 55 and deepened Case 66 now form a three-way decomposition rather than a binary `SMART vs PEL` contrast. (`E`, `A` bounded only)
- **1897 — related-repository boundary:** current `computing-archaeology` search still found no dedicated NVMe PEL/log-lifetime case; broad ATA/SCSI/NVMe diagnostic-log genealogy belongs there if developed, while Case 66 keeps the retention-specific lifetime/scope decomposition. (`H/P` project-state record)
'''
              assert index.rstrip().endswith('(`H/P` project-state record)')
              index = index.rstrip() + findings + '\n'
          index_path.write_text(index, encoding='utf-8')

          for p in [case_path, ev_path, roadmap_path, index_path]:
              lines = p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')

          checks = {
              case_path: ['NVMe 1.3c', 'detailed diagnostic entry lifetime', 'cross-power Error Count ordinal'],
              ev_path: ['NVMe 1.0 historical floor', 'NVMe 1.3c explicit mixed-lifetime error history'],
              roadmap_path: ['Case 66 now also grounds the 2011–2019 NVMe log-lifetime contrast'],
              index_path: ['**1884 — detailed Error Information entry lifetime != Error Count lifetime:**', '**1897 — related-repository boundary:**'],
          }
          for p, needles in checks.items():
              text = p.read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (p, needle)
          PY
      - name: Validate research diff
        run: |
          git diff --check
          git diff --stat
          git diff -- cases/66-nvme14-persistent-event-log-history.md evidence/66-nvme14-2019-persistent-event-log-grounding.md ROADMAP.md CASE_INDEX.md
      - name: Commit research integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add cases/66-nvme14-persistent-event-log-history.md evidence/66-nvme14-2019-persistent-event-log-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m "case66: deepen NVMe diagnostic-history lifetimes"
          git push
