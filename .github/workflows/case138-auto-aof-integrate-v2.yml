name: integrate-case138-auto-aof-genealogy-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case138-auto-aof-integrate-v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research updates
        run: python3 .case138_integrate.py
      - name: Commit canonical research tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'technical-retention-bot'
          git config user.email 'technical-retention-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case138: deepen automatic AOF rewrite genealogy [skip ci]'
          git push origin HEAD:main
