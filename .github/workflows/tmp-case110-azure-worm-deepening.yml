name: case110 azure worm integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-case110-azure-worm-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: integrate
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/automation-case110-azure-worm.py
          python3 -c "from pathlib import Path; p=Path('CASE_INDEX.md'); p.write_text(p.read_text().rstrip() + '\\n')"
          git config user.name technical-retention-automation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'case110: deepen Azure cloud-WORM prior-art boundary'
          git push origin HEAD:main
