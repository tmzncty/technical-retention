---

## Security-erasure deepening — machine clear, clearing, purging, and degaussing

The 1964 TCM-32 evidence proves that a production core-memory system could reset its whole stack to the machine-defined `ZERO` state. It does **not** by itself prove security-grade sanitization. A later period source makes that boundary explicit: the National Computer Security Center's September 1991 [`NCSC-TG-025`](../evidence/02-1991-ncsc-core-clearing-purging-degaussing-deepening.md) distinguishes `clearing` from the stronger `purging` objective by the reconstruction capability that must be defeated and separately names overwriting and degaussing as approved procedures for magnetic core memory.

### Historical record

- In the TCM-32 manual, `Memory Clear` is a **product operation**: a clear-current path resets all cores to the defined `ZERO` state.
- In NCSC-TG-025, `clearing` is a **security-assurance category** aimed at preventing reconstruction through normal system capabilities in a still-controlled environment.
- `Purging` is a stronger security-assurance category aimed at preventing reconstruction through open-ended laboratory techniques when the secure physical environment will not be maintained.
- The 1991 magnetic-core section says both overwriting and degaussing were approved methods to clear or purge core memory and that Type I degaussers / hand-held magnets could purge it.
- The guide treats degausser testing, maintenance, and operator correctness as part of erasure assurance; invoking a procedure is not identical to proving its effectiveness.

### Engineering reconstruction

The older `Memory Clear` and later security `clearing` share a word but not a contract. Case 02 therefore now separates at least three closure conditions:

```text
old value no longer current through the ordinary memory interface
    !=
old value resistant to reconstruction through normal system capability
    !=
old value resistant to the stronger laboratory-oriented purge threat model
```

It also separates two paths for ending magnetic state:

```text
ordinary overwrite / machine clear
    -> acts through normal selection/write or dedicated internal clear circuitry

degaussing
    -> acts through an externally applied magnetic field
```

The second path bypasses ordinary logical addressing, but that fact alone does not prove that a particular degaussing execution was effective; equipment qualification and current operating condition remain separate evidence.

### Functional analogy — bounded only

Later Flash/SSD sanitization cases make a similar relation-level distinction among logical invalidation, physical erase, sanitization objective, completion, and verification. The comparison is useful only at that level. Core overwrite/degaussing is not Flash block erase, FTL reclamation, or NVMe Sanitize, and no genealogy is claimed.

### Philosophical interpretation

This evidence supports a narrow proposition: **technical forgetting has operation-relative and reconstruction-relative closure conditions**. A previous state may cease to be current without satisfying a stronger criterion of unrecoverability. That does not turn NCSC security vocabulary into a universal theory of memory or forgetting.

### Stop conditions

- `TCM-32 Memory Clear != NCSC clearing` merely because both use `clear`;
- `whole-stack ZERO reset != demonstrated purge`;
- `degaussed != logical ZERO`;
- `procedure invoked != erasure assured`;
- `1991 approval != universal early-core operational practice`;
- the NCSC tape-oriented 90 dB degausser test is **not** promoted into a measured core-plane erasure margin.
'''
          case_path.write_text(case, encoding='utf-8')

