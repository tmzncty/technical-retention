name: Temporary Case 02 core sanitization integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply previous bounded research payload
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/tmp-case02-core-degaussing.yml > /tmp/previous.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous.yml').read_text(encoding='utf-8')
          start = text.index('      - name: Apply bounded research slice\n')
          start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('      - name: Validate and commit\n', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply.sh
          python - <<'PY'
          from pathlib import Path
          for name in [
              'CASE_INDEX.md',
              'ROADMAP.md',
              'cases/02-magnetic-core-destructive-read.md',
              'evidence/02-1991-ncsc-core-clearing-purging-degaussing-deepening.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-case02-core-degaussing.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git diff --check
          expected=$'CASE_INDEX.md\nROADMAP.md\ncases/02-magnetic-core-destructive-read.md\nevidence/02-1991-ncsc-core-clearing-purging-degaussing-deepening.md'
          actual="$(git status --short | sed -E 's/^.. //' | grep -v '^\.github/' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected canonical research file set:'
            printf '%s\n' "$actual"
            exit 1
          fi
          grep -q 'Case 02 magnetic-core clearing / purging / degaussing boundary deepening' ROADMAP.md
          grep -q '2769 — related-repository boundary' CASE_INDEX.md
          grep -q 'Security-erasure deepening — machine clear, clearing, purging, and degaussing' cases/02-magnetic-core-destructive-read.md
          git config user.name 'technical-retention research automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'case02: deepen core sanitization boundary'
          git push origin HEAD:main
