This evidence addendum deepens [`../cases/02-magnetic-core-destructive-read.md`](../cases/02-magnetic-core-destructive-read.md) without reopening the general history of magnetic-core memory.

**Bounded question:** the 1964 TCM-32 manual already shows a production core-memory `Memory Clear` operation that electrically resets the whole stack to its defined `ZERO` state. Does that machine operation by itself establish security-grade forgetting, and how did a later period security source distinguish ordinary clearing, stronger purging, overwriting, and degaussing for magnetic core memory?

The answer is useful because the English word `clear` occurs in two different historical vocabularies. A product manual can use it for a concrete state-setting operation, while a computer-security guideline can use `clearing` for an assurance category defined by what reconstruction capability must be defeated. Treating those as synonyms would collapse mechanism, threat model, and administrative authority.

---

## Source A — NCSC-TG-025 Version 2, September 1991

**Document:** National Computer Security Center, *A Guide to Understanding Data Remanence in Automated Information Systems*, NCSC-TG-025, Library No. 5-236,082, Version 2, September 1991.

**Preserved transcription:** <https://irp.fas.org/nsa/rainbow/tg025-2.htm>

**Evidence class:** `H/P*` — a period U.S. National Computer Security Center technical guideline, accessed through a later preservation/transcription host. FAS is not the historical author. The document describes itself as guidance and explicitly warns that it is not a substitute for policy.

The foreword says Version 2 supersedes **CSC-STD-005-85, Department of Defense Magnetic Remanence Security Guideline, dated 15 November 1985**. That establishes a documentary predecessor floor, not the invention date of magnetic-core sanitization, data-remanence analysis, overwriting, or degaussing.

The guide also retrospectively states that the problem posed by retentive storage properties had been recognized as early as 1960. Because that sentence is a 1991 retrospective historical statement rather than a directly inspected 1960 source, this addendum does **not** promote `1960` into an independently grounded origin claim.

---

## A1. `Data remanence` names residual reconstructable physical representation

The 1991 guide defines data remanence as the residual physical representation of data after the storage medium has in some way been erased, where surviving physical characteristics may permit reconstruction.

That definition is already enough to block an easy equivalence:

```text
not current through the ordinary machine interface
    !=
no residual physical representation remains
```

The document is about the security consequences of that gap. It does not say that every erased state on every technology is practically recoverable; rather, the risk exists when the post-erasure physical state still supports reconstruction under the relevant threat model.

---

## A2. Security `clearing` and `purging` are assurance categories, not merely write commands

Section 2.2 distinguishes two threat levels.

**Clearing** requires assurance, proportional to data sensitivity, that prior data cannot be reconstructed through normal system capabilities — the guide describes this as the `keyboard` threat and allows use of advanced diagnostics within that system-level class. It associates clearing with reuse while the secured physical environment remains controlled.

**Purging** requires assurance that prior data cannot be reconstructed through open-ended laboratory techniques and is required when the secure physical environment will no longer be maintained.

Therefore:

```text
security clearing
    !=
security purging
```

and, crucially for Case 02:

```text
TCM-32 `Memory Clear`
    != automatically
NCSC security `clearing`
    != automatically
NCSC security `purging`
```

The first phrase names a documented 1964 product operation. The latter two name 1991 security-assurance categories. A concrete memory operation may participate in a clearing or purging procedure, but the shared word `clear` is not enough to establish that relation.

---

## A3. Overwrite is a logical-pattern replacement procedure

Section 5.1.1 describes overwriting as writing unclassified data into storage locations that previously contained sensitive data. The generic guidance says one overwrite pattern can satisfy the DoD clearing relation for the locations in question, while a purge through overwriting uses a stronger pattern sequence whose exact repetition and applicability depend on the medium and policy context.

Section 4 also warns that overwrite effectiveness depends on whether the software actually reaches the state population that matters. Merely removing file pointers is not generally enough for system-level recovery resistance, and a purging overwrite program must cope with addressability and error conditions rather than assuming that requested coverage equals actual coverage.

For magnetic core, the bounded lesson is:

> **normal write authority can be used as a security-erasure mechanism only when the procedure establishes adequate coverage and assurance for the stated threat model.**

That is stronger than saying `the memory accepted a new logical value`.

---

## A4. Degaussing is a different physical intervention

The guide's degaussing primer treats magnetic recording as alignment of magnetic domains and describes degaussing as applying a magnetic field so that the previous magnetic representation no longer remains reconstructable. It distinguishes AC erasure, in which an alternating field is reduced from an initially high value, from DC erasure/saturation using a unidirectional field or permanent magnet.

The generic standard section describes degaussing as erasing magnetic media and, in its policy vocabulary, returning it to an `initial virgin state`. That phrase should be read as the guide's security/operational description, not as a claim that AC and DC procedures leave one literally identical microscopic domain configuration.

This mechanism is not the same as the TCM-32's whole-stack `Memory Clear`:

```text
TCM-32 Memory Clear
    -> use the memory system's clear current
    -> reset all cores to the machine-defined ZERO state

NCSC degaussing
    -> apply a degaussing magnetic field / approved magnet procedure
    -> suppress recoverable prior magnetic representation
```

Both can intentionally end the previous payload relation. They do so through different physical/control paths.

**Grounded boundary:** `defined logical ZERO state != degaussed-state assurance`.

---

## A5. The guide names magnetic core memory explicitly

Section 5.2.5 is unusually direct: the DoD had approved both **overwriting** and **degaussing** as methods to clear or purge **magnetic core memory**, and the guide says Type I degaussers and hand-held magnets can purge that medium, while referring readers to DoD 5200.28-M for the complete procedure.

This is a period security-policy/guidance witness for magnetic core memory as a remanence-sensitive medium with more than one authorized data-removal path. It does **not** establish:

- that every 1950s or 1960s core-memory installation actually used these security procedures;
- that the 1964 TCM-32 `Memory Clear` option had been evaluated as a DoD purge procedure;
- that NCSC invented core overwriting or degaussing;
- that a hand-held magnet procedure preserves the hardware for later service;
- or that every ferrite material, geometry, packaging, and field strength has identical erasure behavior.

---

## A6. Procedure execution and assurance are different retained relations

The guide warns that degaussers can be used incorrectly, can fail, and can lose capability over time. It recommends periodic testing and explicitly warns against assuming that a new or previously evaluated degausser is necessarily still providing sufficient erasure.

That adds a second-order retention problem:

```text
procedure selected
    !=
procedure executed correctly
    !=
erasure effectiveness established
```

The guide's 90 dB discussion belongs to NSA/CSS degausser testing using a special worst-case **tape** test signal. This addendum does not transfer that number to a specific core plane or claim that the TCM-32 stack was measured against that criterion. The useful relation is only that security erasure depends on an assurance path for the erasure apparatus, not merely on the existence of an erase command or magnetic field.

---

## Engineering reconstruction

### E1. Logical replacement and forensic/security forgetting are different predicates

For Case 02, three states can now be kept separate:

1. **old value is no longer the machine's current logical word**;
2. **old value cannot be recovered through normal system capabilities**;
3. **old value cannot be reconstructed under the stronger laboratory-oriented purge threat model**.

A selected overwrite or whole-stack `Memory Clear` can establish (1) at the product-interface level. The 1991 security vocabulary shows why (1) does not, by itself, prove (2) or (3).

### E2. `Clear` must be typed by mechanism, scope, and assurance target

The repository already learned from the TCM-32 that `clear` needs **scope**: selected address versus whole stack. NCSC-TG-025 adds two more dimensions:

```text
mechanism: ordinary overwrite / internal bulk reset / external degaussing
scope:     selected word / all addressable locations / physical magnetic medium
assurance: current logical replacement / keyboard-resistant clearing / laboratory-resistant purging
```

The same English verb cannot substitute for this tuple.

### E3. Address coverage is constitutive of overwrite-based security erasure

An overwrite can only replace states it reaches. NCSC's broader overwrite discussion therefore makes addressability part of forgetting: `command completed` is weaker than `all relevant retained locations were actually overwritten`.

This is functionally comparable to later Flash/SSD sanitization cases where hidden, remapped, or stale embodiments complicate host-level overwrite. It is **not** evidence that core memory had an FTL, spare-block map, or modern sanitize command.

### E4. Degaussing changes the authority path

Ordinary overwrite relies on the memory's selection/write path to reach stored state. Degaussing instead acts through an external magnetic field on the medium. It therefore changes not only the requested value but the apparatus through which forgetting is attempted.

This is a useful retention contrast:

> the same retained substrate can be ended through its ordinary address/write machinery or through a physically different intervention that bypasses ordinary logical addressing.

### E5. Erasure tooling has its own maintenance/verification state

A degausser can age or fail; therefore a nominal sanitization capability is not timeless. Test history, maintenance, model qualification, operator procedure, and current field capability can become constitutive evidence for whether the erasure path should be trusted.

This does not mean the degausser's maintenance records are part of the old payload. It means that assurance about technical forgetting depends on retained evidence outside the payload-bearing medium.

---

## Functional analogies — bounded only

### Case 22 synthesis / Flash-SSD sanitization

The repository's later Flash/NVMe cases likewise distinguish logical invalidation, physical erase, sanitization objective, operation completion, and independent verification. Magnetic core supplies an older magnetic counterexample showing that this decomposition is not unique to Flash.

Safe analogy:

```text
logical unavailability
    !=
security sanitization
    !=
verification that the sanitization objective was met
```

Rejected identity:

```text
core overwrite/degauss = Flash block erase = NVMe Sanitize
```

The mechanisms, interfaces, hidden-state problems, and historical vocabularies differ.

### Case 02 TCM-32 clear versus NCSC clearing

This is not even primarily a cross-technology analogy. It is a **same-medium vocabulary collision across two historical contexts**: a 1964 manufacturer uses `Memory Clear` for a physical machine operation, while a 1991 security guideline uses `clearing` for a reconstruction-resistance objective. Keeping them separate is an anti-anachronism result.

---

## Philosophical interpretation — deliberately narrow

This slice sharpens `technical forgetting` without turning security terminology into metaphysics.

The exact technical fact is that the same old payload can cease to be current under the normal machine interface while still failing a stronger reconstruction-resistance criterion. NCSC's `clearing` / `purging` distinction makes the stopping rule explicit: forgetting is being evaluated relative to a reconstruction apparatus and a threat model.

A useful interpretation is therefore:

> **technical forgetting is not one universal material event; different systems and institutions define different closure conditions for when a prior state no longer counts as recoverable.**

The interpretation stops there. It does not imply that every form of human forgetting is threat-model-relative, that security `purging` is a universal philosophical definition of forgetting, or that magnetic remanence is identical to cultural memory or Stieglerian tertiary retention.

---

## Rejected / unsupported claims

- **X — `TCM-32 Memory Clear = NCSC clearing`.** Shared English wording does not establish identical semantics or assurance.
- **X — `whole-stack ZERO reset = demonstrated security purge`.** The 1964 manual does not provide the 1991 threat model, approved procedure, or forensic validation.
- **X — `degaussed = logical ZERO`.** The two operations use different state transitions and authority paths.
- **X — `DoD-approved in 1991 = standard practice in every early core-memory installation`.** No deployment claim follows.
- **X — `1991 Version 2 = invention priority`.** The document itself names a 1985 predecessor and retrospectively mentions earlier awareness.
- **X — `90 dB tape-degausser test = measured core-memory erasure margin`.** The inspected test description is tape-specific.
- **X — `procedure invoked = erasure assured`.** Equipment condition and verification remain separate.
- **X — `security erase = physical destruction`.** NCSC lists destruction as another operation class.
- **X — `data remanence = current authoritative payload`.** Residual reconstructable physical representation and ordinary service currentness are different relations.

---

