The broad historical mechanism, coincident-current selection, manufacturing labor, and why core memory was worth building are already covered in [`tmzncty/computing-archaeology: Why Was Magnetic-Core Memory Worth Weaving by Hand?`](https://github.com/tmzncty/computing-archaeology/blob/main/docs/memory/why-core-memory-was-worth-weaving.md).

A fresh repository search for `degauss`, `sanitization`, and magnetic-core remanence found no dedicated companion case to reuse in this round. Broad degausser history, magnetic-security policy genealogy, field-strength/material studies, and experimental remanence measurement belong primarily in `computing-archaeology` if developed. This addendum keeps the retention-specific boundary:

> **product-level state replacement, security clearing, laboratory-oriented purging, degaussing, and evidence that an erasure apparatus still works are separable relations even when they all concern the same magnetic-core substrate.**

---

