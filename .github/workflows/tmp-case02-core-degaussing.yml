---

## Security-erasure deepening — machine clear, clearing, purging, and degaussing

The 1964 TCM-32 evidence proves that a production core-memory system could reset its whole stack to the machine-defined `ZERO` state. It does **not** by itself prove security-grade sanitization. The National Computer Security Center's September 1991 [`NCSC-TG-025`](../evidence/02-1991-ncsc-core-clearing-purging-degaussing-deepening.md) distinguishes `clearing` from stronger `purging` by the reconstruction capability that must be defeated and separately names overwriting and degaussing as approved procedures for magnetic core memory.

### Historical record

- TCM-32 `Memory Clear` is a **product operation** that resets all cores to a defined ZERO state.
- NCSC `clearing` is a **security-assurance category** aimed at normal-system reconstruction resistance in a controlled environment.
- NCSC `purging` is a stronger category aimed at open-ended laboratory reconstruction resistance when that environment will not be maintained.
- NCSC-TG-025 §5.2.5 names both overwriting and degaussing as approved methods for magnetic core memory.
- The guide treats degausser testing/maintenance and operator correctness as separate assurance work.

### Engineering reconstruction

```text
old value no longer current through the ordinary memory interface
    !=
old value resistant to reconstruction through normal system capability
    !=
old value resistant to the stronger laboratory-oriented purge threat model
```

It also separates ordinary overwrite/internal clear from degaussing through an externally applied magnetic field. The latter bypasses ordinary logical addressing, but execution alone does not prove effectiveness.

### Functional analogy — bounded only

Later Flash/SSD sanitization cases similarly separate logical invalidation, physical erase, sanitization objective, completion, and verification. The relation-level comparison is useful; the mechanisms and histories are not identical.

### Philosophical interpretation

A narrow claim survives: **technical forgetting has operation-relative and reconstruction-relative closure conditions**. A state can cease to be current without satisfying a stronger criterion of unrecoverability.

### Stop conditions

- `TCM-32 Memory Clear != NCSC clearing`;
- `whole-stack ZERO reset != demonstrated purge`;
- `degaussed != logical ZERO`;
- `procedure invoked != erasure assured`;
- `1991 approval != universal early-core practice`;
- the NCSC tape-oriented 90 dB test is not a measured core-plane erasure margin.
"""
