## Case 02 deepening — NCSC clearing / purging / degaussing findings

- **2755 — product `Memory Clear` != security `clearing`:** the 1964 TCM-32 term names a whole-stack state-setting operation, while NCSC-TG-025 uses `clearing` for assurance against reconstruction through normal system capabilities; shared wording does not establish one historical concept. (`H/P`, `E`, `X`)
- **2756 — security clearing != security purging:** the 1991 NCSC guide distinguishes normal-system/keyboard reconstruction resistance in a controlled environment from the stronger open-ended-laboratory threat model required for release to a less secure environment. (`H/P`)
- **2757 — current logical replacement != demonstrated purge:** forcing a core word or whole stack to a new defined logical state establishes ordinary machine currentness but does not by itself establish the stronger reconstruction-resistance relation. (`E`)
- **2758 — overwrite != degauss:** overwriting relies on the storage system's write/address path to replace prior patterns, whereas degaussing applies a magnetic field through a physically different erasure path. (`H/P`, `E`)
- **2759 — logical ZERO != degaussed-state assurance:** TCM-32 `Memory Clear` resets cores to the machine-defined ZERO state; NCSC degaussing aims to suppress recoverable previous magnetic representation and is not merely another name for writing ZERO. (`H/P`, `E`)
- **2760 — magnetic-core purge can have multiple approved procedure classes:** NCSC-TG-025 §5.2.5 explicitly names both overwriting and degaussing for magnetic core memory, preventing any claim that one universal physical erasure mechanism defines core sanitization. (`H/P`)
- **2761 — data remanence != current authoritative payload:** the NCSC definition concerns residual physical representation after erasure that may support reconstruction; ordinary current-value semantics and forensic/security recoverability are separate relations. (`H/P`, `E`)
- **2762 — procedure selection != procedure effectiveness:** NCSC warns that degaussers can be misused, fail, or lose capability and recommends periodic testing; a nominal purge path therefore has its own assurance/maintenance burden. (`H/P`)
- **2763 — degausser test evidence != core-plane-specific erasure measurement:** the inspected 90 dB discussion quantifies a special tape test signal; it cannot be silently promoted into a measured erasure margin for the TCM-32 or another named core stack. (`H/P`, `X`)
- **2764 — overwrite request != demonstrated state-population coverage:** NCSC's overwrite discussion makes reachability/coverage and error handling part of clearing/purging assurance; completion of a logical write path is weaker than proof that all security-relevant retained locations were replaced. (`H/P`, `E`)
- **2765 — 1991 guidance != early-core deployment practice:** NCSC-TG-025 is evidence for a 1991 security framework applicable to magnetic core memory, not evidence that MIT Whirlwind, the TCM-32, or every earlier installation operationally used that framework. (`H/P`, `X`)
- **2766 — NCSC-TG-025 Version 2 != invention priority:** the document itself supersedes a 15-Nov-1985 predecessor and retrospectively mentions earlier awareness; exact sanitization genealogy remains open. (`H/P`, `X`)
- **2767 — guideline != policy:** NCSC-TG-025 repeatedly directs users to DoD policy/manual procedures and says the guide should not replace policy; its statements must not be rewritten as a self-sufficient legal/administrative contract. (`H/P`, `X`)
- **2768 — core security-erasure analogy to Flash/NVMe is relational only:** later technologies likewise separate logical invalidation, physical erase, sanitization objective, completion, and verification, but core overwrite/degauss is not Flash block erase, FTL reclamation, or NVMe Sanitize and establishes no genealogy. (`A`, `X`)
- **2769 — related-repository boundary:** current `tmzncty/computing-archaeology` search found no dedicated magnetic-core degaussing/sanitization case to reuse; broad degausser/material/security-policy history belongs there if developed, while Case 02 keeps the retention-specific machine-clear / reconstruction-resistance boundary. (`H/P` project-state record)
'''
              index = index.rstrip() + findings + '\n'
