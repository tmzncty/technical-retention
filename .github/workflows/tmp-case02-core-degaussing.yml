          printf '%s' '**Bounded question:** the 1964 TCM-32 manual already shows a production core-memory `Memory Clear` operation that electrically resets the whole stack to its defined `ZERO` state. Does that machine operation by itself establish security-grade forgetting, and how did a later period security source distinguish clearing, purging, overwriting, and degaussing for magnetic core memory?

The shared English word `clear` is dangerous here: a product manual can use it for a concrete state-setting operation, while a computer-security guideline can use `clearing` for an assurance category defined by what reconstruction capability must be defeated.

---

## Source A — NCSC-TG-025 Version 2, September 1991

**Document:** National Computer Security Center, *A Guide to Understanding Data Remanence in Automated Information Systems*, NCSC-TG-025, Library No. 5-236,082, Version 2, September 1991.

**Preserved transcription:** <https://irp.fas.org/nsa/rainbow/tg025-2.htm>

**Evidence class:** `H/P*` — a period U.S. National Computer Security Center technical guideline, accessed through a later preservation/transcription host. FAS is not the historical author. The document explicitly says it is guidance and should not replace policy.

The foreword says Version 2 supersedes **CSC-STD-005-85, Department of Defense Magnetic Remanence Security Guideline, dated 15 November 1985**. This establishes a documentary predecessor floor, not invention priority. The guide also retrospectively says storage-remanence risk had been recognized as early as 1960; because no direct 1960 source was inspected here, that date remains a retrospective claim rather than a new origin anchor.

---

## Historical record

### H1. Data remanence is residual physical representation after erasure

NCSC-TG-025 defines data remanence as the residual physical representation of data after storage media has been erased, where surviving physical characteristics may still permit reconstruction.

This immediately blocks:

```text
not current through the ordinary machine interface
    !=
no residual physical representation remains
```

The source does not say every erased state on every technology is practically recoverable. It defines the security problem created when residual physical representation remains recoverable under an applicable threat model.

### H2. `Clearing` and `purging` are different security-assurance categories

Section 2.2 defines **clearing** as removing sensitive data with assurance that it cannot be reconstructed through normal system capabilities — the guide frames this as the `keyboard` threat — while the secured physical environment remains controlled.

It defines **purging** as removing sensitive data with assurance that it cannot be reconstructed through open-ended laboratory techniques, and associates purging with release to a less secure environment.

Therefore:

```text
security clearing
    !=
security purging
```

and, for this case:

```text
TCM-32 `Memory Clear`
    != automatically
NCSC security `clearing`
    != automatically
NCSC security `purging`
```

The first phrase names a documented 1964 product operation. The latter two name 1991 security-assurance categories.

### H3. Overwriting and degaussing are distinct procedures

Section 5.1.1 describes overwriting as writing unclassified data to storage locations that previously contained sensitive data. The generic guidance permits a single overwrite pattern for clearing and describes stronger patterned overwrite procedures for purging where applicable.

The degaussing primer instead describes erasure through an applied magnetic field. It distinguishes AC erasure, using an alternating field reduced from an initially high value, from DC erasure/saturation using a unidirectional field or permanent magnet. The generic standards section describes degaussing as erasing magnetic media; its `initial virgin state` language is an operational/security description, not proof that AC and DC procedures leave one identical microscopic state.

### H4. Magnetic core memory is named explicitly

Section 5.2.5 states that the DoD had approved both **overwriting** and **degaussing** as methods to clear or purge **magnetic core memory**, and says Type I degaussers and hand-held magnets can purge that medium, referring readers to DoD 5200.28-M for the full procedure.

This is a 1991 security-guidance witness. It does **not** establish that every earlier core-memory installation used those procedures, that TCM-32 `Memory Clear` had been evaluated as a purge procedure, or that NCSC invented core overwriting/degaussing.

### H5. Erasure tooling needs its own assurance

The guide warns that degaussers can be misused, fail, or lose capability, and recommends periodic testing. It explicitly warns against assuming that a new or previously evaluated degausser is necessarily still providing sufficient erasure.

Its 90 dB discussion concerns a special worst-case **tape** test signal used for degausser evaluation. This addendum does not transfer that number to a named core plane.

---

## Engineering reconstruction

### E1. Current-value replacement and security forgetting are different predicates

Case 02 can now distinguish:

1. the old value is no longer the machine's current logical word;
2. the old value cannot be reconstructed through normal system capability;
3. the old value cannot be reconstructed under the stronger laboratory-oriented purge threat model.

A selected overwrite or whole-stack `Memory Clear` can establish (1) at the product-interface level. The 1991 security vocabulary shows why (1) alone cannot prove (2) or (3).

### E2. `Clear` must be typed by mechanism, scope, and assurance target

The TCM-32 deepening already showed that `clear` needs a **scope**. NCSC-TG-025 adds mechanism and assurance:

```text
mechanism: ordinary overwrite / internal bulk reset / external degaussing
scope:     selected word / all addressable locations / physical magnetic medium
assurance: logical replacement / normal-interface clearing / laboratory-oriented purging
```

The same English verb cannot substitute for this tuple.

### E3. Address coverage is constitutive of overwrite-based erasure

An overwrite can only replace state it actually reaches. NCSC's broader overwrite discussion therefore makes addressability/coverage part of security erasure. `write command completed` is weaker than `all security-relevant retained locations were overwritten`.

This is functionally comparable to later Flash/SSD sanitization problems, but it is not evidence that core memory had an FTL, spare-block map, or modern sanitize command.

### E4. Degaussing changes the authority path

Ordinary overwrite relies on the memory's selection/write path. Degaussing applies a magnetic field through a different physical intervention and can bypass ordinary logical addressing.

Thus the same retained substrate can be ended through its ordinary write apparatus or through another apparatus acting on the physical magnetic medium.

### E5. Procedure execution and erasure assurance are distinct

For a security erasure path:

```text
procedure selected
    !=
procedure executed correctly
    !=
erasure effectiveness established
```

The degausser's condition, qualification, testing, and maintenance can become constitutive evidence for whether forgetting has actually met its stated assurance objective.

---

## Functional analogy — bounded only

The repository's later Flash/NVMe cases likewise distinguish logical invalidation, physical erase, sanitization objective, operation completion, and verification.

Safe relation-level analogy:

```text
logical unavailability
    !=
security sanitization
    !=
verification that sanitization met its objective
```

Rejected identity:

```text
core overwrite/degauss = Flash block erase = NVMe Sanitize
```

The mechanisms, interfaces, hidden-state problems, and histories differ.

---

## Philosophical interpretation — deliberately narrow

The exact technical fact is that an old payload can cease to be current under the ordinary machine interface without thereby satisfying a stronger reconstruction-resistance criterion. NCSC's clearing/purging distinction makes the stopping rule explicit.

A narrow interpretation survives:

> **technical forgetting is not one universal material event; different technical and institutional regimes can impose different closure conditions for when a prior state no longer counts as recoverable.**

This does not turn NCSC security vocabulary into a universal theory of human forgetting, cultural memory, or Stieglerian tertiary retention.

---

## Rejected / unsupported claims

- **X — `TCM-32 Memory Clear = NCSC clearing`.** Shared wording does not establish identical semantics.
- **X — `whole-stack ZERO reset = demonstrated security purge`.** The 1964 manual does not supply the 1991 threat model or validation.
- **X — `degaussed = logical ZERO`.** These operations use different physical/control paths.
- **X — `DoD-approved in 1991 = standard practice in every early core-memory installation`.**
- **X — `1991 Version 2 = invention priority`.** It names a 1985 predecessor.
- **X — `90 dB tape-degausser test = measured core-memory erasure margin`.**
- **X — `procedure invoked = erasure assured`.**
- **X — `data remanence = current authoritative payload`.**

---

## Related-repository boundary

The broad historical mechanism, coincident-current selection, manufacturing labor, and system-level reasons core memory was attractive are already covered in [`tmzncty/computing-archaeology: Why Was Magnetic-Core Memory Worth Weaving by Hand?`](https://github.com/tmzncty/computing-archaeology/blob/main/docs/memory/why-core-memory-was-worth-weaving.md).

A fresh repository search for `degauss`, `sanitization`, and magnetic-core remanence found no dedicated companion case to reuse. Broad degausser history, magnetic-security-policy genealogy, material/coercivity studies, and experimental remanence measurement belong primarily in `computing-archaeology` if developed.

The retention-specific result kept here is:

> **product-level state replacement, security clearing, laboratory-oriented purging, degaussing, and evidence that an erasure apparatus still works are separable relations even when they concern the same magnetic-core substrate.**

---

## Readiness assessment

This closes the bounded **magnetic-core security-erasure vocabulary / clear-versus-purge / overwrite-versus-degauss** seam left open after the 1964 TCM-32 addendum.

Still open are direct analog post-switch remanence measurements on a named core plane, the exact 1960s/1970s classified-core degaussing genealogy, direct inspection of the 1985 predecessor, material-specific thresholds for named products, post-degauss service consequences, and broader secure-sanitization genealogy.
