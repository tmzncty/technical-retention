          roadmap_item = "- [x] Case 02 magnetic-core clearing / purging / degaussing boundary deepening — [`cases/02-magnetic-core-destructive-read.md`](cases/02-magnetic-core-destructive-read.md), deepened by [`evidence/02-1991-ncsc-core-clearing-purging-degaussing-deepening.md`](evidence/02-1991-ncsc-core-clearing-purging-degaussing-deepening.md): NCSC-TG-025 Version 2 (09/1991) explicitly separates security `clearing` from stronger `purging`, names overwriting and degaussing as approved magnetic-core procedures, and treats degausser testing/maintenance as separate assurance work. This closes the bounded `machine Memory Clear != security clearing != security purging`, `logical ZERO reset != degaussed-state assurance`, and `procedure invoked != erasure assured` seam without projecting 1991 policy vocabulary into 1950s/1960s operators. Direct named-core analog-remanence measurement, a directly inspected 1985 predecessor, detailed degaussing-practice genealogy, and material-specific thresholds remain open; broad history belongs primarily in `computing-archaeology`.\n\n"
