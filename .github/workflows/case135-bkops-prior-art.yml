name: Case 135 BKOPS prior-art integration

on:
  push:
    paths:
      - '.github/workflows/case135-bkops-prior-art.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research edits
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          git config user.name 'technical-retention-agent'
          git config user.email 'technical-retention-agent@users.noreply.github.com'
          git add -A
          git commit -m 'case135: ground eMMC 4.41 BKOPS prior art [skip ci]'
          git push origin HEAD:main
