name: Case 135 BKOPS prior-art integration

on:
  push:
    paths:
      - '.github/workflows/case135-bkops-prior-art.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate bounded prior-art deepening
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'manual BKOPS is publicly grounded by e.MMC 4.41' cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md; then
            cat >> cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md <<'EOF'

          ## Prior-art follow-up — manual BKOPS is publicly grounded by e.MMC 4.41

          A bounded follow-up moves the repository's conservative public standardized floor for **generic manual BKOPS** earlier than the 2015 e.MMC 5.1 witness. JESD84-A441's public record is dated **1 March 2010** and names `Background Operation` in the e.MMC 4.41 title; period SanDisk (25 February 2010) and Kingston Solutions (June 2011) e.MMC 4.41 product documents expose `BKOPS_START[164]` / `BKOPS_EN[163]`, with the Kingston document also exposing `BKOPS_SUPPORT[502]` and `BKOPS_STATUS[246]`.

          This is a lower-bound correction, not an invention claim:

          ```text
          public standardized generic manual-BKOPS floor <= e.MMC 4.41 / 2010
          e.MMC 5.1 witness != origin of generic manual BKOPS
          manual host-granted opportunity != later inspected AUTO_EN device scheduling
          scheduling authority != physical-target authority != hidden algorithm identity
          ```

          The 2009 e.MMC 4.4 public title lacks the later `Background Operation` phrase, but title metadata is not a clause-level A44→A441 diff and therefore cannot prove a first-introduction event. Direct normative diffing and the 4.41→4.5→4.51→5.0→5.1 genealogy remain evidence debt, with broader pre-eMMC maintenance history routed to `computing-archaeology`.

          Prior-art deepening: [`../evidence/135-emmc441-2010-manual-bkops-prior-art-deepening.md`](../evidence/135-emmc441-2010-manual-bkops-prior-art-deepening.md).
          EOF
          fi

          if ! grep -q 'Prior-art follow-up — e.MMC 4.41' evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md; then
            cat >> evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md <<'EOF'

          ## Prior-art follow-up — e.MMC 4.41

          A later bounded pass supersedes the **lower-bound uncertainty** of this 5.1-only slice without changing its control-semantics findings. Public JESD84-A441 metadata and period e.MMC 4.41 manufacturer documentation now ground generic manual `BKOPS_START` / `BKOPS_EN` by at least **2010**. Accordingly, e.MMC 5.1 remains the inspected witness for the richer manual-versus-`AUTO_EN` scheduling split, but it is **not** treated as the origin of generic manual BKOPS.

          See [`135-emmc441-2010-manual-bkops-prior-art-deepening.md`](135-emmc441-2010-manual-bkops-prior-art-deepening.md). Exact A44→A441 clause introduction and the intermediate 4.5/4.51/5.0 sequence remain open and must not be inferred from endpoint titles.
          EOF
          fi

          if ! grep -q 'Case 135 e.MMC 4.41 manual-BKOPS prior-art floor' ROADMAP.md; then
            cat >> ROADMAP.md <<'EOF'

          ### Completed bounded deepening — Case 135 e.MMC 4.41 manual-BKOPS prior-art floor

          - [x] [`cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md`](cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md) + [`evidence/135-emmc441-2010-manual-bkops-prior-art-deepening.md`](evidence/135-emmc441-2010-manual-bkops-prior-art-deepening.md): move the conservative public standardized **generic manual-BKOPS** floor from the previously inspected 2015 e.MMC 5.1 witness back to at least **e.MMC 4.41 / 2010**, using JESD84-A441 publication/title metadata plus period SanDisk/Kingston 4.41 product documentation exposing `BKOPS_START`, `BKOPS_EN`, support, and status fields. Preserve the lower-bound/not-invention distinction; keep manual host-granted scheduling separate from the later inspected `AUTO_EN` device-autonomous scheduling mode; preserve `scheduling authority != target/algorithm authority`; and leave the exact A44→A441 clause diff plus 4.5/4.51/5.0 genealogy to direct JEDEC archaeology / `computing-archaeology`.
          EOF
          fi

          if ! grep -q '3407 — H/P' CASE_INDEX.md; then
            cat >> CASE_INDEX.md <<'EOF'

          ## Case 135 prior-art deepening — e.MMC 4.41 manual BKOPS floor

          Grounding: [`cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md`](cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md), [`evidence/135-emmc441-2010-manual-bkops-prior-art-deepening.md`](evidence/135-emmc441-2010-manual-bkops-prior-art-deepening.md), and the existing e.MMC 5.1 follow-up [`evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md`](evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md).

          - **3407 — H/P:** The public standards record for JESD84-A441:2010 is dated 1 March 2010 and includes `Background Operation and High Priority Interrupt` in the e.MMC 4.41 title; this is a public document/version boundary, not an invention date.
          - **3408 — H/P/X:** The public JESD84-A44:2009 title lacks that phrase, but title metadata is not a clause-level A44→A441 diff and cannot prove that no related mechanism existed before A441.
          - **3409 — H/P:** A June-2011 Kingston Solutions e.MMC 4.41 datasheet states JESD84-A441 compatibility and explicitly lists Background Operations as part of the 4.41 feature set.
          - **3410 — H/P:** The same period 4.41 document says the host writes `BKOPS_START[164]` to manually start background operations and the device remains busy until no more background processing is needed.
          - **3411 — H/P:** Period 4.41 product documentation exposes `BKOPS_SUPPORT[502]`, `BKOPS_STATUS[246]`, `BKOPS_START[164]`, and `BKOPS_EN[163]`, separating capability/status/control fields rather than one undifferentiated maintenance flag.
          - **3412 — H/P:** A SanDisk iNAND e.MMC 4.41 datasheet dated 25 February 2010 independently exposes `BKOPS_START[164]` and `BKOPS_EN[163]`, providing a second period manufacturer witness.
          - **3413 — E:** The repository's conservative public standardized floor for **generic manual BKOPS** therefore moves to at least e.MMC 4.41 / 2010; this does not establish first invention, first ballot, or first shipment.
          - **3414 — E:** `BKOPS capability != current maintenance obligation != host-granted manual execution opportunity != hidden maintenance algorithm`.
          - **3415 — E:** The useful 4.41→inspected-5.1 comparison is scheduling authority: manual host-granted BKOPS opportunity is not the same control mode as later `AUTO_EN` device-autonomous idle-time scheduling.
          - **3416 — E:** `scheduling authority != physical-target authority`; changing who opens the service window does not disclose or prove who/what selects physical NAND targets.
          - **3417 — E:** `standardized maintenance opportunity/control != standardized hidden Flash maintenance algorithm`; generic BKOPS alone does not prove garbage collection, wear leveling, read reclaim, retention refresh, or block retirement.
          - **3418 — A:** Generic BKOPS and Micron/Armadillo self refresh share only a functional powered-idle maintenance-opportunity boundary; `shared idle opportunity != shared mechanism`.
          - **3419 — P:** Project interpretation only: a maintenance obligation can exist independently of who is authorized to schedule the next execution window; this is not JEDEC or vendor historical vocabulary.
          - **3420 — X:** No direct normative A44→A441 clause diff, JEDEC ballot genealogy, or pre-eMMC background-maintenance genealogy is established here; first-introduction/invention claims remain prohibited pending stronger primary evidence.
          EOF
          fi

          rm -f .github/workflows/case135-bkops-prior-art.yml
          git config user.name 'technical-retention-agent'
          git config user.email 'technical-retention-agent@users.noreply.github.com'
          git add -A
          git commit -m 'case135: integrate eMMC 4.41 BKOPS prior art [skip ci]'
          git push origin HEAD:main
