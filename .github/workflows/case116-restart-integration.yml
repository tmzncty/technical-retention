name: Case 116 restart integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/case116_restart_deepening.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply bounded Case 116 deepening
        run: python tools/case116_restart_deepening.py
      - name: Validate canonical diff
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          idx = Path('CASE_INDEX.md').read_text()
          for n in range(2635, 2650):
              needle = f'**{n} —'
              assert idx.count(needle) == 1, (n, idx.count(needle))
          case = Path('cases/116-apache-hdfs-datanode-maintenance-state.md').read_text()
          ev = Path('evidence/116-hadoop-301-maintenance-restart-reconstitution-deepening.md').read_text()
          roadmap = Path('ROADMAP.md').read_text()
          assert 'Restart reconstitution deepening — Hadoop 3.0.1' in case
          assert 'persisted admin intent != persisted runtime replica-location knowledge' in ev
          assert 'Case 116 Hadoop 3.0.1 restart-reconstitution deepening' in roadmap
          PY
      - name: Commit and push research slice
        run: |
          if git diff --quiet; then
            echo 'No canonical changes to commit.'
            exit 0
          fi
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/116-apache-hdfs-datanode-maintenance-state.md evidence/116-hadoop-301-maintenance-restart-reconstitution-deepening.md ROADMAP.md CASE_INDEX.md
          git commit -m 'case116: deepen restart-reconstitution boundary'
          git push origin HEAD:main
