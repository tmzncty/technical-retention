name: Temporary Case144 ZooKeeper ephemeral integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case144-zookeeper-ephemeral.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate bounded Case144 research slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 _automation_case144_zookeeper_ephemeral.py
          git diff --check
          test -f cases/144-zookeeper-ephemeral-session-liveness.md
          test -f evidence/144-zookeeper-2009-2015-ephemeral-session-liveness-grounding.md
          grep -q '3101 — 2009 public documentation floor' CASE_INDEX.md
          grep -q '3118 — related-repository boundary' CASE_INDEX.md
          grep -q 'Case 144 ZooKeeper ephemeral-znode session-liveness / automatic-retirement slice' ROADMAP.md
          test ! -e _automation_case144_zookeeper_ephemeral.py
          test ! -e .github/workflows/tmp-case144-zookeeper-ephemeral.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case144: ground ZooKeeper ephemeral session liveness'
          git push origin HEAD:main
