name: deepen-case20-nvme-torn-write

on:
  push:
    paths:
      - '.github/workflows/integrate-case20-nvme-torn-write.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    concurrency:
      group: technical-retention-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deepen Case20 torn-write atomicity
        run: |
          sed -i 's/## Phase 2 — Evidence-backed expansion with comparison discipline/## Phase 2 — Build missing technical bridges/' scripts/integrate-case20-nvme-torn-write.sh
          bash scripts/integrate-case20-nvme-torn-write.sh
