name: recover-case138-auto-aof-genealogy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case138-auto-aof-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and run integration payload with diagnostic capture
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/case138-auto-aof-genealogy-integrate.yml').read_text(encoding='utf-8')
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n\n          git config"
          start = src.index(start_token) + len(start_token)
          end = src.index(end_token, start)
          payload = src[start:end]
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines()) + '\n'
          Path('/tmp/case138_payload.py').write_text(payload, encoding='utf-8')
          PY
          if ! python3 /tmp/case138_payload.py 2> /tmp/case138_error.txt; then
            {
              echo '# Case 138 integration diagnostic'
              echo
              echo '```text'
              cat /tmp/case138_error.txt
              echo '```'
            } > case138-integration-debug.md
            git config user.name 'technical-retention-bot'
            git config user.email 'technical-retention-bot@users.noreply.github.com'
            git add case138-integration-debug.md
            git commit -m 'ops: capture Case 138 integration failure [skip ci]'
            git push origin HEAD:main
            exit 0
          fi
          rm -f .github/workflows/case138-auto-aof-genealogy-integrate.yml
          rm -f .github/workflows/case138-auto-aof-recovery.yml
          rm -f case138-integration-debug.md
          git config user.name 'technical-retention-bot'
          git config user.email 'technical-retention-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case138: deepen automatic AOF rewrite genealogy [skip ci]'
          git push origin HEAD:main
