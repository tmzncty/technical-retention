name: Fix Case 24 synthesis count once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/case24-count-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          t = p.read_text(encoding='utf-8')
          old = '- [x] at least four contrasting cases at `grounded` or better — currently twenty-two;'
          new = '- [x] at least four contrasting cases at `grounded` or better — currently twenty-five;'
          if old not in t:
              raise SystemExit('synthesis count anchor missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/case24-count-fix.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_INDEX.md .github/workflows/case24-count-fix.yml
          git diff --cached --check
          git commit -m "docs: reconcile Case 24 synthesis count"
          git push
