name: Integrate Case 93 AVATAR deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case93-avatar.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'tmzncty/technical-retention'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate Case 93 research navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate_case93_avatar.py
          git diff --check
          test -s evidence/93-avatar-2015-vrt-aware-refresh-revalidation-deepening.md
          grep -q '93-avatar-2015-vrt-aware-refresh-revalidation-deepening.md' cases/93-dram-variable-retention-time-profile-staleness.md
          grep -q 'Case 93 AVATAR VRT-aware runtime-requalification deepening' ROADMAP.md
          grep -q '\*\*2426 —' CASE_INDEX.md
          git status --short

      - name: Commit canonical changes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git rm .github/workflows/integrate-case93-avatar.yml .github/scripts/integrate_case93_avatar.py
          git add cases/93-dram-variable-retention-time-profile-staleness.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'case93: deepen VRT runtime requalification boundary'
          git push origin HEAD:main
