name: case87-integrate

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/case87-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Case 87 navigation and status updates
        run: python .github/case87_integrate.py

      - name: Validate bounded integration
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {
              'README.md': ['cases/87-scsi2-writeback-cache-fua-synchronize-cache.md'],
              'ROADMAP.md': ['cases/87-scsi2-writeback-cache-fua-synchronize-cache.md'],
              'CASE_INDEX.md': [
                  'cases/87-scsi2-writeback-cache-fua-synchronize-cache.md',
                  '| SCSI-2 / SBC-2 cache durability / 1994–2004 bounded chain |',
                  '1069. **command completion / `GOOD` ≠ physical-medium residency**',
                  '1084. **the required retention boundary depends on the transition to be survived**',
                  'currently eighty-eight (Cases 00–87)',
                  'After eighty-eight bounded cases, **all eighty-eight cases are now `grounded`.**',
              ],
          }
          for path, needles in expected.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (path, needle)
          assert Path('cases/87-scsi2-writeback-cache-fua-synchronize-cache.md').exists()
          assert Path('evidence/87-scsi-1994-2004-cache-durability-grounding.md').exists()
          PY
          git diff --check

      - name: Commit integrated research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/case87_integrate.py .github/workflows/case87-integrate.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'case87: integrate SCSI cache durability navigation'
          git push origin HEAD:main
