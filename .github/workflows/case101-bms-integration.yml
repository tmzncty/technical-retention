name: Case 101 BMS integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case101-bms-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply bounded research slice
        run: python3 .github/scripts/integrate_case101.py

      - name: Validate research tree
        run: |
          git diff --check
          test -f cases/101-scsi-background-medium-scan-proactive-defect-discovery.md
          test -f evidence/101-t10-2004-2007-background-medium-scan-grounding.md
          grep -Fq '## Case 101 — SCSI Background Medium Scan findings' CASE_INDEX.md
          grep -Fq 'SCSI Background Medium Scan / proactive medium-readability boundary' ROADMAP.md
          grep -Fq 'BMS standardization ≠ invention of background scanning' CASE_INDEX.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' CASE_INDEX.md ROADMAP.md cases/101-scsi-background-medium-scan-proactive-defect-discovery.md evidence/101-t10-2004-2007-background-medium-scan-grounding.md | sort)"
          test "$changed" = "$expected"

      - name: Commit research
        run: |
          git add CASE_INDEX.md ROADMAP.md cases/101-scsi-background-medium-scan-proactive-defect-discovery.md evidence/101-t10-2004-2007-background-medium-scan-grounding.md
          git commit -m 'case101: ground SCSI background medium scan boundary'
          git push origin main

      - name: Remove one-shot integration files
        run: |
          git rm .github/scripts/integrate_case101.py .github/workflows/case101-bms-integration.yml
          git commit -m 'chore: remove case101 one-shot integration files'
          git push origin main
