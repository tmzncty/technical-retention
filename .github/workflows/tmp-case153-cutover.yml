name: tmp-case153-cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case153-cutover.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Integrate bounded Case 153 slice
        run: python3 tools/tmp_case153_integrate.py
