name: Integrate Case 41

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case41.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 41
        run: python3 .github/scripts/integrate_case41.py
      - name: Validate and commit
        run: |
          test -f cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md
          test -f evidence/41-cassandra-3x-tombstone-repair-grounding.md
          grep -q 'forty-two grounded regimes' CASE_INDEX.md
          grep -q '381. \*\*logical deletion' CASE_INDEX.md
          grep -q 'Case 41' README.md
          grep -q 'Cases 19, 23, 24, 25, 26, 27, 28, 29, and 41' ROADMAP.md
          rm -f .github/scripts/integrate_case41.py .github/workflows/integrate-case41.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: integrate grounded Cassandra tombstone repair bridge'
          git push origin HEAD:main
