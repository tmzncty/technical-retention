name: Integrate Case 32 navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_case32.py'
      - '.github/workflows/integrate-case32.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and status
        run: python3 scripts/integrate_case32.py
      - name: Commit integrated navigation and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/integrate_case32.py .github/workflows/integrate-case32.yml
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'docs: integrate grounded Intel ADR/eADR bridge'
          git push
