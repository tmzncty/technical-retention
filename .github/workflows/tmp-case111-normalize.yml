name: Temporary Case 111 output normalization

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-case111-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize and clean scaffolding
        run: python .github/scripts/tmp_case111_normalize.py
      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/scripts/tmp_case111_normalize.py
          test ! -e .github/workflows/tmp-case111-normalize.yml
          grep -Fq -- '- **3555 —' CASE_INDEX.md
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case111: normalize integration output [skip ci]'
          git push origin HEAD:main
