name: technical-retention-s14-one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-retention-s14.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize exact ROADMAP matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/integration/technical_retention_s14.py')
          s = p.read_text(encoding='utf-8')
          old = 'How should acknowledged, visible, replicated, and durably committed be separated across systems'
          new = 'How should `acknowledged`, `visible`, `replicated`, and `durably committed` be separated across systems'
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'unexpected matcher occurrence count={count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - run: python .github/integration/technical_retention_s14.py
      - name: Normalize generated EOF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - run: |
          git diff --check
          grep -Fq 'SYNTHESIS_14_DISTRIBUTED_ACK_VISIBILITY_DURABILITY.md' README.md
          grep -Fq 'bounded cross-case closure' ROADMAP.md
          grep -Fq 'acknowledged / visible / replicated / durable ≠ universal temporal ladder' CASE_INDEX.md
          rm .github/integration/technical_retention_s14.py .github/workflows/technical-retention-s14.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m 'synthesis: separate distributed acknowledgement visibility durability'
          git push origin HEAD:main
