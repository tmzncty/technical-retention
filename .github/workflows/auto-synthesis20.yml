name: integrate-synthesis20
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-synthesis20.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate Synthesis 20 navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme_para = '''A bounded filesystem-crash-retention comparison is now available in [`docs/SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md`](docs/SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md). Across grounded BSD FFS soft updates and Linux JBD/ext4 cases it separates live/returned visibility, crash-admissible stable state, explicit file/namespace durability closure, recovery/replay authority, remembered post-crash cleanup obligations, and reclamation completion. It fixes the counterexamples `returned ≠ durable`, `crash-admissible ≠ latest state`, `committed recovery evidence ≠ immutable replay authority`, `replay complete ≠ cleanup complete`, and `reclaimed ≠ sanitized`.'''

          roadmap_new = '''- [x] How should `returned/visible`, `crash-admissible`, `explicitly durable`, and `reclaimed/converged` be separated in filesystem regimes? — bounded by [`docs/SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md`](docs/SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md), using grounded Cases 16, 74, 124, and 125. The synthesis separates live visibility, dependency-qualified crash-admissible stable state, explicit file/namespace durability scope, recovery/replay authority, retained cleanup obligations, and final reclamation; it fixes `returned ≠ durable`, `atomic rename visibility ≠ crash durability`, `committed recovery evidence ≠ immutable replay authority`, `replay complete ≠ cleanup/reclamation complete`, and `reclaimed ≠ sanitized`. The broader file-system crash-consistency item remains open for COW/checkpoint systems, cross-filesystem semantics, fast-commit evolution, database/WAL composition, complete genealogy, lower-layer validation, and fault injection.'''

          index_append = '''## Synthesis 20 — Filesystem crash-retention layer findings

          - **2161 — returned/live-visible ≠ crash-admissible:** Case 16 permits the newest application-visible in-memory state to outrun the dependency-safe stable image; an operation being visible to a running caller does not establish the state that survives volatile loss. (`H/P` inherited, `E`)
          - **2162 — crash-admissible ≠ latest-operation durable:** soft updates can leave a structurally safe mountable image while a recent operation never became permanent. (`H/P` inherited, `E`)
          - **2163 — explicit durability closure ≠ one universal whole-filesystem commit:** `fsync` closes a requested scope whose constitutive data/metadata relations depend on the object and operation; its success should not be inflated into a universal durability predicate. (`H/P` inherited, `E`)
          - **2164 — file `fsync` ≠ namespace-binding durability:** Case 124's current Linux contract explicitly keeps the containing directory entry outside the file-only synchronization guarantee unless the directory is separately synchronized. (`H/P` inherited, `E`)
          - **2165 — atomic rename visibility ≠ crash durability:** an observer need not see an intermediate missing destination even while the replacement payload/name relation still lacks the required failure-surviving closure. (`H/P` inherited, `E`)
          - **2166 — surviving committed redo ≠ immutable replay authority:** Case 74 shows that a committed positive journal image can remain physically present yet become replay-inadmissible after a later sequence-qualified revoke and block reuse. (`H/P` inherited, `E`)
          - **2167 — more surviving recovery bytes ≠ monotonically safer recovery:** stale positive history can become dangerous when a newer semantic generation occupies the same home block; retained negative/currentness evidence may be needed to suppress it. (`E`)
          - **2168 — replay completion ≠ cleanup completion:** Case 125 explicitly orders journal replay before orphan delete/truncate restart, so a recovered serviceable filesystem can still carry unfinished maintenance work. (`H/P` inherited, `E`)
          - **2169 — cleanup obligation ≠ reclamation closure:** an orphan entry identifies future work; it does not prove that blocks/inodes have already become reusable. (`H/P` inherited, `E`)
          - **2170 — namespace detachment ≠ storage reclamation:** a name can disappear while an inode and its blocks remain intentionally allocated because an open reference or multi-transaction truncate still requires them. (`H/P` inherited, `E`)
          - **2171 — physical byte survival ≠ safely reusable capacity:** allocation/recovery relations, not mere physical presence, decide when a block or inode may enter a new use. (`E`)
          - **2172 — reclaimed/reusable ≠ securely sanitized:** filesystem reclamation changes allocation authority without establishing overwrite, cryptographic erasure, or forensic absence in lower media; Case 44 remains the separate sanitization boundary. (`A`, `E`, `X`)
          - **2173 — volatile dependency-control state ≠ persistent recovery log:** Case 16 uses in-memory dependency metadata to constrain pre-crash stable writeback without requiring that same control representation to survive as redo history. (`H/P` inherited, `E`)
          - **2174 — negative recovery evidence ≠ deletion tombstone:** JBD revoke suppresses an older redo image for a sequence-bounded reused block; it should not be normalized into Cassandra/Swift distributed-delete semantics merely because all are negative state. (`A`, `X`)
          - **2175 — filesystem durability closure ≠ lower-device persistence compliance:** correct file/namespace ordering and synchronization still compose with the cache/Flush/FUA/persistence contract supplied below; Cases 15/20/87 and Synthesis 13 remain separate layers. (`A`, `E`)
          - **2176 — one word `consistent` ≠ one retention state:** live visibility, crash admissibility, durability scope, replay authority, cleanup obligation, and reclamation each answer a different observer/failure/maintenance question. (`E`)
          - **2177 — implementation adjacency ≠ one genealogy:** BSD FFS soft updates, Linux JBD revoke, ext4 rename handling, and ext3/ext4 orphan tracking are compared functionally; the synthesis does not establish a soft-updates→JBD→ext4 descent or one shared historical vocabulary. (`A`, `X`)
          - **2178 — related-repository boundary:** a fresh `tmzncty/computing-archaeology` search found no dedicated filesystem crash-retention synthesis to reuse; broad FFS/journaling/COW/ext-family/WAL genealogy belongs there if developed, while Synthesis 20 remains retention-specific. (`H/P` project-state record)'''

          synthesis = Path('docs/SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md')
          assert synthesis.exists()

          readme = Path('README.md')
          rtxt = readme.read_text(encoding='utf-8')
          assert 'SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md' not in rtxt
          paras = rtxt.split('\n\n')
          matches = [i for i, p in enumerate(paras) if 'SYNTHESIS_19_LOG_STRUCTURED_TABLET_RECOVERY.md' in p]
          assert len(matches) == 1, matches
          paras.insert(matches[0] + 1, readme_para)
          readme.write_text('\n\n'.join(paras).rstrip() + '\n', encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          lines = roadmap.read_text(encoding='utf-8').splitlines()
          assert not any('SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md' in line for line in lines)
          matches = [i for i, line in enumerate(lines) if line.startswith('- [ ] How should `returned/visible`, `crash-admissible`, `explicitly durable`, and `reclaimed/converged`')]
          assert len(matches) == 1, matches
          lines[matches[0]] = roadmap_new
          roadmap.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          index = Path('CASE_INDEX.md')
          itxt = index.read_text(encoding='utf-8')
          assert '## Synthesis 20 — Filesystem crash-retention layer findings' not in itxt
          assert '**2160 — related-repository boundary:**' in itxt
          assert '**2161 —' not in itxt
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in index_append.splitlines())
          index.write_text(itxt.rstrip() + '\n\n' + normalized.rstrip() + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/auto-synthesis20.yml')
          assert workflow.exists()
          workflow.unlink()
          PY

      - name: Validate integration
        shell: bash
        run: |
          test -f docs/SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md
          test ! -f .github/workflows/auto-synthesis20.yml
          grep -F 'SYNTHESIS_20_FILESYSTEM_CRASH_RETENTION_LAYERS.md' README.md
          grep -F -- '- [x] How should `returned/visible`, `crash-admissible`, `explicitly durable`, and `reclaimed/converged`' ROADMAP.md
          grep -F '## Synthesis 20 — Filesystem crash-retention layer findings' CASE_INDEX.md
          grep -F '**2178 — related-repository boundary:**' CASE_INDEX.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          t = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          nums = [int(x) for x in re.findall(r'^- \*\*(\d+) —', t, flags=re.M)]
          assert nums[-18:] == list(range(2161, 2179)), nums[-20:]
          assert t.count('## Synthesis 20 — Filesystem crash-retention layer findings') == 1
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'synthesis20: integrate filesystem crash-retention navigation'
          git push origin HEAD:main
