name: Case 64 one-shot integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case64-integrator.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch navigation and status
        run: python .github/scripts/integrate_case64.py
      - name: Validate bounded case ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          cases = sorted(Path('cases').glob('[0-9][0-9]-*.md'))
          nums = [int(p.name[:2]) for p in cases]
          assert nums == list(range(65)), (len(nums), nums[:3], nums[-3:])
          assert Path('cases/64-apache-kafka-transaction-coordinator-state-recovery.md').exists()
          assert Path('evidence/64-kafka-0110-transaction-state-recovery-grounding.md').exists()
          idx = Path('CASE_INDEX.md').read_text()
          assert 'After sixty-five bounded cases, **all sixty-five cases are now `grounded`.**' in idx
          assert idx.count('cases/64-apache-kafka-transaction-coordinator-state-recovery.md') >= 2
          assert idx.count('## Case 64 — Kafka transaction-coordinator state-recovery findings') == 1
          for n in range(701, 717):
              assert f'{n}. **' in idx, n
          readme = Path('README.md').read_text()
          roadmap = Path('ROADMAP.md').read_text()
          assert '64-apache-kafka-transaction-coordinator-state-recovery.md' in readme
          assert '64-kafka-0110-transaction-state-recovery-grounding.md' in readme
          assert '64-apache-kafka-transaction-coordinator-state-recovery.md' in roadmap
          print('validated 65 bounded cases, 00-64')
          PY
          git diff --check
      - name: Commit integrated result and remove one-shot runner
        shell: bash
        run: |
          rm -f .github/scripts/integrate_case64.py .github/workflows/case64-integrator.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: integrate grounded Kafka coordinator recovery case'
          git push origin HEAD:main
