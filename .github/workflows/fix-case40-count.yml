name: Fix Case 40 synthesis count

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-case40-count.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix count
        run: python .automation/fix_case40_count.py
      - name: Validate and commit
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_INDEX.md
          git rm .automation/fix_case40_count.py .github/workflows/fix-case40-count.yml
          git diff --cached --check
          git commit -m "docs: reconcile Case 40 synthesis count"
          git push origin HEAD:main
