name: integrate-case151

on:
  push:
    paths:
      - '.github/workflows/integrate-case151.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    concurrency:
      group: technical-retention-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Case151 integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/integration_151.sh
