name: automation-case02-papian-debt

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/automation-case02-papian-debt.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile Papian facsimile evidence debt
        run: python tools/automation_case02_papian_debt.py

      - name: Validate research navigation diff
        run: |
          git diff --check
          grep -q 'Papian direct-facsimile deepening' cases/02-magnetic-core-destructive-read.md
          grep -q 'former Papian-1952 facsimile cleanup is now' cases/02-magnetic-core-destructive-read.md
          grep -q 'closes the older Case-02 roadmap/source-note request' cases/70-magnetic-core-half-select-disturbance.md
          grep -q 'Papian 1952 direct-facsimile cleanup closed via Case 70' ROADMAP.md
          test -f evidence/70-papian-1952-half-select-disturbance-facsimile-deepening.md

      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md cases/02-magnetic-core-destructive-read.md cases/70-magnetic-core-half-select-disturbance.md
          git diff --cached --check
          git commit -m 'core: close Papian facsimile evidence debt [skip ci]'
          git push origin HEAD:main

      - name: Remove temporary automation files
        run: |
          git rm tools/automation_case02_papian_debt.py .github/workflows/automation-case02-papian-debt.yml
          git diff --cached --check
          git commit -m 'core: clean Papian reconciliation artifacts [skip ci]'
          git push origin HEAD:main
