name: integrate-case126-final

on:
  push:
    paths:
      - '.github/workflows/integrate-case126-final.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate_case126.py
          rm -f .github/scripts/integrate_case126.py .github/workflows/integrate-case126-final.yml
          test -f cases/126-nvme11-reservation-ptpl-authority-retention.md
          test -f evidence/126-nvme-1998-2012-reservation-ptpl-grounding.md
          grep -q 'cases/126-nvme11-reservation-ptpl-authority-retention.md' ROADMAP.md
          grep -q 'cases/126-nvme11-reservation-ptpl-authority-retention.md' CASE_INDEX.md
          grep -q '2194' CASE_INDEX.md
          git diff --check
          git config user.name "chatgpt-research-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "case126: integrate reservation PTPL navigation"
          git push origin HEAD:main
