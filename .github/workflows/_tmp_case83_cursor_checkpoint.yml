name: Temporary Case 83 cursor checkpoint integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_case83_cursor_checkpoint.yml'
      - 'tools/_tmp_case83_cursor_checkpoint.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply research integration
        run: python3 tools/_tmp_case83_cursor_checkpoint.py

      - name: Validate and commit research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add cases/83-apache-hdfs-block-scanner-checksum-verification.md \
                  evidence/83-hadoop-2003-2016-block-scanner-grounding.md \
                  evidence/83-hdfs-blockscanner-cursor-checkpoint-clock-domain-deepening.md \
                  ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m "case83: deepen scanner cursor checkpoint boundary"
          git push origin HEAD:main

      - name: Remove temporary integration scaffolding
        run: |
          git rm tools/_tmp_case83_cursor_checkpoint.py .github/workflows/_tmp_case83_cursor_checkpoint.yml
          git commit -m "chore: remove Case 83 cursor integration scaffolding"
          git push origin HEAD:main
