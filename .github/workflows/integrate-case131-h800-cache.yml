name: Case 131 H800 integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate research slice
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore: normalize Case 131 H800 integration" ]; then
            exit 0
          fi
          git config user.name "technical-retention research automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python3 tools/integrate_case131_h800_cache.py
          while IFS=: read -r file line rest; do
            [ -n "$file" ] || continue
            sed -i "${line}s/[[:space:]]\+$//" "$file"
          done < <(git diff --check 2>&1 | grep 'trailing whitespace\.$' || true)
          git diff --check
          grep -q 'controller-local state ≠ state physically inseparable' CASE_INDEX.md
          grep -q 'Case 131 deepening — PERC H800 transportable retained-cache findings' CASE_INDEX.md
          grep -q 'failed-controller dirty-cache layer' ROADMAP.md
          grep -q 'March 2011 PERC H800 makes a transportable failed-controller cache path explicit' cases/131-dell-perc-foreign-configuration-controller-replacement.md
          grep -q 'G-131.26' evidence/131-dell-perc-2007-2011-foreign-configuration-grounding.md
          git add cases/131-dell-perc-foreign-configuration-controller-replacement.md evidence/131-dell-perc-2007-2011-foreign-configuration-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m 'case131: deepen H800 transportable dirty-cache recovery'
          git rm .github/workflows/integrate-case131-h800-cache.yml tools/integrate_case131_h800_cache.py
          git commit -m 'chore: remove Case 131 H800 integration helpers'
          git push origin HEAD:main
