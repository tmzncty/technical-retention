name: Integrate Case 136 source-readability deepening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/automation-case136-puncture.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical research edits
        shell: bash
        run: |
          set +e
          python3 .github/scripts/integrate_case136.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Unexpected: primary helper did not stop at the known CASE_INDEX schema mismatch.'
            exit 1
          fi
          python3 .github/scripts/patch_case136_index.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          rm -f .github/scripts/integrate_case136.py
          rm -f .github/scripts/patch_case136_index.py
          rm -f .github/workflows/automation-case136-puncture.yml
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'technical-retention-automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git commit -m 'case136: deepen degraded-rebuild source readability [skip ci]'
          git push origin HEAD:main
