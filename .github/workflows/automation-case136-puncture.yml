          evidence = r'''# Evidence 136B — Dell PERC degraded-rebuild source unreadability and RAID puncture

## Status

**`grounded`** — bounded primary-source deepening for Case 136. This evidence record asks what happens when a rebuild is scheduled and progressing but a surviving source contribution required for reconstruction is unreadable. It does **not** estimate universal URE probability, generalize RAID 5 behavior to RAID 6, or infer undocumented PERC firmware internals.

## Scope question

Case 136 already separates the retained rebuild-rate policy from the rebuild obligation and from actual rebuild execution. A remaining question was whether aggressive repair scheduling is enough to make all degraded data reconstructable.

The bounded question here is narrower:

> On documented Dell PERC systems, can a degraded rebuild continue even when a local stripe cannot be reconstructed because a surviving source contribution is unreadable, and what state remains afterward?

## Source set and provenance

### Dell OpenManage Server Administrator Storage Management User's Guide — March 2013

- Dell Inc., *OpenManage Server Administrator Storage Management User's Guide*, March 2013.
- Official Dell-hosted manufacturer PDF.
- Relevant sections: `A Rebuild Completes with Errors` (p. 300 in the printed guide / PDF page 299) and `Receive a “Bad Block” Alert with “Replacement,” “Sense,” or “Medium” Error` (printed p. 305 / PDF page 304).
- URL: <https://dl.dell.com/manuals/all-products/esuprt_electronics/esuprt_software/esuprt_ent_sys_mgmt/dell-opnmang-srvr-admin-mngd-das_user's%20guide_en-us.pdf>
- Accessed: 2026-09-12.

### Dell EMC PowerEdge Servers Troubleshooting Guide — November 2018, Rev. A11

- Dell EMC, *PowerEdge Servers Troubleshooting Guide*, Rev. A11, November 2018.
- Official Dell-hosted manufacturer PDF.
- Relevant section: `RAID puncture`, printed pp. 97–99 / PDF pages 97–99.
- URL: <https://dl.dell.com/manuals/common/servertroubleshootingguide_en.pdf>
- Accessed: 2026-09-12.

### Current Dell knowledge-base continuity witness

- Dell, `PowerEdge: How to fix Double Faults and Punctures in RAID Arrays`.
- URL: <https://www.dell.com/support/kbdoc/en-us/000139251/double-faults-and-punctures-in-raid-arrays>
- Used only as a maintained terminology/operational-continuity witness. It is **not** used to establish first use or invention priority.

## Historical record

### March 2013: a rebuild can complete successfully while leaving a damaged portion unrestored

Dell's March 2013 OpenManage guide contains a section titled `A Rebuild Completes with Errors` for PERC 4/SC, 4/DC, 4e/DC, 4/Di, 4e/Si, and 4e/Di.

The guide states that a rebuild may report successful completion and errors at the same time when a portion containing redundant/parity information is damaged. It says healthy portions can be restored while the damaged portion cannot, and that alert 2163 can accompany this condition.

The same section says that if a backup of the degraded virtual disk encounters errors, user data has been damaged and cannot be recovered from the virtual disk; recovery then depends on an earlier backup.

This gives a bounded manufacturer documentation floor by **March 2013** for the proposition that:

> **rebuild completion status != proof that every damaged region was reconstructed.**

This is not a claim that Dell invented the behavior or terminology in 2013.

### March 2013: damaged media discovered during degraded operation can cross a recoverability boundary

The same guide explains that medium/bad-block damage can be discovered during operations that scan or access the disk, including consistency check, rebuild, virtual-disk format, and ordinary I/O.

For alerts 2146–2150 received during rebuild or while the virtual disk is degraded, Dell directs the operator toward replacement/resynchronization and restoration from backup, stating that the damaged data cannot be recovered from that disk without backup.

This separates two conditions that are easy to collapse:

- a rebuild task exists and can run;
- every source region needed by that rebuild remains readable/reconstructable.

They are not equivalent.

### November 2018: Dell explicitly names `RAID puncture` / `rebuild with errors`

Dell's November 2018 PowerEdge troubleshooting guide defines a `RAID puncture` as a PERC feature and also calls it `rebuild with errors`.

The guide describes the trigger relationally: when the controller detects a double-fault condition and the stripe no longer has enough redundancy to recover the missing data, it creates a puncture in that stripe and allows the rebuild to continue.

Dell further states that a punctured stripe's data is lost and that accesses to affected data continue to encounter uncorrectable errors. Without the puncture behavior, the rebuild could fail and leave the array degraded.

### Concrete RAID 5 example: one unavailable member plus one unreadable surviving contribution

Dell gives a three-member RAID 5 example:

1. drive 0 fails and is replaced;
2. surviving drives 1 and 2 provide the data/parity needed to reconstruct the missing contribution;
3. when rebuild reaches a stripe where drive 1 has a data error, there is insufficient information left to reconstruct that stripe;
4. the affected stripe is therefore unrecoverable/lost and is punctured during rebuild.

This is especially useful because the second damaging condition is **not another whole-drive failure**. A local unreadable source region can consume the contribution that the degraded stripe still needed.

> **latent surviving-source defect != second whole-device failure**, even though either can remove a contribution required by a particular reconstruction.

### Global redundancy can be restored while local payload loss remains

The 2018 guide states that puncturing lets the array's redundancy be restored and can return the array to an `optimal` state, while the affected stripe's data remains lost.

This is a direct counterexample to several tempting equivalences:

- **rebuild complete != every payload byte recovered**;
- **redundancy restored != every prior stripe reconstructable**;
- **array optimal != no data loss has occurred**.

The `optimal` state here describes the returned redundancy/array-operational condition, not retroactive recovery of data already lost in the punctured stripe.

### Post-puncture consistency check is not lost-data recovery

Dell explicitly warns that Check Consistency after a puncture has been induced does not resolve the puncture. The guide recommends regular Check Consistency, especially before drive replacement when possible, because proactive observation while redundancy is still intact can expose/correct conditions before a later member loss creates an unrecoverable combination.

Dell's documented post-puncture remedy is destructive at the array level: back up recoverable data, delete/recreate and fully initialize the array, verify consistency, then restore data.

That procedure is an operational recovery/reset path. It is not evidence of secure sanitization or forensic erasure.

## Engineering reconstruction

The following sequence is a project reconstruction of the documented relations, **not** a claim about undocumented PERC firmware implementation details:

```text
member failure
    -> degraded array / repair obligation
    -> replacement destination available
    -> rebuild admitted and scheduled
    -> read surviving stripe contributions
        -> if sufficient/readable: reconstruct missing contribution
        -> if required surviving contribution is unreadable and redundancy is exhausted:
             local stripe reconstruction fails
             -> PERC can puncture affected stripe
             -> global rebuild continues
    -> redundancy can later be restored / array can return optimal
       while the punctured payload remains lost
```

### Source readability is a constitutive repair input

Case 136 already has scheduling state (`rebuild rate`) and task/progress state. This evidence adds another independent requirement:

> **rebuild rate / repair priority != source readability.**

A controller may allocate abundant resources to repair, yet a stripe still cannot be reconstructed if the surviving contributions required by the code are unreadable.

A useful expanded decomposition is:

```text
repair obligation
+ replacement destination
+ surviving-source readability/reconstructability
+ admitted scheduling/resources
-> possible reconstruction work
```

None of these alone proves successful recovery of every stripe.

### Progress is not the same as reconstructable coverage

The Dell record permits global rebuild continuation after a local unrecoverable stripe is punctured.

> **rebuild progress/completion != reconstructable coverage.**

This is not a semantic trick: the controller can finish rebuilding the reconstructable regions while retaining a negative condition at the affected logical extent.

### A puncture is a retained negative condition, not a secure-deletion primitive

Dell says uncorrectable errors continue when affected punctured data is accessed and that eliminating the puncture requires recreating the array and restoring data.

At the project level, that supports treating the puncture as a retained **negative condition / error relation** attached to an affected logical region: future access behavior is constrained by a prior failed reconstruction event.

This wording deliberately avoids claims about whether the relation is encoded in a BBM table, parity bytes, controller metadata, member media, or a combination. The Dell guide does not give enough implementation detail to establish that hidden persistence mechanism.

### Proactive readability qualification != rebuild

A Check Consistency operation performed while the array is still optimal can help expose conditions before a later member loss. It is therefore functionally related to preserving future repair margin, but it is not the rebuild itself.

> **proactive integrity/readability maintenance != reconstruction after member loss.**

## Functional comparisons — not mechanism identity

### Case 18 — ZFS scrub

The functional analogy is that proactive observation can discover latent integrity defects while enough redundancy still exists to repair them. The mechanisms differ: Dell's PERC guide does not establish ZFS-style end-to-end checksum semantics.

### Cases 101 / 102 — medium scan and patrol read

These cases likewise expose proactive discovery work that can surface media problems before another failure consumes redundancy margin.

> **proactive media/integrity scan ~ preservation of future repair opportunity**, functionally.

That analogy does not make patrol read, check consistency, and ZFS scrub the same mechanism.

### Case 94 — RAID 6 P/Q dual-erasure boundary

Dell's concrete worked example is RAID 5. Case 94 is a useful counterexample to over-generalization because RAID 6 has a different erasure margin.

> **RAID 5 single-parity reconstruction boundary != universal RAID disturbance/failure boundary.**

### Case 96 — dRAID / reduced repair exposure

Faster reconstruction can reduce the time spent with diminished redundancy, but this evidence shows that speed and source readability are separate variables.

> **shorter degraded interval != certification that all surviving source regions are readable.**

## Prior-art and chronology boundary

The safe chronology is deliberately narrow:

- by **March 2013**, Dell publicly documented `A Rebuild Completes with Errors` for named PERC 4 controllers;
- by **November 2018**, Dell documentation explicitly used `RAID puncture` and equated it with `rebuild with errors`, including a concrete RAID 5 degraded-rebuild example.

This establishes public documentation floors only. It does **not** establish:

- Dell invention of puncture/rebuild-with-errors behavior;
- first industry use of the term `puncture`;
- identical implementation across PERC generations;
- a direct implementation genealogy from PERC 4 to later PERC controllers.

## Stop conditions / rejected upgrades

This evidence must **not** be upgraded into any of the following claims without new sources:

- `puncture == sanitize` or secure deletion;
- `array optimal == no data loss`;
- post-puncture Check Consistency recovers the already-lost stripe;
- one unreadable surviving block is equivalent to a second whole-drive failure;
- the 2013 document proves Dell invented the feature or phrase;
- the 2018 phrase `another name` proves identical firmware implementation across controller generations;
- the worked RAID 5 example automatically applies to RAID 6 or other codes with different redundancy margins;
- rebuild-rate priority itself causes or prevents punctures;
- these manuals establish a universal URE probability, annual failure rate, correlated-error model, or quantitative rebuild-risk curve;
- destructive array recreation proves forensic erasure of every previous physical embodiment.

## Remaining evidence debt

- controller-generation-specific telemetry for puncture/error-location persistence;
- exact behavior on named RAID 6 / multi-parity PERC generations;
- cross-vendor behavior and terminology;
- probabilistic and correlated-read-error models tied to named media/controller generations;
- independent fault injection reproducing local source unreadability during rebuild;
- interaction among rebuild scheduling, patrol read/check consistency, cache policy, and media-error handling;
- implementation history of rebuild-with-errors/puncture prior to the March 2013 Dell documentation floor.

## Related-repository check

A fresh search of `tmzncty/computing-archaeology` for `PERC puncture` and `RAID rebuild unrecoverable read error` returned no dedicated overlapping module during this round.

Division of labor remains:

- `technical-retention`: the retention relation between repair obligation, scheduling, surviving-source readability, local reconstruction failure, retained error condition, and restored redundancy;
- `computing-archaeology`: broader controller genealogy, prior terminology, firmware lineage, patrol-read/consistency-check history, and quantitative historical reconstruction if later developed.
'''
