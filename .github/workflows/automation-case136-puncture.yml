name: Inspect Case 136 integration schema

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/automation-case136-puncture.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect index schema
        shell: bash
        run: |
          echo '--- HEAD ---'
          head -n 30 CASE_INDEX.md
          echo '--- TAIL ---'
          tail -n 80 CASE_INDEX.md
