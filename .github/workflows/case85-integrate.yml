name: case85-integrate

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/case85-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Case 85 navigation and status updates
        run: python .github/case85_integrate.py

      - name: Validate bounded integration
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {
              'README.md': ['cases/85-toshiba-nand-shift-read-retry-recoverability.md'],
              'ROADMAP.md': ['cases/85-toshiba-nand-shift-read-retry-recoverability.md'],
              'CASE_INDEX.md': [
                  'cases/85-toshiba-nand-shift-read-retry-recoverability.md',
                  '| Toshiba NAND shift/read retry / 2000–2021 bounded chain |',
                  '1037. **physical threshold state ≠ read-decision boundary**',
                  '1052. **chronological prior art ≠ demonstrated genealogy**',
                  'currently eighty-six (Cases 00–85)',
                  'After eighty-six bounded cases, **all eighty-six cases are now `grounded`.**',
              ],
          }
          for path, needles in expected.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (path, needle)
          assert Path('cases/85-toshiba-nand-shift-read-retry-recoverability.md').exists()
          assert Path('evidence/85-flash-2000-2021-read-threshold-retry-grounding.md').exists()
          PY
          git diff --check

      - name: Commit integrated research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/case85_integrate.py .github/workflows/case85-integrate.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'case85: integrate NAND shift-read navigation'
          git push origin HEAD:main
