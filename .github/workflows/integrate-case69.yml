name: integrate-case69

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case69.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 69
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          old = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/integrate-case69.yml'],
              text=True,
          )
          case_match = re.search(r"case = r'''(.*?)\n'''", old, re.S)
          evidence_match = re.search(r"evidence = r'''(.*?)\n'''", old, re.S)
          if not case_match or not evidence_match:
              raise SystemExit('could not recover Case 69 payloads from previous integrator commit')
          case = case_match.group(1).replace(
              '../evidence/69-jedc-ddr4-2012-refresh-scheduling-grounding.md',
              '../evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md',
          )
          evidence = evidence_match.group(1)

          case_path = root / 'cases/69-jedec-ddr4-refresh-postponement-pullin.md'
          evidence_path = root / 'evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md'
          if case_path.exists() or evidence_path.exists():
              raise SystemExit('Case 69 paths already exist; refusing duplicate integration')
          case_path.write_text(case.rstrip() + '\n', encoding='utf-8')
          evidence_path.write_text(evidence.rstrip() + '\n', encoding='utf-8')

          def insert_after_first(lines, needle, new_line):
              out = []
              done = False
              for line in lines:
                  out.append(line)
                  if needle in line and not done:
                      out.append(new_line)
                      done = True
              return out, done

          readme_path = root / 'README.md'
          readme_lines = readme_path.read_text(encoding='utf-8').splitlines()
          case_nav = "- [`cases/69-jedec-ddr4-refresh-postponement-pullin.md`](cases/69-jedec-ddr4-refresh-postponement-pullin.md) — grounded DDR4 refresh-scheduling bridge: JESD79-4 permits bounded REFRESH postponement and pull-in around nominal `tREFI`, scales those bounds across 1x/2x/4x Fine Granularity Refresh, and constrains rate transitions and Self Refresh exit; separates average cadence, deferred/prepaid maintenance, single-command blocking time, and retention-safe schedule state."
          evidence_nav = "- [`evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md`](evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md) — Case-69 grounding record: inspected JESD79-4 §§4.9/4.26 plus IBM 2010/2013 records separate nominal `tREFI`, bounded postpone/pull-in, FGR latency/frequency trade-offs, transition constraints, and invention-priority limits."
          readme_lines, ok_case = insert_after_first(readme_lines, 'cases/68-amazon-dynamo-membership-failure-boundary.md', case_nav)
          if not ok_case:
              raise SystemExit('README Case 68 navigation anchor not found')
          readme_lines, ok_evidence = insert_after_first(readme_lines, 'evidence/68-dynamo-2007-membership-failure-grounding.md', evidence_nav)
          if not ok_evidence:
              case_idx = readme_lines.index(case_nav)
              readme_lines.insert(case_idx + 1, evidence_nav)
          readme_path.write_text('\n'.join(readme_lines).rstrip() + '\n', encoding='utf-8')

          roadmap_path = root / 'ROADMAP.md'
          roadmap = roadmap_path.read_text(encoding='utf-8')
          if 'eleven grounded bounded sub-slices' not in roadmap:
              raise SystemExit('ROADMAP DRAM-count anchor changed; refusing blind patch')
          roadmap = roadmap.replace('eleven grounded bounded sub-slices', 'twelve grounded bounded sub-slices', 1)
          case69_clause = "[`cases/69-jedec-ddr4-refresh-postponement-pullin.md`](cases/69-jedec-ddr4-refresh-postponement-pullin.md), grounded by [`evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md`](evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md), adds a DDR4 temporal-scheduling regime: nominal `tREFI` is an average cadence with bounded postpone/pull-in flexibility, while 1x/2x/4x FGR couples command frequency to `tRFC` and preserves sequencing/catch-up obligations across rate and Self Refresh transitions. "
          dram_start = roadmap.find('- [ ] DRAM evolution and refresh machinery beyond the bounded case')
          marker = 'The broad item stays unchecked because'
          marker_at = roadmap.find(marker, dram_start)
          if dram_start < 0 or marker_at < 0:
              raise SystemExit('ROADMAP DRAM broad-item marker not found')
          roadmap = roadmap[:marker_at] + case69_clause + roadmap[marker_at:]
          refresh_bullet = "- [ ] In refresh-driven memory, how should `retention deadline`, `row enumeration`, `recurring command generation`, `self-refresh mode authority`, `ordinary service availability`, and `exit/recovery timing` be separated?"
          checked = "- [x] In DDR4 ordinary externally issued refresh, separate nominal average cadence, bounded postponed work, pulled-in prepayment, maximum inter-refresh gap, FGR mode/`tRFC` coupling, and transition accounting — grounded in [`cases/69-jedec-ddr4-refresh-postponement-pullin.md`](cases/69-jedec-ddr4-refresh-postponement-pullin.md) with [`evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md`](evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md); exact later JESD79-4 revision evolution and controller implementation remain separate work."
          if refresh_bullet not in roadmap:
              raise SystemExit('ROADMAP Phase-3 refresh bullet anchor not found')
          roadmap = roadmap.replace(refresh_bullet, refresh_bullet + '\n' + checked, 1)
          roadmap_path.write_text(roadmap.rstrip() + '\n', encoding='utf-8')

          index_path = root / 'CASE_INDEX.md'
          index_lines = index_path.read_text(encoding='utf-8').splitlines()
          row69 = "| [JEDEC DDR4 Refresh Postponement and Pull-In: Bounded Scheduling Elasticity, Fine-Granularity Refresh, and Maintenance Accounting](cases/69-jedec-ddr4-refresh-postponement-pullin.md) | **grounded** | externally issued DDR4 REFRESH + average `tREFI` contract + bounded postpone/pull-in accounting + 1x/2x/4x FGR timing modes + transition/Self Refresh catch-up constraints | separate nominal refresh cadence from exact issue time; deferred maintenance from cancellation; pulled-in work from unlimited credit; `tRFC` shortening from command frequency; and schedule-control state from payload | [2012 DDR4 refresh-scheduling grounding](evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md); exact later JESD79-4 revision chronology, controller counter representation, and independent hardware timing validation remain separate work |"
          matrix_row = "| JEDEC DDR4 refresh scheduling / 2012 bounded regime | volatile DRAM payload + device-internal refresh addressing + external refresh schedule + bounded postpone/pull-in relation + MR3 FGR mode | periodic refresh remains mandatory, but bounded work may shift earlier/later; 1x/2x/4x pair command frequency with different `tRFC`; some Self Refresh exits require catch-up work | each rank-level refresh blocks ordinary rank access for its applicable `tRFC` in the bounded FGR analysis; this case focuses on maintenance scheduling rather than cell-read destructiveness | normal data addressing is unchanged; `REF` uses internal refresh addressing while the controller retains/derives temporal schedule position | payload cell location stays fixed while maintenance windows move in time | no payload history; only bounded recent maintenance-accounting/grouping state is needed or derivable to know what work is owed/prepaid and which transition is legal |"
          out = []
          inserted_row = False
          inserted_matrix = False
          for line in index_lines:
              out.append(line)
              if 'cases/68-amazon-dynamo-membership-failure-boundary.md) | **grounded** |' in line and not inserted_row:
                  out.append(row69)
                  inserted_row = True
              if line.startswith('| DRAM |') and not inserted_matrix:
                  out.append(matrix_row)
                  inserted_matrix = True
          if not inserted_row or not inserted_matrix:
              raise SystemExit(f'CASE_INDEX anchors missing: row={inserted_row}, matrix={inserted_matrix}')
          index = '\n'.join(out).rstrip()
          if '780. **Dynamo 2007 membership/failure composition' not in index:
              raise SystemExit('Finding 780 anchor missing')
          findings = [
              "781. **nominal refresh interval ≠ exact per-command timestamp** — JESD79-4 defines average `tREFI` while permitting bounded movement of individual `REF` commands;",
              "782. **bounded postponement ≠ canceled refresh obligation** — postponed work remains capped and the surrounding-command gap remains bounded;",
              "783. **pulled-in refresh ≠ permanently increased refresh requirement** — each allowed advance command can replace one later regular command rather than creating an additional permanent cadence;",
              "784. **maintenance credit ≠ unbounded future exemption** — pull-ins beyond the mode-specific cap do not buy further reduction of later required refreshes;",
              "785. **refresh scheduling history can become retention-control state** — compliance depends on recent postpone/pull-in and grouping position even though the standard does not mandate one physical counter representation;",
              "786. **controller accounting state ≠ DRAM payload** — the schedule relation is retention infrastructure, not application data stored in the array;",
              "787. **average-cadence compliance ≠ zero temporal elasticity** — maintenance can move earlier or later while remaining inside a bounded retention-safe contract;",
              "788. **shorter `tRFC` ≠ lower refresh-command frequency** — 2x/4x FGR shortens the individual refresh cycle while doubling/quadrupling nominal command frequency;",
              "789. **FGR mode ≠ retention-strength grade** — 1x/2x/4x are paired timing regimes, not a simple ranking in which a larger multiplier universally means safer retention;",
              "790. **shorter single refresh pause ≠ necessarily lower aggregate refresh overhead** — IBM's 2013 analysis treats FGR as a latency/frequency trade-off and finds no universally best mode;",
              "791. **on-the-fly refresh mode ≠ unconstrained mode switching** — 2x/4x transitions retain even/multiple-of-four command-group conditions tied explicitly to the retention guarantee;",
              "792. **mode-register change ≠ schedule-history reset** — recent `REF2x`/`REF4x` grouping still constrains whether the next rate transition is admissible;",
              "793. **Self Refresh entry/exit ≠ erasure of prior fine-granularity accounting** — incomplete pre-entry grouping can require extra catch-up refreshes after exit;",
              "794. **Temperature Controlled Refresh ≠ freely composable with all 2012 FGR modes** — JESD79-4 permits it only with normal Fixed 1x in the bounded revision;",
              "795. **temporal refresh scheduling ≠ Same Bank Refresh spatial localization** — Case 69 moves maintenance in time, while Case 33 changes which bank geometry is blocked/served;",
              "796. **DDR4 FGR/postponement ≠ invention of refresh scheduling elasticity** — IBM's 2010 Elastic Refresh already describes exploiting postpone flexibility in JEDEC DDRx specifications; the bounded 2012 claim is the specific DDR4 timing/accounting composition.",
          ]
          index += '\n\n## Case 69 — DDR4 refresh-scheduling findings\n\n' + '\n'.join(findings) + '\n'
          index_path.write_text(index, encoding='utf-8')

          ids = sorted(int(p.name.split('-', 1)[0]) for p in (root / 'cases').glob('[0-9][0-9]-*.md'))
          if ids != list(range(70)):
              raise SystemExit(f'case ledger is not continuous 00-69: {ids[-10:]}')
          for path in [readme_path, roadmap_path, index_path]:
              if 'cases/69-jedec-ddr4-refresh-postponement-pullin.md' not in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'Case 69 navigation missing from {path}')
          if '796. **DDR4 FGR/postponement' not in index_path.read_text(encoding='utf-8'):
              raise SystemExit('Case 69 finding tail missing')
          PY

          git diff --check
          rm .github/workflows/integrate-case69.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case69: ground DDR4 refresh scheduling elasticity'
          git push origin HEAD:main
