name: automation case139 integration
on:
  push:
    branches: [main]
    paths:
      - '.automation/case139-trigger.txt'
permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Case139 navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          case_path = Path('cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md')
          evidence_path = Path('evidence/139-lpddr3-lpddr4-per-bank-refresh-target-authority-grounding.md')
          if not case_path.exists() or not evidence_path.exists():
              raise SystemExit('Case 139 canonical files are missing')

          case_index = Path('CASE_INDEX.md')
          ci = case_index.read_text(encoding='utf-8')
          case_row = '| [LPDDR3→LPDDR4 Per-Bank Refresh: Moving Bank-Target Scheduling Across the Controller/DRAM Boundary](cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md) | **grounded** | volatile DRAM payload + externally issued REFpb + bank-target phase + internal row-refresh phase + controller scheduling state | compare LPDDR3 fixed device-bank-counter target order with LPDDR4 controller-transferred bank identity and arbitrary-order/complete-coverage rule | [LPDDR3→LPDDR4 grounding](evidence/139-lpddr3-lpddr4-per-bank-refresh-target-authority-grounding.md); official-host facsimile provenance, initial LPDDR4 revision genealogy, LPDDR2/LPDDR5 history, controller fault injection remain open |'
          if 'cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md' not in ci:
              lines = ci.splitlines()
              positions = [i for i, line in enumerate(lines) if line.startswith('| [') and 'cases/138-redis26-aof-rewrite-current-state-reserialization.md' in line]
              if not positions:
                  raise SystemExit('Case 138 table row not found')
              lines.insert(positions[-1] + 1, case_row)
              ci = '\n'.join(lines) + '\n'
          heading = '## Case 139 — LPDDR3→LPDDR4 per-bank refresh target-authority findings'
          if heading not in ci:
              payload = Path('.automation/case139-findings.md').read_text(encoding='utf-8').strip()
              ci = ci.rstrip() + '\n\n' + payload + '\n'
          case_index.write_text(ci, encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          rm = roadmap.read_text(encoding='utf-8')
          bullet = '- [x] Case 139 LPDDR3→LPDDR4 per-bank-refresh bank-target-authority slice — [`cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md`](cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md) + [`evidence/139-lpddr3-lpddr4-per-bank-refresh-target-authority-grounding.md`](evidence/139-lpddr3-lpddr4-per-bank-refresh-target-authority-grounding.md): bounded JEDEC-text and Micron product evidence separates LPDDR3 fixed device-bank-counter round-robin targeting from LPDDR4 controller-transferred bank identity and arbitrary bank order under an all-eight-before-repeat coverage rule. This closes `refresh obligation != bank-target scheduling authority`, `controller-chosen bank != controller-chosen refresh row`, `ordering freedom != coverage freedom`, and `bank-count phase != maintenance history`; Case 21 remains the recurring-command/self-refresh authority axis, Case 33 remains DDR5 same-bank-across-bank-groups geometry, and Case 69 remains temporal postpone/pull-in accounting. Official-host standard facsimiles, initial LPDDR4 revision genealogy, LPDDR2/LPDDR5 evolution, proposal/patent history, and controller desynchronization fault injection remain open, with broad LPDDR/JEDEC history routed to `computing-archaeology`.'
          if 'cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md' not in rm:
              marker = '- [ ] DRAM evolution and refresh machinery beyond the bounded case'
              pos = rm.find(marker)
              if pos < 0:
                  raise SystemExit('DRAM evolution roadmap marker not found')
              rm = rm[:pos] + bullet + '\n\n' + rm[pos:]
          rm = rm.replace('partially advanced by fifteen grounded bounded sub-slices', 'partially advanced by sixteen grounded bounded sub-slices', 1)
          roadmap.write_text(rm, encoding='utf-8')
          PY

          test "$(grep -c 'cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md' CASE_INDEX.md)" -ge 1
          test "$(grep -c '^## Case 139 — LPDDR3→LPDDR4 per-bank refresh target-authority findings$' CASE_INDEX.md)" -eq 1
          test "$(grep -c 'cases/139-lpddr3-lpddr4-per-bank-refresh-target-authority.md' ROADMAP.md)" -ge 1
          git diff --check

          git rm -f --ignore-unmatch .automation/case139-findings.md .automation/case139-trigger.txt .github/workflows/automation-case139.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Case139 navigation changes to commit'
            exit 0
          fi
          git commit -m 'case139: finalize LPDDR per-bank refresh navigation'
          git push origin HEAD:main
