name: case145-integrate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case145-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 145 navigation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python3
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/case145-integrate.yml
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'case145: integrate NVMe PEL navigation'
          git push origin HEAD:main
