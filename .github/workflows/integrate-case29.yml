name: Integrate Case 29 navigation

on:
  push:
    paths:
      - .github/workflows/integrate-case29.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 29 into navigation and ledgers
        shell: bash
        run: |
          python3 .github/scripts/integrate_case29.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-case29.yml .github/scripts/integrate_case29.py
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --check
          git commit -m 'docs: integrate grounded Ceph Luminous scrub-repair bridge'
          git push origin HEAD:main
