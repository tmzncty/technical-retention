name: Case 39 DCR prior-art integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-case39-dcr-prior-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate research slice
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/integrate_case39_dcr_prior_art.py')
          text = p.read_text(encoding='utf-8')
          old = 'p.write_text(text.rstrip() + findings + "\\n", encoding="utf-8")'
          new = 'p.write_text(text.rstrip() + findings.rstrip() + "\\n", encoding="utf-8")'
          if old not in text:
              raise SystemExit('expected CASE_INDEX EOF write pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          set +e
          python tools/integrate_case39_dcr_prior_art.py > tools/case39-debug.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/case39-debug.txt
            git commit -m "chore: capture Case 39 integration failure"
            git push origin HEAD:main
            exit "$rc"
          fi
          rm tools/case39-debug.txt

      - name: Verify research diff
        run: |
          git diff --check
          git diff -- cases/39-geckoftl-power-failure-metadata-recovery.md evidence/39-geckoftl-2015-2017-metadata-recovery-grounding.md ROADMAP.md CASE_INDEX.md

      - name: Commit research and self-clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm tools/integrate_case39_dcr_prior_art.py
          rm .github/workflows/zz-case39-dcr-prior-art.yml
          rm -f tools/case39-debug.txt
          git add cases/39-geckoftl-power-failure-metadata-recovery.md evidence/39-geckoftl-2015-2017-metadata-recovery-grounding.md ROADMAP.md CASE_INDEX.md tools/integrate_case39_dcr_prior_art.py .github/workflows/zz-case39-dcr-prior-art.yml
          git add -u tools/case39-debug.txt || true
          git diff --cached --check
          git commit -m "case39: deepen FTL crash-recovery prior-art boundary"
          git push origin HEAD:main
