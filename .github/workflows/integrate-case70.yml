name: integrate-case70

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case70.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 70 navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          case_path = 'cases/70-magnetic-core-half-select-disturbance.md'
          evidence_path = 'evidence/70-core-1951-1959-half-select-grounding.md'
          if not (root / case_path).exists() or not (root / evidence_path).exists():
              raise SystemExit('Case 70 research files missing')

          # README navigation
          p = root / 'README.md'
          lines = p.read_text(encoding='utf-8').splitlines()
          case_nav = '- [`cases/70-magnetic-core-half-select-disturbance.md`](cases/70-magnetic-core-half-select-disturbance.md) — grounded magnetic-core disturbance deepening: separates logical nonselection from physical partial excitation, non-target remanent-state margin from shared sense-line disturbance, and word selection from bit-level inhibit authorization.'
          evidence_nav = '- [`evidence/70-core-1951-1959-half-select-grounding.md`](evidence/70-core-1951-1959-half-select-grounding.md) — Case-70 grounding record: Forrester 1951-filed threshold/partial-select claims, Papian 1952 nonselecting-disturbance retention criteria, and Bauer/Haynes 1954-filed IBM half-select sense-cancellation evidence.'
          if case_nav not in lines:
              for i, line in enumerate(lines):
                  if 'cases/69-jedec-ddr4-refresh-postponement-pullin.md' in line:
                      lines.insert(i + 1, case_nav)
                      break
              else:
                  raise SystemExit('README Case 69 anchor missing')
          if evidence_nav not in lines:
              for i, line in enumerate(lines):
                  if 'evidence/69-jedec-ddr4-2012-refresh-scheduling-grounding.md' in line:
                      lines.insert(i + 1, evidence_nav)
                      break
              else:
                  i = lines.index(case_nav)
                  lines.insert(i + 1, evidence_nav)
          p.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          # ROADMAP status
          p = root / 'ROADMAP.md'
          text = p.read_text(encoding='utf-8')
          road = '- [x] magnetic-core half-select disturbance / selection-margin deepening — [`cases/70-magnetic-core-half-select-disturbance.md`](cases/70-magnetic-core-half-select-disturbance.md), grounded by [`evidence/70-core-1951-1959-half-select-grounding.md`](evidence/70-core-1951-1959-half-select-grounding.md), separates logical nonselection from physical partial excitation, retained-state disturbance from sense-line disturbance, and X/Y word selection from bit-level inhibit; broader core-memory engineering/history remains in `computing-archaeology`, while exact named-machine margin measurements and priority disputes remain separate work.\n'
          if case_path not in text:
              anchor = '- [ ] DRAM evolution and refresh machinery beyond the bounded case'
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('ROADMAP DRAM bridge anchor missing')
              text = text[:pos] + road + text[pos:]
          p.write_text(text.rstrip() + '\n', encoding='utf-8')

          # CASE_INDEX ledger, comparison row, findings
          p = root / 'CASE_INDEX.md'
          lines = p.read_text(encoding='utf-8').splitlines()
          row = '| [Coincident-Current Magnetic Core Half-Select Disturbance: State Margin, Partial-Select Output, and Inhibit Control](cases/70-magnetic-core-half-select-disturbance.md) | **grounded** | remanent ferrite payload + coordinate half-select excitation + repeated nonselecting-disturbance margin + shared sense-line partial-select outputs + inhibit-qualified write transitions | separate logical nonselection from physical excitation; state disturbance from sense/readout disturbance; target address from physical effect scope; word selection from bit write authorization | [1951–1959 half-select grounding](evidence/70-core-1951-1959-half-select-grounding.md); full Papian facsimile numeric margins, named production-machine measurements, and invention-priority study remain separate archival work |'
          matrix = '| Coincident-current magnetic-core half-select / 1951–1959 bounded regime | remanent ferrite state + X/Y coordinate partial excitation + shared sense wiring + bounded inhibit control | no periodic refresh at rest; reliable operation requires non-target cores to tolerate repeated nonselecting pulses and the sense path to discriminate selected output from partial-select disturbance | selected read may remain destructive as in Case 02; half-selected neighbors can produce partial outputs without intended stable-state reversal | logical address selects an X/Y intersection/word while many cores sharing one coordinate are physically excited; inhibit can further qualify bit transitions | no payload relocation; physical effect scope extends beyond logical target | no payload history required, but material/sense margins must survive ordinary access traffic; disturbance cancellation is readout-path control rather than payload restoration |'
          if row not in lines:
              for i, line in enumerate(lines):
                  if 'cases/69-jedec-ddr4-refresh-postponement-pullin.md) | **grounded** |' in line:
                      lines.insert(i + 1, row)
                      break
              else:
                  raise SystemExit('CASE_INDEX Case 69 row anchor missing')
          if matrix not in lines:
              for i, line in enumerate(lines):
                  if line.startswith('| DRAM |'):
                      lines.insert(i, matrix)
                      break
              else:
                  raise SystemExit('CASE_INDEX DRAM matrix anchor missing')
          text = '\n'.join(lines).rstrip()
          if '## Case 70 — magnetic-core half-select findings' not in text:
              findings = [
                  '797. **half-selected ≠ unexcited** — a core sharing one selected coordinate can receive real subthreshold excitation even though it is not the logical target;',
                  '798. **logical nonselection ≠ zero physical excursion** — successful coincident-current addressing requires non-target cores to avoid an unintended stable-state reversal, not to remain physically untouched;',
                  '799. **state preservation ≠ zero sense-line contribution** — half-selected cores can contribute voltage to a shared sense path while retaining their intended stable remanent state;',
                  '800. **neighbor-access traffic can become retention stress** — Papian’s repetitive nonselecting-pulse tests make survival under ordinary array traffic a material retention criterion;',
                  '801. **quiescent nonvolatility ≠ disturbance immunity** — remanence at rest does not guarantee adequate state/sense margin under repeated coordinate excitation;',
                  '802. **selection threshold ≠ mere logical-decoder abstraction** — hysteresis shape, drive amplitude, material variation, and sense discrimination participate in whether an address is safely usable;',
                  '803. **target address ≠ complete physical effect scope** — one logical intersection is selected while many row/column neighbors are partially excited;',
                  '804. **selected-core signal ≠ entire sense-line signal** — the shared readout can contain contributions from the target plus half-selected cores;',
                  '805. **sense disturbance ≠ stored-state corruption** — recoverability may fail through one/zero discrimination even when non-target payload states have not permanently switched;',
                  '806. **disturbance cancellation ≠ state restoration** — cancellation circuitry suppresses unwanted readout contribution; it does not rewrite a degraded remanent bit;',
                  '807. **inhibit action ≠ erase** — in the bounded IBM scheme, an opposing inhibit pulse can prevent a selected word-line core from changing during write rather than deleting a preexisting state by a separate erase regime;',
                  '808. **word selection ≠ bit write authorization** — X/Y can select a word while a further inhibit relation determines which bit positions are permitted to switch;',
                  '809. **selected-core read/restore obligation ≠ neighbor half-select obligation** — Case 02’s destructive-read rewrite and Case 70’s non-target disturbance tolerance are different retention duties within one array;',
                  '810. **core half-select disturbance ≠ RowHammer / NAND disturb** — only the functional pattern is shared: an operation aimed at one logical target can burden other retained state; the physics and history differ;',
                  '811. **repetitive pulse-pattern testing ≠ static retention-time testing** — Papian’s `information-retention ratios` concern traffic-conditioned survival, not merely how long an untouched core holds remanence;',
                  '812. **Case-70 deepening ≠ new core-memory invention claim** — the bounded contribution is a retention comparison across Forrester/Papian/Bauer-Haynes evidence, not a priority judgment.'
              ]
              text += '\n\n## Case 70 — magnetic-core half-select findings\n\n' + '\n'.join(findings)
          p.write_text(text.rstrip() + '\n', encoding='utf-8')

          ids = sorted(int(x.name.split('-', 1)[0]) for x in (root / 'cases').glob('[0-9][0-9]-*.md'))
          if ids != list(range(71)):
              raise SystemExit(f'case ledger not continuous 00-70: tail={ids[-10:]}')
          for fn in ['README.md', 'ROADMAP.md', 'CASE_INDEX.md']:
              t = (root / fn).read_text(encoding='utf-8')
              if case_path not in t or evidence_path not in t:
                  raise SystemExit(f'Case 70 navigation missing from {fn}')
          if '812. **Case-70 deepening' not in (root / 'CASE_INDEX.md').read_text(encoding='utf-8'):
              raise SystemExit('Case 70 finding tail missing')
          PY
          git diff --check
          rm .github/workflows/integrate-case70.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case70: ground magnetic-core half-select disturbance'
          git push origin HEAD:main
