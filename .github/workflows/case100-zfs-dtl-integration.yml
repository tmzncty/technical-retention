          draid_row = "| OpenZFS dRAID / 2017–2021 bounded recovery regime | surviving data/parity + fixed-width redundancy-group geometry + deterministic permutation mapping + distributed spare regions + space-map/rebuild progress + later block-pointer/checksum authority | after device loss, reconstruct allocated ranges sequentially in LBA order across many children into distributed spare capacity; restore coded redundancy first; run later scrub/healing verification | sequential reconstruction reads surviving coded contributions without per-block checksum verification in the first phase; later scrub re-enters block-pointer/checksum space | logical blocks map through fixed-width dRAID groups and deterministic permutations; recovery traversal can use space-map/device-address order rather than full block-tree traversal | distributed spare regions become recovery destinations; replacement/rebalancing can later move state again while restoring spare availability | does not preserve a complete mutation history; preserves layout/rebuild state sufficient to restore missing contributions, then separately revalidates integrity |"
          dtl_matrix = "| ZFS DTL / 2005–2007 selective-resilver regime | surviving redundant blocks + per-block birth txg + per-target failed-replication DTL intervals + tree/topology state | retain exposure interval while a target misses writes; after return, compare current block birth txgs with DTL; resilver matching blocks and prune branches that cannot intersect the interval; retire repair evidence after recovery conditions permit | ordinary source reads/checksums remain separate; DTL membership identifies possible replica incompleteness, not corruption proof | block tree supplies location/reachability while birth txg supplies temporal membership in repair scope | same logical target/device can return and be caught up without full replacement; replacement presents a larger trust/repair boundary | retains a bounded failure-exposure summary rather than a complete mutation history; later OpenZFS can persist a sufficient leaf-missing basis and derive higher-level DTL state |"

          findings_anchor = "1330. **prior-art chronology ≠ direct genealogy** — GFS 2003 `scan and verify`, 2004 disk-scrubbing research, and Ceph 2012 deep scrub provide earlier functional/terminological floors; chronology alone does not prove direct descent."
          findings = findings_anchor + r'''
1331. **repair-scope history ≠ payload history** — DTL can retain transaction-group exposure evidence sufficient for catch-up without retaining every historical payload value or operation.
1332. **failed-replication interval ≠ dirty physical-region bitmap** — pre-ZFS DRL preserves spatial dirty regions; the bounded ZFS DTL family uses transaction-time/birth relations, so functional similarity does not erase mechanism geometry.
1333. **birth time ≠ necessarily wall-clock time** — the DTL family explicitly permits transaction-group number as the relevant birth/time coordinate in the described embodiments.
1334. **block birth metadata + DTL interval can authorize repair exclusion** — a current block outside the relevant failed-replication interval need not be treated as missing merely because the device was once offline.
1335. **repair membership ≠ corruption diagnosis** — DTL says a redundancy relation may be incomplete for a txg; it does not by itself establish checksum failure of the surviving source.
1336. **device returned ≠ redundancy restored** — an outage can end while retained DTL state continues to encode repair debt toward state missed during the outage.
1337. **failure event lifetime ≠ repair-evidence lifetime** — maintenance metadata can deliberately outlive the fault that caused it because future recovery still depends on that past relation.
1338. **minimum necessary resilver ≠ zero work after a short outage** — selective repair bounds work by exposed/current state; the documentation's short-outage examples are not universal performance guarantees.
1339. **temporary-outage catch-up ≠ replacement-device reconstruction** — a returned device can preserve trusted pre-outage embodiment while a blank/new target requires a broader reconstruction relation.
1340. **temporal pruning ≠ sequential reconstruction** — Case 100 reduces which block-tree state needs catch-up; Case 96 dRAID changes fixed-geometry reconstruction order/bandwidth. The two optimizations answer different repair questions.
1341. **DTL-directed resilver ≠ scrub** — selective catch-up restores an incomplete redundancy relation; Case 18 scrub proactively verifies integrity and may heal checksum-qualified defects.
1342. **DTL-directed resilver ≠ RAID-Z write-hole closure** — Case 95 constrains construction/commit of a new coded block; DTL retains evidence for later recovery after incomplete replication has occurred.
1343. **small history summary can be constitutive maintenance infrastructure** — retaining only exception/exposure intervals can eliminate large amounts of unnecessary later traversal and I/O without becoming a complete archive.
1344. **persistent maintenance basis ≠ every derived maintenance state** — OpenZFS 2.1.11 keeps the sufficient leaf `DTL_MISSING` basis on disk and derives other/aggregate DTL state, showing a version-bounded split between durable evidence and regenerated classification.
'''

