          roadmap_add = roadmap_line + "\n- [x] ZFS dirty-time-log / selective-resilver repair-scope boundary — [`cases/100-zfs-dirty-time-log-selective-resilver.md`](cases/100-zfs-dirty-time-log-selective-resilver.md), grounded by [`evidence/100-zfs-2005-2023-dtl-resilver-grounding.md`](evidence/100-zfs-2005-2023-dtl-resilver-grounding.md): the 2005-priority/2007-publication Sun DTL family retains failed-replication transaction-group/birth-time evidence and uses it to bound later resilver/tree traversal, separating outage history from payload history, catch-up scope from checksum verification, and temporal pruning from dRAID sequential reconstruction geometry. Pre-ZFS Sun DRL remains an explicit spatial dirty-map prior-art floor rather than a claimed genealogy; OpenZFS 2.1.11 is used only for later DTL-class/persistence continuity. Broader RAID/controller genealogy, URE-aware rebuild policy, production fault injection, and ZFS implementation chronology remain open."

