name: Integrate Case 34 DDR3 temperature-policy deepening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/case34-ddr3-temp-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research deepening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_section(text, start, end, body):
              i = text.index(start) + len(start)
              j = text.index(end, i)
              return text[:i] + body + text[j:]

          case = 'cases/34-micron-temperature-dependent-dram-refresh.md'
          text = read(case)
          status = "**`grounded`** — bounded to Micron Technology's 1991-filed US5278796A temperature-dependent DRAM refresh circuit, with an earlier 1987-priority CardioData patent family used to control invention-priority claims. A later Micron 2Gb DDR3 product datasheet (Rev. S 02/16) now supplies a product-interface witness for distinct manual `SRT` and automatic `ASR` self-refresh policies; the 2004–2006 temperature-dependent self-refresh patent remains a separate later locus/authority comparison. The later sources deepen policy/authority boundaries but are not treated as proof of direct implementation genealogy from the 1991 patent.\n"
          text = replace_section(text, '## Status\n\n', '\nGrounding record:', status)

          marker = '### Later product-interface witness — Micron 2Gb DDR3 `SRT` / `ASR` (Rev. S 02/16)'
          if marker not in text:
              insert = """### Later product-interface witness — Micron 2Gb DDR3 `SRT` / `ASR` (Rev. S 02/16)

Micron's later **2Gb x4/x8/x16 DDR3 SDRAM** datasheet, document `09005aef826aaadc`, Rev. S 02/16, exposes a useful product-level policy split in Mode Register 2. This source is more than a generic statement that hotter DRAM needs more refresh: it separately documents **manual temperature-range declaration**, **automatic self-refresh rate selection**, and the still-external refresh requirement outside self refresh.

The bounded interface says:

- `MR2[7]` selects **Self Refresh Temperature (`SRT`)** when ASR is disabled. Enabling SRT forces the internal self-refresh rate from 1x to 2x **regardless of actual case temperature** so the extended 0–95 °C operating range can be supported during self refresh.
- `MR2[6]` selects **Auto Self Refresh (`ASR`)**. With ASR enabled, the DRAM automatically changes its internal self-refresh rate between 1x and 2x over the supported temperature range.
- the datasheet explicitly says the automatic transition need not occur at exactly 85 °C; it may occur at a lower temperature while still maintaining data integrity.
- if case temperature exceeds 85 °C during **externally managed refresh**, the user/controller must provide 2x refresh by reducing the refresh period from 64 ms to 32 ms. SRT/ASR govern the self-refresh side of the contract rather than eliminating that external obligation.
- SRT and ASR are mutually exclusive in this interface.

This later product witness adds two control forms that the 1991 patent did not expose as a mode-register pair: a **declared conservative operating envelope** (`SRT`) and an **automatic temperature-conditioned self-refresh policy** (`ASR`). It does not establish that the product implements US5278796A, that Micron invented these interface semantics, or that this one datasheet is a complete JEDEC DDR3 chronology.

"""
              text = text.replace('## Prior art before the Micron filing\n', insert + '## Prior art before the Micron filing\n', 1)

          eng_marker = '### Extended-temperature support is not automatic temperature adaptation'
          if eng_marker not in text:
              eng = """### Extended-temperature support is not automatic temperature adaptation

The DDR3 product interface gives a direct counterexample to treating `supports hotter operation` and `measures/adapts to temperature` as synonyms. `SRT` can support the extended range by forcing 2x self refresh even when the device is cooler; `ASR` instead changes internal self-refresh rate automatically over the supported range.

Therefore:

> **extended-temperature support ≠ automatic temperature adaptation**.

A conservative fixed maintenance policy and an adaptive maintenance policy can protect the same bounded retention envelope while requiring different evidence and control relations.

### SRT declaration is not a temperature measurement

When ASR is disabled, the user programs `SRT` to indicate the operating-temperature range to be protected during self refresh. That bit is policy/configuration state. It does not, by itself, report a measured temperature.

Therefore:

> **declared operating envelope ≠ measured environmental condition**.

This sharpens the 1991 sensor/comparator case: environment, measurement, classification, and chosen cadence can be represented by different mechanisms, and a product may expose only some of them to software.

### External refresh responsibility is not internal self-refresh policy

Above 85 °C, the same DDR3 datasheet requires externally managed refresh to move from the 64 ms to 32 ms period, while self refresh must use either SRT or ASR.

Therefore:

> **external refresh-rate responsibility ≠ internal self-refresh cadence selection**.

The physical temperature constraint can be shared while the locus and representation of maintenance authority change with mode. This is a product-level continuation of the Case-21 responsibility distinction, not evidence that the controller and DRAM use one scheduler.

### Contract boundary is not an exact physical switching point

The datasheet says ASR may switch from 1x to 2x below exactly 85 °C while preserving data integrity. The contractual 85 °C boundary therefore must not be reconstructed as a measured cell-level retention cliff or an exact sensor trip point.

Therefore:

> **specified temperature boundary ≠ exact automatic transition point ≠ per-cell retention limit**.

This is also a concrete guard against reading a mode table as a direct map of semiconductor physics.

"""
              text = text.replace('### Temperature-conditioned refresh is not per-row retention-aware refresh\n', eng + '### Temperature-conditioned refresh is not per-row retention-aware refresh\n', 1)

          if "Micron's Rev. S 02/16 2Gb DDR3 datasheet exposes" not in text:
              rows = """| Micron's Rev. S 02/16 2Gb DDR3 datasheet exposes mutually exclusive SRT and ASR controls in MR2 | H/P | direct later manufacturer product/interface record |
| SRT forces 2x internal self refresh regardless of case temperature, while ASR automatically adjusts between 1x and 2x over the supported range | H/P | direct later product semantics |
| Above 85 °C, externally managed refresh still requires 2x cadence (64 ms → 32 ms) even though self refresh can use SRT or ASR | H/P | direct extended-temperature contract |
| ASR's automatic transition is guaranteed for data integrity but need not occur at exactly 85 °C | H/P | direct product boundary; not a per-cell retention measurement |
| The 2016 product interface proves direct implementation descent from Micron's 1991 patent | X | chronology and shared assignee are insufficient for genealogy |

"""
              text = text.replace('\n## Related repositories\n', '\n' + rows + '## Related repositories\n', 1)

          source_line = "4. Micron Technology, Inc., **2Gb: x4, x8, x16 DDR3 SDRAM**, PDF `09005aef826aaadc`, `2Gb_DDR3_SDRAM.pdf - Rev. S 02/16 EN`, especially Mode Register 2 pp. 146–147 and Extended Temperature Usage pp. 182–183 — later manufacturer product/interface witness for SRT, ASR, external 2x refresh above 85 °C, and the non-exact automatic transition boundary. Public preserved copy inspected: <https://file.hstatic.net/1000180878/file/mt41j128m16_2gb_ddr3_sdram.pdf>."
          if source_line not in text:
              text = text.rstrip() + '\n' + source_line + '\n'
          write(case, text)

          evidence = 'evidence/34-micron-1991-temperature-dependent-refresh-grounding.md'
          text = read(evidence)
          ev_status = "**`grounded`** for the bounded retention claim in Case 34: a DRAM refresh cadence can be selected from measured temperature rather than held at one worst-case cadence, while the underlying dynamic-cell refresh obligation remains intact. A later Micron 2Gb DDR3 Rev. S 02/16 product witness now additionally grounds a manual-declared `SRT` versus automatic `ASR` self-refresh-policy split and separates that internal policy from the still-external 2x refresh obligation above 85 °C.\n"
          text = replace_section(text, '## Status\n\n', '\nCase:', ev_status)

          fourth = "A fourth, later evidence layer is now retained explicitly: Micron's Rev. S 02/16 2Gb DDR3 product datasheet exposes mutually exclusive manual `SRT` and automatic `ASR` self-refresh policies plus a separate externally managed 2x refresh obligation above 85 °C. It is later implementation/interface continuity only, not proof of direct descent from the 1991 patent.\n\n"
          if fourth not in text:
              text = text.replace('## Primary source A — Micron US5278796A\n', fourth + '## Primary source A — Micron US5278796A\n', 1)

          source_d_marker = '## Primary source D — Micron 2Gb DDR3 Rev. S 02/16 SRT / ASR product interface'
          if source_d_marker not in text:
              source_d = """## Primary source D — Micron 2Gb DDR3 Rev. S 02/16 SRT / ASR product interface

### Identity and bounded use

- **Title:** `2Gb: x4, x8, x16 DDR3 SDRAM`
- **Document ID:** `09005aef826aaadc`
- **Revision marker:** `2Gb_DDR3_SDRAM.pdf - Rev. S 02/16 EN`
- **Manufacturer:** Micron Technology, Inc.
- **Preserved manufacturer PDF inspected:** <https://file.hstatic.net/1000180878/file/mt41j128m16_2gb_ddr3_sdram.pdf>

Relevant locations are Mode Register 2, printed pp. 146–147, and `Extended Temperature Usage`, printed pp. 182–183.

### SRT / ASR policy split

`MR2[7]` controls Self Refresh Temperature (`SRT`). When SRT is enabled, the DRAM changes internal self refresh from 1x to 2x **regardless of case temperature**. This is a conservative fixed policy for the extended temperature range, not a temperature reading.

`MR2[6]` controls Auto Self Refresh (`ASR`). When ASR is enabled, the DRAM automatically changes internal self-refresh rate between 1x and 2x over the supported temperature range. The datasheet explicitly says the transition is not guaranteed to occur at exactly 85 °C and may occur lower while data integrity remains supported. SRT and ASR cannot be enabled simultaneously.

### External refresh remains a separate responsibility

For the optional 0–95 °C range, the datasheet separately requires **externally managed refresh** to run at 2x whenever case temperature is above 85 °C, implemented by reducing the refresh period from 64 ms to 32 ms. Self refresh instead requires SRT or ASR for the extended range.

This gives direct product evidence for `extended-temperature support ≠ automatic temperature adaptation`, `declared operating envelope ≠ measured environmental condition`, `external refresh-rate responsibility ≠ internal self-refresh cadence selection`, and `specified temperature boundary ≠ exact automatic transition point`.

### Evidence boundary

The datasheet is a later manufacturer product/interface witness. It is **not** used to claim that Micron invented SRT or ASR, that Rev. S 02/16 first introduced them, that the product implements US5278796A, that 85 °C is a per-cell retention cliff, or that one product document supplies the complete JEDEC DDR3 revision history.

"""
              text = text.replace('## Claim-to-source matrix\n', source_d + '## Claim-to-source matrix\n', 1)

          if "Micron's Rev. S 02/16 2Gb DDR3 exposes" not in text:
              rows = """| Micron's Rev. S 02/16 2Gb DDR3 exposes mutually exclusive SRT and ASR controls | Micron 2Gb DDR3 datasheet pp. 146–147 | direct later manufacturer product/interface record |
| SRT forces 2x internal self refresh independent of actual case temperature | Micron 2Gb DDR3 datasheet p. 147 | direct product semantics |
| ASR automatically changes internal self-refresh rate between 1x and 2x, with a transition that need not occur at exactly 85 °C | Micron 2Gb DDR3 datasheet p. 147 | direct product boundary |
| External refresh above 85 °C still requires 2x cadence, 64 ms → 32 ms | Micron 2Gb DDR3 datasheet p. 183 | direct external-maintenance contract |
| The DDR3 product proves direct implementation genealogy from US5278796A | none | **unsupported / rejected** |

"""
              text = text.replace('\n## Engineering reconstruction enabled by the evidence\n', '\n' + rows + '## Engineering reconstruction enabled by the evidence\n', 1)

          if '### 6. Declared envelope versus automatic policy' not in text:
              more = """### 6. Declared envelope versus automatic policy

The 2016 DDR3 product interface adds a policy distinction that is not visible in the 1991 comparator example: SRT can conservatively force the high self-refresh rate without claiming a current temperature measurement, while ASR automatically changes rate over the supported range. A retained configuration bit and an environmental observation are therefore different evidence classes even when both influence the same maintenance cadence.

### 7. Mode-dependent authority

The same product requires the controller/user to double externally managed refresh above 85 °C, while SRT/ASR govern the internal self-refresh path. The physical retention constraint can therefore stay temperature-conditioned while recurrence authority and policy representation move with operating mode.

"""
              text = text.replace('## Anti-anachronism and rejected claims\n', more + '## Anti-anachronism and rejected claims\n', 1)

          text = text.replace('- exact modern DDR/LPDDR temperature-band/timing semantics;\n', '- complete JEDEC DDR3/DDR4/LPDDR revision chronology and cross-vendor temperature-band/timing semantics beyond the bounded Micron DDR3 witness;\n', 1)
          write(evidence, text)

          roadmap = 'ROADMAP.md'
          text = read(roadmap)
          pattern = re.compile(r'^- \[ \] In temperature-sensitive DRAM refresh,.*$', re.M)
          replacement = "- [x] In temperature-sensitive DRAM refresh, separate `physical retention constraint`, `environmental condition`, `temperature measurement`, `guardband/policy classification`, `chosen refresh cadence`, `measurement/control overhead`, and `refresh authority` — closed at the bounded manufacturer-primary relation level by [`cases/34-micron-temperature-dependent-dram-refresh.md`](cases/34-micron-temperature-dependent-dram-refresh.md), now deepened with a later Micron 2Gb DDR3 `SRT`/`ASR` product-interface witness. [`cases/35-micron-mobile-ddr-automatic-tcsr.md`](cases/35-micron-mobile-ddr-automatic-tcsr.md) remains the separate commercial automatic-TCSR/PASR case. Complete JEDEC DDR3/DDR4/LPDDR revision genealogy, cross-vendor sensor semantics, controller compliance, calibration/fault injection, and per-row retention-aware scheduling remain separate work."
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'ROADMAP temperature-sensitive line replacements={n}')
          write(roadmap, text)

          index = 'CASE_INDEX.md'
          text = read(index)
          pattern = re.compile(r'^\| \[Micron Temperature-Dependent DRAM Refresh: Guardband, Environmental Sensing, and Adaptive Maintenance\].*$', re.M)
          replacement = "| [Micron Temperature-Dependent DRAM Refresh: Guardband, Environmental Sensing, and Adaptive Maintenance](cases/34-micron-temperature-dependent-dram-refresh.md) | **grounded** | volatile dynamic payload + environmental measurement/proxy + policy/guardband state + fixed or automatic temperature-conditioned cadence + mode-dependent refresh authority | separate the continuing refresh obligation from worst-case maintenance frequency; distinguish environment, measurement, declared operating envelope, adaptive versus fixed policy, cadence, authority, and control-energy cost; preserve 1987-priority temperature-adaptive prior art | [1991 Micron + later DDR3 SRT/ASR grounding](evidence/34-micron-1991-temperature-dependent-refresh-grounding.md); Rev. S 02/16 now separates SRT fixed-2x policy, ASR automatic 1x/2x policy, non-exact auto transition, and the still-external 2x refresh duty above 85 °C. Case 35 remains the separate Mobile-DDR automatic-TCSR/PASR witness; full JEDEC/cross-vendor genealogy, sensor fault qualification, and per-row scheduling remain open |"
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'CASE_INDEX Case34 row replacements={n}')

          heading = '### Case 34 DDR3 temperature-policy deepening — SRT, ASR, and mode-dependent authority'
          if heading not in text:
              nums = [int(x) for x in re.findall(r'(?m)^(\d+)\.', text)]
              start = max(nums) + 1
              findings = [
                  '**extended-temperature support ≠ automatic temperature adaptation** — Micron DDR3 SRT can conservatively force 2x self refresh regardless of actual case temperature, while ASR automatically changes the internal rate over the supported range.',
                  '**SRT policy state ≠ temperature measurement** — the SRT bit declares the operating envelope the self-refresh policy must cover; it is not itself evidence of a sensed temperature.',
                  '**fixed conservative maintenance ≠ adaptive maintenance** — SRT and ASR can protect the same bounded 0–95 °C self-refresh envelope while requiring different observation/control relations.',
                  '**external refresh-rate responsibility ≠ internal self-refresh cadence selection** — above 85 °C the controller/user must still provide 2x externally managed refresh, while SRT or ASR governs the device self-refresh path.',
                  '**specified 85 °C boundary ≠ exact ASR transition point** — the product document allows ASR to switch below 85 °C while maintaining data integrity, so the contractual boundary is not an exact sensor trip point.',
                  '**ASR transition point ≠ per-cell retention cliff** — one product-level automatic policy does not directly measure every row/cell remaining charge or retention limit.',
                  '**automatic cadence selection ≠ removal of refresh obligation** — ASR changes the rate at which constitutive restoration recurs; it does not make the dynamic array nonvolatile or maintenance-free.',
                  '**shared manufacturer chronology ≠ implementation genealogy** — the later Micron DDR3 SRT/ASR interface deepens the 1991 Micron case but does not prove that the product implements US5278796A or descends directly from that circuit.',
                  '**manufacturer product semantics ≠ complete JEDEC chronology** — the Rev. S 02/16 witness closes a bounded relation decomposition, while standards revision history and cross-vendor compliance remain separate research.'
              ]
              block = '\n\n' + heading + '\n\n' + '\n'.join(f'{start+i}. {v}' for i, v in enumerate(findings)) + '\n'
              text = text.rstrip() + block
          write(index, text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git diff --check
          grep -Fq -- "extended-temperature support ≠ automatic temperature adaptation" cases/34-micron-temperature-dependent-dram-refresh.md
          grep -Fq -- "Primary source D — Micron 2Gb DDR3 Rev. S 02/16" evidence/34-micron-1991-temperature-dependent-refresh-grounding.md
          grep -Fq -- "- [x] In temperature-sensitive DRAM refresh" ROADMAP.md
          grep -Fq -- "manufacturer product semantics ≠ complete JEDEC chronology" CASE_INDEX.md
          git rm .github/workflows/case34-ddr3-temp-deepening.yml
          git add cases/34-micron-temperature-dependent-dram-refresh.md evidence/34-micron-1991-temperature-dependent-refresh-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m "case34: deepen DDR3 temperature-policy boundary"
          git push origin HEAD:main
