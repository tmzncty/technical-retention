name: Integrate Case 34 DDR3 temperature-policy deepening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/case34-ddr3-temp-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research deepening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          case = 'cases/34-micron-temperature-dependent-dram-refresh.md'
          replace_once(
              case,
              "**`grounded`** — bounded to Micron Technology's 1991-filed US5278796A temperature-dependent DRAM refresh circuit, with an earlier 1987-priority CardioData patent family used to control invention-priority claims and a 2004–2006 temperature-dependent self-refresh patent used only as a later locus/authority comparison.",
              "**`grounded`** — bounded to Micron Technology's 1991-filed US5278796A temperature-dependent DRAM refresh circuit, with an earlier 1987-priority CardioData patent family used to control invention-priority claims. A later Micron 2Gb DDR3 product datasheet (Rev. S 02/16) now supplies a product-interface witness for distinct manual `SRT` and automatic `ASR` self-refresh policies; the 2004–2006 temperature-dependent self-refresh patent remains a separate later locus/authority comparison. The later sources deepen policy/authority boundaries but are not treated as proof of direct implementation genealogy from the 1991 patent."
          )

          historical_anchor = "The patent also states that adding more comparators can improve refresh-rate granularity, but at some point the control circuit's own power consumption exceeds the refresh-power savings. This makes the sensing/control apparatus part of the retention cost rather than a free optimization layer.\n\n"
          historical_insert = historical_anchor + """### Later product-interface witness — Micron 2Gb DDR3 `SRT` / `ASR` (Rev. S 02/16)\n\nMicron's later **2Gb x4/x8/x16 DDR3 SDRAM** datasheet, document `09005aef826aaadc`, Rev. S 02/16, exposes a useful product-level policy split in Mode Register 2. This source is more than a generic statement that hotter DRAM needs more refresh: it separately documents **manual temperature-range declaration**, **automatic self-refresh rate selection**, and the still-external refresh requirement outside self refresh.\n\nThe bounded interface says:\n\n- `MR2[7]` selects **Self Refresh Temperature (`SRT`)** when ASR is disabled. Enabling SRT forces the internal self-refresh rate from 1x to 2x **regardless of actual case temperature** so the extended 0–95 °C operating range can be supported during self refresh.\n- `MR2[6]` selects **Auto Self Refresh (`ASR`)**. With ASR enabled, the DRAM automatically changes its internal self-refresh rate between 1x and 2x over the supported temperature range.\n- the datasheet explicitly says the automatic transition need not occur at exactly 85 °C; it may occur at a lower temperature while still maintaining data integrity.\n- if case temperature exceeds 85 °C during **externally managed refresh**, the user/controller must provide 2x refresh by reducing the refresh period from 64 ms to 32 ms. SRT/ASR govern the self-refresh side of the contract rather than eliminating that external obligation.\n- SRT and ASR are mutually exclusive in this interface.\n\nThis later product witness adds two control forms that the 1991 patent did not expose as a standardized-looking mode-register pair: a **declared conservative operating envelope** (`SRT`) and an **automatic temperature-conditioned self-refresh policy** (`ASR`). It does not establish that the product implements US5278796A, that Micron invented these interface semantics, or that this one datasheet is a complete JEDEC DDR3 chronology.\n\n"""
          replace_once(case, historical_anchor, historical_insert)

          engineering_anchor = "### Temperature-conditioned refresh is not per-row retention-aware refresh\n"
          engineering_insert = """### Extended-temperature support is not automatic temperature adaptation\n\nThe DDR3 product interface gives a direct counterexample to treating `supports hotter operation` and `measures/adapts to temperature` as synonyms. `SRT` can support the extended range by forcing 2x self refresh even when the device is cooler; `ASR` instead changes internal self-refresh rate automatically over the supported range.\n\nTherefore:\n\n> **extended-temperature support ≠ automatic temperature adaptation**.\n\nA conservative fixed maintenance policy and an adaptive maintenance policy can protect the same bounded retention envelope while retaining different evidence and control requirements.\n\n### SRT declaration is not a temperature measurement\n\nWhen ASR is disabled, the user programs `SRT` to indicate the operating-temperature range to be protected during self refresh. That bit is policy/configuration state. It does not, by itself, report a measured temperature.\n\nTherefore:\n\n> **declared operating envelope ≠ measured environmental condition**.\n\nThis sharpens the 1991 sensor/comparator case: environment, measurement, classification, and chosen cadence can be represented by different mechanisms, and a product may expose only some of them to software.\n\n### External refresh responsibility is not internal self-refresh policy\n\nAbove 85 °C, the same DDR3 datasheet requires externally managed refresh to move from the 64 ms to 32 ms period, while self refresh must use either SRT or ASR.\n\nTherefore:\n\n> **external refresh-rate responsibility ≠ internal self-refresh cadence selection**.\n\nThe physical temperature constraint can be shared while the locus and representation of maintenance authority change with mode. This is a product-level continuation of the Case-21 responsibility distinction, not evidence that the controller and DRAM use one scheduler.\n\n### Contract boundary is not an exact physical switching point\n\nThe datasheet says ASR may switch from 1x to 2x below exactly 85 °C while preserving data integrity. The contractual 85 °C boundary therefore must not be reconstructed as a measured cell-level retention cliff or an exact sensor trip point.\n\nTherefore:\n\n> **specified temperature boundary ≠ exact automatic transition point ≠ per-cell retention limit**.\n\nThis is also a concrete guard against reading a mode table as a direct map of semiconductor physics.\n\n""" + engineering_anchor
          replace_once(case, engineering_anchor, engineering_insert)

          cross_old = "    !=\nclassification / guardband policy\n    !=\nchosen refresh cadence\n    !=\nrefresh authority"
          cross_new = "    !=\nclassification / guardband policy or declared operating envelope\n    !=\nchosen fixed/adaptive refresh cadence\n    !=\nmode-dependent refresh authority"
          replace_once(case, cross_old, cross_new)

          ledger_anchor = "| Environment-conditioned refresh cadence can be separated from refresh-row enumeration, target geometry, and self-refresh authority | E | bounded cross-case reconstruction |\n"
          ledger_insert = ledger_anchor + """| Micron's Rev. S 02/16 2Gb DDR3 datasheet exposes mutually exclusive SRT and ASR controls in MR2 | H/P | direct later manufacturer product/interface record |\n| SRT forces 2x internal self refresh regardless of case temperature, while ASR automatically adjusts between 1x and 2x over the supported range | H/P | direct later product semantics |\n| Above 85 °C, externally managed refresh still requires 2x cadence (64 ms → 32 ms) even though self refresh can use SRT or ASR | H/P | direct extended-temperature contract |\n| ASR's automatic transition is guaranteed for data integrity but need not occur at exactly 85 °C | H/P | direct product boundary; not a per-cell retention measurement |\n| The 2016 product interface proves direct implementation descent from Micron's 1991 patent | X | chronology and shared assignee are insufficient for genealogy |\n"""
          replace_once(case, ledger_anchor, ledger_insert)

          source_anchor = "3. Chien-Yi Chang, Elite Semiconductor Memory Technology, Inc., **US7035157B2, “Temperature-dependent DRAM self-refresh circuit,”** priority 27 August 2004, filed 14 September 2004, granted 25 April 2006 — used only as a later comparison showing temperature-conditioned cadence integrated with self-refresh sensing/latching/oscillator control: <https://patents.google.com/patent/US7035157B2/en>.\n"
          source_insert = source_anchor + "4. Micron Technology, Inc., **2Gb: x4, x8, x16 DDR3 SDRAM**, PDF `09005aef826aaadc`, `2Gb_DDR3_SDRAM.pdf - Rev. S 02/16 EN`, especially Mode Register 2 pp. 146–147 and Extended Temperature Usage pp. 182–183 — later manufacturer product/interface witness for SRT, ASR, external 2x refresh above 85 °C, and the non-exact automatic transition boundary. Public preserved copy inspected: <https://file.hstatic.net/1000180878/file/mt41j128m16_2gb_ddr3_sdram.pdf>.\n"
          replace_once(case, source_anchor, source_insert)

          evidence = 'evidence/34-micron-1991-temperature-dependent-refresh-grounding.md'
          replace_once(
              evidence,
              "**`grounded`** for the bounded retention claim in Case 34: a DRAM refresh cadence can be selected from measured temperature rather than held at one worst-case cadence, while the underlying dynamic-cell refresh obligation remains intact.",
              "**`grounded`** for the bounded retention claim in Case 34: a DRAM refresh cadence can be selected from measured temperature rather than held at one worst-case cadence, while the underlying dynamic-cell refresh obligation remains intact. A later Micron 2Gb DDR3 Rev. S 02/16 product witness now additionally grounds a manual-declared `SRT` versus automatic `ASR` self-refresh-policy split and separates that internal policy from the still-external 2x refresh obligation above 85 °C."
          )
          replace_once(
              evidence,
              "This record deliberately separates three historical layers:\n\n1. **earlier prior art** — a 1987-priority CardioData patent family already describes ambient-temperature-controlled DRAM refresh using a thermistor, processor A/D conversion, and a table;\n2. **bounded Micron mechanism** — US5278796A, filed 12 April 1991, gives a particularly explicit sensor → comparator bands → encoder → oscillator → refresh-sequence design and discusses guardband/granularity/power tradeoffs;\n3. **later comparison only** — US7035157B2, priority 2004, integrates temperature measurement and sampled/latching control into an explicitly named DRAM self-refresh circuit. It is not used to project later self-refresh semantics backward into the 1991 Micron design.\n",
              "This record deliberately separates four historical layers:\n\n1. **earlier prior art** — a 1987-priority CardioData patent family already describes ambient-temperature-controlled DRAM refresh using a thermistor, processor A/D conversion, and a table;\n2. **bounded Micron mechanism** — US5278796A, filed 12 April 1991, gives a particularly explicit sensor → comparator bands → encoder → oscillator → refresh-sequence design and discusses guardband/granularity/power tradeoffs;\n3. **later self-refresh comparison** — US7035157B2, priority 2004, integrates temperature measurement and sampled/latching control into an explicitly named DRAM self-refresh circuit. It is not used to project later self-refresh semantics backward into the 1991 Micron design;\n4. **later Micron DDR3 product/interface witness** — the Rev. S 02/16 2Gb DDR3 datasheet exposes mutually exclusive manual `SRT` and automatic `ASR` self-refresh policies, plus a separate externally managed 2x refresh obligation above 85 °C. It deepens the policy/authority boundary without proving direct descent from the 1991 patent.\n"
          )

          evidence_anchor = "## Claim-to-source matrix\n"
          evidence_section = """## Primary source D — Micron 2Gb DDR3 Rev. S 02/16 SRT / ASR product interface\n\n### Identity and bounded use\n\n- **Title:** `2Gb: x4, x8, x16 DDR3 SDRAM`\n- **Document ID:** `09005aef826aaadc`\n- **Revision marker:** `2Gb_DDR3_SDRAM.pdf - Rev. S 02/16 EN`\n- **Manufacturer:** Micron Technology, Inc.\n- **Preserved manufacturer PDF inspected:** <https://file.hstatic.net/1000180878/file/mt41j128m16_2gb_ddr3_sdram.pdf>\n\nRelevant locations are Mode Register 2, printed pp. 146–147, and `Extended Temperature Usage`, printed pp. 182–183.\n\n### SRT / ASR policy split\n\n`MR2[7]` controls Self Refresh Temperature (`SRT`). When SRT is enabled, the DRAM changes internal self refresh from 1x to 2x **regardless of case temperature**. This is a conservative fixed policy for the extended temperature range, not a temperature reading.\n\n`MR2[6]` controls Auto Self Refresh (`ASR`). When ASR is enabled, the DRAM automatically changes internal self-refresh rate between 1x and 2x over the supported temperature range. The datasheet explicitly says the transition is not guaranteed to occur at exactly 85 °C and may occur lower while data integrity remains supported. SRT and ASR cannot be enabled simultaneously.\n\n### External refresh remains a separate responsibility\n\nFor the optional 0–95 °C range, the datasheet separately requires **externally managed refresh** to run at 2x whenever case temperature is above 85 °C, implemented by reducing the refresh period from 64 ms to 32 ms. Self refresh instead requires SRT or ASR for the extended range.\n\nThis gives direct product evidence for:\n\n- `extended-temperature support ≠ automatic temperature adaptation`;\n- `declared operating envelope ≠ measured environmental condition`;\n- `external refresh-rate responsibility ≠ internal self-refresh cadence selection`;\n- `specified temperature boundary ≠ exact automatic transition point`.\n\n### Evidence boundary\n\nThe datasheet is a later manufacturer product/interface witness. It is **not** used to claim:\n\n- that Micron invented SRT or ASR;\n- that Rev. S 02/16 is the first DDR3 revision to expose these fields;\n- that the product implements US5278796A;\n- that its 85 °C contract boundary is a per-cell physical retention cliff;\n- that this one product document supplies the full JEDEC DDR3 revision history.\n\n""" + evidence_anchor
          replace_once(evidence, evidence_anchor, evidence_section)

          matrix_anchor = "| Later temperature-dependent self-refresh can sample/latch temperature and change oscillator timing | US7035157B2 | direct later primary record; comparison only |\n"
          matrix_insert = matrix_anchor + """| Micron's Rev. S 02/16 2Gb DDR3 exposes mutually exclusive SRT and ASR controls | Micron 2Gb DDR3 datasheet pp. 146–147 | direct later manufacturer product/interface record |\n| SRT forces 2x internal self refresh independent of actual case temperature | Micron 2Gb DDR3 datasheet p. 147 | direct product semantics |\n| ASR automatically changes internal self-refresh rate between 1x and 2x, with a transition that need not occur at exactly 85 °C | Micron 2Gb DDR3 datasheet p. 147 | direct product boundary |\n| External refresh above 85 °C still requires 2x cadence, 64 ms → 32 ms | Micron 2Gb DDR3 datasheet p. 183 | direct external-maintenance contract |\n| The DDR3 product proves direct implementation genealogy from US5278796A | none | **unsupported / rejected** |\n"""
          replace_once(evidence, matrix_anchor, matrix_insert)

          reconstruction_anchor = "### 5. Environmental conditioning versus self-refresh locus\n\nThe 1991 Micron design and 2004–2006 self-refresh patent support a controlled comparison: the condition that modulates cadence and the place where recurring maintenance authority resides can evolve independently.\n"
          reconstruction_insert = reconstruction_anchor + "\n### 6. Declared envelope versus automatic policy\n\nThe 2016 DDR3 product interface adds a policy distinction that is not visible in the 1991 comparator example: SRT can conservatively force the high self-refresh rate without claiming a current temperature measurement, while ASR automatically changes rate over the supported range. A retained configuration bit and an environmental observation are therefore different evidence classes even when both influence the same maintenance cadence.\n\n### 7. Mode-dependent authority\n\nThe same product requires the controller/user to double externally managed refresh above 85 °C, while SRT/ASR govern the internal self-refresh path. The physical retention constraint can therefore stay temperature-conditioned while recurrence authority and policy representation move with operating mode.\n"
          replace_once(evidence, reconstruction_anchor, reconstruction_insert)

          gaps_old = "- exact modern DDR/LPDDR temperature-band/timing semantics;\n"
          gaps_new = "- complete JEDEC DDR3/DDR4/LPDDR revision chronology and cross-vendor temperature-band/timing semantics beyond the bounded Micron DDR3 witness;\n"
          replace_once(evidence, gaps_old, gaps_new)

          roadmap = 'ROADMAP.md'
          road_old = "- [ ] In temperature-sensitive DRAM refresh, how should `physical retention constraint`, `environmental condition`, `temperature measurement`, `guardband/policy classification`, `chosen refresh cadence`, `measurement/control overhead`, and `refresh authority` be separated?"
          road_new = "- [x] In temperature-sensitive DRAM refresh, separate `physical retention constraint`, `environmental condition`, `temperature measurement`, `guardband/policy classification`, `chosen refresh cadence`, `measurement/control overhead`, and `refresh authority` — closed at the bounded manufacturer-primary relation level by [`cases/34-micron-temperature-dependent-dram-refresh.md`](cases/34-micron-temperature-dependent-dram-refresh.md), now deepened with a later Micron 2Gb DDR3 `SRT`/`ASR` product-interface witness. [`cases/35-micron-mobile-ddr-automatic-tcsr.md`](cases/35-micron-mobile-ddr-automatic-tcsr.md) remains the separate commercial automatic-TCSR/PASR case. Complete JEDEC DDR3/DDR4/LPDDR revision genealogy, cross-vendor sensor semantics, controller compliance, calibration/fault injection, and per-row retention-aware scheduling remain separate work."
          replace_once(roadmap, road_old, road_new)

          index = 'CASE_INDEX.md'
          idx_old = "| [Micron Temperature-Dependent DRAM Refresh: Guardband, Environmental Sensing, and Adaptive Maintenance](cases/34-micron-temperature-dependent-dram-refresh.md) | **grounded** | volatile dynamic payload + nearby temperature measurement + discrete band/guardband state + oscillator-selected refresh cadence + system refresh logic | separate the continuing refresh obligation from worst-case maintenance frequency; distinguish physical environment, measured proxy, policy discretization, cadence, authority, and control-energy cost; preserve 1987-priority temperature-adaptive prior art | [1991 Micron temperature-dependent refresh grounding](evidence/34-micron-1991-temperature-dependent-refresh-grounding.md); commercial automatic TCSR is now handled separately in Case 35; JEDEC temperature-compensated-self-refresh genealogy, exact later DDR/LPDDR semantics, sensor fault qualification, and per-row retention-aware scheduling remain separate work |"
          idx_new = "| [Micron Temperature-Dependent DRAM Refresh: Guardband, Environmental Sensing, and Adaptive Maintenance](cases/34-micron-temperature-dependent-dram-refresh.md) | **grounded** | volatile dynamic payload + environmental measurement/proxy + policy/guardband state + fixed or automatic temperature-conditioned cadence + mode-dependent refresh authority | separate the continuing refresh obligation from worst-case maintenance frequency; distinguish environment, measurement, declared operating envelope, adaptive versus fixed policy, cadence, authority, and control-energy cost; preserve 1987-priority temperature-adaptive prior art | [1991 Micron + later DDR3 SRT/ASR grounding](evidence/34-micron-1991-temperature-dependent-refresh-grounding.md); Rev. S 02/16 now separates SRT fixed-2x policy, ASR automatic 1x/2x policy, non-exact auto transition, and the still-external 2x refresh duty above 85 °C. Case 35 remains the separate Mobile-DDR automatic-TCSR/PASR witness; full JEDEC/cross-vendor genealogy, sensor fault qualification, and per-row scheduling remain open |"
          replace_once(index, idx_old, idx_new)

          p = Path(index)
          text = p.read_text().rstrip()
          if not text.endswith("1426. **cryptographic forgetting can be modeled as decryptability closure ≠ NIST historical vocabulary** — the project may reconstruct a relation among ciphertext, MEKs, KEKs, key copies, lifecycle instances, scope, and external recovery paths, but that graph-like formulation is an analytical tool rather than a phrase attributed to the 2014 authors."):
              raise SystemExit('CASE_INDEX tail moved; refusing to assign stale finding numbers')
          text += """\n\n### Case 34 DDR3 temperature-policy deepening — SRT, ASR, and mode-dependent authority\n\n1427. **extended-temperature support ≠ automatic temperature adaptation** — Micron DDR3 SRT can conservatively force 2x self refresh regardless of actual case temperature, while ASR automatically changes the internal rate over the supported range.\n1428. **SRT policy state ≠ temperature measurement** — the SRT bit declares the operating envelope the self-refresh policy must cover; it is not itself evidence of a sensed temperature.\n1429. **fixed conservative maintenance ≠ adaptive maintenance** — SRT and ASR can protect the same bounded 0–95 °C self-refresh envelope while requiring different observation/control relations.\n1430. **external refresh-rate responsibility ≠ internal self-refresh cadence selection** — above 85 °C the controller/user must still provide 2x externally managed refresh, while SRT or ASR governs the device's self-refresh path.\n1431. **specified 85 °C boundary ≠ exact ASR transition point** — the product document allows ASR to switch below 85 °C while maintaining data integrity, so the contractual boundary is not an exact sensor trip point.\n1432. **ASR transition point ≠ per-cell retention cliff** — one product-level automatic policy does not directly measure every row/cell's remaining charge or retention limit.\n1433. **automatic cadence selection ≠ removal of refresh obligation** — ASR changes the rate at which constitutive restoration recurs; it does not make the dynamic array nonvolatile or maintenance-free.\n1434. **shared manufacturer chronology ≠ implementation genealogy** — the later Micron DDR3 SRT/ASR interface deepens the 1991 Micron case but does not prove that the product implements US5278796A or descends directly from that circuit.\n1435. **manufacturer product semantics ≠ complete JEDEC chronology** — the Rev. S 02/16 witness closes a bounded relation decomposition, while standards revision history and cross-vendor compliance remain separate research.\n"""
          p.write_text(text + "\n")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git diff --check
          grep -Fq "extended-temperature support ≠ automatic temperature adaptation" cases/34-micron-temperature-dependent-dram-refresh.md
          grep -Fq "Primary source D — Micron 2Gb DDR3 Rev. S 02/16" evidence/34-micron-1991-temperature-dependent-refresh-grounding.md
          grep -Fq "- [x] In temperature-sensitive DRAM refresh" ROADMAP.md
          grep -Fq "1435. **manufacturer product semantics ≠ complete JEDEC chronology**" CASE_INDEX.md
          git rm .github/workflows/case34-ddr3-temp-deepening.yml
          git add cases/34-micron-temperature-dependent-dram-refresh.md evidence/34-micron-1991-temperature-dependent-refresh-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m "case34: deepen DDR3 temperature-policy boundary"
          git push origin HEAD:main
