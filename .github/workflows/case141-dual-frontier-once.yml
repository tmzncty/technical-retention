          Thus:

          ```text
          consumer acknowledgement frontier (`confirmed_flush`)
              != WAL restart/reclamation frontier (`restart_lsn`)
          ```

          and, more specifically:

          `confirmed progress advanced != every older WAL record immediately reclaimable`

