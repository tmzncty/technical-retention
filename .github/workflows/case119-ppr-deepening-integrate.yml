name: Case 119 PPR retention resource integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded Case 119 patch
        run: python3 .github/retention_case119_integrate_v2.py
      - name: Validate research tree
        run: |
          git diff --check
          test -f evidence/119-micron-ddr4-ppr-payload-retention-resource-exhaustion-deepening.md
          grep -Fq 'Payload-retention and repair-resource deepening' cases/119-ddr4-post-package-repair-row-remapping.md
          grep -Fq 'Case 119 deepening — DDR4 PPR payload-preservation' ROADMAP.md
          grep -Fq '**3511 — X:**' CASE_INDEX.md
          grep -Fq 'Micron payload-retention / repair-resource deepening' CASE_INDEX.md
      - name: Commit and push research integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/retention_case119_integrate.py .github/retention_case119_integrate_v2.py .github/workflows/case119-ppr-deepening-integrate.yml
          git add CASE_INDEX.md ROADMAP.md cases/119-ddr4-post-package-repair-row-remapping.md evidence/119-micron-ddr4-ppr-payload-retention-resource-exhaustion-deepening.md
          git commit -m 'case119: deepen PPR payload retention and resource bounds [skip ci]'
          git push origin HEAD:main
