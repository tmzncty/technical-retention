name: Case37 bounded integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/zz-case37-restoration-deepening.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research patch
        run: python .automation/case37_deepen.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'technical-retention research automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md ROADMAP.md cases/37-samsung-840-evo-old-data-performance-refresh.md evidence/37-samsung-2014-restoration-transaction-deepening.md
          git rm .automation/case37_deepen.py
          git rm .github/workflows/zz-case37-restoration-deepening.yml
          git diff --cached --check
          git commit -m 'case37: deepen restoration transaction boundary'
          git push origin HEAD:main
