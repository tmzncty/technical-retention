## Case 09 deepening — DRAM refresh-counter initialization / testability findings

- **2590 — on-chip refresh counter != stateless address decoder:** TI's disclosed refresh counter carries a sequential phase that starts at zero at power-on and changes on successive CAS-before-RAS refresh cycles. (`H/P`)
