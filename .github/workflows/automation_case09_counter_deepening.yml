name: Apply Case 09 refresh-counter deepening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation_case09_counter_deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate bounded research slice
        run: python .github/apply_case09_counter_deepening.py

      - name: Commit research and remove integration scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply_case09_counter_deepening.py
          rm -f .github/workflows/automation_case09_counter_deepening.yml
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case09: deepen refresh-counter initialization boundary'
          git push origin main
          git rev-parse HEAD
