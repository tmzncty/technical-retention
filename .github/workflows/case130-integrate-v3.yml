name: Case 130 integration v3

on:
  push:
    paths:
      - '.github/workflows/case130-integrate-v3.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate and validate
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/case130.py
          python /tmp/case130.py
          grep -q 'Case 130' ROADMAP.md
          grep -q '^## Case 130 —' CASE_INDEX.md
          grep -q '2315 —' CASE_INDEX.md
          grep -q '2330 —' CASE_INDEX.md
          git diff --check
          rm .github/workflows/case130-integrate-v3.yml
          git add ROADMAP.md CASE_INDEX.md .github/workflows/case130-integrate-v3.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case130: integrate LTO reader-obsolescence navigation'
          git push
