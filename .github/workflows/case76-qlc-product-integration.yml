name: case76-qlc-product-integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case76-qlc-product-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research integration
        run: python .github/integration/case76_qlc_product_witness.py

      - name: Normalize EOFs and validate Markdown changes
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'cases/76-jedec-ssd-endurance-retention-qualification.md',
              'evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md',
              'ROADMAP.md',
              'CASE_INDEX.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit research slice and remove integration helpers
        run: |
          rm -f .github/integration/case76_qlc_product_witness.py
          rm -f .github/workflows/case76-qlc-product-integration.yml
          rmdir .github/integration 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case76: ground QLC product retention witness'
          git push origin HEAD:main
