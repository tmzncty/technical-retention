name: case88-integrate

on:
  push:
    paths:
      - '.github/workflows/case88-integration.yml'
      - '.github/case88-integrate.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run integration
        run: python3 .github/case88-integrate.py
      - name: Commit integration
        run: |
          rm -f .github/case88-integrate.py .github/workflows/case88-integration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md .github/case88-integrate.py .github/workflows/case88-integration.yml
          git commit -m "case88: integrate RAID5 PPL navigation"
          git push
