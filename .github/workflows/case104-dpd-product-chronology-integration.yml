name: Case 104 DPD product chronology integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case104-dpd-product-chronology-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Apply Case 104 DPD chronology research patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "496f2ff0ea7eef83eda7779badb9674662bbf227"
          python3 .github/case104_dpd_product_chronology_patch.py
          sed -i 's/[[:space:]]\+$//' cases/104-micron-lpddr-selective-adaptive-self-refresh.md
          sed -i 's/[[:space:]]\+$//' evidence/104-micron-hynix-2008-2009-dpd-product-availability-deepening.md
          sed -i 's/[[:space:]]\+$//' ROADMAP.md
          sed -i 's/[[:space:]]\+$//' CASE_INDEX.md
          rm .github/case104_dpd_product_chronology_patch.py
          rm .github/workflows/case104-dpd-product-chronology-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case104: deepen DPD product availability boundary [skip ci]"
          git push origin HEAD:main
