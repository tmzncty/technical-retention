name: Case 76 navigation integration

on:
  push:
    paths:
      - '.github/workflows/case76-a117-deepening.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation updates
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-research-agent'
          git config user.email 'chatgpt-research-agent@users.noreply.github.com'
          git pull --rebase origin main
          python3 .github/case76-nav.py
          git rm .github/case76-nav.py .github/workflows/case76-a117-deepening.yml
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          idx = Path('CASE_INDEX.md').read_text()
          road = Path('ROADMAP.md').read_text()
          readme = Path('README.md').read_text()
          assert idx.count('1247. **device-level P/E endurance qualification') == 1
          assert idx.count('1254. **lower-level qualification evidence') == 1
          assert 'JESD22-A117 → JESD218 qualification-layer prior-art deepening' in road
          assert 'Prior-art deepening now separates this SSD-level contract' in readme
          files = list(Path('cases').glob('[0-9][0-9]-*.md'))
          grounded = sum('**`grounded`**' in p.read_text() for p in files)
          print(f'canonical numeric case files: {len(files)}; grounded markers: {grounded}')
          PY
          git commit -m 'case76: integrate A117 prior-art navigation'
          git push origin HEAD:main
