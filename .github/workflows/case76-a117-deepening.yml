name: Case76 A117 prior-art deepening

on:
  push:
    paths:
      - '.github/workflows/case76-a117-deepening.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate bounded Case 76 deepening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-research-agent'
          git config user.email 'chatgpt-research-agent@users.noreply.github.com'
          git pull --rebase origin main
          cat > /tmp/case76.py.gz.b64 <<'PAYLOAD'
          

          PAYLOAD
          base64 -d /tmp/case76.py.gz.b64 | gzip -d > /tmp/case76.py
          python3 /tmp/case76.py
          git rm .github/workflows/case76-a117-deepening.yml
          git add README.md ROADMAP.md CASE_INDEX.md \
            cases/76-jedec-ssd-endurance-retention-qualification.md \
            evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          case = Path('cases/76-jedec-ssd-endurance-retention-qualification.md').read_text()
          ev = Path('evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md').read_text()
          idx = Path('CASE_INDEX.md').read_text()
          roadmap = Path('ROADMAP.md').read_text()
          assert idx.count('1247. **device-level P/E endurance qualification') == 1
          assert idx.count('1254. **lower-level qualification evidence') == 1
          assert 'JESD22-A117B' in case and 'Belgal et al.' in case and 'Belgal et al.' in ev
          assert 'JESD22-A117 → JESD218 qualification-layer prior-art deepening' in roadmap
          assert not Path('.github/workflows/case76-a117-deepening.yml').exists()
          case_files = list(Path('cases').glob('[0-9][0-9]-*.md'))
          grounded = sum('**`grounded`**' in p.read_text() for p in case_files)
          print(f'canonical numeric case files: {len(case_files)}; grounded markers: {grounded}')
          PY
          git commit -m 'case76: deepen A117 endurance-retention prior art'
          git push origin HEAD:main
