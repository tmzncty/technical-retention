name: Case146 TI deepening integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/case146-ti-deepening.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research slice
        run: python3 .automation/case146_ti_deepening.py
      - name: Validate links and expected files
        run: |
          test -f evidence/146-ti-tms29f040-erase-suspend-microstate-power-deepening.md
          grep -q 'Findings 3748–3763' CASE_INDEX.md
          grep -q 'TMS29F040' ROADMAP.md
          grep -q 'internal pulse counter' cases/146-flash-erase-suspend-pending-operation-state.md
      - name: Commit canonical research update and remove one-shot integration files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .automation/case146_ti_deepening.py .github/workflows/case146-ti-deepening.yml
          git add CASE_INDEX.md ROADMAP.md cases/146-flash-erase-suspend-pending-operation-state.md evidence/146-ti-tms29f040-erase-suspend-microstate-power-deepening.md
          git diff --cached --check
          git commit -m 'case146: deepen suspend microstate power boundary [skip ci]'
          git push origin HEAD:main
