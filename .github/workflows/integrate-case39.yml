name: Integrate Case 39 navigation

on:
  push:
    paths:
      - '.github/workflows/integrate-case39.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch navigation and status
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def insert_after_line(text, needle, new_line):
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if needle in line]
              assert len(matches) == 1, (needle, matches)
              i = matches[0]
              if new_line not in lines:
                  lines.insert(i + 1, new_line)
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          # README: add the new bounded case after Case 38.
          p = Path('README.md')
          text = p.read_text()
          case39_readme = "- [`cases/39-geckoftl-power-failure-metadata-recovery.md`](cases/39-geckoftl-power-failure-metadata-recovery.md) — grounded research-FTL metadata-recovery bridge: GeckoFTL separates nonvolatile NAND payload from volatile mapping/validity state, persists and reconstructs controller relations through Flash-resident metadata, checkpoints, completion witnesses, and recovery scans, and makes restart latency a retention constraint without claiming commercial deployment."
          text = insert_after_line(text, 'cases/38-intel-dc-s3700-pli-self-test-validation.md', case39_readme)
          p.write_text(text)

          # ROADMAP: extend the SSD/controller slice while preserving commercial-product gaps.
          p = Path('ROADMAP.md')
          text = p.read_text()
          old_count = 'Cases 15, 20, 30, 31, 32, 36, 37, and 38'
          assert text.count(old_count) == 1
          text = text.replace(old_count, 'Cases 15, 20, 30, 31, 32, 36, 37, 38, and 39')
          old_gap = 'independent named-product PLP fault compliance, controller-metadata recovery under interruption, other platform-specific persistence-domain implementations'
          assert text.count(old_gap) == 1
          text = text.replace(old_gap, 'independent named-product PLP fault compliance, commercial/named-controller metadata recovery under interruption, other platform-specific persistence-domain implementations')
          anchor = "Case 38 grounds a manufacturer-primary enterprise PLI health/validation sub-slice; it does not convert Intel's own 7000-repeat validation flow into independent certification, and the anonymized FAST '13 evidence in Case 15 remains a contract-versus-compliance boundary rather than silently assigned to a named product."
          assert text.count(anchor) == 1
          addition = " Case 39 grounds a research-system controller-metadata recovery sub-slice: GeckoFTL separates nonvolatile NAND payload from volatile mapping/validity state, checkpoint-bounded dirty entries, partial-run admissibility, and restart reconstruction time; it does not establish commercial deployment or named-controller compliance."
          text = text.replace(anchor, anchor + addition)
          p.write_text(text)

          # CASE_INDEX: add case row.
          p = Path('CASE_INDEX.md')
          text = p.read_text()
          case_row = "| [GeckoFTL Power-Failure Recovery: Flash-Resident Validity Metadata, Checkpoints, and Restart Reconstitution](cases/39-geckoftl-power-failure-metadata-recovery.md) | **grounded** | research FTL + nonvolatile NAND payload + Flash-resident mapping/validity metadata + volatile SRAM caches/buffers + checkpoint/recovery witnesses | separate payload survival from controller-state survival and immediate restart availability; show partial metadata can survive physically yet be inadmissible, while safe reclamation may depend on retaining old metadata until newer invalidity state is durably closed | [2015–2017 GeckoFTL grounding](evidence/39-geckoftl-2015-2017-metadata-recovery-grounding.md); commercial/named-controller metadata recovery, independent fault compliance, and filesystem/database composition remain separate work |"
          text = insert_after_line(text, '[Intel DC S3700/S3500 PLI Self-Test: Retention-Infrastructure Health, Fault Validation, and Readiness State]', case_row)

          comparison_row = "| GeckoFTL power-failure metadata recovery / 2015–2017 research regime | NAND user pages + Flash-resident mapping/validity/reverse-map metadata + volatile SRAM caches/buffers + checkpoint/run-completion witnesses | normal operation logs mapping/invalidity updates and checkpoints bound dirty state; recovery scans persistent metadata and reconstructs SRAM state after power failure | physical user pages may survive while logical access waits for mapping/currentness reconstruction; partial metadata runs can be rejected | logical page mappings, physical block IDs, PVB/invalid-page bitmaps, reverse maps, GMD/run directories | payload pages and metadata runs can survive Flash while volatile controller structures disappear and are recreated; currentness depends on mapping/completion evidence rather than byte survival alone | bounded checkpoint/update history is retained for recovery, but no application history is implied |"
          text = insert_after_line(text, '| Intel DC S3700/S3500 PLI health/validation / 2014–2015 bounded regime |', comparison_row)

          assert text.count('thirty-nine grounded regimes now support') == 1
          text = text.replace('thirty-nine grounded regimes now support', 'forty grounded regimes now support')
          old_bridge = 'and Intel DC S3700/S3500 PLI-health/validation bridges;'
          assert text.count(old_bridge) == 1
          text = text.replace(old_bridge, 'Intel DC S3700/S3500 PLI-health/validation, and GeckoFTL controller-metadata-recovery bridges;')

          findings = """359. **nonvolatile payload ≠ nonvolatile controller state** — GeckoFTL's power-failure path can leave NAND user pages present while SRAM-resident mapping, directory, cache, and invalidity state disappears and must be reconstructed.
360. **payload survival ≠ immediate restart availability** — the recovery target is explicitly to restore enough SRAM-resident metadata for normal FTL operation to resume; surviving data pages do not by themselves provide the logical service.
361. **metadata persistence ≠ zero recovery work** — Flash-resident mapping/validity structures still require block/OOB scanning, run qualification, directory/GMD reconstruction, dirty-entry recreation, and invalidity-state recovery after interruption.
362. **recovery correctness ≠ recovery latency** — GeckoFTL treats power-failure recovery time as an independent scaling constraint; eventual reconstructability does not by itself satisfy a practical restart-time objective.
363. **more persistent metadata ≠ free durability** — moving controller metadata into Flash can reduce RAM dependence while adding internal I/O, performance cost, and lifetime/endurance pressure; persistence placement is a tradeoff rather than a monotonic good.
364. **physically present metadata ≠ recovery-admissible metadata** — the LSM recovery design rejects runs without completion postambles and discards obsolete runs, so surviving bytes are not enough to make a metadata embodiment current.
365. **surviving data page ≠ recoverable logical identity** — the patent's interrupted-buffer example allows an updated NAND page to remain while loss of its mapping entry makes that page inaccessible until the recovery/checkpoint scheme preserves the relation.
366. **metadata obsolescence ≠ immediately safe erasure** — GeckoFTL can retain an older run until volatile invalidity information is flushed, because an otherwise-obsolete metadata embodiment may still be recovery evidence needed before reclamation is safe.
367. **FTL checkpoint ≠ filesystem/database transaction checkpoint** — GeckoFTL checkpointing bounds unsynchronized mapping state inside the controller; similarity to WAL/journaling is functional only and does not establish application-level atomicity or genealogy.
368. **research evaluation ≠ commercial deployment** — GeckoFTL's peer-reviewed analytical/simulation results ground a research-system retention regime but do not establish that a named shipped SSD used the design or achieved the reported baseline-relative figures.
"""
          marker = '\nThese are provisional cross-case findings, not final philosophical conclusions.'
          assert text.count(marker) == 1
          if '359. **nonvolatile payload ≠ nonvolatile controller state**' not in text:
              text = text.replace(marker, '\n' + findings + marker)
          p.write_text(text)
          PY
      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .github/workflows/integrate-case39.yml
          git diff --cached --check
          git commit -m 'docs: integrate grounded GeckoFTL metadata-recovery bridge'
          git push
