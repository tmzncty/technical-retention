name: Integrate Synthesis 23 access-apparatus boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-synthesis23-access-apparatus.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'tmzncty/technical-retention'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate bounded synthesis
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate_synthesis23.py
          git diff --check
          test -s docs/SYNTHESIS_23_RETENTION_INTERPRETER_ACCESS_APPARATUS.md
          grep -q 'SYNTHESIS_23_RETENTION_INTERPRETER_ACCESS_APPARATUS.md' README.md
          grep -q 'machine-access-apparatus layer' ROADMAP.md
          grep -q '\*\*2374 —' CASE_INDEX.md
          git status --short

      - name: Commit navigation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git rm .github/workflows/integrate-synthesis23-access-apparatus.yml .github/scripts/integrate_synthesis23.py
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'synthesis23: integrate access-apparatus navigation'
          git push origin HEAD:main
