name: one-shot-case59-integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/case59-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair path-count assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_case59.py')
          s = p.read_text(encoding='utf-8')
          old = "for name, text in [('README', readme), ('ROADMAP', roadmap), ('CASE_INDEX', index)]:\n    if text.count(case_path) != (1 if name != 'CASE_INDEX' else 1):"
          new = "for name, text in [('README', readme), ('ROADMAP', roadmap), ('CASE_INDEX', index)]:\n    expected = 2 if name in ('README', 'ROADMAP') else 1\n    if text.count(case_path) != expected:"
          if old not in s:
              raise SystemExit('validation patch anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply and validate Case 59 navigation patch
        run: python3 scripts/integrate_case59.py

      - name: Normalize Markdown EOF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('README.md', 'ROADMAP.md', 'CASE_INDEX.md'):
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Check diff
        run: git diff --check

      - name: Commit integration and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/integrate_case59.py
          rm -f .github/workflows/case59-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: integrate grounded NAND program-interference case"
          git push origin HEAD:main
