name: Temporary Case146 Flash erase-suspend integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case146-flash-erase-suspend.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate bounded Case146 research slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 _automation_case146_flash_erase_suspend.py
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'CASE_INDEX.md',
              'ROADMAP.md',
              'cases/146-flash-erase-suspend-pending-operation-state.md',
              'evidence/146-intel-amd-1991-1998-flash-erase-suspend-grounding.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          rm -f _automation_case146_flash_erase_suspend.py .github/workflows/tmp-case146-flash-erase-suspend.yml
          git diff --check
          test -f cases/146-flash-erase-suspend-pending-operation-state.md
          test -f evidence/146-intel-amd-1991-1998-flash-erase-suspend-grounding.md
          grep -q '3159 — 1991 priority != 1991 public disclosure' CASE_INDEX.md
          grep -q '3174 — related-repository / sanitization boundary' CASE_INDEX.md
          grep -q 'Case 146 Flash erase-suspend / pending-operation-state slice' ROADMAP.md
          test ! -e _automation_case146_flash_erase_suspend.py
          test ! -e .github/workflows/tmp-case146-flash-erase-suspend.yml
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case146: ground Flash erase-suspend operation state'
          git push origin HEAD:main
