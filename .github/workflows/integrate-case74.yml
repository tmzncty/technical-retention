name: integrate-case74

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/integrate_case74.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete Case 74 grounding and navigation
        run: python .github/scripts/integrate_case74.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md evidence
          git rm .github/scripts/integrate_case74.py .github/workflows/integrate-case74.yml
          git diff --cached --check
          python - <<'PY'
          from pathlib import Path
          case_files = sorted(Path('cases').glob('[0-9][0-9]-*.md'))
          nums = sorted(int(p.name[:2]) for p in case_files)
          assert nums == list(range(75)), nums
          assert Path('cases/74-linux-jbd-revoke-stale-replay-suppression.md').exists()
          assert Path('evidence/74-linux-jbd-1998-2005-revoke-grounding.md').exists()
          for p in ['README.md', 'ROADMAP.md', 'CASE_INDEX.md']:
              text = Path(p).read_text()
              assert '74-linux-jbd-revoke-stale-replay-suppression.md' in text, p
          idx = Path('CASE_INDEX.md').read_text()
          assert '861. **committed journal image ≠ permanently replay-authoritative image**' in idx
          assert '876. **replay currentness can depend on retained negative evidence**' in idx
          assert 'After seventy-five bounded cases' in idx
          assert 'all seventy-five cases are now `grounded`' in idx
          print('validated 00-74 contiguous case ledger, Case 74 evidence/navigation, findings 861-876, and case-count status')
          PY
          git commit -m 'case74: integrate JBD revoke grounding and navigation'
          git push origin HEAD:main
