name: Stage Case 115 snapshot restart deepening

on:
  push:
    branches: [main]
    paths:
      - 'tools/stage_case115_snapshot_restart_retirement.py'
      - '.github/workflows/stage-case115-snapshot-restart.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded research slice
        run: python tools/stage_case115_snapshot_restart_retirement.py
      - name: Validate canonical diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            "CASE_INDEX.md"
            "ROADMAP.md"
            "cases/115-apache-hdfs-snapshot-shared-block-replication.md"
            "evidence/115-hadoop-241-snapshot-restart-retirement-deepening.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          grep -Fq '## Checkpoint/restart and block-retirement deepening — Hadoop 2.4.1' cases/115-apache-hdfs-snapshot-shared-block-replication.md
          grep -Fq 'Case 115 HDFS snapshot checkpoint/restart + block-retirement/invalidation deepening' ROADMAP.md
          grep -Fq 'evidence/115-hadoop-241-snapshot-restart-retirement-deepening.md' CASE_INDEX.md
          for n in $(seq 2770 2784); do
            count="$(grep -c -- "\*\*${n} —" CASE_INDEX.md)"
            [[ "$count" -eq 1 ]]
          done
      - name: Commit and push canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-research-agent"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_INDEX.md ROADMAP.md cases/115-apache-hdfs-snapshot-shared-block-replication.md evidence/115-hadoop-241-snapshot-restart-retirement-deepening.md tools/stage_case115_snapshot_restart_retirement.py .github/workflows/stage-case115-snapshot-restart.yml
          git rm tools/stage_case115_snapshot_restart_retirement.py .github/workflows/stage-case115-snapshot-restart.yml
          git diff --cached --check
          git commit -m "case115: deepen snapshot restart-retirement boundary"
          git push
