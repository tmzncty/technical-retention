name: Integrate Case 128 ZFS restart-root grounding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case128-zfs-restart-root.yml'
      - 'scripts/integrate_case128_zfs_restart_root.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Adapt helper to current compact navigation wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_case128_zfs_restart_root.py')
          s = p.read_text(encoding='utf-8')

          old = """    if len(positions) != 1:\n        raise SystemExit(f'Expected exactly one README Case 127 row, found {len(positions)}')\n    insert_at = positions[0] + 1\n"""
          new = """    if not positions:\n        positions = [i for i, line in enumerate(lines) if '(cases/100-zfs-dirty-time-log-selective-resilver.md)' in line]\n    if len(positions) != 1:\n        raise SystemExit(f'Expected one README insertion anchor (Case 127 or Case 100), found {len(positions)}')\n    insert_at = positions[0] + 1\n"""
          if old not in s:
              raise SystemExit('README anchor patch target not found in helper')
          s = s.replace(old, new, 1)

          old_roadmap = "positions = [i for i, line in enumerate(lines) if line.startswith('- [x]') and 'Case 127' in line]"
          new_roadmap = "positions = [i for i, line in enumerate(lines) if line.startswith('- [x]') and '(cases/127-' in line]"
          if old_roadmap not in s:
              raise SystemExit('ROADMAP anchor patch target not found in helper')
          s = s.replace(old_roadmap, new_roadmap, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Integrate Case 128 research and navigation
        run: python scripts/integrate_case128_zfs_restart_root.py
      - name: Validate canonical diff
        run: |
          test -f cases/128-zfs-vdev-label-uberblock-import-root-recovery.md
          test -f evidence/128-zfs-2005-2026-vdev-label-uberblock-grounding.md
          test ! -e scripts/integrate_case128_zfs_restart_root.py
          test ! -e .github/workflows/integrate-case128-zfs-restart-root.yml
          grep -q 'Case 128' ROADMAP.md
          grep -q '128-zfs-vdev-label-uberblock-import-root-recovery.md' README.md
          grep -q 'Case 128 — ZFS vdev-label / uberblock restart-root findings' CASE_INDEX.md
          git diff --check
      - name: Commit research integration and one-shot cleanup
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            cases/128-zfs-vdev-label-uberblock-import-root-recovery.md \
            evidence/128-zfs-2005-2026-vdev-label-uberblock-grounding.md \
            README.md ROADMAP.md CASE_INDEX.md \
            scripts/integrate_case128_zfs_restart_root.py \
            .github/workflows/integrate-case128-zfs-restart-root.yml
          git diff --cached --check
          git commit -m "case128: ground ZFS restart-root retention"
          git push
