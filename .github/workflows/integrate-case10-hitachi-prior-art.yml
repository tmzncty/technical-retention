          old_source2 = "2. Hitachi Ltd., JPS5956291A, _MOS storage device_, priority 24 September 1982, publication 31 March 1984 — used here only through Toshiba's explicit prior-art description/citation unless independently inspected: <https://patents.google.com/patent/JPS5956291A/ja>."
          new_source2 = "2. Hitachi Ltd., JPS5956291A, _MOS storage device_, application/priority 24 September 1982, publication 31 March 1984 — now directly inspected for the two-capacitor leakage-simulation/comparator self-refresh mechanism; detailed anchors and limits are in [`../evidence/10-hitachi-1982-1984-leakage-comparator-self-refresh-prior-art.md`](../evidence/10-hitachi-1982-1984-leakage-comparator-self-refresh-prior-art.md): <https://patents.google.com/patent/JPS5956291A/en>."
          if new_source2 not in case:
