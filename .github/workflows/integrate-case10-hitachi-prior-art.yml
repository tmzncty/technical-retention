          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap_entry = """- [x] Case 10 Hitachi 1982/1984 leakage-comparator self-refresh prior-art deepening — canonical [`cases/10-toshiba-leakage-tracked-self-refresh.md`](cases/10-toshiba-leakage-tracked-self-refresh.md), with [`evidence/10-hitachi-1982-1984-leakage-comparator-self-refresh-prior-art.md`](evidence/10-hitachi-1982-1984-leakage-comparator-self-refresh-prior-art.md), now independently inspects JPS5956291A instead of relying only on Toshiba's later citation: the 31-March-1984 public Hitachi document directly grounds two precharged leakage-simulation capacitors, voltage comparison, comparator-derived self-refresh control, oscillator/counter internal addressing, full-array refresh, and overflow-triggered monitor re-precharge. This narrows Toshiba's later novelty boundary to its distinct preferred monitor/threshold implementation without claiming Hitachi priority beyond this public floor. The 24-September-1982 filing/priority date remains distinct from publication; first invention, pre-1982 genealogy, named-product deployment, standards lineage, and wider DRAM circuit/product history remain open and should primarily live in `computing-archaeology`."""
          if "Case 10 Hitachi 1982/1984 leakage-comparator self-refresh prior-art deepening" not in roadmap:
