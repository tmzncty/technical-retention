name: Integrate Case 10 Hitachi prior-art deepening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-case10-hitachi-prior-art.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate research slice
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate_case10_hitachi.py
          git diff --check
          test -s evidence/10-hitachi-1982-1984-leakage-comparator-self-refresh-prior-art.md
          grep -q 'Hitachi 1982–1984 prior-art deepening' CASE_INDEX.md
          grep -q '\*\*2438 —' CASE_INDEX.md
          grep -q '31 March 1984' cases/10-toshiba-leakage-tracked-self-refresh.md
      - name: Commit canonical changes and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git rm .github/workflows/integrate-case10-hitachi-prior-art.yml .github/scripts/integrate_case10_hitachi.py
          git add cases/10-toshiba-leakage-tracked-self-refresh.md evidence/10-toshiba-1984-self-refresh-scheduling-grounding.md evidence/10-hitachi-1982-1984-leakage-comparator-self-refresh-prior-art.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'case10: deepen Hitachi leakage-self-refresh prior art'
          git push origin HEAD:main
