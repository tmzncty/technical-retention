name: integrate-case84

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/integrate_case84.py'
      - '.github/workflows/integrate-case84.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 84
        run: python .github/scripts/integrate_case84.py
      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          test -f cases/84-nvme-zns-zone-reset-logical-reuse.md
          test -f evidence/84-nvme-2020-2021-zns-zone-reset-grounding.md
          grep -Fq '1021. **zone write pointer ≠ payload**' CASE_INDEX.md
          grep -Fq '1036. **logical forgetting can enable future write admissibility**' CASE_INDEX.md
          grep -Fq 'cases/84-nvme-zns-zone-reset-logical-reuse.md' README.md
          grep -Fq 'cases/84-nvme-zns-zone-reset-logical-reuse.md' ROADMAP.md
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md
          git commit -m 'case84: integrate NVMe ZNS zone-reset navigation'
          git push
