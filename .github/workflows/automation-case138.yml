name: automation case138 integration
on:
  push:
    branches: [main]
    paths:
      - '.automation/case138-trigger.txt'
permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded Redis AOF rewrite research slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          case_path = Path("cases/138-redis26-aof-rewrite-current-state-reserialization.md")
          evidence_path = Path("evidence/138-redis26-aof-rewrite-grounding.md")
          if case_path.exists() or evidence_path.exists():
              raise SystemExit("Case 138 files already exist; refusing duplicate integration")

          case_path.write_bytes(base64.b64decode("   uY3R5L2NvbXB1dGluZy1hcmNoYWVvbG9neWAo "))
          evidence_path.write_bytes(base64.b64decode("       GV   "))

          case_index = Path("CASE_INDEX.md")
          ci = case_index.read_text(encoding="utf-8")
          case_row = '| [Redis 2.6 AOF Rewrite: Current-State Re-serialization, Concurrent Delta Capture, and Log Replacement](cases/138-redis26-aof-rewrite-current-state-reserialization.md) | **grounded** | replayable user-command AOF + current-dataset re-serialization + fork-time base + parent delta buffer + rename/file-descriptor authority handoff + separate fsync policy | separate retained operation history, current-state reconstructability, temporary concurrent-delta bridge state, replacement authority, maintenance trigger, and write-durability cadence; show rewrite can forget event-sequence identity without forgetting current recoverability | [2012 Redis 2.6 grounding](evidence/138-redis26-aof-rewrite-grounding.md); exact first AOF/BGREWRITEAOF/2.4 auto-rewrite genealogy, Redis 7 multipart evolution, cross-filesystem crash testing, and lower-media sanitization remain open |'
          if "cases/138-redis26-aof-rewrite-current-state-reserialization.md" not in ci:
              lines = ci.splitlines()
              matches = [i for i, line in enumerate(lines) if "cases/137-leveldb-v17-manifest-current-recovery.md" in line and line.startswith("| [")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one Case 137 table row, got {len(matches)}")
              lines.insert(matches[0] + 1, case_row)
              ci = "\n".join(lines) + "\n"

          findings = base64.b64decode(" BIL1BgLCBgWGA     pCi0gKioyOTM5IOKAlCBCR1JFV1JJVEVBT0Ygc3RhcnQvc2NoZWR1bGluZyAhPSByZXdyaXRlIGNvbXBsZXRpb246KiogYWNjZXB0aW5nIG9yIHNjaGVkdWxpbmcgdGhlIG1haW50ZW5hbmNlIG9wZXJhdGlvbiBpcyBkaXN0aW5jdCBmcm9tIGxhdGVyIHN1Y2Nlc3NmdWwgcmVzdWx0IGluc3RhbGxhdGlvbi4gKGBIL1BgLCBgRWA    CwgcmV0YWluaW5nIHRoZSBjdXJyZW50IGFic29sdXRlIGRlYWRsaW5lIHJlbGF0aW9uIHdpdGhvdXQgcmV0YWluaW5nIHRoZSBleGFjdCBlYXJsaWVyIHJlbGF0aXZlIGNvbW1hbmQgZm9ybS4gKGBIL1BgLCBgRWA " ).decode("utf-8")
          if "## Case 138 — Redis 2.6 AOF rewrite / current-state re-serialization findings" not in ci:
              ci = ci.rstrip() + "\n\n" + findings.rstrip() + "\n"
          case_index.write_text(ci, encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          rm = roadmap.read_text(encoding="utf-8")
          bullet = '- [x] Case 138 Redis 2.6 AOF rewrite / current-state re-serialization slice — [`cases/138-redis26-aof-rewrite-current-state-reserialization.md`](cases/138-redis26-aof-rewrite-current-state-reserialization.md) + [`evidence/138-redis26-aof-rewrite-grounding.md`](evidence/138-redis26-aof-rewrite-grounding.md): the released 22-October-2012 `2.6.0` tree separates ordinary replayable AOF history, a fork-time current-dataset rewrite, parent-held concurrent differences, replacement-file authority handoff, size-growth rewrite scheduling, and independent `appendfsync` policy. This closes the bounded `append history != current dataset`, `AOF rewrite != old-log record filtering`, `fork snapshot != final concurrent state`, `rewrite trigger != retention deadline`, and `compaction policy != durability policy` seams without claiming invention priority, universal rename crash durability, or media sanitization. Exact AOF/BGREWRITEAOF/2.4 auto-rewrite genealogy, Redis 7 multipart-AOF evolution, and power-cut/fault validation remain open; broader Redis persistence history belongs primarily in `computing-archaeology`.'
          if "Case 138 Redis 2.6 AOF rewrite / current-state re-serialization slice" not in rm:
              lines = rm.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith("- [x] Case 137 LevelDB v1.7 MANIFEST/CURRENT")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one Case 137 roadmap bullet, got {len(matches)}")
              lines.insert(matches[0] + 1, bullet)
              rm = "\n".join(lines) + "\n"

          old = "partially advanced by grounded Cases 42, 57, 58, 63, and 64"
          new = "partially advanced by grounded Cases 42, 57, 58, 63, 64, 137, and 138"
          if old in rm:
              rm = rm.replace(old, new, 1)
          elif new not in rm:
              raise SystemExit("Could not locate append-log partial-advance case list")
          roadmap.write_text(rm, encoding="utf-8")
          PY

          rm -f .github/workflows/automation-case138.yml .automation/case138-trigger.txt
          rmdir .automation 2>/dev/null || true

          test -f cases/138-redis26-aof-rewrite-current-state-reserialization.md
          test -f evidence/138-redis26-aof-rewrite-grounding.md
          grep -q 'Case 138 Redis 2.6 AOF rewrite' ROADMAP.md
          grep -q 'cases/138-redis26-aof-rewrite-current-state-reserialization.md' CASE_INDEX.md
          grep -q '2948 — related-repository boundary' CASE_INDEX.md
          git diff --check
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "case138: ground Redis AOF rewrite currentness"
          git push origin HEAD:main
