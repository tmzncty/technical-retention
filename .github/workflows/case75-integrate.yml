name: integrate-case75

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/integrate_case75.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete Case 75 navigation and findings
        run: python .github/scripts/integrate_case75.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .github/scripts/integrate_case75.py .github/workflows/case75-integrate.yml
          git diff --cached --check
          python - <<'PY'
          from pathlib import Path
          case_files = sorted(Path('cases').glob('[0-9][0-9]-*.md'))
          nums = sorted(int(p.name[:2]) for p in case_files)
          assert nums == list(range(76)), nums
          assert Path('cases/75-nvme13-reservation-persistence-ptpl.md').exists()
          assert Path('evidence/75-nvme-2001-2019-reservation-persistence-grounding.md').exists()
          for p in ['README.md', 'ROADMAP.md', 'CASE_INDEX.md']:
              text = Path(p).read_text()
              assert '75-nvme13-reservation-persistence-ptpl.md' in text, p
          idx = Path('CASE_INDEX.md').read_text()
          assert '877. **payload durability ≠ access-authority durability**' in idx
          assert '892. **NVMe 1.3d reservation/PTPL semantics ≠ invention of persistent reservations**' in idx
          print('validated 00-75 contiguous case ledger, Case 75 evidence/navigation, and findings 877-892')
          PY
          git commit -m 'case75: integrate NVMe reservation persistence navigation'
          git push origin HEAD:main
