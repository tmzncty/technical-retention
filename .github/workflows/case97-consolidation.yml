name: Case 97 duplicate consolidation

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/consolidate_case97_v2.py'
      - '.github/workflows/case97-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply consolidation
        run: python .github/scripts/consolidate_case97_v2.py

      - name: Validate and commit
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "chatgpt-research-agent@users.noreply.github.com"
          git rm .github/scripts/consolidate_case97_into_case52.py .github/scripts/consolidate_case97_v2.py .github/workflows/case97-consolidation.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "case52: consolidate duplicate Case 97"
          git push origin HEAD:main
