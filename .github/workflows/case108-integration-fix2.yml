name: case108-integration-fix2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case108-integration-fix2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to current main
        run: git pull --ff-only origin main

      - name: Correct validator/EOF formatting and integrate Case 108
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/case108_integrate.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('"fixed logical-block size ≠ same number"', '"same logical-block size ≠ same number"'),
              ('INDEX_PATH.write_text(index.rstrip() + findings + "\\n", encoding="utf-8")', 'INDEX_PATH.write_text(index.rstrip() + findings.rstrip() + "\\n", encoding="utf-8")'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'patch needle not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python tools/case108_integrate.py
          rm -f .github/workflows/case108-integration-fix.yml .github/workflows/case108-integration-fix2.yml

      - name: Validate and commit research tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "case108: ground HDD zone-bit geometry boundary"
          git push origin HEAD:main
