name: Case 59 program-disturb deepening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case59-program-disturb-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research slice
        run: python tools/integrate_case59_program_disturb.py

      - name: Validate canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f evidence/59-program-disturb-1997-1999-terminology-mechanism-boundary.md
          grep -Fq 'Terminology/prior-art addendum' cases/59-nand-program-interference-write-induced-neighbor-drift.md
          grep -Fq '1997–1999 adjacent prior art' evidence/59-nand-2002-2014-program-interference-grounding.md
          grep -Fq 'Case 59 pre-2002 NAND `program disturb` terminology' ROADMAP.md
          python - <<'PY'
          from pathlib import Path
          text = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          for n in range(2402, 2415):
              marker = f'**{n} —'
              assert text.count(marker) == 1, (n, text.count(marker))
          assert text.count('## Case 59 deepening — pre-2002 `program disturb` / program-inhibit findings') == 1
          PY

      - name: Commit research integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            cases/59-nand-program-interference-write-induced-neighbor-drift.md \
            evidence/59-nand-2002-2014-program-interference-grounding.md \
            evidence/59-program-disturb-1997-1999-terminology-mechanism-boundary.md \
            ROADMAP.md \
            CASE_INDEX.md
          git commit -m 'case59: deepen program-disturb terminology boundary'
          git push origin HEAD:main

      - name: Remove one-shot integration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/case59-program-disturb-deepening.yml tools/integrate_case59_program_disturb.py
          git commit -m 'chore: remove Case 59 integration scaffolding'
          git push origin HEAD:main
