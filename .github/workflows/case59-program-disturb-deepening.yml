name: Case 59 program-disturb deepening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case59-program-disturb-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research slice
        run: python tools/integrate_case59_program_disturb.py

      - name: Normalize changed research files
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('cases/59-nand-program-interference-write-induced-neighbor-drift.md'),
              Path('evidence/59-nand-2002-2014-program-interference-grounding.md'),
              Path('evidence/59-program-disturb-1997-1999-terminology-mechanism-boundary.md'),
              Path('ROADMAP.md'),
              Path('CASE_INDEX.md'),
          ]
          for path in paths:
              lines = [line.rstrip() for line in path.read_text(encoding='utf-8').splitlines()]
              while lines and lines[-1] == '':
                  lines.pop()
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          case = Path('cases/59-nand-program-interference-write-induced-neighbor-drift.md').read_text(encoding='utf-8')
          evidence = Path('evidence/59-nand-2002-2014-program-interference-grounding.md').read_text(encoding='utf-8')
          addendum = Path('evidence/59-program-disturb-1997-1999-terminology-mechanism-boundary.md')
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          index = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          assert addendum.is_file()
          assert 'Terminology/prior-art addendum' in case
          assert '1997–1999 adjacent prior art' in evidence
          assert 'Case 59 pre-2002 NAND `program disturb` terminology' in roadmap
          assert index.count('## Case 59 deepening — pre-2002 `program disturb` / program-inhibit findings') == 1
          for n in range(2402, 2415):
              marker = f'**{n} —'
              assert index.count(marker) == 1, (n, index.count(marker))
          PY

      - name: Commit research integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            cases/59-nand-program-interference-write-induced-neighbor-drift.md \
            evidence/59-nand-2002-2014-program-interference-grounding.md \
            evidence/59-program-disturb-1997-1999-terminology-mechanism-boundary.md \
            ROADMAP.md \
            CASE_INDEX.md
          git commit -m 'case59: deepen program-disturb terminology boundary'
          git push origin HEAD:main

      - name: Remove one-shot integration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/case59-program-disturb-deepening.yml tools/integrate_case59_program_disturb.py
          git commit -m 'chore: remove Case 59 integration scaffolding'
          git push origin HEAD:main
