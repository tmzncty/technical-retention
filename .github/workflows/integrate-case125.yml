name: Integrate Case 125 orphan retention

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case125.yml'
      - 'scripts/integrate_case125_orphan.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Integrate Case 125 navigation
        run: python scripts/integrate_case125_orphan.py

      - name: Normalize changed research files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['ROADMAP.md', 'CASE_INDEX.md']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              lines = [line.rstrip() for line in text.splitlines()]
              while lines and not lines[-1]:
                  lines.pop()
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate bounded integration
        run: |
          test -f cases/125-linux-ext3-ext4-orphan-crash-cleanup-reclamation.md
          test -f evidence/125-linux-ext3-ext4-2000-2023-orphan-recovery-grounding.md
          grep -q 'cases/125-linux-ext3-ext4-orphan-crash-cleanup-reclamation.md' CASE_INDEX.md
          grep -q '^## Case 125 — Linux ext3/ext4 orphan recovery findings$' CASE_INDEX.md
          grep -q '^\- \*\*2142 — related-repository boundary:' CASE_INDEX.md
          grep -q 'substantially advanced at the filesystem layer by grounded Cases 16 and 125' ROADMAP.md
          git diff --check

      - name: Commit research integration
        run: |
          git config user.name technical-retention-bot
          git config user.email technical-retention-bot@users.noreply.github.com
          git add ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'case125: integrate orphan reclamation navigation'
            git push origin HEAD:main
          fi

      - name: Remove one-shot integration files
        if: success()
        run: |
          rm .github/workflows/integrate-case125.yml scripts/integrate_case125_orphan.py
          git add .github/workflows/integrate-case125.yml scripts/integrate_case125_orphan.py
          git commit -m 'chore: remove Case 125 integration tooling'
          git push origin HEAD:main
