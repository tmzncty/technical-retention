name: case92-integration

on:
  push:
    paths:
      - '.github/workflows/case92-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 92 navigation and status
        run: python .github/scripts/case92_integrate.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f cases/92-dram-rowhammer-access-induced-retention-failure.md
          test -f evidence/92-dram-2012-2014-rowhammer-grounding.md
          grep -Fq 'cases/92-dram-rowhammer-access-induced-retention-failure.md' README.md
          grep -Fq 'cases/92-dram-rowhammer-access-induced-retention-failure.md' ROADMAP.md
          grep -Fq 'cases/92-dram-rowhammer-access-induced-retention-failure.md' CASE_INDEX.md
          grep -Fq 'After ninety-three bounded cases, **all ninety-three cases are now `grounded`.**' CASE_INDEX.md
          grep -Fq '1149. **ordinary refresh compliance ≠ disturbance immunity**' CASE_INDEX.md
          grep -Fq '1164. **interference makes retention relational**' CASE_INDEX.md
          grep -Fq 'refresh failure — **partially advanced by grounded Case 92**' ROADMAP.md
          test ! -e .github/scripts/case92_integrate.py
          test ! -e .github/workflows/case92-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case92: integrate DRAM RowHammer retention'
          git push origin HEAD:main
