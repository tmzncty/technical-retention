name: Case 15 unsafe-shutdown telemetry integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/case15_unsafe_shutdown_telemetry.py'
      - '.github/workflows/case15-unsafe-shutdown-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply bounded Case 15 telemetry deepening
        run: python tools/case15_unsafe_shutdown_telemetry.py
      - name: Normalize newly touched source line
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cases/15-intel-ssd320-power-loss-durability.md')
          text = p.read_text()
          text = text.replace('cache-control surfaces.  \n', 'cache-control surfaces.\n')
          p.write_text(text)
          PY
      - name: Validate canonical diff
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          idx = Path('CASE_INDEX.md').read_text()
          for n in range(2650, 2665):
              needle = f'**{n} —'
              assert idx.count(needle) == 1, (n, idx.count(needle))
          case = Path('cases/15-intel-ssd320-power-loss-durability.md').read_text()
          ev = Path('evidence/15-intel320-2011-unsafe-shutdown-telemetry-deepening.md').read_text()
          roadmap = Path('ROADMAP.md').read_text()
          grounding = Path('evidence/15-intel-ssd320-power-loss-durability-grounding.md').read_text()
          assert 'Unsafe-shutdown telemetry: event history is not a durability verdict' in case
          assert 'documented cumulative counter semantics != demonstrated power-fail-atomic counter update' in ev
          assert 'Case 15 Intel SSD 320 retained unsafe-shutdown telemetry deepening' in roadmap
          assert 'intel.com.br/content/dam/www/public/us/en/documents/product-specifications/ssd-320-specification.pdf' in grounding
          PY
      - name: Commit and push research slice
        run: |
          if git diff --quiet; then
            echo 'No canonical changes to commit.'
            exit 0
          fi
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/15-intel-ssd320-power-loss-durability.md evidence/15-intel-ssd320-power-loss-durability-grounding.md evidence/15-intel320-2011-unsafe-shutdown-telemetry-deepening.md ROADMAP.md CASE_INDEX.md
          git commit -m 'case15: deepen unsafe-shutdown telemetry boundary'
          git push origin HEAD:main