name: case76-tlc-crosscheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case76-tlc-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research integration
        run: python .github/integration/case76_tlc_crosscheck.py

      - name: Validate bounded research changes
        run: |
          git diff --check
          grep -Fq '### HPE 2026 CM7: a same-capacity TLC cross-check, not a media-only experiment' cases/76-jedec-ssd-endurance-retention-qualification.md
          grep -Fq '## Source 10 — HPE QLC/TLC commercial-product pair' evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md
          grep -Fq 'Named QLC/TLC commercial-product post-endurance retention comparison' ROADMAP.md
          grep -Fq '1591. **bounded HPE TLC/QLC comparison ≠ universal TLC/QLC ranking**' CASE_INDEX.md
          grep -Fq 'P61183-B21' cases/76-jedec-ssd-endurance-retention-qualification.md
          grep -Fq '14,016 TB' evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md

      - name: Commit research slice and remove integration helpers
        run: |
          rm -f .github/integration/case76_tlc_crosscheck.py
          rm -f .github/workflows/case76-tlc-crosscheck.yml
          rmdir .github/integration 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'case76: ground TLC QLC product cross-check'
          git push origin HEAD:main