name: integrate-case35

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-case35.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repaired navigation updates
        run: python3 tools/integrate_case35.py
      - name: Validate
        run: git diff --check
      - name: Commit and clean staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-case35.yml tools/integrate_case35.py
          git add README.md ROADMAP.md CASE_INDEX.md
          git commit -m "docs: integrate grounded Micron Mobile DDR TCSR bridge"
          git push origin HEAD:main
