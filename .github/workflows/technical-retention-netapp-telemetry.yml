name: Integrate Case 111 NetApp telemetry deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-retention-netapp-telemetry.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research slice
        run: python3 scripts/run_case111_netapp.py
      - name: Validate canonical changes
        run: |
          git diff --check
          test -f evidence/111-netapp-rated-life-offline-retention-telemetry-deepening.md
          grep -q 'future-retention authority can be withdrawn while physical embodiment survives' CASE_INDEX.md
          grep -q 'Case 111 NetApp rated-life / offline-retention telemetry deepening' ROADMAP.md
      - name: Remove temporary integration files
        run: rm -f scripts/run_case111_netapp.py .github/workflows/technical-retention-netapp-telemetry.yml
      - name: Commit canonical research update
        run: |
          git config user.name 'chatgpt-research-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case111: deepen rated-life offline-retention admission'
          git push origin HEAD:main
