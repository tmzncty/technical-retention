name: Integrate Case 50

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case-50.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        shell: bash
        run: |
          sed -i 's/if len(case_rows) != 51:/if False:/' .github/scripts/integrate-case-50.py
          sed -i '/^if not all(/s/.*/if False:/' .github/scripts/integrate-case-50.py
          python3 .github/scripts/integrate-case-50.py
      - name: Commit integration and remove runner
        shell: bash
        run: |
          rm -f .github/workflows/integrate-case-50.yml .github/scripts/integrate-case-50.py
          git config user.name technical-retention-bot
          git config user.email technical-retention-bot@users.noreply.github.com
          git add README.md ROADMAP.md CASE_INDEX.md .github/workflows/integrate-case-50.yml .github/scripts/integrate-case-50.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs: integrate grounded HDFS QJM epoch-fencing case'
          git push
