name: Case 131 navigation integration

on:
  push:
    paths:
      - '.github/workflows/case131-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update navigation and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/case131_nav.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md CASE_INDEX.md
          git commit -m "case131: integrate PERC controller-recovery navigation"
          git push origin HEAD:main
          rm -f .github/case131_nav.py .github/workflows/case131-integrate.yml
          git add .github/case131_nav.py .github/workflows/case131-integrate.yml
          git commit -m "chore: remove Case 131 integration helpers"
          git push origin HEAD:main
