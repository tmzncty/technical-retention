name: Case 131 navigation integration

on:
  push:
    paths:
      - '.github/workflows/case131-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update navigation and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          s = p.read_text(encoding='utf-8')
          if 'cases/130-lto-generational-compatibility-reader-obsolescence.md' not in s:
              marker = 'cases/129-zfs-feature-flags-format-compatibility.md'
              pos = s.index(marker)
              end = s.index('\n', pos)
              row = ('| [LTO Generational Compatibility: Retained Reader Dependency and Media Obsolescence]'
                     '(cases/130-lto-generational-compatibility-reader-obsolescence.md) | **grounded** | '
                     'surviving magnetic cartridge + bounded drive/media read-write compatibility relation + retained reader population | '
                     'separate media survival from reader availability; read compatibility from write compatibility; vendor interchangeability from time-unbounded generational compatibility; and migration obligation from physical erasure | '
                     '[LTO compatibility grounding](evidence/130-lto-generational-compatibility-grounding.md); broader tape genealogy, reader maintenance/failure, host-interface obsolescence, and controlled migration remain open |')
              s = s[:end+1] + row + '\n' + s[end+1:]
              p.write_text(s, encoding='utf-8')
          PY
          python3 .github/case131_nav.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md CASE_INDEX.md
          git commit -m "case131: integrate PERC controller-recovery navigation"
          git push origin HEAD:main
          rm -f .github/case131_nav.py .github/workflows/case131-integrate.yml
          git add .github/case131_nav.py .github/workflows/case131-integrate.yml
          git commit -m "chore: remove Case 131 integration helpers"
          git push origin HEAD:main
