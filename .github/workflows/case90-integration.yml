name: case90-integration

on:
  push:
    paths:
      - '.github/workflows/case90-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 90 navigation and status
        run: python .github/scripts/case90_integrate.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f cases/90-apache-kafka-leader-epoch-safe-truncation.md
          test -f evidence/90-kafka-2016-2017-leader-epoch-truncation-grounding.md
          grep -Fq 'cases/90-apache-kafka-leader-epoch-safe-truncation.md' README.md
          grep -Fq 'cases/90-apache-kafka-leader-epoch-safe-truncation.md' ROADMAP.md
          grep -Fq 'cases/90-apache-kafka-leader-epoch-safe-truncation.md' CASE_INDEX.md
          grep -Fq 'After ninety-one bounded cases, **all ninety-one cases are now `grounded`.**' CASE_INDEX.md
          grep -Fq '1117. **high watermark ≠ complete recovery lineage**' CASE_INDEX.md
          grep -Fq '1132. **correct forgetting can preserve historical continuity**' CASE_INDEX.md
          test ! -e .github/scripts/case90_integrate.py
          test ! -e .github/workflows/case90-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case90: integrate Kafka leader-epoch recovery'
          git push origin HEAD:main
