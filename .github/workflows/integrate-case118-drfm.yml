name: Integrate Case 118 DRFM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case118-drfm.yml'
      - 'scripts/integrate_case118_drfm.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 118 DRFM research
        run: python scripts/integrate_case118_drfm.py
      - name: Validate diff
        run: git diff --check
      - name: Commit research integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add ROADMAP.md CASE_INDEX.md cases/54-ddr5-rfm-split-maintenance-authority.md
          git commit -m "case118: integrate DDR5 DRFM navigation and findings"
          git push
