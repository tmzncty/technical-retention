name: Case 115 normalize

on:
  push:
    paths:
      - 'tools/normalize_case115.py'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize generated research files
        run: python tools/normalize_case115.py
      - name: Validate
        run: |
          git diff --check
          test "$(head -n 1 cases/115-apache-hdfs-snapshot-shared-block-replication.md)" = '# Apache HDFS Snapshots: Shared Blocks, Historical Namespace Reachability, and Retained Replication Obligation'
          test "$(head -n 1 evidence/115-hadoop-2012-2014-snapshot-shared-block-grounding.md)" = '# Evidence 115 — HDFS Snapshot Shared Blocks and Replication Obligation, 2012–2014'
      - name: Commit normalization and cleanup
        run: |
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cases/115-apache-hdfs-snapshot-shared-block-replication.md evidence/115-hadoop-2012-2014-snapshot-shared-block-grounding.md
          git commit -m 'case115: normalize generated markdown headers'
          rm -f tools/normalize_case115.py .github/workflows/case115-normalize.yml
          git add -A
          git commit -m 'chore: remove Case 115 normalization helper'
          git push origin HEAD:main
