name: integrate bounded Case 27 deep-scrub deepening

on:
  push:
    paths:
      - '.github/workflows/case27-deep-scrub-final.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deepen Case 27 and navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique marker: {label} count={text.count(old)}')
              return text.replace(old, new, 1)

          # Canonical Case 27: add Ceph's own 2012 deep-scrub floor instead of
          # creating a duplicate new case.
          p = Path('cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md')
          t = p.read_text()
          if '9013efd3a3cf92d1ec8e2a39639214792067d0d2' not in t:
              rq = '- **Research question:** when an erasure-coded object is mutable, what additional retained integrity state is required to decide whether a surviving fragment is trustworthy, and what happens when that integrity state itself is wrong?\n'
              t = must_replace(t, rq, rq + '- **Historical prior-art boundary:** Ceph\'s own replicated-PG `deep scrub` implementation is anchored separately to September–October 2012. That earlier mechanism prevents a false Luminous-origin claim; it is not treated as if 2012 replicated scrub already had 2017 BlueStore/EC semantics.\n', 'case scope')

              h = '### H/P — Luminous ties EC overwrites to BlueStore integrity support\n'
              section = '''### H/P — Ceph `deep scrub` predates Luminous and began as replicated-PG comparison\n\nCeph commit [`9013efd3a3cf92d1ec8e2a39639214792067d0d2`](https://github.com/ceph/ceph/commit/9013efd3a3cf92d1ec8e2a39639214792067d0d2), dated 5 September 2012, introduced the bounded deep-scrub witness used here. Its commit message says deep scrub reads every file's contents from the store, computes a `crc32` digest, and has the primary compare digests across replicas; a mismatch marks the PG `inconsistent`. The patch also adds `last_deep_scrub` / `last_deep_scrub_stamp` and a default `osd_deep_scrub_interval` of one week.\n\nThe same source preserves an important compatibility boundary. OSDs without deep-scrub support perform ordinary chunky scrub, while the subset that supports deep scrub has its content digests compared. During such a mixed-capability rollout, requesting deep scrub therefore did **not** itself prove equivalent content-level verification of every replica.\n\nA companion documentation commit, [`3fd5914cf35829c3f2e9e5c0a548fae0862732aa`](https://github.com/ceph/ceph/commit/3fd5914cf35829c3f2e9e5c0a548fae0862732aa), explicitly distinguishes three September-2012 operations: `scrub` compares replica object metadata, `deep-scrub` additionally compares object contents, and `repair` fixes an inconsistent replicated PG by replacing inconsistent objects with the primary's copy. Ceph's official `v0.53` release notice of 16 October 2012 likewise announces the new deep scrub as comparing object content across replicas, once per week by default.\n\nThis changes the historical boundary without changing the bounded Luminous question: **Luminous did not introduce Ceph's concept of deep scrub.** The 2017–2018 contribution studied below is the later composition of mutable EC overwrites, BlueStore-retained checksums, scheduled deep scrub, and a release incident in which integrity metadata itself lost authority.\n\nThe 2012 `repair` wording is retained as historical policy, not promoted into a claim that the primary is objectively correct. Case 29's 2018 source-level analysis later shows a more qualified `authoritative` candidate path and explicitly preserves uncertainty about correctness.\n\n**Primary anchors:** Ceph commits `9013efd3...` and `3fd5914c...`; Ceph `v0.53 released`, 16 October 2012.\n\n'''
              t = must_replace(t, h, section + h, 'case historical section')

              old_pa = 'Case 26 already documents a 2003 GFS functional precedent for proactive background integrity verification under the phrase `scan and verify`; Case 18 records a 2004 direct `disk scrubbing` terminology anchor. Reed–Solomon and distributed EC prior art are already controlled in Cases 19 and 24.\n'
              new_pa = 'Case 26 already documents a 2003 GFS functional precedent for proactive background integrity verification under the phrase `scan and verify`; Case 18 records a 2004 direct `disk scrubbing` terminology anchor. Within Ceph itself, the September–October 2012 source/release record now establishes replicated `deep scrub` years before Luminous. Reed–Solomon and distributed EC prior art remain controlled in Cases 19 and 24.\n\nThe resulting historical ladder is deliberately non-genealogical: **GFS 2003 distributed verification ≠ 2004 disk-scrubbing prior art ≠ Ceph 2012 replicated deep scrub ≠ Luminous 2017–2018 BlueStore/EC integrity authority.** Chronology and functional resemblance alone do not prove direct inheritance.\n'
              t = must_replace(t, old_pa, new_pa, 'case prior art')

              claim_heading = '\n---\n\n## Claim ledger\n'
              limit = '''\nThe 2012 compatibility path adds another limit: **`deep-scrub requested ≠ every replica content-qualified`** when some OSDs do not support deep scrub. This is a rolling-capability boundary for that implementation, not a claim about modern homogeneous clusters. Likewise, matching `crc32` values are error-detection evidence inside the comparison protocol, not cryptographic authentication or proof that every physical failure mode has been excluded.\n'''
              t = must_replace(t, claim_heading, limit + claim_heading, 'case limits')

              src = 'Ceph Project, **`v12.2.0 Luminous Released`**, 29 August 2017.\n'
              addsrc = '''Ceph Project primary source history, **deep scrub introduction**, 5 September–16 October 2012.\n\n- implementation commit: <https://github.com/ceph/ceph/commit/9013efd3a3cf92d1ec8e2a39639214792067d0d2>\n- command/documentation commit: <https://github.com/ceph/ceph/commit/3fd5914cf35829c3f2e9e5c0a548fae0862732aa>\n- `v0.53 released`: <https://www.ceph.io/en/news/blog/2012/v0-53-released/>\n\n'''
              t = must_replace(t, src, addsrc + src, 'case sources')
          p.write_text(t)

          # Grounding record: preserve filename for stable links, widen evidence window.
          p = Path('evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md')
          t = p.read_text()
          if '### P0 — Ceph 2012 deep-scrub implementation' not in t:
              old_title = '# Case 27 Grounding Record — Ceph Luminous EC Overwrites, BlueStore Checksums, and Deep Scrub (2017–2018)'
              t = must_replace(t, old_title, '# Case 27 Grounding Record — Ceph Deep-Scrub Prior Art and Luminous EC Integrity Authority (2012–2018)', 'evidence title')

              cls = '## Evidence classes\n\n### P1 — official Luminous release record\n'
              p0 = '''## Evidence classes\n\n### P0 — Ceph 2012 deep-scrub implementation, command semantics, and release record\n\nThree project-primary records establish the pre-Luminous floor:\n\n- `9013efd3a3cf92d1ec8e2a39639214792067d0d2` (5 September 2012): content reads, per-object `crc32`, primary-side replica digest comparison, `inconsistent` marking, `last_deep_scrub` state, weekly default interval, and mixed-capability fallback;\n- `3fd5914cf35829c3f2e9e5c0a548fae0862732aa` (5 September 2012): explicit separation of `scrub`, `deep-scrub`, and `repair`;\n- official `v0.53 released` (16 October 2012): new deep scrub compares object content across replicas, weekly by default.\n\nThis is an internal Ceph prior-art floor for the mechanism/term. It does not back-project BlueStore, mutable EC overwrites, or Luminous digest semantics into 2012.\n\n### P1 — official Luminous release record\n'''
              t = must_replace(t, cls, p0, 'evidence P0')

              led = '## Direct source ledger\n\n### 1. `v12.2.0` release notice — BlueStore + EC overwrite boundary\n'
              led0 = '''## Direct source ledger\n\n### 0. September–October 2012 — replicated deep scrub before Luminous\n\nDirectly established:\n\n- ordinary `scrub` compares replica object metadata; `deep-scrub` adds content comparison;\n- the initial deep path reads object/file content and computes `crc32`;\n- the primary compares replica digests and marks a PG `inconsistent` on mismatch;\n- `repair` is a separate operation and, in this bounded replicated path, copies from the primary;\n- `last_deep_scrub` / `last_deep_scrub_stamp` retain verification recency separately from payload;\n- `osd_deep_scrub_interval` defaults to one week in the introduced configuration;\n- unsupported OSDs can fall back to ordinary chunky scrub while supporting members' content digests are compared.\n\nEvidence use: this prevents a false Luminous-origin claim; separates replica multiplicity from verified agreement and detection from repair; and establishes a mixed-capability boundary where requested maintenance level and achieved verification coverage can differ.\n\n### 1. `v12.2.0` release notice — BlueStore + EC overwrite boundary\n'''
              t = must_replace(t, led, led0, 'evidence ledger')

              inspect = 'The tag-matched Ceph source documentation was read directly from GitHub at `v12.2.0`. These are text/source files, so no PDF facsimile or screenshot claim is involved.\n'
              t = must_replace(t, inspect, 'The September 2012 implementation/documentation commits were inspected at their exact Git SHAs, including commit messages and patches. The tag-matched Luminous source documentation was read directly from GitHub at `v12.2.0`. These are text/source files, so no PDF facsimile or screenshot claim is involved.\n', 'evidence inspection')

              pa = '- Case 18 records 2004 `disk scrubbing` terminology/prior art;\n'
              t = must_replace(t, pa, pa + '- Ceph\'s own 2012 source/release record establishes replicated `deep scrub` before the 2017–2018 Luminous regime, so Luminous is not treated as the origin of Ceph scrub semantics;\n', 'evidence prior art')
          p.write_text(t)

          # README navigation.
          p = Path('README.md')
          t = p.read_text()
          old = '- [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) — grounded coded-integrity bridge: Luminous ties mutable erasure-coded overwrites to BlueStore checksumming and deep scrub, while the 12.2.6–12.2.8 digest regression shows that integrity metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before ordinary trust is restored.'
          new = '- [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) — grounded coded-integrity bridge with a 2012 Ceph-internal prior-art floor: replicated `scrub`/`deep-scrub` separates metadata comparison, content-digest comparison, inconsistency detection, and repair; Luminous later ties mutable erasure-coded overwrites to BlueStore checksumming, while the 12.2.6–12.2.8 digest regression shows that integrity metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before ordinary trust is restored.'
          if old in t:
              t = must_replace(t, old, new, 'README Case27')
          elif 'coded-integrity bridge with a 2012 Ceph-internal prior-art floor' not in t:
              raise SystemExit('README Case27 neither old nor updated')
          p.write_text(t)

          # ROADMAP: record the completed bounded deepening next to recent slices.
          p = Path('ROADMAP.md')
          t = p.read_text()
          bullet = '- [x] Ceph `deep scrub` historical prior-art deepening — canonical [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md), with stable [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md), now adds exact September 2012 implementation/documentation commits plus the October 2012 `v0.53` release record. The earlier replicated-PG path separates metadata scrub, content CRC32 comparison, inconsistency marking, repair, retained last-deep-scrub time, and mixed-capability fallback. This prevents a false Luminous-origin claim while keeping 2012 replica comparison distinct from 2017 BlueStore checksum authority and 2018 EC authoritative-shard reconstruction. GFS 2003 and disk-scrubbing 2004 remain external prior-art floors, not asserted direct genealogy.\n'
          if bullet not in t:
              marker = '- [x] ZFS snapshot reference-pinning / deferred reclamation boundary — [`cases/99-zfs-snapshot-reference-pinned-retention.md`](cases/99-zfs-snapshot-reference-pinned-retention.md), grounded by [`evidence/99-zfs-1994-2010-snapshot-reference-grounding.md`](evidence/99-zfs-1994-2010-snapshot-reference-grounding.md): a 2010 Solaris ZFS snapshot keeps an older point-in-time tree admissible by retaining references to old blocks, separating live-dataset supersession from reclamation eligibility; `hold`, clone dependencies, and `defer_destroy` further separate destroy intent from permission/completion. WAFL 1994 is retained only as an earlier COW-snapshot prior-art floor, not as proven direct genealogy. Broader filesystem snapshot/COW lineage, ZFS send/receive retention policy, clone genealogy, field space-exhaustion behavior, and secure media erasure remain open.\n'
              t = must_replace(t, marker, marker + bullet, 'ROADMAP recent slice')

          old_next = 'Prefer a new bounded bridge that adds a genuinely different retention relation: a **mutable coded-object currentness** case, a **local-reconstruction-code repair-geometry** case, **distributed scrub/anti-entropy**, or a revision-specific **later NVMe persistence-domain** case if primary normative text changes the failure/persistence comparison.'
          new_next = 'Prefer a new bounded bridge that adds a genuinely different retention relation. Mutable coded-object currentness and LRC repair geometry are already grounded in Cases 25 and 24, while distributed verification is represented by GFS Case 26 and Ceph Case 27 with a 2012 deep-scrub origin anchor. A future distributed-scrub/anti-entropy slice should therefore add a genuinely different failure/authority relation or cross-system synthesis rather than another generic scrub description; later NVMe persistence work is useful only where primary normative text changes the comparison.'
          if old_next in t:
              t = must_replace(t, old_next, new_next, 'ROADMAP next unit')
          p.write_text(t)

          # CASE_INDEX canonical row + findings.
          p = Path('CASE_INDEX.md')
          t = p.read_text()
          old_row = '| [Ceph Luminous EC Overwrites: BlueStore Checksums, Deep Scrub, and Integrity-Metadata Authority](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) | **grounded** | mutable erasure-coded chunks + CRUSH placement + BlueStore data/metadata checksums + scheduled light/deep scrub + release-scoped digest trust state | separate algebraic EC recoverability from local integrity qualification; show checksum metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before trust is restored | [2017–2018 Ceph Luminous EC scrub grounding](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md); exact `v12.2.8` scrub-repair source selection is now handled separately in Case 29, while later BlueStore checksum evolution and modern auto-repair remain separate work |'
          new_row = '| [Ceph Luminous EC Overwrites: BlueStore Checksums, Deep Scrub, and Integrity-Metadata Authority](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) | **grounded** | 2012 replicated metadata/content scrub + later mutable erasure-coded chunks + CRUSH placement + BlueStore data/metadata checksums + scheduled light/deep scrub + release-scoped digest trust state | separate replica multiplicity from verified agreement and scrub from repair; prevent a Luminous-origin myth; then separate algebraic EC recoverability from local integrity qualification and show checksum metadata itself can become inconsistent and require requalification | [2012–2018 Ceph deep-scrub/Luminous grounding](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md); exact `v12.2.8` scrub-repair source selection remains Case 29, while broader scrub genealogy and modern auto-repair remain separate work |'
          if old_row in t:
              t = must_replace(t, old_row, new_row, 'CASE_INDEX row')
          elif '[2012–2018 Ceph deep-scrub/Luminous grounding]' not in t:
              raise SystemExit('CASE_INDEX Case27 row neither old nor updated')

          if '1319. **Ceph deep scrub predates' not in t:
              tail = '1318. **retention cost can be deferred into future divergence and reclamation work** — nearly instantaneous snapshot creation can create long-lived space/accounting obligations that become visible only as the live tree changes.\n'
              add = tail + '''\n\n### Case 27 historical deepening — Ceph 2012 deep-scrub prior-art findings\n\n1319. **Ceph deep scrub predates the Luminous EC regime by five years** — exact September 2012 source plus the October `v0.53` release record establish replicated content comparison before BlueStore and mutable-EC overwrite support.\n1320. **ordinary scrub ≠ deep scrub** — 2012 project documentation separates replica metadata comparison from the deeper operation that also compares object contents.\n1321. **replica multiplicity ≠ verified replica agreement** — several surviving copies can exist while scheduled comparison is still required to establish whether their metadata/content relations agree.\n1322. **inconsistency detection ≠ fault localization** — a digest or metadata disagreement establishes a broken relation among copies; it does not by itself prove which embodiment is objectively correct.\n1323. **2012 primary-based repair authority ≠ proof that the primary is correct** — the period documentation says repair replaces inconsistent replicated objects from the primary, while Case 29's later source preserves explicit uncertainty even in an `authoritative` candidate path.\n1324. **requested deep scrub ≠ complete content-level verification during mixed-capability rollout** — the 2012 compatibility path lets unsupported OSDs fall back to ordinary chunky scrub while only supporting members contribute comparable deep digests.\n1325. **verification recency is retained operational state** — `last_deep_scrub` and `last_deep_scrub_stamp` record that payload persistence and knowledge of when it was last deeply checked are distinct retained relations.\n1326. **configured verification interval ≠ completed verification coverage** — a weekly default expresses scheduling policy; it does not itself prove that every PG/object has finished a deep scrub within that window.\n1327. **CRC agreement ≠ cryptographic authenticity or exhaustive media proof** — the 2012 `crc32` digest is bounded error-detection evidence inside the comparison protocol, not a universal proof about provenance or all physical failure modes.\n1328. **2012 replica digest comparison ≠ 2017 BlueStore checksum authority** — the later Luminous case adds retained storage-backend checksums, mutable EC overwrites, and a checksum-maintenance failure that can make the verifier itself untrustworthy.\n1329. **shared product lineage ≠ unchanged maintenance semantics** — Ceph/RADOS 2006–2007 currentness (Case 05), 2012 replicated deep scrub, 2017 integrity qualification (Case 27), and 2018 EC repair-source selection (Case 29) remain release-bounded.\n1330. **prior-art chronology ≠ direct genealogy** — GFS 2003 `scan and verify`, 2004 disk-scrubbing research, and Ceph 2012 deep scrub provide earlier functional/terminological floors; chronology alone does not prove direct descent.\n'''
              t = must_replace(t, tail, add, 'CASE_INDEX findings tail')
          p.write_text(t)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -q '9013efd3a3cf92d1ec8e2a39639214792067d0d2' cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md
          grep -q '### P0 — Ceph 2012 deep-scrub implementation' evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md
          grep -q '^1330\. \*\*prior-art chronology' CASE_INDEX.md
          rm -f \
            .github/workflows/case27-deep-scrub-prior-art.yml \
            .github/workflows/fix-case27-deep-scrub-workflow.yml \
            .github/workflows/fix-case27-deep-scrub-workflow-v2.yml \
            .github/workflows/case27-deep-scrub-final.yml
          git add README.md ROADMAP.md CASE_INDEX.md \
            cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md \
            evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md \
            .github/workflows
          git diff --cached --check
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git commit -m 'case27: deepen Ceph deep-scrub prior art'
          git push origin HEAD:main
