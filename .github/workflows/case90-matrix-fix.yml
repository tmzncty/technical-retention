name: case90-matrix-fix

on:
  push:
    paths:
      - '.github/workflows/case90-matrix-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Case 90 comparison row placement
        run: python .github/scripts/case90_matrix_fix.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('CASE_INDEX.md').read_text()
          row='| Apache Kafka 0.11 / KIP-101 leader-epoch recovery |'
          assert t.count(row)==1
          assert t.index(row) < t.index('\n---\n\n## Cross-case findings already supported')
          PY
          test ! -e .github/scripts/case90_matrix_fix.py
          test ! -e .github/workflows/case90-matrix-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case90: keep comparison row inside matrix'
          git push origin HEAD:main
