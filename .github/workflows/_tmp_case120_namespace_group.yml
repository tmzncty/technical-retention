          findings = """## Case 120 deepening — NVMe 1.4 namespace / NVM Set / Endurance Group lifecycle findings

Evidence: [`evidence/120-nvme14-2019-namespace-group-association-deepening.md`](evidence/120-nvme14-2019-namespace-group-association-deepening.md)

- **2800 — Revision-1.4 feature attribution != invention priority:** NVM Express's official change record attributes NVM Sets to TP4018b and Endurance Groups to TP4018b/TP4050, but without inspecting the proposal bodies this does not establish proposal-internal chronology, authorship, or invention priority. (`H/P`, `X`)
- **2801 — namespace creation host-selects `NVMSETID`, not `ENDGID`:** Revision 1.4 §4.9 and Namespace Management Figure 262 make the target NVM Set a host-specified create field while `ENDGID` is absent from that host-specified field list. (`H/P`)
- **2802 — selected NVM Set -> exactly one Endurance Group association:** §4.9 states each NVM Set is associated with exactly one Endurance Group, so namespace creation enters the endurance-management relation through the selected NVM Set. (`H/P`, `E`)
