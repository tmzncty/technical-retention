          s = s.replace(hist_marker, hist_insert + "\n\n" + hist_marker, 1)

          old_open = "Exact behavior under group deletion/recreation, controller replacement, namespace migration, subsystem reconfiguration, or identifier reuse remains open."
          new_open = "Revision 1.4 now closes one narrower point: ordinary Namespace Management create/delete does not itself define Endurance Group provisioning or history reset. Exact behavior under Endurance Group creation/deletion/recreation, controller replacement, NVM Set reprovisioning, subsystem reconfiguration, identifier reuse, or namespace migration between management domains remains open."
          assert old_open in s
          s = s.replace(old_open, new_open, 1)

          eng_marker = "### Host workload and media work are different historical quantities"
          eng_insert = """### Namespace lifecycle is not Endurance Group lifecycle

Namespace Management makes the scope difference operationally visible: create selects an NVM Set, not a new Endurance Group, and delete retires the namespace without defining group destruction. The case can therefore distinguish:

> **namespace creation != Endurance Group creation**

> **namespace deletion != Endurance Group deletion**

> **host-selected `NVMSETID` != direct `ENDGID` provisioning in Namespace Management**

> **`ENDGIDMAX` != group-lifetime generation counter**

These are interface/lifetime boundaries, not claims that an Endurance Group necessarily survives every administrative operation. In particular, deleting all namespaces does not by itself prove either survival or destruction of every Endurance Group; the group-provisioning layer remains ungrounded here."""
          assert eng_marker in s
          s = s.replace(eng_marker, eng_insert + "\n\n" + eng_marker, 1)
          case_path.write_text(s, encoding='utf-8')

          roadmap_path = Path('ROADMAP.md')
