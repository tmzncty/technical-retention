name: Apply Case 78 BBT currentness deepening

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_case78_bbt_currentness_deepening.py'
      - '.github/workflows/apply-case78-bbt-currentness-deepening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Case 78 research slice
        run: |
          set -euo pipefail
          python3 scripts/apply_case78_bbt_currentness_deepening.py

      - name: Validate canonical research changes
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/78-linux-mtd-2004-2021-bbt-currentness-admissibility-deepening.md
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          case = Path('cases/78-micron-nand-bad-block-marker-management.md').read_text(encoding='utf-8')
          ev = Path('evidence/78-linux-mtd-2004-2021-bbt-currentness-admissibility-deepening.md').read_text(encoding='utf-8')
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          idx = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          assert case.count('### H/P — BBT currentness depends on ordering and candidate admissibility, not version magnitude alone') == 1
          assert case.count('../evidence/78-linux-mtd-2004-2021-bbt-currentness-admissibility-deepening.md') == 1
          assert ev.count('## Historical record') == 1
          assert ev.count('## Engineering reconstruction') == 1
          assert ev.count('## Functional comparisons — not genealogy') == 1
          assert ev.count('## Philosophical interpretation — bounded') == 1
          assert '((int8_t)(td->version[i] - md->version[i])) > 0' in ev
          assert 'higher BBT version != valid BBT payload' in ev
          assert roadmap.count('Case 78 Linux MTD BBT version-order / candidate-admissibility deepening') == 1
          assert idx.count('## Case 78 deepening — BBT currentness arithmetic and candidate-admissibility findings') == 1
          for n in range(2740, 2755):
              marker = f'**{n} —'
              assert idx.count(marker) == 1, (n, idx.count(marker))
          allowed = {
              'ROADMAP.md',
              'CASE_INDEX.md',
              'cases/78-micron-nand-bad-block-marker-management.md',
              'evidence/78-linux-mtd-2004-2021-bbt-currentness-admissibility-deepening.md',
          }
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = {line[3:] for line in status if len(line) >= 4}
          assert changed == allowed, (changed, allowed)
          PY
          git diff --check

      - name: Commit research and remove one-shot integration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/apply_case78_bbt_currentness_deepening.py
          git rm -f .github/workflows/apply-case78-bbt-currentness-deepening.yml
          git add ROADMAP.md CASE_INDEX.md cases/78-micron-nand-bad-block-marker-management.md evidence/78-linux-mtd-2004-2021-bbt-currentness-admissibility-deepening.md
          git diff --cached --check
          git commit -m "case78: deepen BBT currentness authority boundary"
          git push origin HEAD:main
