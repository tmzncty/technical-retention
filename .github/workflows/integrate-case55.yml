name: integrate-case55

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/integrate_case55.py'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'tmzncty/technical-retention'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 55
        run: python .github/scripts/integrate_case55.py
      - name: Commit integrated files and remove one-shot runner
        run: |
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-nvme10-13-smart-health-endurance-grounding.md
          git rm .github/scripts/integrate_case55.py .github/workflows/integrate-case55.yml
          git diff --cached --check
          git commit -m "docs: integrate grounded NVMe health-telemetry case"
          git push
