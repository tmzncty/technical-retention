name: Integrate Case 124 FTL mapping recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case124-ftl-mapping-recovery.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
      - name: Integrate bounded Case 124 navigation
        run: python3 scripts/integrate_case124_ftl_mapping_recovery.py
      - name: Validate and commit
        run: |
          test -f cases/124-ftl-power-loss-mapping-recovery.md
          test -f evidence/124-ftl-1995-2014-mapping-recovery-grounding.md
          grep -q 'cases/124-ftl-power-loss-mapping-recovery.md' CASE_INDEX.md
          grep -q '## Case 124 — FTL power-loss mapping-recovery findings' CASE_INDEX.md
          grep -q '2046 — related-repository boundary' CASE_INDEX.md
          grep -q 'Recovering from loss of mapping/allocation metadata' ROADMAP.md
          grep -q 'loss of index or mapping metadata' ROADMAP.md
          test ! -e scripts/integrate_case124_ftl_mapping_recovery.py
          test ! -e .github/workflows/integrate-case124-ftl-mapping-recovery.yml
          git diff --check
          git add -A
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m 'case124: integrate FTL mapping-recovery navigation'
          git push origin HEAD:main
