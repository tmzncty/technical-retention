name: Integrate Case 28 navigation

on:
  push:
    paths:
      - .github/workflows/integrate-case28.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 28 into navigation and ledgers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # README
          p = Path('README.md')
          s = read(p)
          case28 = "- [`cases/28-openstack-swift-tombstone-consistency-window.md`](cases/28-openstack-swift-tombstone-consistency-window.md) — grounded distributed-deletion bridge: Swift retains a timestamped `.ts` tombstone as the newest negative object state so deletion can propagate across divergent replicas; payload retirement, deletion convergence, and later tombstone reclamation remain separate retention events.\n"
          if 'cases/28-openstack-swift-tombstone-consistency-window.md' not in s:
              anchor = "- [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) — grounded coded-integrity bridge: Luminous ties mutable erasure-coded overwrites to BlueStore checksumming and deep scrub, while the 12.2.6–12.2.8 digest regression shows that integrity metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before ordinary trust is restored.\n"
              assert anchor in s, 'README Case 27 anchor missing'
              s = s.replace(anchor, anchor + case28, 1)
          evidence28 = "- [`evidence/28-openstack-swift-2016-tombstone-consistency-grounding.md`](evidence/28-openstack-swift-2016-tombstone-consistency-grounding.md) — Case-28 grounding record: Swift 2.10.1 release metadata, replication documentation, on-disk implementation, configuration, and unit tests separate timestamped negative currentness, asynchronous delete propagation, the consistency window, and age-gated tombstone reclamation without equating DELETE with secure erasure.\n"
          if 'evidence/28-openstack-swift-2016-tombstone-consistency-grounding.md' not in s:
              anchor = "- [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md) — Case-27 grounding record: tag-matched Luminous source documentation and official 2018 correction records separate EC algebra, BlueStore checksum state, scrub coverage, checksum-metadata authority, diagnostic mismatch, and restored integrity confidence without inventing an exact per-shard repair algorithm.\n"
              assert anchor in s, 'README evidence 27 anchor missing'
              s = s.replace(anchor, anchor + evidence28, 1)
          write(p, s)

          # ROADMAP
          p = Path('ROADMAP.md')
          s = read(p)
          lines = s.splitlines(True)
          out = []
          changed = False
          for line in lines:
              if line.startswith('- [ ] distributed replication and erasure coding beyond RADOS'):
                  if 'cases/28-openstack-swift-tombstone-consistency-window.md' not in line:
                      line = line.replace('Cases 19, 23, 24, 25, 26, and 27', 'Cases 19, 23, 24, 25, 26, 27, and 28')
                      insert = " [`cases/28-openstack-swift-tombstone-consistency-window.md`](cases/28-openstack-swift-tombstone-consistency-window.md), grounded by [`evidence/28-openstack-swift-2016-tombstone-consistency-grounding.md`](evidence/28-openstack-swift-2016-tombstone-consistency-grounding.md), adds distributed delete retention: a timestamped `.ts` tombstone becomes the newest negative state, remains synchronizable while stale positive replicas may still exist, and is reclaimed only after the configured `reclaim_age`/consistency-window relation rather than at client-visible DELETE time."
                      marker = ' The broad item stays unchecked because'
                      assert marker in line, 'ROADMAP broad-item marker missing'
                      line = line.replace(marker, insert + marker, 1)
                      line = line.replace('other mutable-EC consistency protocols, delete/tombstone semantics, exact coded-shard', 'other mutable-EC consistency protocols, exact coded-shard')
                      line = line.replace('later Swift durability-marker/on-disk evolution,', 'later Swift durability-marker/on-disk evolution, later Swift tombstone/versioning/account-container-expiration semantics,')
                      changed = True
              out.append(line)
          assert changed or 'cases/28-openstack-swift-tombstone-consistency-window.md' in s, 'ROADMAP distributed item not updated'
          write(p, ''.join(out))

          # CASE_INDEX
          p = Path('CASE_INDEX.md')
          s = read(p)
          case_row = "| [OpenStack Swift Tombstones: Deletion as Retained Negative State and Consistency-Window Reclamation](cases/28-openstack-swift-tombstone-consistency-window.md) | **grounded** | timestamped negative object state + replica divergence + asynchronous propagation + age-gated tombstone reclamation | show deletion can require retained control state; separate local absence, distributed negative currentness, payload retirement, and tombstone retirement | [2016 Swift tombstone grounding](evidence/28-openstack-swift-2016-tombstone-consistency-grounding.md); later Swift reclaim/versioning semantics, account/container deletion, expiration, and secure erasure remain separate work |\n"
          if 'OpenStack Swift Tombstones: Deletion as Retained Negative State' not in s:
              anchor_start = '| [Ceph Luminous EC Overwrites: BlueStore Checksums, Deep Scrub, and Integrity-Metadata Authority](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md)'
              pos = s.find(anchor_start)
              assert pos >= 0, 'CASE_INDEX Case 27 row missing'
              end = s.find('\n', pos) + 1
              s = s[:end] + case_row + s[end:]

          matrix_row = "| OpenStack Swift tombstones / 2016 bounded regime | object identity + timestamped `.ts` negative state + older positive embodiments + ring/sync/reclaim policy | tombstone creation; asynchronous replication/reconstruction; handoff/sync; age-gated reclamation | lookup/currentness selection treats a newer tombstone as deletion and suppresses older data; the negative state itself can later be reclaimed | object name → policy/ring → candidate nodes → timestamped local state kind → newest admissible state | stale positive embodiments may survive temporarily while the logical object is deleted; the tombstone itself later disappears after reclamation | no payload history by default; current deletion/version state is retained long enough to converge and suppress stale replicas |\n"
          if 'OpenStack Swift tombstones / 2016 bounded regime' not in s:
              anchor_start = '| Ceph Luminous / 2017–2018 bounded EC-integrity regime |'
              pos = s.find(anchor_start)
              assert pos >= 0, 'CASE_INDEX Case 27 matrix row missing'
              end = s.find('\n', pos) + 1
              s = s[:end] + matrix_row + s[end:]

          s = s.replace('After twenty-eight bounded cases, **all twenty-seven cases are now `grounded`.**', 'After twenty-nine bounded cases, **all twenty-nine cases are now `grounded`.**', 1)
          s = s.replace('twenty-eight grounded regimes now support the current relational criterion', 'twenty-nine grounded regimes now support the current relational criterion', 1)
          # Bring the latest two distributed regimes into the category-coherence list without rewriting its older controls.
          target = 'Swift mutable-EC currentness, and GFS distributed-integrity-verification bridges;'
          if target in s:
              s = s.replace(target, 'Swift mutable-EC currentness, GFS distributed-integrity-verification, Ceph EC checksum-authority/deep-scrub, and Swift distributed-delete/tombstone-consistency bridges;', 1)

          findings = """253. **deletion ≠ immediate absence of retained state** — Swift 2.10.1 materializes DELETE as a timestamped `.ts` tombstone so the deletion itself can remain the newest synchronizable object state while older positive embodiments may still exist elsewhere.\n254. **local absence ≠ distributed proof of absence** — a replica can be isolated while DELETE occurs; removing local payload does not by itself communicate versioned negative currentness to that stale copy, while the tombstone can be propagated and ordered against it.\n255. **payload retirement ≠ tombstone retirement** — older `.data`, `.meta`, `.durable`, or fragment state can cease to be admissible before the tombstone is itself old enough for reclamation; positive-state forgetting and delete-marker forgetting are distinct events.\n256. **negative state can be constitutive retention state** — the tombstone is not application payload, yet its timestamp/kind relation decides that older payload must not answer as current. Technical retention can therefore preserve non-admissibility rather than positive content.\n257. **reclamation age ≠ physical retention lifetime** — Swift's `reclaim_age` is a configurable protocol/maintenance interval tied by the release documentation to the consistency window and replica convergence, not a medium-decay constant or a secure-erasure deadline.\n258. **forgetting can require temporary remembrance** — in this bounded regime, making an object remain forgotten across asynchronous replicas requires retaining the fact of deletion for a while. This is an engineering reconstruction from the tombstone mechanism, not a universal philosophical identity between memory and forgetting.\n259. **tombstone precedence extends across replicated and EC on-disk state** — release-matched unit tests make a newer or equal-timestamp tombstone defeat older positive `.data`/`.meta` state and, in EC cases, prior `.durable`/fragment state. Negative currentness is versioned control logic rather than empty disk space.\n260. **Swift tombstone reclamation ≠ Flash garbage collection, cache eviction, or Dynamo reconciliation** — each can retire an embodiment or alter currentness, but Swift's mechanism is a timestamped negative object version propagated across replicas and later reclaimed. The comparison is functional, not historical or mechanistic identity.\n261. **delete-marker retention has a correctness/capacity trade-off** — keeping tombstones longer spends storage, scans, and synchronization work on anti-resurrection evidence; reclaiming sooner releases that control state while narrowing the failure/convergence interval it can cover. The bounded sources justify the trade-off relation, not one universal safe duration.\n"""
          if '253. **deletion ≠ immediate absence of retained state**' not in s:
              marker = '\nThese are provisional cross-case findings, not final philosophical conclusions.'
              assert marker in s, 'CASE_INDEX findings marker missing'
              s = s.replace(marker, '\n' + findings + marker, 1)

          s = s.replace('currently twenty-eight;', 'currently twenty-nine;', 1)
          gate_anchor = '- [x] at least one distributed erasure-coded case where failure-domain placement and online reconstruction are separately grounded — Facebook f4;\n'
          gate_line = '- [x] at least one distributed-deletion case where a negative state must itself remain long enough to propagate before later reclamation — OpenStack Swift tombstone Case 28;\n'
          if gate_line not in s:
              assert gate_anchor in s, 'CASE_INDEX synthesis-gate anchor missing'
              s = s.replace(gate_anchor, gate_anchor + gate_line, 1)
          write(p, s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-case28.yml
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --check
          git commit -m 'docs: integrate grounded Swift tombstone bridge'
          git push origin HEAD:main
