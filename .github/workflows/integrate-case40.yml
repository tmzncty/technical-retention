name: Integrate Case 40 navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-case40.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate navigation and status
        run: python .automation/integrate_case40.py

      - name: Validate and commit
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .automation/integrate_case40.py .github/workflows/integrate-case40.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no staged changes"
            exit 1
          fi
          git commit -m "docs: integrate grounded RAIDR retention-profile bridge"
          git push origin HEAD:main

# Temporary self-deleting integration workflow.
