name: Integrate Case 135

on:
  push:
    paths:
      - '.github/workflows/tr-case135.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded Case 135 research slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          old = subprocess.check_output(['git','show','6980a9618f56d4078929cbe01679e94fc3c84e42:.github/workflows/tr-case135.yml'], text=True)
          m = re.search(r"          case = r'''(.*?)'''\n\n          evidence = r'''(.*?)'''\n\n          case_path", old, re.S)
          if not m:
              raise SystemExit('could not recover staged Case 135 content')
          case, evidence = m.group(1), m.group(2)
          case_path = Path('cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md')
          evidence_path = Path('evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md')
          if case_path.exists() or evidence_path.exists():
              raise SystemExit('Case 135 paths already exist; refusing to overwrite')
          case_path.write_text(case, encoding='utf-8')
          evidence_path.write_text(evidence, encoding='utf-8')

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          marker = '### Recent bounded evidence deepening\n'
          if 'Case 135 Micron automotive eMMC self-refresh' not in roadmap:
              pos = roadmap.find(marker)
              if pos < 0:
                  raise SystemExit('ROADMAP recent-deepening marker not found')
              pos += len(marker)
              bullet = "\n- [x] **Case 135 Micron automotive eMMC self-refresh / retained-time control-state grounding** — Atmark Techno's 2021-12-09 G4 manual grounds the reset → `SET_TIME (CMD49)` → bus-idle/delay → selective ECC-threshold self-refresh path plus retained progress/history telemetry, while Micron's 2023-04-11 TN-FC-60 catalog entry independently confirms the automotive-eMMC-5.1 refresh-feature family. Treat one-day eligibility, reset, host time injection, execution, completion evidence, and physical retention limits as distinct; the secured Micron note body, JEDEC/eMMC genealogy, exact rewrite geometry, and fault injection remain open.\n"
              roadmap = roadmap[:pos] + bullet + roadmap[pos:]
              roadmap_path.write_text(roadmap, encoding='utf-8')

          index_path = Path('CASE_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          if 'cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md' not in index:
              row = "| [Micron Automotive eMMC 5.1 Self-Refresh: Host Time, Selective Renewal, and Maintenance Evidence](cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md) | **grounded** | managed NAND/eMMC + host-supplied time/control + idle-gated selective self-refresh + retained progress/history | distinguish payload from maintenance eligibility, execution, and second-order evidence; compare only functionally with Flash/SSD renewal cases | [2021–2023 grounding record](evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md); full Micron TN-FC-60 body, exact rewrite geometry, JEDEC/eMMC genealogy, and fault injection remain open |\n"
              section_start = index.find('## Cases')
              pos = index.find('\n## Case ', section_start)
              if section_start < 0 or pos < 0:
                  raise SystemExit('CASE_INDEX insertion marker not found')
              index = index[:pos] + '\n' + row + index[pos:]
              existing = [int(x) for x in re.findall(r'^- \*\*(\d+) —', index, re.M)]
              start = max(existing) + 1
              findings = [
                  ('2021 Armadillo product-integration floor != invention priority', 'Atmark Techno v1.0.0 publicly documents the bounded eMMC data-retention/self-refresh feature by 2021-12-09, but this does not establish Micron invention or first-shipment priority. (`H/P`, `X`)'),
                  ('product `self refresh` != DRAM refresh', 'the shared label names a managed-eMMC maintenance feature whose documented trigger/selection path differs from DRAM scheduled cell refresh. (`H/P`, `E`, `X`)'),
                  ('OTP trigger policy != maintenance execution', 'one-time selection of reset-every-time versus elapsed-time comparison configures when work becomes eligible; it is not itself a refresh run. (`H/P`, `E`)'),
                  ('reset != refresh', 'the bounded path still requires SET_TIME within Delay 1, bus-idle observation, Delay 2, selection, and execution after reset. (`H/P`, `E`)'),
                  ('host time injection != maintenance completion', '`SET_TIME (CMD49)` supplies a control value used by the device; it does not prove that later renewal ran or completed. (`H/P`, `E`)'),
                  ('one-day eligibility != NAND retention cliff', 'the >=1-day comparison is a configured trigger interval, not evidence of unreadability after 24 hours. (`H/P`, `E`, `X`)'),
                  ('maintenance due != immediately schedulable', 'the controller waits for bus idle and a further Delay 2 before executing, so service opportunity is distinct from temporal eligibility. (`H/P`, `E`)'),
                  ('selective ECC-threshold refresh != full-medium rewrite', 'Atmark says only cells above error threshold 2 receive self refresh; exact raw-NAND rewrite/relocation geometry remains undisclosed. (`H/P`, `E`, `X`)'),
                  ('ECC threshold != complete degradation history', 'threshold evidence can authorize local renewal without preserving a chronology of charge loss or every corrected bit. (`E`)'),
                  ('maintenance telemetry != payload', 'self-refresh progress, loop/refresh counts, completion-related values, queue state, and power-loss counters are second-order operational state rather than user data. (`H/P`, `E`)'),
                  ('current progress != maintenance history', 'a current not-running/progress-zero state can coexist with retained counts from earlier renewal work. (`H/P`, `E`)'),
                  ('retained maintenance evidence != complete history or future guarantee', 'counts/progress expose bounded maintenance facts but do not establish every past event, every cell state, or a universal future-retention interval. (`E`, `X`)'),
                  ('host assistance != host physical-target selection', 'the host supplies reset/time input while the controller monitors idleness and local error evidence; inspected sources do not show the host choosing individual NAND targets. (`H/P`, `E`)'),
                  ('Micron TN-FC-60 metadata != uninspected clause semantics', 'the official 2023-04-11 catalog independently confirms the automotive eMMC 5.1 refresh-feature scope, but the login-gated body is not silently used for timing/threshold claims. (`H/P*`, `X`)'),
                  ('Case 36/37/111 similarity != genealogy', 'FCR, Samsung 840 EVO maintenance, enterprise-SSD shutdown runbooks, and this eMMC path are compared only as different retention-maintenance authority/trigger structures. (`A`, `X`)'),
                  ('composite trigger adds a managed-NAND control example', 'Case 135 combines reset, time evidence, idle opportunity, delay, and local error selection, refining Syntheses 24/26/27 without making those project categories historical vendor vocabulary. (`E/A`, `X`)'),
                  ('related-repository boundary', 'fresh `computing-archaeology` searches for `Micron eMMC` and `SET_TIME eMMC` found no dedicated module; broad eMMC/JEDEC/BKOPS/controller genealogy belongs there if developed. (`H/P` project-state record)')
              ]
              lines = ['\n## Case 135 — Micron automotive eMMC self-refresh findings\n', '\nGrounding record: [`evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md`](evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md).\n\n']
              for offset, (title, body) in enumerate(findings):
                  lines.append(f'- **{start + offset} — {title}:** {body}\n')
              index = index.rstrip() + '\n' + ''.join(lines) + '\n'
              index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -s cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md
          test -s evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md
          grep -Fq 'Case 135 Micron automotive eMMC self-refresh' ROADMAP.md
          grep -Fq 'cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md' CASE_INDEX.md
          grep -Fq 'host time injection != maintenance completion' CASE_INDEX.md
          grep -Fq 'one-day eligibility != NAND retention cliff' CASE_INDEX.md
          grep -Fq 'Micron TN-FC-60 metadata != uninspected clause semantics' CASE_INDEX.md
          git diff --check
          git config user.name 'technical-retention-bot'
          git config user.email 'technical-retention-bot@users.noreply.github.com'
          git rm .github/workflows/tr-case135.yml
          git add ROADMAP.md CASE_INDEX.md cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md
          git diff --cached --check
          git commit -m 'case135: ground eMMC self-refresh control-state boundary'
          git push origin HEAD:main
