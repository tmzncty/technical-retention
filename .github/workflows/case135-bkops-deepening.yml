          evidence = r'''# Case 135 Deepening Evidence — e.MMC 5.1 BKOPS Maintenance Opportunity vs Vendor Self-Refresh

## Status

**`grounded`** for the bounded distinction between JEDEC e.MMC 5.1 background-operation control and the Micron/Armadillo vendor self-refresh path already documented in Case 135.

This record does **not** claim that BKOPS is a retention-refresh command, that every background operation is Flash refresh, or that e.MMC 5.1 invented internal Flash maintenance.

## Research question

Case 135 already shows a vendor-specific Micron e.MMC path in which reset, host-supplied time, bus idleness, an ECC-related threshold, and retained maintenance statistics participate in data-retention work. The bounded question here is different:

> What does the standard e.MMC 5.1 BKOPS interface actually expose about internal maintenance, and which parts of that interface must remain separate from Micron's documented self-refresh semantics?

The answer matters because both mechanisms use powered idle opportunity, but they expose different policy evidence and different host/device authority boundaries.

## Source boundary

### Primary technical source

- JEDEC Solid State Technology Association, **JESD84-B51, Embedded Multi-Media Card (e.MMC) Electrical Standard (5.1)**, February 2015, especially §6.6.25 and EXT_CSD fields `BKOPS_STATUS[246]`, `BKOPS_START[164]`, and `BKOPS_EN[163]`. Official historical URL: <https://www.jedec.org/system/files/docs/JESD84-B51.pdf>. The official endpoint was not directly retrievable in this research environment; the standard text was inspected through a text mirror that preserves the JEDEC pagination and section/field numbering: <https://studylib.net/doc/27873175/emmc5.1%E5%AE%98%E6%96%B9%E6%A0%87%E5%87%86%E5%8D%8F%E8%AE%AE>.

### Publication/date corroboration

- JEDEC's 24 February 2015 e.MMC 5.1 announcement is reproduced by Design & Reuse and identifies JESD84-B51 as the new 5.1 publication while listing **Background Operation Control** among the revision's added features: <https://www.design-reuse.com/news/202526512-jedec-announces-publication-of-e-mmc-standard-update-v5-1/>.

### Existing Case 135 product/vendor witnesses

- Atmark Techno, **Armadillo-IoT Gateway G4 Product Manual v1.0.0**, 9 December 2021, eMMC data-retention/self-refresh integration: <https://manual.atmark-techno.com/armadillo-iot-g4/armadillo-iotg-g4_product_manual_ja-1.0.0/ch09.html>.
- Micron software/technical-note catalog entry for **TN-FC-60, Refresh Features for Micron e.MMC Automotive 5.1 Devices**, 11 April 2023: <https://www.micron.com/products/storage/emmc/software-downloads>.

## Historical record

### H/P — JESD84-B51 exposes background-maintenance opportunity, not a named physical maintenance algorithm

Section 6.6.25 says e.MMC devices have internal maintenance operations and distinguishes foreground work, such as host read/write service, from background work executed while the host is not being serviced.

The section does **not** identify every such maintenance operation as garbage collection, wear leveling, read reclaim, data refresh, block retirement, or any other one hidden Flash algorithm. The standard interface therefore exposes a maintenance-control relation while leaving the physical mechanism set intentionally abstract.

### H/P — manual BKOPS grants an explicit service window

For the manually initiated method, the host writes any value to `BKOPS_START` (EXT_CSD byte 164). The device remains busy until no more background processing is needed.

`MANUAL_EN` in `BKOPS_EN` (EXT_CSD byte 163) tells the device that the host expects to start background operations periodically. The standard explicitly allows the device to delay some maintenance until the host later writes `BKOPS_START`.

This supplies a concrete host/device scheduling relation:

```text
host advertises future maintenance opportunities
    -> device may defer some internal maintenance
    -> host opens a BKOPS service window
    -> device performs currently needed background processing
```

It does not expose the physical target set or rewrite geometry of that processing.

### H/P — BKOPS_STATUS is urgency, not a maintenance transcript

`BKOPS_STATUS[246]` reports four urgency levels:

- `0x0` — no operations required;
- `0x1` — operations outstanding, non-critical;
- `0x2` — operations outstanding, performance being impacted;
- `0x3` — operations outstanding, critical.

At levels 2 or 3, `URGENT_BKOPS` can surface through exception status. At level 3, foreground operations may exceed their original timeouts because maintenance can no longer be delayed. The host is still required to inspect full BKOPS status periodically.

This is an **urgency/control summary**, not a record of which NAND pages moved, which blocks were erased, which ECC events occurred, or which retention-refresh operations completed.

### H/P — e.MMC 5.1 also exposes autonomous idle-time BKOPS

JESD84-B51 defines `AUTO_EN` in `BKOPS_EN`. When enabled, the device may start or stop background operations during idle time without notifying the host. The standard tells the host to keep device power active while this mode is enabled, while allowing the host to set or clear the bit according to its power constraints.

The same standard says the background-operations feature is mandatory for the specification and requires the support bit in `BKOPS_SUPPORT[502]`.

This creates a distinct authority split from manual BKOPS:

```text
manual BKOPS:
    host opens the maintenance window
    device decides the hidden maintenance work

autonomous BKOPS:
    host permits autonomous idle-time work
    device decides both when to use idle time and what hidden maintenance to run
```

The February 2015 publication announcement lists **Background Operation Control** among e.MMC 5.1 changes. This is used only as a revision/publication boundary. It is **not** an invention-priority claim for Flash background maintenance or BKOPS in general.

### H/P — BKOPS and Sanitize are separate standard controls

In the same EXT_CSD command-control area, JESD84-B51 defines `SANITIZE_START[165]` separately from `BKOPS_START[164]`. A host writing `SANITIZE_START` manually starts sanitize; a write to `BKOPS_START` manually starts background operations.

That side-by-side separation is useful negative evidence:

> successful BKOPS processing is not, merely by being internal Flash maintenance, a sanitize operation.

## Engineering reconstruction

### E — support, urgency, execution, and completion are different states

The standard exposes several relations that should not be collapsed:

```text
BKOPS supported
    !=
background work currently outstanding
    !=
background work urgent
    !=
maintenance opportunity granted
    !=
background processing executing
    !=
no more BKOPS work currently needed
```

A capability bit therefore cannot stand in for current maintenance state, and an urgency level cannot stand in for proof of a particular hidden operation.

### E — maintenance opportunity is not mechanism identity

BKOPS gives the device time and authority to perform internal maintenance, but it does not tell the host which internal algorithm consumes that opportunity.

Accordingly:

> **BKOPS execution != demonstrated garbage collection**;
>
> **BKOPS execution != demonstrated wear leveling**;
>
> **BKOPS execution != demonstrated retention refresh**.

Any of those may occur in a particular implementation, but demonstrating that requires vendor, firmware, teardown, telemetry, or experimental evidence beyond the generic interface contract.

### E — urgency zero is narrower than “all future retention risk resolved”

`BKOPS_STATUS = 0` means the device currently reports no background operations required under this interface. It does not prove:

- that every NAND cell has freshly renewed charge margin;
- that no latent media error exists;
- that no future maintenance will become due;
- that every vendor-specific retention counter has been reset;
- or that physical media has been sanitized.

Thus:

> **no BKOPS work currently required != universal media-health guarantee**.

### E — Micron self-refresh eligibility is not interchangeable with BKOPS urgency

Case 135's Armadillo/Micron path uses a vendor retention policy involving reset, `SET_TIME (CMD49)`, elapsed-time qualification, bus idleness, Delay 2, and an ECC-related threshold. JESD84-B51 BKOPS instead exposes generic maintenance support, urgency, and host/device scheduling controls.

The two interfaces may both need a powered idle opportunity, but the inspected sources do not establish that:

- `SET_TIME` updates BKOPS urgency;
- BKOPS status is the self-refresh queue;
- starting BKOPS starts Micron self refresh;
- completing BKOPS means Micron self refresh completed;
- or Micron self refresh is implemented internally as standard BKOPS.

Therefore:

> **vendor self-refresh due != generic BKOPS urgency**;
>
> **shared idle opportunity != shared mechanism**.

### E — host assistance can change without exposing hidden target selection

Manual and autonomous BKOPS move the scheduling boundary without requiring the standard to disclose physical target selection. Case 135's self-refresh path likewise gives the host time/reset inputs while the controller retains local ECC-conditioned selection.

Across both paths, host participation and physical-target authority remain separate axes.

## Functional comparison only

### Case 135 vendor self refresh

The useful similarity is powered maintenance opportunity. The difference is policy evidence: the vendor path exposes time/ECC-oriented retention semantics, while BKOPS exposes generic maintenance urgency/opportunity.

This is a **functional analogy**, not evidence that the two state machines are identical or historically descended from one another.

### Cases 36 and 37

Case 36's research mechanism and Case 37's Samsung 840 EVO maintenance both give stronger evidence about refresh-like behavior than generic BKOPS does. They must not be used to fill in BKOPS's intentionally hidden mechanism.

### Case 150 managed-SSD garbage collection

Both BKOPS and SSD garbage collection can consume idle/background time, but BKOPS is an interface class for internal maintenance opportunity whereas Case 150 grounds a more specific reclamation relation. Shared scheduling geometry does not establish algorithm identity.

## Prior-art and chronology boundary

The safe chronological statement in this slice is limited:

- JESD84-B51 is dated **February 2015**;
- the February 2015 publication announcement lists **Background Operation Control** among e.MMC 5.1 changes;
- JESD84-B51 itself defines manual and autonomous background-operation control as described above.

This pass does **not** establish when manual BKOPS first appeared, when any vendor first shipped comparable background maintenance, or who invented autonomous managed-Flash maintenance. Those broader genealogies belong in `computing-archaeology` if pursued.

A fresh search of `tmzncty/computing-archaeology` for `BKOPS` found no dedicated technical-history module to reuse in this pass.

## Sanitization boundary

JESD84-B51's separate `SANITIZE_START` and `BKOPS_START` controls are a direct warning against semantic collapse.

> **BKOPS complete / BKOPS_STATUS=0 != sanitize complete != verified physical erasure**.

Nothing in the generic BKOPS interface proves that stale physical embodiments of user data have been rendered unrecoverable.

## Philosophical limit

No new historical philosophy is attributed to JEDEC, Micron, or Atmark.

A narrow project-level interpretation is enough: a managed storage system can retain a compact **maintenance obligation signal** and expose a **maintenance opportunity protocol** without exposing the detailed physical work that makes the obligation disappear. That interpretation is secondary to the engineering record above.

## Resulting bounded relations

```text
maintenance capability != current maintenance obligation
current obligation != urgency
urgency != execution
execution != disclosed physical mechanism
no current BKOPS work != all future retention risk eliminated
vendor self-refresh due != generic BKOPS urgency
shared idle opportunity != mechanism identity
BKOPS completion != sanitization
```

## Remaining evidence debt

- inspect pre-5.1 JEDEC revisions directly to establish the exact chronology of manual BKOPS versus later background-operation control, rather than inferring it from the 5.1 announcement;
- obtain the full Micron TN-FC-60 body and test whether it explicitly relates self refresh to standard BKOPS controls;
- obtain a named Micron part/firmware record exposing both BKOPS fields and the vendor self-refresh feature in the same device;
- gather fault-injection or telemetry evidence showing what BKOPS status does during/after interrupted vendor self-refresh;
- keep any host-tooling one-time-programmable warnings separate from this conceptual analysis unless the exact target field semantics are directly verified against the relevant device/spec revision.
'''

          evidence_path.write_text(evidence, encoding='utf-8')

          case = case_path.read_text(encoding='utf-8')
          grounding = "Grounding record: [`../evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md`](../evidence/135-micron-emmc-2021-2023-self-refresh-grounding.md)."
          deep_link = "Deepening record: [`../evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md`](../evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md)."
          if deep_link not in case:
