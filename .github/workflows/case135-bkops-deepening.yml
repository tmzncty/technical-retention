### Completed bounded deepening — Case 135 e.MMC BKOPS maintenance opportunity

- [x] Ground JESD84-B51 `BKOPS_START`, `BKOPS_STATUS`, `MANUAL_EN`, and `AUTO_EN` as a generic managed-Flash maintenance-opportunity/urgency interface; distinguish capability, outstanding work, urgency, execution, and completion; keep the standard interface separate from Micron/Armadillo time/ECC-conditioned self refresh; record `BKOPS complete != sanitize`; leave pre-5.1 BKOPS genealogy to direct revision research. Evidence: [`evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md`](evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md).
'''
          if 'Completed bounded deepening — Case 135 e.MMC BKOPS maintenance opportunity' not in roadmap:
              roadmap = roadmap.rstrip() + roadmap_note + '\n'
          roadmap_path.write_text(roadmap, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index_note = r'''

## Case 135 deepening — e.MMC BKOPS maintenance opportunity vs vendor self-refresh

Grounding: [`cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md`](cases/135-micron-emmc-self-refresh-time-trigger-maintenance.md) and [`evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md`](evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md).

- **3392 — H/P:** JESD84-B51 (February 2015) defines Background Operations as device-internal maintenance executed when the host is not being serviced; this is a public standard boundary, not an invention-priority claim for Flash maintenance.
- **3393 — H/P:** `BKOPS_START[164]` manually opens a background-processing interval and the device remains busy until no more background processing is needed.
- **3394 — H/P:** `MANUAL_EN` tells the device that the host expects to start BKOPS periodically, allowing the device to defer some maintenance to those future host-granted windows.
- **3395 — H/P:** `BKOPS_STATUS[246]` is an urgency summary with four levels: none required, non-critical outstanding, performance-impacting outstanding, and critical outstanding.
- **3396 — H/P:** Levels 2/3 can surface `URGENT_BKOPS`; level 3 may stretch foreground-operation timeouts because maintenance can no longer be delayed.
- **3397 — H/P:** JESD84-B51 requires Background Operations support for the specification and defines `BKOPS_SUPPORT[502]` accordingly; capability does not itself mean work is currently outstanding.
- **3398 — H/P:** With `AUTO_EN` set, an e.MMC may start or stop background operations during idle time without host notification; the host is advised to keep device power active while autonomous BKOPS is permitted.
- **3399 — E:** `BKOPS supported != work outstanding != urgent != execution opportunity != execution != no more currently needed work`.
- **3400 — E:** BKOPS exposes maintenance control/opportunity but does not identify the hidden algorithm; generic BKOPS execution alone does not prove garbage collection, wear leveling, or retention refresh.
- **3401 — E:** `BKOPS_STATUS = 0` means no background operations currently required under the interface, not that every NAND cell has fresh retention margin or that no future maintenance can become due.
- **3402 — E:** Case 135's Micron/Armadillo reset/time/ECC-conditioned self-refresh eligibility is not interchangeable with generic BKOPS urgency: `vendor self-refresh due != generic BKOPS urgency`.
- **3403 — A:** BKOPS and Micron self refresh can both depend on powered idle opportunity, but `shared idle opportunity != shared mechanism`; the comparison is functional only and proves no genealogy or state-machine identity.
- **3404 — E:** Manual versus autonomous BKOPS changes maintenance scheduling authority while leaving physical target selection hidden; host participation and physical-target authority are separate axes.
- **3405 — H/E:** JESD84-B51 defines `SANITIZE_START[165]` separately from `BKOPS_START[164]`, directly supporting `BKOPS completion != sanitize completion`.
- **3406 — X:** Neither completed BKOPS nor zero BKOPS urgency is evidence of verified physical erasure or media sanitization; stale physical embodiment claims require stronger implementation/sanitization evidence.
'''
          if '## Case 135 deepening — e.MMC BKOPS maintenance opportunity vs vendor self-refresh' not in index:
              index = index.rstrip() + index_note + '\n'
