              case = case.replace(grounding, grounding + "\n\n" + deep_link, 1)

          section = r'''## Deepening — standard BKOPS is a maintenance-opportunity interface, not a synonym for vendor self refresh

JESD84-B51 (February 2015) gives e.MMC a standard **Background Operations** control surface. It distinguishes host-service foreground work from device-internal maintenance performed when the host is not being serviced. Manual BKOPS uses `BKOPS_START[164]`; `MANUAL_EN` lets the host advertise that such windows will be supplied periodically; `BKOPS_STATUS[246]` reports four levels from no work required through critical outstanding work. The same section defines `AUTO_EN`, under which the device may start or stop background work during idle time without notifying the host, while the host is advised to keep device power active.

That standard surface must stay separate from the Micron/Armadillo retention path documented above. BKOPS exposes **maintenance support, urgency, and scheduling opportunity**; the vendor path exposes **reset/time eligibility, bus-idle gating, ECC-threshold selection, and self-refresh telemetry**. The inspected sources do not establish that either state machine drives the other.

Therefore:

```text
BKOPS supported
    != BKOPS work outstanding
    != BKOPS urgent
    != BKOPS executing
    != a particular hidden Flash algorithm demonstrated

vendor self-refresh due != generic BKOPS urgency
shared powered-idle opportunity != shared mechanism
```

This is especially important because generic BKOPS does not name the internal maintenance algorithm. A particular controller may use background time for garbage collection, wear leveling, refresh-like work, or other maintenance, but the interface contract alone does not prove which one occurred.

JESD84-B51 also defines `SANITIZE_START[165]` separately from `BKOPS_START[164]`. Accordingly, `BKOPS_STATUS = 0` or completion of manually started BKOPS is not evidence of sanitize completion, secure erasure, or elimination of stale physical embodiments.

The bounded evidence and chronology ledger is in [`../evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md`](../evidence/135-jedec-emmc51-bkops-maintenance-opportunity-deepening.md). This pass uses February 2015 only as the public floor for the inspected e.MMC 5.1 control semantics; it does not claim that e.MMC 5.1 invented Flash background maintenance or manual BKOPS.
'''
          anchor = '## Open research debt'
          if section.strip() not in case:
              assert anchor in case
              case = case.replace(anchor, section + '\n\n' + anchor, 1)
          old_debt = '- trace `SET_TIME (CMD49)` and the relevant vendor extension against official JEDEC eMMC revision history without assuming command-number identity across contexts;'
          new_debt = old_debt + "\n- trace pre-5.1 manual BKOPS and the later background-operation-control genealogy directly in JEDEC revisions; do not infer the full genealogy from JESD84-B51 alone;"
          if 'trace pre-5.1 manual BKOPS' not in case:
