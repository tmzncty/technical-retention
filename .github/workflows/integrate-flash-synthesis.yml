name: Integrate Flash retention synthesis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-flash-synthesis.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded synthesis
        run: |
          python .github/scripts/integrate_flash_synthesis.py
          python -c "from pathlib import Path; p=Path('CASE_INDEX.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\\n', encoding='utf-8')"
      - name: Validate Markdown diff
        run: git diff --check
      - name: Commit research changes and remove one-shot integration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/integrate_flash_synthesis.py .github/workflows/integrate-flash-synthesis.yml
          git add -A
          git diff --cached --check
          git commit -m "synthesis: separate Flash read recovery from renewal"
          git push origin HEAD:main
