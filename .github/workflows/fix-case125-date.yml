name: Correct Case 125 commit date

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case125-date.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct UTC commit date
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'cases/125-linux-ext3-ext4-orphan-crash-cleanup-reclamation.md': [
                  ('authored 16 August 2021 and committed 30 August 2021',
                   'authored 16 August 2021 and committed upstream 31 August 2021 (UTC)'),
              ],
              'evidence/125-linux-ext3-ext4-2000-2023-orphan-recovery-grounding.md': [
                  ('2021-08-16 author date / 2021-08-30 committer date',
                   '2021-08-16 author date / 2021-08-31 UTC committer date'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  assert old in text, (name, old)
                  text = text.replace(old, new, 1)
              p.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Commit correction
        run: |
          git config user.name technical-retention-bot
          git config user.email technical-retention-bot@users.noreply.github.com
          git add cases/125-linux-ext3-ext4-orphan-crash-cleanup-reclamation.md evidence/125-linux-ext3-ext4-2000-2023-orphan-recovery-grounding.md
          git diff --cached --check
          git commit -m 'case125: correct orphan-file commit date'
          git push origin HEAD:main

      - name: Remove one-shot workflow
        if: success()
        run: |
          rm .github/workflows/fix-case125-date.yml
          git add .github/workflows/fix-case125-date.yml
          git commit -m 'chore: remove Case 125 date-fix workflow'
          git push origin HEAD:main
