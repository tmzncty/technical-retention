name: synthesis09-distributed-coded-service-integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-synthesis09.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded synthesis
        run: python3 .github/oneoff_synthesis09.py

      - name: Remove one-shot automation
        run: rm .github/oneoff_synthesis09.py .github/workflows/oneoff-synthesis09.yml

      - name: Commit integrated research slice
        shell: bash
        run: |
          set -euxo pipefail
          test -f docs/SYNTHESIS_09_DISTRIBUTED_CODED_SERVICE_REPAIR_PLACEMENT.md
          test ! -e .github/oneoff_synthesis09.py
          test ! -e .github/workflows/oneoff-synthesis09.yml
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'synthesis: separate distributed coded service from repair placement'
          git push origin HEAD:main
