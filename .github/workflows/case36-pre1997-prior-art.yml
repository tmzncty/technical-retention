name: Case36 pre-1997 prior-art integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/case36-pre1997-prior-art.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research slice
        run: python .github/scripts/case36_pre1997.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f evidence/36-1978-1994-nonvolatile-flash-refresh-prior-art-deepening.md
          grep -q '2832 —' CASE_INDEX.md
          grep -q '2848 —' CASE_INDEX.md
          grep -q 'Case 36 pre-1997 nonvolatile/Flash refresh prior-art deepening' ROADMAP.md
          git config user.name 'technical-retention-bot'
          git config user.email 'technical-retention-bot@users.noreply.github.com'
          git rm .github/workflows/case36-pre1997-prior-art.yml .github/scripts/case36_pre1997.py
          git add CASE_INDEX.md ROADMAP.md cases/36-nand-flash-correct-and-refresh-maintenance.md evidence/36-flash-refresh-1997-2009-prior-art-deepening.md evidence/36-1978-1994-nonvolatile-flash-refresh-prior-art-deepening.md
          git diff --cached --check
          git commit -m 'case36: deepen pre-1997 nonvolatile refresh prior art'
          git push origin HEAD:main
