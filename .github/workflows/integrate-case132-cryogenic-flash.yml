name: Integrate Case 132 cryogenic Flash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case132-cryogenic-flash.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'tmzncty/technical-retention'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate bounded Case 132 navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate_case132.py
          git diff --check
          test -s cases/132-cryogenic-serial-flash-retention-operability.md
          test -s evidence/132-2015-cryogenic-serial-flash-grounding.md
          grep -q '132-cryogenic-serial-flash-retention-operability.md' CASE_INDEX.md
          grep -q '\*\*2388 —' CASE_INDEX.md
          grep -q 'environmental Flash-retention layer by grounded Case 132' ROADMAP.md
          git status --short

      - name: Commit navigation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git rm .github/workflows/integrate-case132-cryogenic-flash.yml .github/scripts/integrate_case132.py
          git add ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'case132: integrate cryogenic Flash navigation'
          git push origin HEAD:main
