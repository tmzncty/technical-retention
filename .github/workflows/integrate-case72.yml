name: Integrate Case 72

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case72.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Integrate grounded Case 72
        run: python .github/scripts/integrate_case72.py
