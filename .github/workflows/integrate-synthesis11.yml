name: Integrate access-disturbance synthesis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-synthesis11.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research patch
        run: python3 .github/scripts/integrate_synthesis11.py
      - name: Validate and integrate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f docs/SYNTHESIS_11_ACCESS_DISTURBANCE_MAINTENANCE.md
          grep -q 'SYNTHESIS_11_ACCESS_DISTURBANCE_MAINTENANCE.md' README.md
          grep -q 'SYNTHESIS_11_ACCESS_DISTURBANCE_MAINTENANCE.md' ROADMAP.md
          grep -q '1436. \*\*logical request target ≠ physical effect scope\*\*' CASE_INDEX.md
          grep -q '1447. \*\*cross-case access-disturbance decomposition ≠ historical genealogy\*\*' CASE_INDEX.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md docs/SYNTHESIS_11_ACCESS_DISTURBANCE_MAINTENANCE.md
          git rm .github/scripts/integrate_synthesis11.py .github/workflows/integrate-synthesis11.yml
          git commit -m 'synthesis: separate access effects from retention maintenance'
          git push origin HEAD:main
