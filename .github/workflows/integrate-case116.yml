name: Integrate Case 116

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case116.yml'
      - 'scripts/integrate_case116.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate navigation and cross-links
        run: python scripts/integrate_case116.py
      - name: Validate diff
        run: git diff --check
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add ROADMAP.md CASE_INDEX.md cases/80-apache-hdfs-datanode-decommission-replica-drain.md
          git commit -m "case116: integrate HDFS maintenance-state navigation"
          git push