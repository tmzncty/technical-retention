name: Integrate Case 99 ZFS snapshot boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case99-zfs-snapshot.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Case 99 navigation slice
        run: python .github/scripts/integrate_case99_zfs_snapshot_nav.py
      - name: Validate Markdown diff
        run: git diff --check
      - name: Commit navigation changes and remove one-shot integration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/integrate_case99_zfs_snapshot_nav.py .github/workflows/integrate-case99-zfs-snapshot.yml
          git add -A
          git diff --cached --check
          git commit -m "case99: integrate ZFS snapshot retention navigation"
          git push origin HEAD:main
