name: Case82 integration

on:
  push:
    branches: [main]
    paths:
      - '.github/case82-integrate.py'
      - '.github/workflows/case82-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate and validate
        run: python .github/case82-integrate.py
      - name: Commit documentation updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m 'case82: integrate NAND copyback navigation'
          git push
