name: Fix Case 25 coherence count once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/case25-coherence-count-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          t = p.read_text(encoding='utf-8')
          old = 'twenty-four grounded regimes now support the current relational criterion'
          new = 'twenty-six grounded regimes now support the current relational criterion'
          if old not in t:
              raise SystemExit('coherence-count anchor missing')
          t = t.replace(old, new, 1)
          old_tail = 'and Dynamo divergent-version/anti-entropy bridges; future write-back-cache, filesystem, refresh, virtual-memory, and distributed regimes must still be allowed to break or revise it rather than being forced into it;'
          new_tail = 'Dynamo divergent-version/anti-entropy, Windows Azure LRC repair-locality/representation-handoff, and Swift mutable-EC currentness bridges; future write-back-cache, filesystem, refresh, virtual-memory, and distributed regimes must still be allowed to break or revise it rather than being forced into it;'
          if old_tail not in t:
              raise SystemExit('coherence-regime-list anchor missing')
          p.write_text(t.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY
          rm .github/workflows/case25-coherence-count-fix.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_INDEX.md .github/workflows/case25-coherence-count-fix.yml
          git diff --cached --check
          git commit -m "docs: reconcile Case 25 coherence count"
          git push
