name: Apply Case 55 spare-exhaustion deepening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-case55-spare.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research slice
        run: python tools/automation_case55_spare.py

      - name: Validate research patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'spare below threshold ≠ spare exhausted' cases/55-nvme-smart-health-endurance-telemetry.md
          grep -Fq 'Generic Command Status 80h' evidence/55-nvme10-13-smart-health-endurance-grounding.md
          grep -Fq 'partially advanced by grounded Cases 14, 55, and 78' ROADMAP.md
          grep -Fq '1477. **finite spare reserve = possible continuation resource, not ordinary user capacity**' CASE_INDEX.md
          test "$(grep -c '^1468\.' CASE_INDEX.md)" -eq 1
          test "$(grep -c '^1477\.' CASE_INDEX.md)" -eq 1

      - name: Commit bounded slice and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/automation_case55_spare.py .github/workflows/automation-case55-spare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case55: deepen spare-exhaustion failure boundary'
          git push origin HEAD:main
