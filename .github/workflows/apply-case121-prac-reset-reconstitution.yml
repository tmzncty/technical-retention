name: Apply Case 121 PRAC reset-reconstitution deepening

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_case121_prac_reset_reconstitution.py'
      - '.github/workflows/apply-case121-prac-reset-reconstitution.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Case 121 deepening
        run: |
          set -euo pipefail
          python3 - <<'PY' >case121-integration-debug.txt 2>&1
          from pathlib import Path
          helper = Path('scripts/apply_case121_prac_reset_reconstitution.py')
          source = helper.read_text(encoding='utf-8')
          start_marker = '# Update the Case 121 table row by adding the deepening record and narrowing the reset debt.'
          end_marker = '# Insert new findings into the existing Case 121 findings section.'
          start = source.index(start_marker)
          end = source.index(end_marker)
          source = source[:start] + "index = INDEX.read_text(encoding='utf-8')\n\n" + source[end:]
          old_assert = "assert index.count('121-ddr5-prac-powerup-reset-reconstitution-deepening.md') >= 1"
          new_tail = '''if index.count('121-ddr5-prac-powerup-reset-reconstitution-deepening.md') < 1:\n    section = '## Case 121 — DDR5 PRAC activation-counter findings\\n'\n    link = '\\nDeepening record: [`evidence/121-ddr5-prac-powerup-reset-reconstitution-deepening.md`](evidence/121-ddr5-prac-powerup-reset-reconstitution-deepening.md).\\n'\n    index = index.replace(section, section + link, 1)\n    INDEX.write_text(index, encoding='utf-8')\nassert index.count('121-ddr5-prac-powerup-reset-reconstitution-deepening.md') >= 1'''
          source = source.replace(old_assert, new_tail, 1)
          exec(compile(source, str(helper), 'exec'))
          PY

      - name: Persist diagnostics if apply failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add case121-integration-debug.txt
          git commit -m "chore: capture Case 121 integration failure"
          git push origin HEAD:main

      - name: Validate research changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f case121-integration-debug.txt
          test -f evidence/121-ddr5-prac-powerup-reset-reconstitution-deepening.md
          python3 - <<'PY'
          from pathlib import Path
          case = Path('cases/121-ddr5-prac-activation-counter-initialization.md').read_text(encoding='utf-8')
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          idx = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          ev = Path('evidence/121-ddr5-prac-powerup-reset-reconstitution-deepening.md').read_text(encoding='utf-8')
          assert '### Power-up / system-reset reconstitution deepening' in case
          assert '### Reset can invalidate counter authority without proving physical erasure' in case
          assert roadmap.count('Case 121 DDR5 PRAC power-up / system-reset reconstitution deepening') == 1
          assert idx.count('121-ddr5-prac-powerup-reset-reconstitution-deepening.md') >= 1
          for n in range(2680, 2695):
              marker = f'**{n} —'
              assert idx.count(marker) == 1, (n, idx.count(marker))
          assert 'Historical record' in ev
          assert 'Engineering reconstruction' in ev
          assert 'Functional analogy' in ev
          assert 'Philosophical interpretation — bounded' in ev
          assert 'system reset physically erases PRAC counter cells' in ev
          PY
          git diff --check

      - name: Commit research and remove integration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_case121_prac_reset_reconstitution.py
          git rm .github/workflows/apply-case121-prac-reset-reconstitution.yml
          git rm -f case121-integration-debug.txt || true
          git add ROADMAP.md CASE_INDEX.md cases/121-ddr5-prac-activation-counter-initialization.md evidence/121-ddr5-prac-powerup-reset-reconstitution-deepening.md
          git diff --cached --check
          git commit -m "case121: deepen PRAC reset-reconstitution boundary"
          git push origin HEAD:main
