name: Technical Retention Case 41 Paxos stale-commit integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-retention-case41-paxos-stale-commit.yml'
      - 'tools/.tmp_case41_paxos_stale_commit_integrate.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded research slice
        run: python3 tools/.tmp_case41_paxos_stale_commit_integrate.py

      - name: Validate and commit research
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = [
              'cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md',
              'evidence/41-cassandra-2024-paxos-v2-stale-commit-resurrection-deepening.md',
              'ROADMAP.md',
              'CASE_INDEX.md',
          ]
          for p in canonical:
              assert Path(p).is_file(), p

          index = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          nums = [int(x) for x in re.findall(r'^- \*\*(\d+)\b', index, re.M)]
          for n in range(2546, 2561):
              assert nums.count(n) == 1, (n, nums.count(n))
          assert max(nums) == 2560, max(nums)

          ev = Path('evidence/41-cassandra-2024-paxos-v2-stale-commit-resurrection-deepening.md').read_text(encoding='utf-8')
          for heading in [
              'Historical record (`H/P`)',
              'Engineering reconstruction (`E`)',
              'Functional analogies (`A`)',
              'Philosophical interpretation (`I`)',
              'Counterexamples and stop conditions (`X`)',
          ]:
              assert heading in ev, heading
          assert 'CASSANDRA-19617' in ev
          assert '53b06453b7dea147ef6369765e0b7ac7fb0990fd' in ev

          case = Path('cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md').read_text(encoding='utf-8')
          assert 'Paxos v2 stale-commit redistribution' in case
          assert 'auxiliary positive state can defeat otherwise-completed negative-state retirement' in case

          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          assert roadmap.count('Case 41 Paxos-v2 auxiliary-state resurrection deepening') == 1
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/41-apache-cassandra-tombstone-gc-grace-resurrection.md \
            evidence/41-cassandra-2024-paxos-v2-stale-commit-resurrection-deepening.md \
            ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          git commit -m "case41: deepen Paxos stale-commit resurrection boundary"
          git push origin HEAD:main

      - name: Remove temporary scaffolding
        run: |
          set -euo pipefail
          git rm tools/.tmp_case41_paxos_stale_commit_integrate.py .github/workflows/technical-retention-case41-paxos-stale-commit.yml
          git commit -m "chore: remove Case 41 integration scaffolding"
          git push origin HEAD:main
