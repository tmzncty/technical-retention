name: synthesis10-mutable-ec-currentness

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-synthesis10.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bounded synthesis
        run: python3 .github/oneoff_synthesis10.py
      - name: Validate research integration
        shell: bash
        run: |
          set -euxo pipefail
          test -f docs/SYNTHESIS_10_MUTABLE_EC_CURRENTNESS_RETIREMENT_REPAIR.md
          grep -Fq 'SYNTHESIS_10_MUTABLE_EC_CURRENTNESS_RETIREMENT_REPAIR.md' README.md
          grep -Fq -- '- [x] In mutable erasure-coded object storage' ROADMAP.md
          ! grep -Fq -- '- [ ] In mutable erasure-coded object storage' ROADMAP.md
          grep -Fq '1395. **fragment presence ≠ fragment validity**' CASE_INDEX.md
          grep -Fq '1407. **mutable coded currentness ≠ immutable coded-repair pipeline or historical genealogy**' CASE_INDEX.md
          grep -Fq 'Swift 2.11.0' docs/SYNTHESIS_10_MUTABLE_EC_CURRENTNESS_RETIREMENT_REPAIR.md
          git diff --check
      - name: Remove one-shot integration machinery
        run: rm .github/oneoff_synthesis10.py .github/workflows/oneoff-synthesis10.yml
      - name: Commit and push
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          test ! -e .github/oneoff_synthesis10.py
          test ! -e .github/workflows/oneoff-synthesis10.yml
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'synthesis: separate mutable EC currentness from repair convergence'
          git push origin HEAD:main
