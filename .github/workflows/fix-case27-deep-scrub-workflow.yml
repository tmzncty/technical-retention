name: repair Case 27 integration marker

on:
  push:
    paths:
      - '.github/workflows/fix-case27-deep-scrub-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair one-shot workflow and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/case27-deep-scrub-prior-art.yml')
          text = p.read_text()
          old_cond = "    if: github.actor != 'github-actions[bot]'\n"
          new_cond = "    if: always()\n"
          old_marker = '          limits_marker = "Most importantly, the present source set does **not** fully ground the exact per-shard reconstruction/authoritative-source algorithm used after every scrub-detected error; that is handled separately in Case 29.\\n"\n'
          new_marker = '          limits_marker = "Most importantly, the present source set does **not** fully ground the exact per-shard reconstruction/authoritative-source algorithm used after every deep-scrub-detected EC corruption. That remains a separate implementation-archeology slice.\\n"\n'
          if old_cond not in text:
              raise SystemExit('actor condition marker missing')
          if old_marker not in text:
              raise SystemExit('limits marker line missing')
          text = text.replace(old_cond, new_cond, 1).replace(old_marker, new_marker, 1)
          p.write_text(text)
          PY
          rm .github/workflows/fix-case27-deep-scrub-workflow.yml
          git add .github/workflows/case27-deep-scrub-prior-art.yml .github/workflows/fix-case27-deep-scrub-workflow.yml
          git diff --cached --check
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git commit -m 'chore: fix Case 27 integration marker'
          git push origin HEAD:main
