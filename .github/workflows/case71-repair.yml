name: Case 71 repair integrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case71-repair.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Case 71 without self-deleting integration files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/case71_integrate.py')
          s = p.read_text()
          marker = '\nif WORKFLOW_PATH.exists():\n    WORKFLOW_PATH.unlink()\nif SELF_PATH.exists():\n    SELF_PATH.unlink()\n'
          if marker not in s:
              raise SystemExit('expected self-delete block not found')
          p.write_text(s.replace(marker, '\n'))
          PY
          python .github/case71_integrate.py
      - name: Validate research slice
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          nums = sorted(int(p.name[:2]) for p in Path('cases').glob('[0-9][0-9]-*.md'))
          assert nums == list(range(72)), nums
          assert Path('cases/71-apache-zookeeper-fuzzy-snapshot-replay-recovery.md').exists()
          assert Path('evidence/71-zookeeper-2006-2019-fuzzy-snapshot-grounding.md').exists()
          ci = Path('CASE_INDEX.md').read_text()
          assert '813. **recovery-equivalent representation' in ci
          assert '828. **ZooKeeper 2010 fuzzy recovery' in ci
          assert 'Apache ZooKeeper Fuzzy Snapshots' in ci
          assert 'cases/71-apache-zookeeper-fuzzy-snapshot-replay-recovery.md' in Path('README.md').read_text()
          assert 'ZooKeeper fuzzy snapshot / replay recovery' in Path('ROADMAP.md').read_text()
          PY
      - name: Commit only permanent research files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md \
            cases/71-apache-zookeeper-fuzzy-snapshot-replay-recovery.md \
            evidence/71-zookeeper-2006-2019-fuzzy-snapshot-grounding.md
          git commit -m "case71: ground ZooKeeper fuzzy snapshot recovery"
          git push origin HEAD:main
