name: Integrate Case 44 ATA secure-erase prior art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-case44-ata-secure-erase.yml'
      - 'scripts/integrate_case44_ata_secure_erase.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 44 ATA prior-art deepening
        run: python scripts/integrate_case44_ata_secure_erase.py
      - name: Validate diff
        run: git diff --check
      - name: Validate integration markers
        run: |
          grep -F 'Earlier device-level prior art — ATA Enhanced Security Erase' cases/44-nvme13-deallocate-sanitize-forgetting.md
          grep -F 'T13 D96156 / ATA/ATAPI-4 Enhanced Security Erase' evidence/44-nvme12-13-deallocate-sanitize-grounding.md
          grep -F '1909 — related-repository boundary' CASE_INDEX.md
      - name: Commit research integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add cases/44-nvme13-deallocate-sanitize-forgetting.md evidence/44-nvme12-13-deallocate-sanitize-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m "case44: deepen ATA secure-erase prior-art boundary"
          git push
