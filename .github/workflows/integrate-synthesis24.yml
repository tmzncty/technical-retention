name: Integrate Synthesis 24

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-synthesis24.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply Synthesis 24 research changes
        run: python .github/scripts/integrate_synthesis24.py

      - name: Normalize generated canonical files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'README.md',
              'ROADMAP.md',
              'CASE_INDEX.md',
              'docs/GLOSSARY.md',
              'docs/SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate canonical changes
        run: |
          git diff --check
          test -f docs/SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md
          grep -q 'SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md' README.md
          grep -q 'SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md' ROADMAP.md
          grep -q 'SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md' docs/GLOSSARY.md
          grep -q 'Synthesis 24 — retention-maintenance trigger-regime findings' CASE_INDEX.md
          python - <<'PY'
          from pathlib import Path
          text = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          for n in range(2501, 2516):
              needle = f'**{n} —'
              count = text.count(needle)
              assert count == 1, (n, count)
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          assert '- [ ] Should the project formally distinguish quiescent retention' not in roadmap
          assert '- [x] Formally distinguish quiescent retention' in roadmap
          synthesis = Path('docs/SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md').read_text(encoding='utf-8')
          for phrase in [
              'quiescent retention',
              'continuous maintenance',
              'access-triggered restoration',
              'deadline-driven maintenance',
              'capacity/reclaim-triggered maintenance',
              'wear/lifetime-triggered policy',
              'failure/repair-triggered maintenance',
              'trigger regime ≠ response mechanism',
          ]:
              assert phrase in synthesis, phrase
          PY

      - name: Commit research changes
        run: |
          git add README.md ROADMAP.md CASE_INDEX.md docs/GLOSSARY.md docs/SYNTHESIS_24_RETENTION_MAINTENANCE_TRIGGER_REGIMES.md
          git commit -m "synthesis24: formalize retention maintenance regimes"
          git push origin HEAD:main

      - name: Remove one-shot integration scaffolding
        run: |
          git rm .github/scripts/integrate_synthesis24.py .github/workflows/integrate-synthesis24.yml
          git commit -m "chore: remove Synthesis 24 integration scaffolding"
          git push origin HEAD:main
