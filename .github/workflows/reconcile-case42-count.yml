name: Reconcile Case 42 count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-case42-count.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile count
        run: python3 .github/scripts/reconcile_case42_count.py
      - name: Validate and commit
        run: |
          grep -Fq 'After forty-three bounded cases' CASE_INDEX.md
          grep -Fq 'currently forty-three;' CASE_INDEX.md
          grep -Fq '400. **source-of-current-state role' CASE_INDEX.md
          rm -f .github/scripts/reconcile_case42_count.py .github/workflows/reconcile-case42-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md .github/scripts/reconcile_case42_count.py .github/workflows/reconcile-case42-count.yml
          git commit -m 'docs: reconcile Case 42 synthesis count'
          git push origin HEAD:main
