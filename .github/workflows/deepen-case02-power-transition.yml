name: deepen-case02-power-transition

on:
  push:
    paths:
      - '.github/workflows/deepen-case02-power-transition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    concurrency:
      group: technical-retention-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deepen Case 02 power-transition retention
        run: |
          bash scripts/deepen_case02_power_transition_retention.sh
