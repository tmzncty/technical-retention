name: integrate-case56

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/integrate_case56.py'
      - '.github/workflows/integrate-case56.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'tmzncty/technical-retention'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate Case 56
        run: python .github/scripts/integrate_case56.py
      - name: Commit integrated files and remove one-shot runner
        run: |
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md
          git rm .github/scripts/integrate_case56.py .github/workflows/integrate-case56.yml
          git status --short
          git commit -m "docs: integrate grounded Kafka replication case"
          git push origin HEAD:main
