name: Temporary Case149 Micron NAND OTP integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case149-micron-nand-otp.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate bounded Case149 research slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 _automation_case149_micron_nand_otp.py
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'CASE_INDEX.md',
              'ROADMAP.md',
              'cases/149-micron-nand-otp-data-protect-irreversible-authority.md',
              'evidence/149-micron-2004-2006-nand-otp-data-protect-grounding.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          rm -f _automation_case149_micron_nand_otp.py .github/workflows/tmp-case149-micron-nand-otp.yml
          git diff --check
          test -f cases/149-micron-nand-otp-data-protect-irreversible-authority.md
          test -f evidence/149-micron-2004-2006-nand-otp-data-protect-grounding.md
          grep -q '3216 — 2006 product-document floor != invention date' CASE_INDEX.md
          grep -q '3233 — related-repository boundary' CASE_INDEX.md
          grep -q 'Case 149 Micron NAND OTP Data Protect irreversible-authority slice' ROADMAP.md
          grep -q 'programmed != protected' cases/149-micron-nand-otp-data-protect-irreversible-authority.md
          test ! -e _automation_case149_micron_nand_otp.py
          test ! -e .github/workflows/tmp-case149-micron-nand-otp.yml
          git config user.name 'technical-retention automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case149: ground Micron NAND OTP irreversible protection'
          git push origin HEAD:main
