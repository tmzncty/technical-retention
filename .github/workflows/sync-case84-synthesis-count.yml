name: sync-case84-synthesis-count

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/sync_case84_synthesis_count.py'
      - '.github/workflows/sync-case84-synthesis-count.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync synthesis count
        run: python .github/scripts/sync_case84_synthesis_count.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -Fq 'currently eighty-five (Cases 00–84);' CASE_INDEX.md
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md
          git commit -m 'case84: sync synthesis gate case count'
          git push
