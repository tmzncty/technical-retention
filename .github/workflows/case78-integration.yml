name: Case 78 integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case78-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 78
        run: python .github/case78_integrate.py
      - name: Validate and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes'; exit 1; } || true
          git commit -m "case78: ground NAND bad-block retention metadata"
          git push
