name: Integrate Case 27 navigation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-case27-ceph-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_after_substring(path, marker, line):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines()
              if line in lines:
                  return
              for i, old in enumerate(lines):
                  if marker in old:
                      lines.insert(i + 1, line)
                      p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                      return
              raise SystemExit(f'missing marker in {path}: {marker}')

          # README navigation
          case_line = '- [`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) — grounded coded-integrity bridge: Luminous ties mutable erasure-coded overwrites to BlueStore checksumming and deep scrub, while the 12.2.6–12.2.8 digest regression shows that integrity metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before ordinary trust is restored.'
          insert_after_substring('README.md', 'cases/26-google-gfs-inactive-chunk-integrity.md', case_line)
          evidence_line = '- [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md) — Case-27 grounding record: tag-matched Luminous source documentation and official 2018 correction records separate EC algebra, BlueStore checksum state, scrub coverage, checksum-metadata authority, diagnostic mismatch, and restored integrity confidence without inventing an exact per-shard repair algorithm.'
          insert_after_substring('README.md', 'evidence/26-gfs-2003-integrity-scan-grounding.md', evidence_line)

          # ROADMAP distributed bridge and comparison questions
          p = Path('ROADMAP.md')
          road = p.read_text(encoding='utf-8')
          old_count = '**partially advanced by grounded Cases 19, 23, 24, 25, and 26**'
          new_count = '**partially advanced by grounded Cases 19, 23, 24, 25, 26, and 27**'
          if old_count in road:
              road = road.replace(old_count, new_count, 1)
          elif new_count not in road:
              raise SystemExit('distributed case-count anchor missing')

          old_tail = 'The broad item stays unchecked because other mutable-EC consistency protocols, delete/tombstone semantics, coded-fragment distributed integrity scrubbing, cross-region coded maintenance, later Swift durability-marker/on-disk evolution, later GFS/Colossus integrity semantics, and additional repair-bandwidth/failure models remain separate regimes.'
          add = '[`cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md`](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md), grounded by [`evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md`](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md), adds a bounded mutable-EC integrity regime: Luminous gates EC overwrites on BlueStore checksum/deep-scrub support, while the 12.2.6–12.2.8 digest incident shows that the integrity metadata used to qualify stored state can itself become inconsistent, temporarily lose authority, and require a full verification/repair pass before trust is restored. '
          new_tail = 'The broad item stays unchecked because other mutable-EC consistency protocols, delete/tombstone semantics, exact coded-shard scrub repair and authoritative-source selection, cross-region coded maintenance, later Swift durability-marker/on-disk evolution, later GFS/Colossus integrity semantics, later Ceph/BlueStore automatic-repair semantics, and additional repair-bandwidth/failure models remain separate regimes.'
          if old_tail in road:
              road = road.replace(old_tail, add + new_tail, 1)
          elif 'cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md' not in road:
              raise SystemExit('distributed open-gap anchor missing')

          q = '- [ ] In integrity-qualified coded storage, how should `coded recoverability`, `local checksum validity`, `checksum-metadata authority`, `scrub coverage`, `diagnostic mismatch`, and `restored repair confidence` be separated?'
          if q not in road:
              lines = road.splitlines()
              marker = '- [ ] In distributed integrity maintenance, how should `version currentness`, `checksum validity`, `demand-time versus idle-time discovery`, `fallback read availability`, `valid-replica count`, `clone repair`, and `restored replication goal` be separated?'
              for i, line in enumerate(lines):
                  if line == marker:
                      lines.insert(i + 1, q)
                      road = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('phase-3 distributed-integrity question anchor missing')

          narrative = "The grounded Ceph Luminous EC-integrity bridge adds a verifier-authority boundary to the coded-storage cases. Luminous explicitly ties mutable EC overwrites to BlueStore checksumming and deep scrub, but the 12.2.6 regression demonstrates that retained checksum metadata can itself become inconsistent and cause read failures. The 12.2.7–12.2.8 workaround/repair sequence therefore forces future integrity comparisons to distinguish **payload corruption**, **integrity-metadata inconsistency**, **checksum mismatch as a diagnostic relation**, **temporary withdrawal of verifier authority**, and **full verification coverage as a return-to-trust milestone**. This does not establish the exact per-shard repair algorithm, which remains separate implementation archaeology."
          if narrative not in road:
              phase4 = '\n---\n\n## Phase 4 — Technical forgetting\n'
              if phase4 not in road:
                  raise SystemExit('Phase 4 anchor missing')
              road = road.replace(phase4, '\n' + narrative + '\n' + phase4, 1)

          forget = '- [ ] stale/corrupt integrity metadata, false checksum mismatch, or premature restoration of trust before prescribed verification coverage;'
          if forget not in road:
              lines = road.splitlines()
              for i, line in enumerate(lines):
                  if 'cross-timestamp fragment mixing' in line:
                      lines.insert(i + 1, forget)
                      road = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('Phase 4 mutable-EC forgetting anchor missing')
          p.write_text(road, encoding='utf-8')

          # CASE_INDEX row, matrix, findings, count
          p = Path('CASE_INDEX.md')
          ci = p.read_text(encoding='utf-8')
          row = '| [Ceph Luminous EC Overwrites: BlueStore Checksums, Deep Scrub, and Integrity-Metadata Authority](cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md) | **grounded** | mutable erasure-coded chunks + CRUSH placement + BlueStore data/metadata checksums + scheduled light/deep scrub + release-scoped digest trust state | separate algebraic EC recoverability from local integrity qualification; show checksum metadata itself can become inconsistent, be distrusted, and require a verification/repair pass before trust is restored | [2017–2018 Ceph Luminous EC scrub grounding](evidence/27-ceph-luminous-2017-2018-ec-scrub-grounding.md); exact Luminous per-shard scrub-repair selection, later BlueStore checksum evolution, and modern auto-repair remain separate work |'
          if row not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| [Google File System Inactive-Chunk Verification:'):
                      lines.insert(i + 1, row)
                      ci = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('Case 26 row anchor missing')

          matrix = '| Ceph Luminous / 2017–2018 bounded EC-integrity regime | mutable EC data/coding chunks + CRUSH placement + BlueStore stored data/metadata checksums + PG scrub/deep-scrub state + release-scoped digest trust | overwrite-time checksum maintenance; scheduled/throttled light/deep scrub; incident workaround that distrusts bad digest state; full deep-scrub requalification/repair | ordinary reads depend on storage integrity paths; the 12.2.6 regression could return EIO when stored per-object checksum state was stale, so mismatch diagnosis is not identical to payload corruption | object/pool → EC profile/chunk index → CRUSH OSD placement → BlueStore extent + checksum relation; code membership and local integrity qualification are separate | chunks remain placed/coded while integrity metadata can become untrusted and later be repaired/requalified; exact bad-shard reconstruction is outside this slice | no complete history; current coded payload plus placement, integrity metadata, scrub coverage, and release-correct trust relations are retained |'
          if matrix not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| Google File System / 2003 bounded integrity regime |'):
                      lines.insert(i + 1, matrix)
                      ci = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('GFS matrix anchor missing')

          findings = [
              '244. **coded recoverability ≠ integrity-qualified recoverability** — Luminous EC profiles describe which chunk-loss patterns remain decodable, but BlueStore checksum/deep-scrub support exists because surviving indexed chunks still need local integrity qualification before nominal coding margin can be treated as trustworthy.',
              '245. **checksum presence ≠ checksum authority** — the 12.2.6 regression left some stored per-object checksum values stale; 12.2.7 therefore added a mode that explicitly distrusts those digests. Retaining a verifier is weaker than retaining a verifier the system may safely believe.',
              '246. **checksum mismatch ≠ universal proof of payload corruption** — the Luminous regression provides a concrete counterexample in which the maintained checksum relation itself was inconsistent and could produce `EIO`; a mismatch establishes a diagnostic inconsistency, not automatically which side of the relation is wrong.',
              '247. **integrity metadata is maintained retained state** — BlueStore checksum values consume metadata space, are updated through writes, read during verification, and in the bounded incident had to be repaired. They are constitutive operational state rather than timeless annotations outside the storage system.',
              '248. **checksum existence ≠ scrub coverage** — Luminous separately schedules and throttles scrub/deep-scrub work. Stored checksums may exist long before a background pass has exercised the relevant population, so verification coverage has its own temporality and resource budget.',
              '249. **nominal EC margin ≠ verified repair confidence** — `K/M` geometry and CRUSH placement can remain nominally intact while hidden corruption or untrusted digest state reduces confidence in which surviving chunks are safe future reconstruction inputs.',
              '250. **full verification coverage can be a repair milestone** — the 12.2.8 procedure required a full-cluster deep scrub and resolution of digest inconsistencies before the temporary distrust workaround could be disabled; returning verifier authority was gated by completed verification/repair work.',
              '251. **mutable EC support can depend on lower-layer integrity semantics** — Luminous permits `allow_ec_overwrites` only on BlueStore because its checksumming is used for deep-scrub corruption detection. A high-level coding feature can therefore depend on a lower storage layer retaining and maintaining integrity state.',
              '252. **Ceph Luminous deep scrub ≠ GFS `scan and verify` ≠ ZFS scrub, and later Ceph ≠ early RADOS** — these regimes are functionally comparable at proactive integrity maintenance, but their historical vocabulary, redundancy form, currentness rules, verifier state, and release semantics differ. Shared function or project lineage is not one historical mechanism.'
          ]
          if '244. **coded recoverability ≠ integrity-qualified recoverability**' not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('243. '):
                      lines[i+1:i+1] = findings
                      ci = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('finding 243 anchor missing')

          # Count/coherence wording. Only project tally prose should use these word forms.
          ci = ci.replace('twenty-seven bounded cases', 'twenty-eight bounded cases')
          ci = ci.replace('twenty-seven grounded', 'twenty-eight grounded')
          ci = ci.replace('currently twenty-seven', 'currently twenty-eight')
          ci = ci.replace('After twenty-seven', 'After twenty-eight')
          ci = ci.replace('across twenty-seven', 'across twenty-eight')
          p.write_text(ci, encoding='utf-8')
          PY

          rm .github/workflows/automation-case27-ceph-integrate.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md .github/workflows/automation-case27-ceph-integrate.yml
          git diff --cached --check
          grep -q 'cases/27-ceph-luminous-ec-deep-scrub-checksum-authority.md' README.md ROADMAP.md CASE_INDEX.md
          grep -q '244. \*\*coded recoverability ≠ integrity-qualified recoverability\*\*' CASE_INDEX.md
          grep -q 'integrity-qualified coded storage' ROADMAP.md
          git commit -m "docs: integrate grounded Ceph Luminous integrity bridge"
          git push
