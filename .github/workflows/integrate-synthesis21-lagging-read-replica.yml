name: Integrate Synthesis 21 lagging read-replica freshness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-synthesis21-lagging-read-replica.yml'
      - 'scripts/integrate_synthesis21_lagging_read_replica.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply bounded synthesis integration
        run: |
          python scripts/integrate_synthesis21_lagging_read_replica.py
          sed -i 's/[[:space:]]\+$//' \
            docs/SYNTHESIS_21_LAGGING_READ_REPLICA_FRESHNESS_AUTHORITY.md \
            README.md ROADMAP.md CASE_INDEX.md
          perl -0pi -e 's/\n+\z/\n/' CASE_INDEX.md
      - name: Validate canonical diff
        run: |
          test -f docs/SYNTHESIS_21_LAGGING_READ_REPLICA_FRESHNESS_AUTHORITY.md
          grep -q '^# Synthesis 21 — Lagging Read-Replica Freshness' docs/SYNTHESIS_21_LAGGING_READ_REPLICA_FRESHNESS_AUTHORITY.md
          grep -q 'SYNTHESIS_21_LAGGING_READ_REPLICA_FRESHNESS_AUTHORITY' README.md
          grep -q '^\- \[x\] In lagging read replicas' ROADMAP.md
          grep -q '^## Synthesis 21 — Lagging read-replica freshness findings$' CASE_INDEX.md
          grep -q '^\- \*\*2251 — mutation authority ≠ read-serving authority:' CASE_INDEX.md
          grep -q '^\- \*\*2268 — related-repository boundary:' CASE_INDEX.md
          test ! -e scripts/integrate_synthesis21_lagging_read_replica.py
          test ! -e .github/workflows/integrate-synthesis21-lagging-read-replica.yml
          git diff --check
      - name: Commit synthesis and one-shot cleanup
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs/SYNTHESIS_21_LAGGING_READ_REPLICA_FRESHNESS_AUTHORITY.md \
            README.md ROADMAP.md CASE_INDEX.md \
            scripts/integrate_synthesis21_lagging_read_replica.py \
            .github/workflows/integrate-synthesis21-lagging-read-replica.yml
          git diff --cached --check
          git commit -m "synthesis21: separate lagging read-replica freshness layers"
          git push
