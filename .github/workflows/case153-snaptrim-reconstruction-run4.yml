name: Case 153 snaptrim reconstruction integration run 4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case153-snaptrim-reconstruction-run4.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Apply and finalize Case 153 reconstruction research
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -f .github/case153_snaptrim_reconstruction_patch.py
          rm -f evidence/153-ceph-2016-pg-activation-trim-obligation-reconstruction-deepening.md
          python3 .github/case153_snaptrim_reconstruction_patch.py
          sed -i 's/[[:space:]]\+$//' cases/153-ceph-rados-snaptrim-asynchronous-reclamation.md
          sed -i 's/[[:space:]]\+$//' evidence/153-ceph-2016-pg-activation-trim-obligation-reconstruction-deepening.md
          sed -i 's/[[:space:]]\+$//' docs/SYNTHESIS_28_RECLAMATION_AUTHORITY_AFTER_RETIREMENT.md
          sed -i 's/[[:space:]]\+$//' ROADMAP.md
          sed -i 's/[[:space:]]\+$//' CASE_INDEX.md
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'cases/153-ceph-rados-snaptrim-asynchronous-reclamation.md',
              'evidence/153-ceph-2016-pg-activation-trim-obligation-reconstruction-deepening.md',
              'docs/SYNTHESIS_28_RECLAMATION_AUTHORITY_AFTER_RETIREMENT.md',
              'ROADMAP.md',
              'CASE_INDEX.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .github/case153_snaptrim_reconstruction_patch.py
          rm -f .github/case153_snaptrim_debug.txt
          rm -f .github/case153_snaptrim_debug2.txt
          rm -f .github/case153_snaptrim_debug3.txt
          rm -f .github/workflows/case153-snaptrim-reconstruction-integration.yml
          rm -f .github/workflows/case153-snaptrim-reconstruction-run2.yml
          rm -f .github/workflows/case153-snaptrim-reconstruction-run3.yml
          rm -f .github/workflows/case153-snaptrim-reconstruction-run4.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "case153: deepen snaptrim obligation reconstruction [skip ci]"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
