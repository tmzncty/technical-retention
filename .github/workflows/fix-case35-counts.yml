name: fix-case35-counts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-case35-counts.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile CASE_INDEX counts
        run: python3 tools/fix_case35_counts.py
      - name: Validate
        run: git diff --check
      - name: Commit and clean staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-case35-counts.yml tools/fix_case35_counts.py
          git add CASE_INDEX.md
          git commit -m "docs: reconcile Case 35 index counts"
          git push origin HEAD:main
