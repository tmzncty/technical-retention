name: integrate-case37-samsung-840-evo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-case37-samsung-840-evo.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Case 37 navigation and status
        run: python3 tools/integrate_case37.py
      - name: Validate diff
        run: git diff --check
      - name: Validate links and counts
        run: |
          grep -q 'cases/37-samsung-840-evo-old-data-performance-refresh.md' README.md ROADMAP.md CASE_INDEX.md
          grep -q 'evidence/37-samsung-840-evo-2014-2015-performance-refresh-grounding.md' README.md ROADMAP.md CASE_INDEX.md
          grep -q 'After thirty-eight bounded cases' CASE_INDEX.md
          grep -q '349. \*\*commercial refresh deployment ≠ generic NAND requirement or academic-algorithm identity\*\*' CASE_INDEX.md
          grep -q 'In controller-managed Flash' ROADMAP.md
      - name: Commit integrated state and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-case37-samsung-840-evo.yml tools/integrate_case37.py
          git add README.md ROADMAP.md CASE_INDEX.md
          git commit -m "docs: integrate grounded Samsung 840 EVO performance-refresh bridge"
          git push origin HEAD:main
