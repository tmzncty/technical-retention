The current NIST text also warns against equating verification with mandatory raw-media forensics: absent an organizational requirement, elaborate full or representative post-sanitize sampling is not generally necessary. Case 47's FAST '11 raw-Flash dismantling experiment therefore remains a stronger, different empirical observation path, not the definition of NIST Rev.-2 verification.

'''
