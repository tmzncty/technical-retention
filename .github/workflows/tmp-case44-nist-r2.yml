## Scope

This evidence note deepens Case 44 at a deliberately later institutional layer. It does **not** revise the historical meaning of NVM Express 1.3 (2017), and it does not claim that NIST SP 800-88 Rev. 2 is an NVMe conformance specification.

The bounded question is:

> After a storage interface reports that a sanitization operation completed, what further evidence or decision is needed before an organization accepts the target data as effectively sanitized — especially when the data owner no longer controls the underlying physical media?

The answer is grounded in two first-party NIST sources:

- **NIST SP 800-88 Rev. 2, _Guidelines for Media Sanitization_**, September 2025, final publication; it supersedes Rev. 1 (December 2014).
- **Frequently Asked Questions for NIST SP 800-88r2**, published July 16, 2026, which clarifies the Revision-2 vocabulary for logical/cloud storage and sanitization assurance.

This is a current-guidance boundary and a later conceptual comparison. It must not be back-projected into the vocabulary or intentions of NVMe 1.3, FAST '11, or the 1991 NCSC guidance used elsewhere in this repository.

## Source status and chronology

### H/P — Rev. 2 is the current successor to Rev. 1

The NIST publication record dates SP 800-88r2 to **September 2025** and states that it supersedes SP 800-88r1. The PDF publication history says the Editorial Review Board approved the document on **September 12, 2025**. NIST's release announcement is dated **September 26, 2025**.

This matters because Case 44's existing Rev.-1 key-coverage discussion is now historical guidance. It remains useful as a period source for the 2014 CE formulation, but it should not be presented as NIST's current media-sanitization guidance.

### H/P — Rev. 2 deliberately moves away from a device-technique catalog

Appendix D's change log says that, apart from cryptographic erase (CE), detailed sanitization techniques and tools were replaced by recommendations to use current standards such as IEEE 2883, NSA specifications, or an organizationally approved standard. The document also shifts its center of gravity from hands-on media-specific instructions toward an agency/enterprise sanitization program.

Therefore:

> **current NIST program guidance != a device-command specification**.

NVMe `Sanitize`, ATA security erase, an SSD vendor utility, and a cloud-provider operation still need their own mechanism/interface evidence.

## Historical record — logical sanitization is broader than one overwrite verb

Section 3.1 divides sanitization techniques into **logical** and **physical** techniques. Logical techniques may use software or tools over an interface to replace data systematically, issue specific commands that cause data to be eliminated, **or eliminate access to the data**; their intent is to leave the information storage media (ISM) usable. Physical techniques apply external physical measures and generally leave the media unusable.

The same revision introduces **information storage media (ISM)** in place of the older `electronic (soft copy) media` vocabulary. Appendix D explicitly says this accommodates logical storage such as cloud storage as well as newer material media. The July 2026 FAQ makes the intended scope still clearer: ISM includes physical devices such as SSDs and tape as well as virtual/logical systems such as **cloud and object storage** that abstract the underlying physical media.

Two boundaries follow.

**Historical record:**

> **logical sanitization != necessarily host-visible overwrite**.

The current NIST category can include interface commands and access-elimination mechanisms as well as writes.

**Engineering reconstruction:**

> **logical storage ownership != ownership of the physical sanitization path**.

The latter is a project reconstruction from the cloud/abstraction boundary, not NIST's philosophical vocabulary.

## Historical record — verification and validation are different states of assurance

Section 4.5 introduces **sanitization assurance** and separates two activities.

### Verification

Section 4.5.1 defines sanitization verification as determining the outcome of the technique used during the sanitization operation. For logical clear/purge techniques using tools and systems, verification may inspect tool completion status, errors, anomalies, and the health of the ISM.

This is the layer at which an NVMe Sanitize Status log can become relevant evidence: it can contribute operation-completion/status information.

But the NIST definition does not make such a status bit the end of the assurance process.

### Validation

Section 4.5.2 defines sanitization validation as the decision whether the target data was effectively sanitized. It considers verification results, identified errors/anomalies, data sensitivity, and residual confidentiality risk; unacceptable risk means the result is rejected and another technique or stronger method is required.

Therefore:

> **operation/technique completion evidence != validation acceptance**.

And, more specifically for Case 44:

> **NVMe sanitize-operation completion status != by itself a NIST Rev.-2 sanitization-validation verdict**.

The second statement is an engineering comparison across two different normative layers, not a claim that NIST defines the semantics of the NVMe log page.

## Historical record — a technically completed operation can still be ineffective

Revision 2 gives explicit counterexamples that prevent `completed successfully` from becoming a universal synonym for `target data effectively sanitized`.

Section 4.5.2 says a degaussing operation applied to an SSD can complete successfully while sanitizing **no sensitive data**, because the technique is inappropriate for the substrate. It also warns that simple write-based clear sanitization on media with **overprovisioning** may leave a substantial amount of user data unchanged because the scope was too narrow.

These examples independently reinforce two relations already visible in Cases 44 and 47:

> **procedure completion != substrate-appropriate sanitization**.

> **user-addressable overwrite coverage != complete target-data coverage on overprovisioned storage**.

The first is a current NIST policy/assurance claim. The second is also consistent with FAST '11's empirical raw-Flash observations, but no direct genealogy is asserted.

## Verification does not mean mandatory raw-media sampling

A crucial limit must be preserved. Section 4.5.1 states that, unless organizational policy explicitly requires it, elaborate full or representative sampling of an ISM's contents after clear or purge is **not necessary**. Appendix D says almost all older `verification` language was removed and that validation now focuses on errors, anomalies, and other issues from a confidentiality/sensitivity perspective.

Therefore:

> **NIST Rev.-2 verification/validation != FAST '11 raw-Flash forensic sampling by definition**.

FAST '11 provides a particularly strong experimental observation path for its tested SSDs: dismantling drives and reading flash directly. NIST Rev. 2 instead defines a programmatic assurance process that may accept other evidence and explicitly does not generally require such sampling.

This distinction prevents a tempting vocabulary collision. The same English word `verification` can name different evidence practices in different source traditions.

## Current 2026 clarification — cloud/virtual media move the forgetting boundary into relations and contracts

The July 16, 2026 FAQ states that in virtual/cloud environments the physical ISM is abstracted from the organization. Traditional physical destruction or overwrite commands are therefore impossible for the data owner to execute; in those logical-storage scenarios, CE is often the only viable purge method. The FAQ tells organizations to review cloud service agreements for secure key management and for **traceably validated zeroization**.

The FAQ also says the Revision-2 ISM term was chosen to cover cloud, container, and object-storage abstractions.

This gives a bounded distributed-storage comparison:

```text
data owner / tenant
    -> logical object or virtual storage relation
    -> provider-controlled physical embodiments
    -> key-management / service-contract / evidence path
    -> sanitization acceptance
```

Engineering reconstruction:

> **data-owner delete/sanitize intent != direct physical-media authority**.

> **physical-media abstraction can make sanitization evidence depend on retained key-management, provider, and traceability relations**.

These are not claims that every cloud service uses CE, nor that a service contract itself proves sanitization. The FAQ says CE is **often** the only viable purge method in the specified logical-storage situation and explicitly requires review of key management and traceable zeroization.

## Cross-case boundaries

### Case 44 — NVMe Deallocate / Sanitize

Case 44 establishes a device-interface state machine: a Sanitize command starts background work, Sanitize Status separately reports progress/result, and successful sanitization carries a stronger accessibility contract than Deallocate.

NIST Rev. 2 adds a later assurance layer:

```text
NVMe command accepted
    !=
NVMe sanitize operation completed
    !=
verification evidence judged technically satisfactory
    !=
validation decision that target-data confidentiality risk is acceptable
```

Only the first two states are NVMe-1.3 interface semantics. The latter two are current NIST assurance vocabulary.

### Case 47 — FAST '11 SSD sanitization verification

FAST '11 empirically bypasses the controller and inspects raw flash. Its result remains a strong implementation-level counterexample to trusting a command report alone.

NIST Rev. 2 does **not** retrospectively rename the FAST experiment, and FAST '11 does not establish the later NIST `verification`/`validation` distinction. The functional comparison is narrower:

> **reported success, observed operation outcome, and accepted effectiveness are separable evidence layers**.

### Case 02 — magnetic-core clearing/purging

The 1991 NCSC clearing/purging vocabulary is a historical security-assurance regime with its own definitions. NIST Rev.-2 `clear`, `purge`, `destroy`, `logical`, `physical`, `verification`, and `validation` should not be projected backward as if the terms were unchanged across 35 years.

