name: tmp-case44-nist-r2
on:
  push:
    paths:
      - '.github/workflows/tmp-case44-nist-r2.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded research patch
        shell: bash
        run: |
          echo '

' | base64 -d > /tmp/case44_patch.py
          python3 /tmp/case44_patch.py
          rm -f .github/workflows/tmp-case44-nist-r2.yml
          git diff --check
          git status --short
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CASE_INDEX.md ROADMAP.md cases/44-nvme13-deallocate-sanitize-forgetting.md evidence/44-nist-2025-2026-sanitization-assurance-logical-storage-deepening.md .github/workflows/tmp-case44-nist-r2.yml
