name: Case44 bounded integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-case44-nist-r2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research patch
        run: python .automation/case44_deepen.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-case44-nist-r2.yml .automation/case44_deepen.py
          git diff --check
          git status --short
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CASE_INDEX.md ROADMAP.md cases/44-nvme13-deallocate-sanitize-forgetting.md evidence/44-nist-2025-2026-sanitization-assurance-logical-storage-deepening.md .github/workflows/tmp-case44-nist-r2.yml .automation/case44_deepen.py
          git commit -m "case44: deepen sanitization assurance boundary"
          git push origin HEAD:main
