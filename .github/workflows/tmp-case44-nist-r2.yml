- NIST, **Frequently Asked Questions for NIST SP 800-88r2**, published July 16, 2026, especially Q1, Q3, Q7, Q9, and Q13: <https://csrc.nist.gov/files/pubs/sp/800/88/r2/final/docs/sp800-88r2-faq.pdf>

