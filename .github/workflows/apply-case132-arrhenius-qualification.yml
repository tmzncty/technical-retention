name: Apply Case 132 accelerated-retention qualification deepening

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_case132_arrhenius_qualification.py'
      - '.github/workflows/apply-case132-arrhenius-qualification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Case 132 deepening
        run: |
          set -euo pipefail
          python3 scripts/apply_case132_arrhenius_qualification.py

      - name: Validate research changes
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/132-2005-2013-arrhenius-qualification-boundary-deepening.md
          python3 - <<'PY'
          from pathlib import Path
          case = Path('cases/132-cryogenic-serial-flash-retention-operability.md').read_text(encoding='utf-8')
          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          idx = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          ev = Path('evidence/132-2005-2013-arrhenius-qualification-boundary-deepening.md').read_text(encoding='utf-8')
          assert case.count('### H/P — accelerated retention qualification is model-mediated and technology-qualified') == 1
          assert case.count('### E — accelerated-test time != directly observed use-life time') == 1
          assert case.count('132-2005-2013-arrhenius-qualification-boundary-deepening.md') >= 2
          assert roadmap.count('Case 132 accelerated-retention / Arrhenius qualification boundary deepening') == 1
          assert roadmap.count('132-2005-2013-arrhenius-qualification-boundary-deepening.md') == 2
          assert idx.count('## Case 132 deepening — accelerated-stress / Arrhenius qualification findings') == 1
          for n in range(2695, 2710):
              marker = f'**{n} —'
              assert idx.count(marker) == 1, (n, idx.count(marker))
          assert '## Historical record' in ev
          assert '## Engineering reconstruction' in ev
          assert '## Functional analogy — bounded' in ev
          assert '## Philosophical interpretation — bounded' in ev
          assert 'EB618 does not apply to this technology' in ev
          PY
          git diff --check

      - name: Commit research and remove integration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f scripts/apply_case132_arrhenius_qualification.py
          git rm -f .github/workflows/apply-case132-arrhenius-qualification.yml
          git add ROADMAP.md CASE_INDEX.md cases/132-cryogenic-serial-flash-retention-operability.md evidence/132-2005-2013-arrhenius-qualification-boundary-deepening.md
          git diff --cached --check
          git commit -m "case132: deepen accelerated-retention model boundary"
          git push origin HEAD:main
