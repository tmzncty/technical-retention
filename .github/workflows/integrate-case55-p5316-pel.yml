name: integrate-case55-p5316-pel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-case55-p5316-pel.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Integrate bounded named-product PEL research slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/recover-and-integrate-case55-p5316.py
          sed -i 's/[[:blank:]]\+$//' evidence/55-solidigm-d5-p5316-pel-product-adoption-deepening.md
          sed -i 's/[[:blank:]]\+$//' cases/55-nvme-smart-health-endurance-telemetry.md
          sed -i 's/[[:blank:]]\+$//' evidence/55-nvme14-2019-persistent-event-log-deepening.md
          sed -i 's/[[:blank:]]\+$//' ROADMAP.md
          sed -i 's/[[:blank:]]\+$//' CASE_INDEX.md
          git diff --check
          grep -q 'Findings 3716–3731' CASE_INDEX.md
          grep -q 'D5-P5316 named-product PEL adoption / conformance-label deepening' ROADMAP.md
          grep -q 'Named-product PEL-adoption deepening' cases/55-nvme-smart-health-endurance-telemetry.md
          grep -q 'feature support != whole-revision conformance claim' evidence/55-solidigm-d5-p5316-pel-product-adoption-deepening.md
          grep -q 'named-product adoption floor is now supplied' evidence/55-nvme14-2019-persistent-event-log-deepening.md
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention@users.noreply.github.com'
          git rm .github/workflows/integrate-case55-p5316-pel.yml
          git rm .github/scripts/recover-and-integrate-case55-p5316.py
          git add -A
          git status --short
          git commit -m 'case55: deepen named-product PEL adoption [skip ci]'
          git push
