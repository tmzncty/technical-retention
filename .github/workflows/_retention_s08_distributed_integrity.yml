name: retention-s08-distributed-integrity-one-shot
on:
  push:
    paths:
      - '.github/workflows/_retention_s08_distributed_integrity.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply distributed-integrity synthesis patch
        run: python3 .automation/s08_distributed_integrity_patch.py
      - name: Validate
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          assert '## Distributed replica-integrity lifecycle addendum' in Path('docs/SYNTHESIS_08_PROACTIVE_INTEGRITY_REPAIR_MARGIN.md').read_text()
          assert '1504. **distributed replica-integrity lifecycle synthesis ≠ implementation genealogy**' in Path('CASE_INDEX.md').read_text()
          PY
          git status --short
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CASE_INDEX.md docs/SYNTHESIS_08_PROACTIVE_INTEGRITY_REPAIR_MARGIN.md
          git commit -m 'synthesis: close distributed replica-integrity lifecycle'
          git push origin HEAD:main
