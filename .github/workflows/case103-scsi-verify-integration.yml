name: Case 103 host SCSI VERIFY integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case103-scsi-verify-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply bounded research slice
        run: python3 .github/scripts/integrate_case103.py

      - name: Validate research tree
        run: |
          git diff --check
          test -f cases/103-scsi-verify-host-driven-medium-qualification.md
          test -f evidence/103-scsi-1990-2005-verify-grounding.md
          grep -Fq '## Case 103 — Host-Driven SCSI VERIFY findings' CASE_INDEX.md
          grep -Fq 'Host-driven SCSI VERIFY / explicit-range medium-qualification boundary' ROADMAP.md
          grep -Fq 'host-issued verification ≠ autonomous background scan' CASE_INDEX.md
          grep -Fq 'medium verification ≠ initiator-supplied byte comparison' cases/103-scsi-verify-host-driven-medium-qualification.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' CASE_INDEX.md ROADMAP.md cases/103-scsi-verify-host-driven-medium-qualification.md evidence/103-scsi-1990-2005-verify-grounding.md | sort)"
          test "$changed" = "$expected"

      - name: Commit research
        run: |
          git add CASE_INDEX.md ROADMAP.md cases/103-scsi-verify-host-driven-medium-qualification.md evidence/103-scsi-1990-2005-verify-grounding.md
          git commit -m 'case103: ground host SCSI VERIFY maintenance boundary'
          git push origin main

      - name: Remove one-shot integration files
        run: |
          git rm .github/scripts/integrate_case103.py .github/workflows/case103-scsi-verify-integration.yml
          git commit -m 'chore: remove case103 one-shot integration files'
          git push origin main
