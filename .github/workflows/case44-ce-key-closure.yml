name: case44 cryptographic erase key-coverage deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case44-ce-key-closure.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate bounded Case 44 deepening
        shell: bash
        run: |
          python scripts/.case44_ce_key_deepening.py
          git rm .github/workflows/case44-ce-key-closure.yml scripts/.case44_ce_key_deepening.py
          git diff --check
          grep -Fq 'cryptographic forgetting is closure over a decryptability relation' cases/44-nvme13-deallocate-sanitize-forgetting.md
          grep -Fq 'NIST SP 800-88 Rev. 1 §§2.6.1–2.6.3 / Appendix D' evidence/44-nvme12-13-deallocate-sanitize-grounding.md
          grep -Fq 'one-key deletion ≠ decryptability closure' ROADMAP.md
          grep -Fq '1426. **cryptographic forgetting can be modeled as decryptability closure' CASE_INDEX.md
          test ! -e .github/workflows/case44-ce-key-closure.yml
          test ! -e scripts/.case44_ce_key_deepening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases/44-nvme13-deallocate-sanitize-forgetting.md evidence/44-nvme12-13-deallocate-sanitize-grounding.md ROADMAP.md CASE_INDEX.md
          git commit -m 'case44: deepen cryptographic erase key-coverage boundary'
          git push origin HEAD:main
