name: case44 cryptographic erase key-coverage deepening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case44-ce-key-closure.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit bounded Case 44 deepening
        shell: bash
        run: |
          python scripts/.case44_ce_key_deepening.py
          git rm .github/workflows/case44-ce-key-closure.yml scripts/.case44_ce_key_deepening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case44: deepen cryptographic erase key-coverage boundary'
          git push origin HEAD:main
