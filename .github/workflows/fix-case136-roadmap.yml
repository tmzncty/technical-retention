name: Normalize Case 136 roadmap navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-case136-roadmap.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate Case 136 navigation token
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          bad = 'Cases 17, 18, 136, 136, and 140'
          good = 'Cases 17, 18, 136, and 140'
          assert bad in s, 'expected duplicate navigation token not found'
          s2 = s.replace(bad, good)
          assert bad not in s2
          p.write_text(s2, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-case136-roadmap.yml
          git add -A
          git diff --cached --check
          git config user.name 'technical-retention-automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git commit -m 'case136: normalize roadmap navigation [skip ci]'
          git push origin HEAD:main
