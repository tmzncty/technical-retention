name: automation-case141-run
on:
  push:
    paths:
      - '.github/workflows/automation-case141-run.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diagnose Case 141 integration
        shell: bash
        run: |
          set +e
          python3 scripts/tmp_case141_physical_slot_integrate.py > /tmp/case141.out 2>&1
          rc=$?
          cat /tmp/case141.out
          if [ "$rc" -ne 0 ]; then
            cp /tmp/case141.out .case141-integration-error.txt
            git config user.name "tmzncty"
            git config user.email "72063145+tmzncty@users.noreply.github.com"
            git add .case141-integration-error.txt
            git commit -m "automation: capture Case 141 integration error [skip ci]"
            git push
            exit 0
          fi
          git config user.name "tmzncty"
          git config user.email "72063145+tmzncty@users.noreply.github.com"
          git add evidence/141-postgresql-2018-2020-physical-slot-advance-persistence-deepening.md \
                  cases/141-postgresql-replication-slot-wal-retention-frontier.md \
                  ROADMAP.md CASE_INDEX.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only
          git commit -m "case141: deepen physical-slot advance persistence [skip ci]"
          git push
