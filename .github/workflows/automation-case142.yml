name: automation case142 integration

on:
  push:
    branches: [main]
    paths:
      - '.automation/case142-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate Case142 navigation and status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          case_path = Path('cases/142-ceph-reef-capacity-gated-recovery.md')
          evidence_path = Path('evidence/142-ceph-reef-capacity-gated-recovery-grounding.md')
          if not case_path.exists() or not evidence_path.exists():
              raise SystemExit('Case 142 canonical files are missing')

          # ---- CASE_INDEX ----
          index_path = Path('CASE_INDEX.md')
          ci = index_path.read_text(encoding='utf-8')

          row = '| [Ceph Reef Capacity-Gated Recovery: Repair Headroom, Admission, and Redundancy Debt](cases/142-ceph-reef-capacity-gated-recovery.md) | **grounded** | surviving RADOS replicas + PG degraded/clean state + recovery/backfill need + destination fullness admission + OSDMap fullness-policy state | separate serviceability, configured redundancy, repair need, reservation/admission, destination headroom, projected occupancy, explicit operator suspension, and foreground write-stop thresholds | [Reef capacity-gated recovery grounding](evidence/142-ceph-reef-capacity-gated-recovery-grounding.md); first-introduction genealogy, source-level state-machine history, mClock interaction, named-cluster traces, and fault/capacity experiments remain open |'

          if row not in ci:
              lines = ci.splitlines()
              anchors = [i for i, line in enumerate(lines)
                         if line.startswith('| [PostgreSQL Replication Slots:')
                         and 'cases/141-postgresql-replication-slot-wal-retention-frontier.md' in line]
              if not anchors:
                  raise SystemExit('Case 141 table row anchor not found')
              lines.insert(anchors[-1] + 1, row)
              ci = '\n'.join(lines) + '\n'

          heading = '## Case 142 — Ceph Reef capacity-gated recovery findings'
          if heading not in ci:
              nums = [int(x) for x in re.findall(r'(?m)^- \*\*(\d+) —', ci)]
              if not nums:
                  raise SystemExit('No existing finding numbers found')
              n = max(nums) + 1
              findings = [
                  ('`active` != `clean`', 'Reef PG documentation defines `active` as processing requests and `clean` as having every object replicated the correct number of times; the monitor guide explicitly allows `active+degraded` operation while aiming to recover to `active+clean`. (`H/P`, `E`)'),
                  ('serviceability != restored configured redundancy', 'a PG may still serve while some objects have not yet regained the configured replica count; current request admission and restored redundancy are distinct relations. (`H/P`, `E`)'),
                  ('repair required != repair currently admitted', '`recovery_toofull` and `backfill_toofull` are waiting states caused by destination fullness, not declarations that missing replica work is no longer required. (`H/P`, `E`)'),
                  ('`recovery_toofull` != `backfill_toofull`', 'Reef uses the full ratio for the former and the lower backfillfull ratio for the latter; recovery and backfill remain related but separately gated maintenance paths. (`H/P`)'),
                  ('backfill reservation rejection != repair-obligation discharge', 'Reef recovery-reservation documentation says a too-full target can reject a remote backfill reservation; the primary drops its local reservation, waits, and retries indefinitely. (`H/P`, `E`)'),
                  ('queue/reservation waiting != capacity rejection', '`backfill_wait` and `backfill_toofull` encode different causes of delayed maintenance and should not be normalized into one generic “repair pending” state. (`H/P`, `E`)'),
                  ('current occupancy != projected post-backfill occupancy', '`OSD_BACKFILLFULL` may be raised when a destination would cross the threshold if currently mapped backfills finished, so already-promised future occupancy can constrain present admission. (`H/P`, `E`)'),
                  ('warning threshold != repair-admission threshold != write-stop threshold', '`nearfull`, `backfillfull`, and `full` have different roles; Reef documents defaults of 0.85, 0.90, and 0.95 respectively and expects ordered threshold semantics. (`H/P`)'),
                  ('destination placement suitability != destination capacity admissibility', 'an OSD may be a placement/backfill target yet still be rejected because the configured fullness policy says it lacks acceptable headroom. (`H/P`, `E`)'),
                  ('configuration-file text != current fullness-policy authority after cluster creation', 'Reef says the relevant ratios are stored in the OSDMap after cluster creation and that OSDs use those OSDMap values rather than ordinary config-file/central-config values. (`H/P`, `E`)'),
                  ('small retained policy state can govern large replica movement', 'OSDMap fullness ratios are tiny control state but can determine whether PG populations may be copied into a destination. (`E`)'),
                  ('automatic capacity gate != explicit administrator suspension', '`backfill_toofull`/`recovery_toofull` are capacity conditions, while `nobackfill`, `norecover`, and `norebalance` are explicit control flags that suspend maintenance. (`H/P`, `E`)'),
                  ('source recoverability != destination admissibility', 'Case 98 `unfound` concerns absence of a found current source; Case 142 concerns a repair path whose destination is blocked by capacity policy. (`A`, `X`)'),
                  ('repair priority != repair admission', 'Case 136 rebuild-rate policy changes the share/priority of admitted repair; Case 142 shows a destination operation can instead be rejected before execution. (`A`, `X`)'),
                  ('repair headroom is retention infrastructure, not retained payload', 'free capacity matters because a future replacement embodiment needs an admissible destination; this does not make unused blocks themselves part of the logical object. (`E`, `X`)'),
                  ('fullness-policy threshold != physical media-retention threshold', '`backfillfull`/`full` are cluster operational policies and do not establish NAND/HDD corruption, charge-loss, or media-endurance boundaries. (`H/P`, `X`)'),
                  ('repair/backfill completion != secure deletion of stale source copies', 'replica convergence and old-placement retirement do not by themselves establish overwrite, block erase, crypto erase, or forensic disappearance. (`E`, `X`)'),
                  ('Reef witness != first-introduction genealogy', 'the case is bounded to the Reef 18.2.x documentation line and does not claim Reef invented fullness ratios, recovery reservations, or `*_toofull`; those release/source genealogies remain open. (`H/P`, `X`)'),
                  ('related-repository boundary', 'a fresh `tmzncty/computing-archaeology` search for `Ceph backfillfull` found no dedicated study; exact mechanism genealogy and scheduler/source evolution belong there if developed, while Case 142 keeps the retention-specific admission/headroom comparison. (`H/P` project-state record)')
              ]
              sec = [heading, '', 'Grounding record: [`evidence/142-ceph-reef-capacity-gated-recovery-grounding.md`](evidence/142-ceph-reef-capacity-gated-recovery-grounding.md).', '']
              for title, body in findings:
                  sec.append(f'- **{n} — {title}:** {body}')
                  n += 1
              ci = ci.rstrip() + '\n\n' + '\n'.join(sec) + '\n'

          index_path.write_text(ci, encoding='utf-8')

          # ---- ROADMAP ----
          roadmap_path = Path('ROADMAP.md')
          rm = roadmap_path.read_text(encoding='utf-8')

          completed = '- [x] Case 142 Ceph Reef capacity-gated recovery / repair-headroom slice — [`cases/142-ceph-reef-capacity-gated-recovery.md`](cases/142-ceph-reef-capacity-gated-recovery.md) + [`evidence/142-ceph-reef-capacity-gated-recovery-grounding.md`](evidence/142-ceph-reef-capacity-gated-recovery-grounding.md): Reef first-party documentation separates `active` from `clean`, `recovery_toofull` from `backfill_toofull`, ordinary reservation waiting from fullness rejection, and capacity-gated delay from explicit `nobackfill`/`norecover` suspension. A too-full backfill target can reject a remote reservation while the primary retries later, and `OSD_BACKFILLFULL` can account for projected occupancy if already mapped backfills finish. The active nearfull/backfillfull/full values are OSDMap state after cluster creation. This closes only the bounded `serviceability vs redundancy debt vs repair admission vs destination headroom vs retained fullness policy` relation; first-introduction genealogy, source-level state-machine evolution, mClock interaction, named-cluster traces, and fault/capacity experiments remain open.'

          if 'Case 142 Ceph Reef capacity-gated recovery / repair-headroom slice' not in rm:
              lines = rm.splitlines()
              anchor_positions = [i for i, line in enumerate(lines)
                                  if 'Case 141 PostgreSQL 9.4→13 replication-slot WAL-retention-frontier slice' in line]
              if not anchor_positions:
                  raise SystemExit('ROADMAP Case 141 completed-slice anchor not found')
              lines.insert(anchor_positions[-1] + 1, completed)
              rm = '\n'.join(lines) + '\n'

          lines = rm.splitlines()
          distributed_found = False
          for i, line in enumerate(lines):
              if line.startswith('- [ ] distributed replication and erasure coding beyond RADOS'):
                  distributed_found = True
                  # Extend the grounded-case list without relying on a fixed previous tail.
                  m = re.search(r'\*\*partially advanced by grounded Cases ([^*]+)\*\*', line)
                  if not m:
                      raise SystemExit('Distributed grounded-case list not found')
                  ids = m.group(1)
                  if re.search(r'\b142\b', ids) is None:
                      if ', and 141' in ids:
                          new_ids = ids.replace(', and 141', ', 141, and 142')
                      elif ids.endswith('141'):
                          new_ids = ids[:-3].rstrip(', ') + ', 141, and 142'
                      else:
                          new_ids = ids.rstrip() + ', and 142'
                      line = line[:m.start(1)] + new_ids + line[m.end(1):]
                  sentence = ' Case 142 adds a later Ceph capacity-admission boundary: a PG can remain serviceable but degraded while recovery/backfill is still owed, yet a destination may reject backfill under OSDMap fullness policy and retry later; this separates source recoverability, configured redundancy, repair priority, repair admission, projected occupancy, and spare repair headroom.'
                  if 'Case 142 adds a later Ceph capacity-admission boundary' not in line:
                      phrase = ' The broad item stays unchecked because'
                      if phrase not in line:
                          raise SystemExit('Distributed roadmap tail marker not found')
                      line = line.replace(phrase, sentence + phrase, 1)
                  lines[i] = line
                  break
          if not distributed_found:
              raise SystemExit('Distributed roadmap item not found')
          rm = '\n'.join(lines) + '\n'
          roadmap_path.write_text(rm, encoding='utf-8')
          PY

          test "$(grep -c '^| \[Ceph Reef Capacity-Gated Recovery:' CASE_INDEX.md)" -eq 1
          test "$(grep -c '^## Case 142 — Ceph Reef capacity-gated recovery findings$' CASE_INDEX.md)" -eq 1
          test "$(grep -c 'Case 142 Ceph Reef capacity-gated recovery / repair-headroom slice' ROADMAP.md)" -eq 1
          test "$(grep -c 'Case 142 adds a later Ceph capacity-admission boundary' ROADMAP.md)" -eq 1
          git diff --check

          git rm -f --ignore-unmatch .automation/case142-trigger.txt .github/workflows/automation-case142.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CASE_INDEX.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Case142 navigation changes to commit'
            exit 0
          fi
          git commit -m 'case142: integrate Ceph capacity-gated recovery navigation'
          git push origin HEAD:main
