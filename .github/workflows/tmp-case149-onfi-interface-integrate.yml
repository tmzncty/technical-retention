name: Temporary Case 149 ONFI interface integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-case149-onfi-interface-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate bounded research slice
        run: python .github/scripts/tmp_case149_onfi_interface_integrate.py

      - name: Normalize generated markdown EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate canonical research diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f evidence/149-onfi10-20-vendor-feature-space-otp-interface-deepening.md
          test ! -e .github/scripts/tmp_case149_onfi_interface_integrate.py
          test ! -e .github/workflows/tmp-case149-onfi-interface-integrate.yml
          grep -Fq -- '## ONFI command-space boundary and later Micron interface migration' cases/149-micron-nand-otp-data-protect-irreversible-authority.md
          grep -Fq -- '- **3571 — interface chronology != invention or implementation genealogy:**' CASE_INDEX.md
          grep -Fq -- 'Case 149 Micron NAND OTP Data Protect irreversible-authority slice + ONFI interface deepening' ROADMAP.md
          git status --short

      - name: Commit canonical research changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case149: deepen ONFI vendor-space interface migration [skip ci]'
          git push origin HEAD:main
