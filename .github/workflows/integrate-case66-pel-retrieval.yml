name: integrate case66 PEL retrieval deepening

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_case66_pel_retrieval.py'
      - '.github/workflows/integrate-case66-pel-retrieval.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'technical-retention-bot'
          git config user.email 'technical-retention-bot@users.noreply.github.com'
      - name: Apply bounded Case 66 deepening
        run: python scripts/integrate_case66_pel_retrieval.py
      - name: Validate integration
        run: |
          git diff --check
          grep -F '## 2021 implementation and reporting-generation deepening' cases/66-nvme14-persistent-event-log-history.md
          grep -F '## 2021 deepening — implementation artifacts and retrieval-generation validation' evidence/66-nvme14-2019-persistent-event-log-grounding.md
          grep -F 'NVMe PEL retrieval-validity / reporting-generation deepening' ROADMAP.md
          grep -F '### Case 66 deepening — PEL implementation and retrieval-validity findings' CASE_INDEX.md
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          nums = [int(x) for x in re.findall(r'^- \*\*(\d+) —', text, flags=re.M)]
          assert nums == sorted(nums), 'finding numbers are not monotonic'
          assert len(nums) == len(set(nums)), 'duplicate finding numbers'
          assert nums[-1] >= 2124, nums[-1]
          PY
      - name: Commit and push canonical research files
        run: |
          git add cases/66-nvme14-persistent-event-log-history.md \
                  evidence/66-nvme14-2019-persistent-event-log-grounding.md \
                  ROADMAP.md CASE_INDEX.md
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'case66: deepen PEL retrieval-validity history'
          git push origin HEAD:main
