name: technical-retention-case106-one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/technical-retention-case106.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate bounded Case 106
        run: python .github/integration/technical_retention_case106.py
      - name: Validate and commit research slice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [
              Path('cases/106-ddr5-same-bank-refresh-parallel-target-set.md'),
              Path('evidence/106-ddr5-2017-2023-same-bank-refresh-grounding.md'),
              Path('cases/105-micron-lpddr2-per-bank-refresh-maintenance-granularity.md'),
              Path('ROADMAP.md'),
              Path('CASE_INDEX.md'),
          ]:
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          grep -Fq '106-ddr5-same-bank-refresh-parallel-target-set.md' ROADMAP.md
          grep -Fq 'Case 106 — DDR5 Same Bank REFRESH findings' CASE_INDEX.md
          grep -Fq 'same-bank REFRESH ≠ one physical bank total' CASE_INDEX.md
          grep -Fq 'Case 106' cases/105-micron-lpddr2-per-bank-refresh-maintenance-granularity.md
          test -f cases/106-ddr5-same-bank-refresh-parallel-target-set.md
          test -f evidence/106-ddr5-2017-2023-same-bank-refresh-grounding.md
          rm .github/integration/technical_retention_case106.py .github/workflows/technical-retention-case106.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m 'case106: ground DDR5 same-bank refresh target-set boundary'
          git push origin HEAD:main
