name: robust repair Case 27 integration workflow

on:
  push:
    paths:
      - '.github/workflows/fix-case27-deep-scrub-workflow-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stored integration workflow by line pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/case27-deep-scrub-prior-art.yml')
          text = p.read_text()
          text2 = text.replace("    if: github.actor != 'github-actions[bot]'\n", "    if: always()\n", 1)
          if text2 == text:
              raise SystemExit('actor condition was not replaced')
          replacement = '          limits_marker = "Most importantly, the present source set does **not** fully ground the exact per-shard reconstruction/authoritative-source algorithm used after every deep-scrub-detected EC corruption. That remains a separate implementation-archeology slice.\\n"\n'
          text3, n = re.subn(r'^          limits_marker = .*$', replacement.rstrip('\n'), text2, count=1, flags=re.M)
          if n != 1:
              raise SystemExit(f'limits_marker replacement count={n}')
          p.write_text(text3)
          PY
          rm -f .github/workflows/fix-case27-deep-scrub-workflow.yml
          rm .github/workflows/fix-case27-deep-scrub-workflow-v2.yml
          git add .github/workflows/case27-deep-scrub-prior-art.yml \
            .github/workflows/fix-case27-deep-scrub-workflow.yml \
            .github/workflows/fix-case27-deep-scrub-workflow-v2.yml
          git diff --cached --check
          git config user.name 'technical-retention automation'
          git config user.email 'technical-retention-automation@users.noreply.github.com'
          git commit -m 'chore: repair Case 27 integration workflow'
          git push origin HEAD:main
