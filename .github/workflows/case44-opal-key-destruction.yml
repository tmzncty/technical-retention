name: Integrate Case 44 Opal key-destruction deepening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case44-opal-key-destruction.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Case 44 deepening
        run: |
          python scripts/integrate_case44_opal_key_destruction.py
          python - <<'PY'
          from pathlib import Path
          p = Path('CASE_INDEX.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate research changes
        run: |
          git diff --check
          grep -F 'TCG Opal 1.0' cases/44-nvme13-deallocate-sanitize-forgetting.md
          grep -F 'KeepGlobalRangeKey' evidence/44-nvme12-13-deallocate-sanitize-grounding.md
          grep -F 'partially advanced by grounded Case 44 historical deepening' ROADMAP.md
          grep -F '1265. **key destruction ≠ ciphertext destruction**' CASE_INDEX.md
          grep -F '1274. **key state is retention state when payload intelligibility depends on it**' CASE_INDEX.md

      - name: Commit research slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md ROADMAP.md CASE_INDEX.md cases/44-nvme13-deallocate-sanitize-forgetting.md evidence/44-nvme12-13-deallocate-sanitize-grounding.md
          git diff --cached --check
          git commit -m 'case44: deepen Opal key-destruction prior art'
          git push origin HEAD:main

      - name: Remove one-shot integration machinery
        run: |
          git rm scripts/integrate_case44_opal_key_destruction.py .github/workflows/case44-opal-key-destruction.yml
          git commit -m 'case44: clean Opal integration workflow'
          git push origin HEAD:main
