name: Case 55 ATA5 SMART self-test integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case55-ata5-selftest-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply bounded research slice
        run: python3 .github/scripts/integrate_case55_ata5_selftest.py

      - name: Normalize generated markdown
        run: sed -i 's/[[:space:]]\+$//' evidence/55-nvme10-13-smart-health-endurance-grounding.md

      - name: Validate research tree
        run: |
          git diff --check
          grep -Fq '1999 ATA/ATAPI-5 separates off-line data collection, self-test execution mode, and retained diagnostic history' cases/55-nvme-smart-health-endurance-telemetry.md
          grep -Fq '## Source H — T13 1999 SMART/self-test proposal metadata' evidence/55-nvme10-13-smart-health-endurance-grounding.md
          grep -Fq '## Source I — ATA/ATAPI-5 T13/1321D Revision 2, 13 December 1999' evidence/55-nvme10-13-smart-health-endurance-grounding.md
          grep -Fq 'ATA SMART retained-health-state and ATA/ATAPI-5 diagnostic-history prior-art floor' ROADMAP.md
          grep -Fq '## Case 55 ATA/ATAPI-5 SMART self-test deepening — retained diagnostic history and asynchronous qualification' CASE_INDEX.md
          grep -Fq '1572. **ATA off-line self-test ≠ SCSI BMS ≠ host SCSI VERIFY**' CASE_INDEX.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-nvme10-13-smart-health-endurance-grounding.md | sort)"
          test "$changed" = "$expected"

      - name: Commit research
        run: |
          git add CASE_INDEX.md ROADMAP.md cases/55-nvme-smart-health-endurance-telemetry.md evidence/55-nvme10-13-smart-health-endurance-grounding.md
          git commit -m 'case55: deepen ATA5 self-test history boundary'
          git push origin main

      - name: Remove one-shot integration files
        run: |
          git rm .github/scripts/integrate_case55_ata5_selftest.py .github/workflows/case55-ata5-selftest-integration.yml
          git commit -m 'chore: remove case55 ATA5 integration files'
          git push origin main
