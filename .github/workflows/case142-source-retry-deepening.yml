name: Case 142 source retry deepening integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case142-source-retry-deepening.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research slice and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python3 scripts/case142_source_retry_deepening.py
          python3 -c "from pathlib import Path; p=Path('evidence/142-ceph-reef-capacity-gated-recovery-grounding.md'); p.write_text(p.read_text().rstrip() + '\n')"
          test -f evidence/142-ceph-reef-source-retry-state-horizon-deepening.md
          grep -q source-retry-state-horizon-deepening cases/142-ceph-reef-capacity-gated-recovery.md
          grep -q source-retry-state-horizon-deepening evidence/142-ceph-reef-capacity-gated-recovery-grounding.md
          grep -q source-retry-state-horizon-deepening ROADMAP.md
          grep -q source-retry-state-horizon-deepening CASE_INDEX.md
          test ! -e .github/workflows/case142-source-retry-deepening.yml
          test ! -e scripts/case142_source_retry_deepening.py
          git diff --check
          git config user.name 'technical-retention automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'case142: deepen Ceph capacity-gated retry state [skip ci]'
          git push origin HEAD:main
