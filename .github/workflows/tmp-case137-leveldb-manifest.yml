name: Case137 bounded integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-case137-leveldb-manifest.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply research patch
        run: python .automation/case137_integrate.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-case137-leveldb-manifest.yml .automation/case137_integrate.py
          test -f cases/137-leveldb-v17-manifest-current-recovery.md
          test -f evidence/137-leveldb-v17-manifest-current-grounding.md
          grep -q 'Case 137' CASE_INDEX.md
          grep -q '2911 — user-update log != MANIFEST serving-state log' CASE_INDEX.md
          grep -q '2928 — related-repository boundary' CASE_INDEX.md
          grep -q 'Case 137 LevelDB v1.7 MANIFEST/CURRENT' ROADMAP.md
          git diff --check
          git status --short
          git config user.name "technical-retention automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CASE_INDEX.md ROADMAP.md cases/137-leveldb-v17-manifest-current-recovery.md evidence/137-leveldb-v17-manifest-current-grounding.md .github/workflows/tmp-case137-leveldb-manifest.yml .automation/case137_integrate.py
          git commit -m "case137: ground LevelDB manifest currentness"
          git push origin HEAD:main
