name: Fix Case 111 finding ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case111-findings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct finding numbering
        run: python3 scripts/fix_case111_findings.py
      - name: Validate
        run: |
          git diff --check
          grep -q -- '- \*\*2488 — rated-life estimate' CASE_INDEX.md
          grep -q -- '- \*\*2500 — future-retention authority' CASE_INDEX.md
      - name: Remove temporary files
        run: rm -f scripts/fix_case111_findings.py .github/workflows/fix-case111-findings.yml
      - name: Commit correction
        run: |
          git config user.name 'chatgpt-research-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'case111: correct finding ledger numbering'
          git push origin HEAD:main
