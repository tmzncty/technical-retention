name: Integrate Case 26 navigation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-case26-gfs.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path, marker, line):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines()
              if line in lines:
                  return
              for i, old in enumerate(lines):
                  if marker in old:
                      lines.insert(i + 1, line)
                      p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                      return
              raise SystemExit(f'missing marker in {path}: {marker}')

          insert_after('README.md', 'cases/25-openstack-swift-ec-overwrite-durable-currentness.md', '- [`cases/26-google-gfs-inactive-chunk-integrity.md`](cases/26-google-gfs-inactive-chunk-integrity.md) — grounded distributed-integrity bridge: GFS separates chunk-version currentness from per-replica checksum validity, verifies before read return, scans inactive chunks during idle periods, and restores a trustworthy replica count by cloning from another valid copy.')
          insert_after('README.md', 'evidence/25-openstack-swift-2015-2016-ec-currentness-grounding.md', '- [`evidence/26-gfs-2003-integrity-scan-grounding.md`](evidence/26-gfs-2003-integrity-scan-grounding.md) — Case-26 grounding record: the 2003 GFS primary paper separates version staleness, local checksum integrity, demand-time verification, idle inactive-chunk verification, alternate-replica service, cloning repair, and restored replication margin without projecting later `scrub` vocabulary backward.')

          p = Path('ROADMAP.md')
          road = p.read_text(encoding='utf-8')
          old = '**partially advanced by grounded Cases 19, 23, 24, and 25**.'
          new = '**partially advanced by grounded Cases 19, 23, 24, 25, and 26**.'
          if old in road:
              road = road.replace(old, new, 1)
          elif new not in road:
              raise SystemExit('distributed case count anchor missing')
          if 'cases/26-google-gfs-inactive-chunk-integrity.md' not in road:
              marker = 'The broad item stays unchecked because other mutable-EC consistency protocols, delete/tombstone semantics, distributed integrity scrubbing, cross-region coded maintenance, later Swift durability-marker/on-disk evolution, and additional repair-bandwidth/failure models remain separate regimes.'
              if marker not in road:
                  raise SystemExit('distributed open-gap anchor missing')
              addition = '[`cases/26-google-gfs-inactive-chunk-integrity.md`](cases/26-google-gfs-inactive-chunk-integrity.md), grounded by [`evidence/26-gfs-2003-integrity-scan-grounding.md`](evidence/26-gfs-2003-integrity-scan-grounding.md), adds distributed integrity qualification under replication: chunk-version currentness and per-copy checksum validity are separate, read-time validation can fall back before durable repair completes, and idle `scan and verify` work prevents an undiscovered corrupt replica from falsely satisfying the valid-replica goal. '
              tail = 'The broad item stays unchecked because other mutable-EC consistency protocols, delete/tombstone semantics, coded-fragment distributed integrity scrubbing, cross-region coded maintenance, later Swift durability-marker/on-disk evolution, later GFS/Colossus integrity semantics, and additional repair-bandwidth/failure models remain separate regimes.'
              road = road.replace(marker, addition + tail, 1)
          question = '- [ ] In distributed integrity maintenance, how should `version currentness`, `checksum validity`, `demand-time versus idle-time discovery`, `fallback read availability`, `valid-replica count`, `clone repair`, and `restored replication goal` be separated?'
          if question not in road:
              lines = road.splitlines()
              for i, line in enumerate(lines):
                  if 'physical presence' in line and 'proactively checked storage' in line:
                      lines.insert(i + 1, question)
                      road = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('phase-3 integrity question anchor missing')
          p.write_text(road, encoding='utf-8')

          p = Path('CASE_INDEX.md')
          ci = p.read_text(encoding='utf-8')
          row = '| [Google File System Inactive-Chunk Verification: Checksums, Valid Replicas, and Background Repair](cases/26-google-gfs-inactive-chunk-integrity.md) | **grounded** | replicated chunks + per-block persistent checksum metadata + chunk-version currentness + demand/idle verification + master-coordinated cloning toward a replication goal | separate copy count, version currentness, integrity validity, discovery timing, fallback-read availability, clone repair, and restored redundancy margin; show legal replica divergence makes byte equality an invalid corruption test | [2003 GFS integrity-scan grounding](evidence/26-gfs-2003-integrity-scan-grounding.md); later GFS/Colossus evolution, coded-fragment scrubbing, cryptographic integrity, and distributed audit protocols remain separate work |'
          if row not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| [OpenStack Swift EC Overwrites:'):
                      lines.insert(i + 1, row)
                      ci = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('case table anchor missing')
          matrix = "| Google File System / 2003 bounded integrity regime | replicated chunk payload + chunk version numbers + per-64 KB 32-bit checksums + current replica locations/replication goal | per-read checksum verification; idle-period scan of inactive chunks; failure/corruption-triggered master re-replication; throttled cloning from a valid replica | read verifies overlapping checksum blocks before returning data; checksum failure returns an error and requester can use another replica while repair follows | file/chunk handle resolves through replica locations; version number excludes stale replicas while checksum separately qualifies a local copy's integrity | physical replica membership changes as corrupt/unavailable copies are excluded, cloned, and deleted; chunk identity survives | no complete history; current chunk/version, integrity checksums, and enough valid placement/redundancy relations are retained |"
          if matrix not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('| OpenStack Swift EC / 2015–2016 bounded regime |'):
                      lines.insert(i + 1, matrix)
                      ci = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('comparison matrix anchor missing')
          findings = [
              '236. **replica multiplicity ≠ valid replica count** — GFS explicitly warns that an inactive corrupted replica can make the master believe a chunk has enough valid replicas until the defect is discovered; redundancy quantity must therefore be qualified by replica usability.',
              '237. **version currentness ≠ integrity validity** — chunk version numbers exclude stale replicas while per-block checksums detect corruption of stored data. A copy can fail the currentness relation or the integrity relation, and one mechanism does not substitute for the other.',
              '238. **replica divergence ≠ corruption** — GFS states that divergent replicas may be legal under its mutation semantics, especially record append, so bytewise replica equality cannot serve as the universal integrity authority in this bounded system; local checksum relations do that work.',
              '239. **demand-time verification ≠ proactive idle-time discovery** — normal reads verify requested checksum blocks, while idle chunkservers can scan inactive chunks specifically to reveal corruption in rarely read state before ordinary demand happens to expose it.',
              '240. **defect discovery ≠ fallback service ≠ restored redundancy margin** — after a checksum failure the requester can use another replica while the master separately clones a valid replacement; good service can resume before the replication goal has been durably restored.',
              '241. **checksum metadata ≠ payload, but can be constitutive retention state** — GFS stores per-block checksums separately from user data because later verification and repair-source qualification depend on the data/checksum relation.',
              '242. **background integrity repair has a resource budget** — clone concurrency and bandwidth are explicitly limited so re-replication does not overwhelm clients, while inactive-chunk verification is scheduled during idle periods; background maintenance is real competed-for work.',
              "243. **GFS idle verification ≠ ZFS `scrub` ≠ Dynamo anti-entropy** — the 2003 GFS paper documents `scan and verify` of inactive chunks, functionally predating this repository's 2004 `disk scrubbing` terminology anchor without using that word; ZFS later names pool scrubbing, while Dynamo anti-entropy targets replica divergence/currentness rather than local-copy corruption. This is a functional/prior-art boundary, not one shared historical mechanism or an invention claim."
          ]
          if '236. **replica multiplicity ≠ valid replica count**' not in ci:
              lines = ci.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('235. '):
                      lines[i+1:i+1] = findings
                      ci = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('finding 235 anchor missing')
          ci = ci.replace('twenty-six', 'twenty-seven')
          old_tail = 'and Swift mutable-EC currentness bridges;'
          if old_tail in ci:
              ci = ci.replace(old_tail, 'Swift mutable-EC currentness, and GFS distributed-integrity-verification bridges;', 1)
          p.write_text(ci, encoding='utf-8')
          PY
          rm .github/workflows/automation-case26-gfs.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md .github/workflows/automation-case26-gfs.yml
          git diff --cached --check
          grep -q 'cases/26-google-gfs-inactive-chunk-integrity.md' README.md ROADMAP.md CASE_INDEX.md
          grep -q 'After twenty-seven bounded cases' CASE_INDEX.md
          git commit -m "docs: integrate grounded GFS integrity bridge"
          git push
