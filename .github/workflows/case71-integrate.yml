name: Case 71 one-shot integrator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Case 71 research slice
        run: python .github/case71_integrate.py
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          nums = sorted(int(p.name[:2]) for p in Path('cases').glob('[0-9][0-9]-*.md'))
          assert nums == list(range(72)), nums
          ci = Path('CASE_INDEX.md').read_text()
          assert '813. **recovery-equivalent representation' in ci
          assert '828. **ZooKeeper 2010 fuzzy recovery' in ci
          assert Path('cases/71-apache-zookeeper-fuzzy-snapshot-replay-recovery.md').exists()
          assert Path('evidence/71-zookeeper-2006-2019-fuzzy-snapshot-grounding.md').exists()
          PY
          git add -A
          git commit -m "case71: ground ZooKeeper fuzzy snapshot recovery"
          git push origin HEAD:main
