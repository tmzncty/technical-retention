name: Case 52 grounding summary fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_case52_grounding_summary.py'
      - '.github/workflows/case52-grounding-summary-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python .github/scripts/fix_case52_grounding_summary.py
      - name: Validate and commit
        run: |
          git config user.name "chatgpt-research-agent"
          git config user.email "chatgpt-research-agent@users.noreply.github.com"
          git rm .github/scripts/fix_case52_grounding_summary.py .github/workflows/case52-grounding-summary-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "case52: align expanded grounding summary"
          git push origin HEAD:main
