name: Temporary Case 132 temperature-contract integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-case132-temperature-contract.yml'

permissions:
  contents: write

concurrency:
  group: tmp-case132-temperature-contract
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded research slice
        run: python tools/tmp_case132_temperature_contract.py

      - name: Validate canonical files
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          idx = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          for n in range(2439, 2451):
              token = f'**{n} —'
              assert idx.count(token) == 1, (n, idx.count(token))
          assert Path('evidence/132-2014-2018-temperature-conditioned-retention-contract-deepening.md').exists()
          assert not Path('tools/tmp_case132_temperature_contract.py').exists()
          assert not Path('.github/workflows/tmp-case132-temperature-contract.yml').exists()
          PY

      - name: Commit and push research
        run: |
          git config user.name "technical-retention research automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "case132: deepen temperature-conditioned retention boundary"
          git push origin HEAD:main
