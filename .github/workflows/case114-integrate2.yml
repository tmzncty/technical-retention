name: Case 114 integrate v2

on:
  push:
    branches: [main]
    paths:
      - '.case114_integrate.py'
      - '.github/workflows/case114-integrate2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward current main
        run: git pull --ff-only origin main

      - name: Integrate Case 114 navigation and status
        run: python .case114_integrate.py

      - name: Remove v2 one-shot workflow
        run: |
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/case114-integrate2.yml
          git commit -m 'chore: remove Case 114 v2 integration workflow'
          git push origin HEAD:main
