name: Case 113 integrate

on:
  push:
    branches: [main]
    paths:
      - 'tools/case113_integrate.py'
      - '.github/workflows/case113-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward current main
        run: git pull --ff-only origin main

      - name: Integrate Case 113 navigation and status
        run: python tools/case113_integrate.py

      - name: Normalize generated EOFs
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'CASE_INDEX.md',
              'cases/89-ata-lba-chs-translation-logical-sector-identity.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate research tree
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          required = [
              Path('cases/113-ata-atapi6-48bit-lba-reachability.md'),
              Path('evidence/113-ata-2000-2003-48bit-lba-grounding.md'),
          ]
          for p in required:
              assert p.exists(), p
              assert p.stat().st_size > 1000, (p, p.stat().st_size)

          roadmap = Path('ROADMAP.md').read_text(encoding='utf-8')
          index = Path('CASE_INDEX.md').read_text(encoding='utf-8')
          case89 = Path('cases/89-ata-lba-chs-translation-logical-sector-identity.md').read_text(encoding='utf-8')

          assert roadmap.count('cases/113-ata-atapi6-48bit-lba-reachability.md') == 1
          assert '- [x] ATA/ATAPI-6 48-bit Address feature / legacy-reachability boundary' in roadmap
          hdd_line = next(x for x in roadmap.splitlines() if x.startswith('- [ ] HDD geometry, bad-sector remapping, CHS → LBA'))
          assert 'Cases 14, 89, 108, and 113' in hdd_line
          assert 'LBA28→LBA48' not in hdd_line

          assert index.count('cases/113-ata-atapi6-48bit-lba-reachability.md') == 1
          assert index.count('## Case 113 — ATA/ATAPI-6 48-bit LBA reachability findings') == 1
          for n in range(1766, 1781):
              assert re.search(rf'\*\*{n} —', index), n
          assert index.count('**1766 —') == 1
          assert index.count('**1780 —') == 1

          assert case89.count('## Continuation — Case 113 48-bit address-width expansion') == 1
          assert 'coordinate-representation continuity ≠ command-address-width reachability' in case89
          print('validation ok')
          PY

      - name: Commit research integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md CASE_INDEX.md cases/89-ata-lba-chs-translation-logical-sector-identity.md
          if git diff --cached --quiet; then
            echo 'No navigation/status changes to commit'
          else
            git commit -m 'case113: integrate ATA 48-bit LBA navigation and comparison'
            git push origin HEAD:main
          fi

      - name: Remove one-shot integration helper
        run: |
          git pull --ff-only origin main
          git rm -f tools/case113_integrate.py .github/workflows/case113-integrate.yml
          git commit -m 'chore: remove Case 113 integration helper'
          git push origin HEAD:main
