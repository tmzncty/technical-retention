name: case76-tlc-reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case76-tlc-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/integration/case76_tlc_reconcile.py
      - run: |
          git diff --check
          grep -Fq 'bounded product-contract comparison' evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md
          grep -Fq 'the named TLC cross-check below advances that gap' CASE_INDEX.md
          rm .github/integration/case76_tlc_reconcile.py .github/workflows/case76-tlc-reconcile.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m 'case76: reconcile TLC QLC evidence boundary'
          git push origin HEAD:main