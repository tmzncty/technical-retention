name: Integrate Case 81 Chain Replication

on:
  push:
    branches:
      - main
    paths:
      - tools/integrate_case81.py
      - .github/workflows/case81-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'chore: stage case81 chain replication integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate case 81
        run: python3 tools/integrate_case81.py

      - name: Validate
        run: |
          test -f cases/81-chain-replication-tail-currentness-reconfiguration.md
          test -f evidence/81-chain-replication-2004-grounding.md
          grep -Fq 'After eighty-two bounded cases' CASE_INDEX.md
          grep -Eq '^973\.' CASE_INDEX.md
          grep -Eq '^988\.' CASE_INDEX.md
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md CASE_INDEX.md cases/81-chain-replication-tail-currentness-reconfiguration.md evidence/81-chain-replication-2004-grounding.md
          git rm tools/integrate_case81.py .github/workflows/case81-integration.yml
          git commit -m "case81: ground chain replication reconfiguration"
          git push origin main
