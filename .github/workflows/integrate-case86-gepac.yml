name: Integrate Case 86 GE-PAC deepening

on:
  push:
    paths:
      - '.github/workflows/integrate-case86-gepac.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and run staged integration script
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          old = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/integrate-case86-gepac.yml"],
              text=True,
          )
          start = "          python - <<'PY'\n"
          body = old.split(start, 1)[1].rsplit("\n          PY", 1)[0]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(body, "case86_integration.py", "exec"))
          PY