name: case76-crossvendor-integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case76-crossvendor-integration.yml'

permissions:
  contents: write

concurrency:
  group: technical-retention-case76-crossvendor
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to current main
        run: git pull --ff-only origin main

      - name: Integrate bounded Case 76 cross-vendor slice
        run: python tools/case76_crossvendor_integrate.py

      - name: Validate and commit research tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          grep -Fq "Solidigm 2025 + Micron 2026: cross-vendor product-contract corroboration" cases/76-jedec-ssd-endurance-retention-qualification.md
          grep -Fq "Source 11 — Solidigm D5-P5336 QLC + Micron 7600 TLC" evidence/76-jedec-2000-2015-ssd-endurance-retention-grounding.md
          grep -Fq "Cross-vendor TLC/QLC manufacturer product-contract corroboration" ROADMAP.md
          grep -Fq "## Case 76 — Cross-vendor SSD retention-contract deepening findings" CASE_INDEX.md
          grep -Fq "**1725 — Related-repository boundary:**" CASE_INDEX.md
          rm -f tools/case76_crossvendor_integrate.py .github/workflows/case76-crossvendor-integration.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "case76: add cross-vendor SSD retention contract corroboration"
          git push origin HEAD:main
