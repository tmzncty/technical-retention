name: Case 138 2009 origin integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case138-2009-origin-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Apply Case 138 research patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "37f51b3132d242d7c3a7303969d3606d2a8f4be3"
          python3 .github/case138_2009_origin_patch.py
          sed -i 's/[[:space:]]\+$//' cases/138-redis26-aof-rewrite-current-state-reserialization.md
          sed -i 's/[[:space:]]\+$//' evidence/138-redis-2009-aof-bgrewriteaof-origin-deepening.md
          rm .github/case138_2009_origin_patch.py
          rm .github/workflows/case138-2009-origin-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "case138: deepen 2009 AOF rewrite origins [skip ci]"
          git push origin HEAD:main
