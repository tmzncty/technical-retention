name: Case 138 2009 origin integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/case138-2009-origin-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Apply Case 138 research patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e93308b25723ee9b391e4a5dd63f25ed58e62cd5"
          python3 .github/case138_2009_origin_patch.py
          rm .github/case138_2009_origin_patch.py
          rm .github/workflows/case138-2009-origin-integration.yml
          git config user.name "technical-retention automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "case138: deepen 2009 AOF rewrite origins [skip ci]"
          git push origin HEAD:main
